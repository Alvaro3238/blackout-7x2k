<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUJUTSU KAISEN — BLACKOUT</title>
<style>
:root{
  --bg:#07070b; --bg2:#0d0e15; --panel:#12131c; --line:#242637;
  --red:#c3122e; --red2:#ff2f4e; --blue:#2f7cff; --purple:#7b3ff2;
  --gold:#e3b23c; --txt:#e8e6f0; --dim:#8b8ba3; --green:#3fd47a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans JP",sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app canvas{position:absolute}
#cv3{z-index:0}
#cv{z-index:1;background:transparent !important}
body.locked{cursor:none}
canvas{display:block;image-rendering:auto}
#cv3{background:#05050a}
.hidden{display:none !important}

/* ---------- capas ---------- */
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:safe center;
  background:radial-gradient(ellipse at 50% 30%,#141222 0%,#07070b 70%);z-index:20;overflow:auto;padding:24px}
.layer.dim{background:rgba(5,5,10,.86);backdrop-filter:blur(6px)}

/* ---------- tipografía ---------- */
h1.title{font-size:clamp(28px,6vw,64px);letter-spacing:.22em;font-weight:800;
  background:linear-gradient(180deg,#fff 0%,#ff5f78 55%,#7a0d1d 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1.05}
h1.title small{display:block;font-size:.28em;letter-spacing:.6em;color:var(--dim);
  -webkit-text-fill-color:var(--dim);margin-top:10px;font-weight:500}
h2{font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt);margin-bottom:4px}
.sub{color:var(--dim);font-size:13px;letter-spacing:.05em;line-height:1.6}
.kanji-bg{position:fixed;font-size:min(60vh,60vw);color:#ffffff05;font-weight:900;
  z-index:-1;user-select:none;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%)}

/* ---------- botones ---------- */
.btn{background:linear-gradient(180deg,#191b28,#101119);border:1px solid var(--line);color:var(--txt);
  padding:13px 26px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  border-radius:3px;transition:.14s;font-weight:600;position:relative;overflow:hidden;min-width:250px;
  font-family:inherit}
.btn:hover{border-color:var(--red2);background:linear-gradient(180deg,#26141b,#170d12);
  transform:translateX(4px);box-shadow:-3px 0 0 var(--red2)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--line)}
.btn.sm{padding:8px 16px;font-size:12px;min-width:0;letter-spacing:.1em}
.btn.gold:hover{border-color:var(--gold);box-shadow:-3px 0 0 var(--gold);background:linear-gradient(180deg,#241f10,#15120a)}
.btn.blue:hover{border-color:var(--blue);box-shadow:-3px 0 0 var(--blue);background:linear-gradient(180deg,#101a2a,#0b1018)}
.menu{display:flex;flex-direction:column;gap:11px;margin-top:34px;align-items:center}

/* ---------- paneles ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:18px}
.row{display:flex;gap:14px}
.wrap{max-width:1180px;width:100%}
.grid-chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;
  /* altura mínima de fila: con el contenedor de alto fijo, la rejilla apretaba
     las filas hasta cortar el nombre del personaje */
  grid-auto-rows:minmax(78px,max-content);align-content:start}
.cc{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center;
  cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.cc:hover{border-color:var(--red2);transform:translateY(-3px)}
.cc.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px #e3b23c33}
.cc.banned{opacity:.28;cursor:not-allowed;filter:grayscale(1)}
.cc.banned::after{content:"";position:absolute;inset:0;background:
  linear-gradient(45deg,transparent 47%,var(--red2) 47%,var(--red2) 53%,transparent 53%)}
.cc .k{font-size:34px;font-weight:900;line-height:1;margin-bottom:5px;font-family:"Noto Serif JP",serif}
.cc .n{font-size:10.5px;letter-spacing:.03em;color:var(--txt);line-height:1.25;font-weight:600}
.cc .g{font-size:8.5px;color:var(--dim);margin-top:3px;letter-spacing:.08em}
.cc.locked{opacity:.4;filter:grayscale(.85)}
.cc.locked .n::after{content:" 🔒"}

.tag{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:2px;letter-spacing:.1em;
  border:1px solid var(--line);color:var(--dim);text-transform:uppercase}
.tag.r{border-color:#5c1a26;color:#ff8090;background:#2a0d14}
.tag.b{border-color:#1b3560;color:#8ab6ff;background:#0c1626}
.tag.g{border-color:#1c4a30;color:#7ee0a4;background:#0b1a12}
.tag.y{border-color:#4d3d12;color:#f0cf72;background:#1c1707}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:12px}
.bar{height:13px;background:#0a0a11;border:1px solid #2a2c3d;border-radius:2px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .1s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}
.hp i{background:linear-gradient(90deg,#8b0c1e,#ff3f5c)}
.ce i{background:linear-gradient(90deg,#1d4ea8,#4aa3ff)}
.dm i{background:linear-gradient(90deg,#4a1a8f,#b06bff)}
.st i{background:linear-gradient(90deg,#6b5410,#e3b23c)}

#hudL{position:absolute;left:16px;bottom:16px;width:330px;pointer-events:none}
#hudR{position:absolute;right:16px;top:16px;width:290px;text-align:right}
#skills{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
.sk{width:60px;height:60px;background:#0c0d15;border:1px solid var(--line);border-radius:4px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.sk .kk{font-size:23px;font-weight:900;font-family:"Noto Serif JP",serif;line-height:1}
.sk .key{position:absolute;top:2px;left:4px;font-size:9px;color:var(--dim);font-weight:700}
.sk .cost{position:absolute;bottom:2px;right:4px;font-size:9px;color:#4aa3ff;font-weight:700}
.sk .cd{position:absolute;inset:0;background:#000000cc;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff}
.sk.ready{border-color:#3a4a6a;box-shadow:0 0 8px #2f7cff22}
.sk.lockedsk{opacity:.45;filter:grayscale(.7);border-color:#3a2130}
.sk.dom{border-color:#5b2a8f}
.sk.dom.on{border-color:#c05bff;box-shadow:0 0 16px #b06bff88;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px #b06bff66}50%{box-shadow:0 0 26px #b06bffcc}}
.sk .nm{position:absolute;bottom:-1px;left:0;right:0;font-size:7.5px;text-align:center;color:var(--dim);
  background:#00000099;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#center-msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;
  font-size:34px;font-weight:900;letter-spacing:.2em;text-shadow:0 3px 18px #000;opacity:0;transition:.25s}
#objective{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;
  background:#0a0a12cc;border:1px solid var(--line);border-radius:3px;padding:7px 20px;font-size:12px;
  letter-spacing:.1em;max-width:70vw}
#objective b{color:var(--gold)}
#minimap{position:absolute;right:16px;bottom:16px;border:1px solid var(--line);background:#05050acc;border-radius:3px}
#combat-log{position:absolute;left:16px;top:16px;width:280px;font-size:11px;line-height:1.7;color:var(--dim)}
#combat-log div{opacity:.9;text-shadow:0 1px 3px #000}

/* ---------- diálogo ---------- */
#dialogue{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(0deg,#05050afa,#05050ad0 70%,transparent);
  padding:32px 6vw 40px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dbox{max-width:860px;width:100%;background:#0c0d15ee;border:1px solid var(--line);border-left:3px solid var(--red2);
  border-radius:4px;padding:20px 26px;position:relative}
.dspk{position:absolute;top:-13px;left:20px;background:var(--red);color:#fff;font-size:11px;padding:3px 14px;
  letter-spacing:.16em;font-weight:700;border-radius:2px;text-transform:uppercase}
.dtxt{font-size:15.5px;line-height:1.85;color:#ddd9e8;min-height:52px}
.dhint{margin-top:12px;font-size:10.5px;color:var(--dim);letter-spacing:.14em;text-align:right}

/* ---------- listas ---------- */
.mission{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--line);
  border-radius:4px;padding:13px 16px;cursor:pointer;transition:.12s;margin-bottom:8px}
.mission:hover{border-color:var(--red2);transform:translateX(4px)}
.mission.locked{opacity:.35;cursor:not-allowed;transform:none}
.mission.done{border-left:3px solid var(--green)}
.mission .no{font-size:22px;font-weight:900;color:var(--dim);width:40px;text-align:center;font-family:"Noto Serif JP",serif}
.mission .body{flex:1}
.mission .mt{font-size:14px;font-weight:700;letter-spacing:.05em}
.mission .md{font-size:11.5px;color:var(--dim);margin-top:3px}
.mission .rank{font-size:26px;font-weight:900;width:44px;text-align:center;font-family:Georgia,serif}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
tr.me td{background:#1a0f14;color:#ffb0bc}

input[type=text]{background:#0a0a11;border:1px solid var(--line);color:var(--txt);padding:9px 12px;
  border-radius:3px;font-family:inherit;font-size:13px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.scroll{overflow-y:auto;max-height:56vh;padding-right:6px}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:#2a2c3d;border-radius:4px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a1b26;font-size:12px}
.kv b{color:var(--gold);font-weight:600}
.badge{font-size:34px;font-weight:900;font-family:"Noto Serif JP",serif;letter-spacing:.05em}
.top-bar{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:flex;justify-content:space-between;
  align-items:center;z-index:25;background:linear-gradient(180deg,#07070bee,transparent)}
/* la entrada anima SOLO el desplazamiento: si el navegador se atasca con la
   animación, una capa a medio camino sigue siendo legible en vez de invisible */
.fade-in{animation:fi .30s ease}
@keyframes fi{from{transform:translateY(9px)}to{transform:none}}
.layer{opacity:1}
.flash{animation:fl .5s}
@keyframes fl{0%{filter:brightness(3)}100%{filter:none}}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:#1a1508;border:1px solid #4d3d12;
  border-radius:3px;padding:5px 11px;font-size:12px;color:#f0cf72;font-weight:700}
.notice{font-size:11px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px;line-height:1.65}

/* ================= capas que dejan ver la escena 3D ===================== */
.layer.see3d{background:linear-gradient(100deg,
  rgba(5,5,10,.96) 0%, rgba(6,6,12,.90) 30%, rgba(6,6,12,.55) 52%,
  rgba(6,6,12,.10) 72%, rgba(6,6,12,0) 100%);}
.layer.see3d.rightside{background:linear-gradient(260deg,
  rgba(5,5,10,.96) 0%, rgba(6,6,12,.90) 34%, rgba(6,6,12,.52) 55%,
  rgba(6,6,12,.08) 76%, rgba(6,6,12,0) 100%);}
.layer.see3d::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 220px 60px #05050a}
/* selector: hueco transparente en el centro para que se vea el personaje */
.layer.see3d.midgap{background:linear-gradient(90deg,
  rgba(5,5,10,.95) 0%, rgba(6,6,12,.92) 41%, rgba(6,6,12,.10) 49%,
  rgba(6,6,12,.04) 60%, rgba(6,6,12,.88) 69%, rgba(5,5,10,.95) 100%);}

/* ---------------------- pantalla de inicio ------------------------------ */
.titlelay{align-items:flex-start;justify-content:center;padding:2vh 0 2vh clamp(20px,6vw,96px)}
.titlecol{max-width:470px;width:100%;position:relative;z-index:2}
.brandmark{display:flex;align-items:flex-end;gap:13px;margin-bottom:4px}
.brandmark .bk{font-family:"Noto Serif JP",serif;font-size:clamp(44px,6.4vh,72px);font-weight:900;line-height:.84;
  background:linear-gradient(180deg,#fff,#ff5f78 60%,#5d0a17);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 0 42px #ff2f4e33}
h1.title.big{text-align:left;font-size:clamp(21px,3.1vh,34px);letter-spacing:.15em;line-height:1.12}
h1.title.big small{letter-spacing:.46em;margin-top:5px;font-size:.32em}
.tagline{color:var(--dim);font-size:11px;letter-spacing:.11em;margin-top:9px;line-height:1.7}
.tagline em{color:#6a6a84;font-style:normal;font-family:"Noto Serif JP",serif;letter-spacing:.28em}
.menu.left{align-items:flex-start;margin-top:15px;gap:6px}
.menu.left .btn{min-width:326px;text-align:left;padding:8px 18px;font-size:12.5px;letter-spacing:.11em}
.menu.left .btn .mk{font-family:"Noto Serif JP",serif;color:var(--dim);margin-right:11px;font-size:14px}
.menu.left .btn:hover .mk{color:var(--red2)}
.menu.left .btn .msub{display:block;font-size:9px;letter-spacing:.05em;color:#5a5a70;
  text-transform:none;margin-top:1px;margin-left:25px}
.hintline{margin-top:14px;font-size:9.5px;color:#4a4a5e;letter-spacing:.06em;line-height:1.7}
@media(max-height:640px){ .menu.left .btn{padding:6px 16px} .hintline{display:none} }

/* tarjeta de cuenta */
.acccard{position:fixed;top:18px;right:20px;z-index:26;display:flex;align-items:center;gap:12px;
  background:#0b0c14dd;border:1px solid var(--line);border-radius:5px;padding:10px 14px;
  cursor:pointer;transition:.14s;backdrop-filter:blur(4px);min-width:250px}
.acccard:hover{border-color:var(--gold);transform:translateY(-1px)}
.acccard .av{width:42px;height:42px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif JP",serif;font-size:26px;font-weight:900;background:#12131c;border:1px solid var(--line)}
.acccard .who{font-size:13.5px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.acccard .ttl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;margin-top:2px}
.acccard .st{font-size:9.5px;color:#5a5a70;margin-top:3px;letter-spacing:.06em}

/* ---------------------------- perfil ------------------------------------ */
.profgrid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start}
@media(max-width:900px){.profgrid{grid-template-columns:1fr}}
.portrait{height:352px;border:1px solid var(--line);border-radius:5px;position:relative;
  background:linear-gradient(180deg,#0c0d1533,#0c0d15aa);overflow:hidden}
.portrait .pin{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;
  background:linear-gradient(0deg,#08080ef2,#08080e00)}
.portrait .pk{position:absolute;top:12px;left:14px;font-family:"Noto Serif JP",serif;
  font-size:40px;font-weight:900;line-height:1;text-shadow:0 2px 14px #000}
.portrait .swap{position:absolute;top:12px;right:12px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:8px 11px}
.stat .sv{font-size:17px;font-weight:800;color:var(--txt);line-height:1.15}
.stat .sl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.stat.gold .sv{color:var(--gold)}
.stat.green .sv{color:var(--green)}
.stat.blue .sv{color:#6fb0ff}
.stat.red .sv{color:#ff5f78}
.titlegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
.tcard{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;cursor:pointer;transition:.12s}
.tcard:hover{border-color:var(--red2)}
.tcard.lock{opacity:.36;cursor:default;filter:grayscale(.8)}
.tcard.lock:hover{border-color:var(--line)}
.tcard.eq{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.tcard .tk2{font-family:"Noto Serif JP",serif;font-size:23px;font-weight:900;line-height:1;width:34px;text-align:center}
.tcard .tn2{font-size:12px;font-weight:700;letter-spacing:.03em}
.tcard .td2{font-size:9.5px;color:var(--dim);line-height:1.4;margin-top:2px}
.segbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;border:1px solid var(--line);
  border-radius:3px;cursor:pointer;color:var(--dim);background:#0c0d15;transition:.12s}
.seg:hover{color:var(--txt);border-color:#3a3d52}
.seg.on{color:var(--gold);border-color:var(--gold);background:#1a1508}

/* --------------------------- cuentas ------------------------------------ */
input[type=password]{background:#0a0a11;border:1px solid var(--line);color:var(--txt);padding:9px 12px;
  border-radius:3px;font-family:inherit;font-size:13px;width:100%}
input[type=password]:focus{outline:none;border-color:var(--blue)}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.msgline{font-size:12px;min-height:20px;line-height:1.5;margin-top:8px}
.msgline.ok{color:var(--green)} .msgline.err{color:#ff6f84}
.userrow{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:4px;padding:10px 13px;margin-bottom:7px;cursor:pointer;transition:.12s}
.userrow:hover{border-color:var(--blue)}
.userrow.on{border-color:var(--gold)}
.userrow .ua{width:34px;height:34px;border-radius:3px;background:#12131c;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP",serif;font-weight:900}

/* --------------------------- tutorial ----------------------------------- */
#tutbox{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:28;width:min(660px,86vw);
  background:#0b0c14ee;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:5px;
  padding:14px 20px 16px;backdrop-filter:blur(5px);box-shadow:0 10px 40px #000a}
#tutbox .tstep{font-size:9.5px;letter-spacing:.20em;color:var(--gold)}
#tutbox .ttitle{font-size:19px;font-weight:800;letter-spacing:.05em;margin-top:3px}
#tutbox .ttext{font-size:12.5px;color:#c9c6d6;line-height:1.7;margin-top:6px}
#tutbox .ttext b{color:#fff;background:#1e2030;border:1px solid #333750;border-radius:3px;
  padding:1px 7px;font-size:11.5px;letter-spacing:.06em}
#tutbox .tgoal{display:flex;align-items:center;gap:10px;margin-top:10px}
#tutbox .tkey{font-size:10px;letter-spacing:.14em;color:#0b0c14;background:var(--gold);
  border-radius:2px;padding:3px 9px;font-weight:800}
#tutbox .tgt{font-size:11.5px;color:var(--dim)}
#tutbox .tbar{height:6px;background:#0a0a11;border:1px solid #2a2c3d;border-radius:2px;margin-top:9px;overflow:hidden}
#tutbox .tbar i{display:block;height:100%;background:linear-gradient(90deg,#6b5410,#e3b23c);
  transition:width .18s linear}
#tutbox .tskip{position:absolute;top:10px;right:12px;opacity:.55}
#tutbox .tskip:hover{opacity:1}

/* ------------------------- avisos de título ----------------------------- */
.toastbox{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;
  transition:opacity .7s;pointer-events:none}
.toast{display:flex;align-items:center;gap:13px;background:#0c0d15f2;border:1px solid var(--gold);
  border-left:3px solid var(--gold);border-radius:4px;padding:12px 18px;min-width:290px;
  box-shadow:0 8px 34px #000a;animation:fi .4s ease}
.toast .tk{font-family:"Noto Serif JP",serif;font-size:30px;font-weight:900;line-height:1}
.toast .tt{font-size:9px;letter-spacing:.18em;color:var(--gold)}
.toast .tn{font-size:14px;font-weight:800;letter-spacing:.04em;margin-top:2px}
.toast .td{font-size:10px;color:var(--dim);margin-top:2px}
</style>
</head>

/* ============================== MAPAS =================================== */
/* tipos de muro: solid (bloquea todo) | low (bloquea movimiento, no proyectiles)
   | destr (destructible) | water (ralentiza + moja) | hazard (daña) | pit (bloquea todo, visual) */

/* W(x, y, ancho, alto, tipo, altura3D, material)
   tipos: solid · low · destr · tower · pit · water · rail · hazard        */
function W(x,y,w,h,t,hh,mat){ return {x,y,w,h,t:t||'solid',hh:hh||0,mat:mat||''}; }

/* Vida de un muro. Escala con su tamaño: una valla cae de dos golpes, un
   edificio necesita que le dediques la pelea entera o una técnica de las gordas. */
function wallHP(w){
  const area=w.w*w.h;
  if(w.t==='destr'||w.t==='weak') return Math.round((150 + Math.min(750, area/70)) * (w.hpMul||1));
  if(w.t==='tower') return Math.round(1600 + Math.min(3400, area/16));
  return Infinity;
}

/* ==================== CIUDAD GENERADA POR RETICULA ======================
   Rellena el mapa de manzanas dejando calles entre ellas. Es DETERMINISTA:
   sale de mulberry32 con una semilla fija, se ejecuta una sola vez al cargar
   y produce exactamente los mismos muros en los dos extremos de una partida
   en linea. 'reservado' son los rectangulos de los hitos y las apariciones,
   que no se pisan.
   Las alturas generadas se quedan por DEBAJO de 100 m a proposito: por encima
   de esa cota un edificio se salta el descarte por distancia y se dibuja
   siempre, y eso solo pueden permitirselo los hitos contados.            */
function cityGrid(seed, ox, oy, cols, rows, cell, street, reservado, hMin, hMax, pDestr){
  const rnd = mulberry32(seed>>>0);
  const out = [];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const bx = ox + i*(cell+street), by = oy + j*(cell+street);
    const mw = Math.round(cell*(0.58+rnd()*0.34));
    const mh = Math.round(cell*(0.58+rnd()*0.34));
    const x  = Math.round(bx + (cell-mw)*rnd());
    const y  = Math.round(by + (cell-mh)*rnd());
    let choca=false;
    for(const r of reservado)
      if(x < r[0]+r[2] && x+mw > r[0] && y < r[1]+r[3] && y+mh > r[1]){ choca=true; break; }
    if(choca) continue;
    const destr = rnd() < pDestr;
    const hh = Math.round(hMin + rnd()*(hMax-hMin));
    /* material segun el tipo: torre de oficinas con cristal, bloque bajo con
       fachada de viviendas. Antes todos los bajos salian de chapa oxidada. */
    out.push(W(x,y,mw,mh, destr?'destr':'tall',
               destr?Math.round(hh*0.55):hh, destr?'apart':'glass'));
  }
  return out;
}

/* Farolas y arbolado a lo largo de las calles de la reticula. Determinista,
   como las manzanas. El motor ya reubica en espiral lo que caiga dentro de un
   muro, asi que basta con sembrar sobre las lineas de calle. */
function streetProps(seed, ox, oy, cols, rows, cell, street, w, h, arbolado){
  const rnd = mulberry32(seed>>>0), out = [];
  const paso = cell+street, med = street/2;
  const dentro=(x,y)=> x>70 && y>70 && x<w-70 && y<h-70;
  /* Un elemento por manzana y lado de calle. Con tres se llegaba a 360 farolas
     en Tokio: a seis llamadas de dibujo cada una, eso es mas coste que toda la
     ciudad junta. Con uno quedan ~30 visibles a la vez, que es lo que se ve. */
  const sembrar=(x,y,i,j)=>{
    if(!dentro(x,y)) return;
    const r=rnd();
    if(arbolado && r<0.30)      out.push(P('tree',  x, y));
    else if(r<0.60)             out.push(P('lamp',  x, y));
    else if(r<0.68)             out.push(P('bench', x, y));
    else if(r<0.73)             out.push(P('vend',  x, y));
    else if(r<0.77)             out.push(P('bin',   x, y));
  };
  for(let i=0;i<=cols;i++) for(let j=0;j<rows;j++){
    const lado = ((i+j)%2) ? 1 : -1;
    sembrar(Math.round(ox+i*paso-med+lado*(med-street*0.18)),
            Math.round(oy+j*paso+cell*0.5), i, j);
  }
  for(let j=0;j<=rows;j++) for(let i=0;i<cols;i++){
    const lado = ((i+j)%2) ? -1 : 1;
    sembrar(Math.round(ox+i*paso+cell*0.5),
            Math.round(oy+j*paso-med+lado*(med-street*0.18)), i, j);
  }
  return out;
}

/* ============================================================================
   j_audio.js — Motor de audio 100% procedural (Web Audio API)
   No hay ni un solo fichero de sonido: todo se sintetiza en tiempo real.
   Cadena: fuentes → panorámica posicional → seco/húmedo → compresor → master
   ========================================================================= */

const AU = {
  ctx:null, ok:false, started:false,
  master:null, comp:null, sfx:null, mus:null, verb:null, wet:null,
  vol:{ master:0.85, sfx:1.0, mus:0.55 }, muted:false,
  lx:0, ly:0, yaw:0,           // posición y orientación del oyente
  q:[], lastHit:0, hitCount:0,

  /* --------------------------- arranque --------------------------- */
  init(){
    if(this.ctx) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      const c = new AC();
      this.ctx = c;

      this.master = c.createGain(); this.master.gain.value = this.vol.master;
      this.comp = c.createDynamicsCompressor();
      this.comp.threshold.value = -14; this.comp.knee.value = 22;
      this.comp.ratio.value = 6; this.comp.attack.value = 0.004; this.comp.release.value = 0.22;
      // limitador suave (tanh): imposible que llegue a saturar digitalmente
      this.limit = c.createWaveShaper();
      const N=1024, curve=new Float32Array(N);
      for(let i=0;i<N;i++){ const x=(i/(N-1))*2-1; curve[i]=Math.tanh(x*1.6)/Math.tanh(1.6); }
      this.limit.curve=curve; this.limit.oversample='4x';
      this.comp.connect(this.limit); this.limit.connect(this.master);
      this.master.connect(c.destination);

      // reverberación: respuesta al impulso generada por ruido con caída exponencial
      this.verb = c.createConvolver();
      this.verb.buffer = this.impulse(2.6, 2.4);
      this.wet = c.createGain(); this.wet.gain.value = 0.30;
      this.verb.connect(this.wet); this.wet.connect(this.comp);

      this.sfx = c.createGain(); this.sfx.gain.value = this.vol.sfx;
      this.sfx.connect(this.comp);
      this.sfxVerb = c.createGain(); this.sfxVerb.gain.value = 0.34;
      this.sfxVerb.connect(this.verb);

      this.mus = c.createGain(); this.mus.gain.value = 0;
      this.mus.connect(this.comp);
      this.musVerb = c.createGain(); this.musVerb.gain.value = 0.4;
      this.musVerb.connect(this.verb); this.mus.connect(this.musVerb);

      this.ok = true;
      // planificador global de música (independiente del bucle de combate)
      this._timer = setInterval(()=>{ try{ this.tick(); }catch(e){} }, 50);
      return true;
    }catch(e){ this.ok=false; return false; }
  },
  resume(){
    if(!this.ok) this.init();
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    this.started = true;
    if(!this.M.on && typeof UI!=='undefined')
      this.musicStart(UI.screen==='match'?'combat':'menu');
  },
  impulse(dur, decay){
    const c=this.ctx, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=b.getChannelData(ch);
      for(let i=0;i<n;i++){
        const t=i/n;
        // eco temprano + cola difusa
        d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.15);
      }
    }
    return b;
  },
  noiseBuf(dur, shape){
    const c=this.ctx, n=Math.max(1,Math.floor(c.sampleRate*dur)), b=c.createBuffer(1,n,c.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<n;i++){
      const t=i/n;
      let e=1;
      if(shape==='rise')  e=Math.pow(t,2.2);
      if(shape==='fall')  e=Math.pow(1-t,2.0);
      if(shape==='burst') e=Math.pow(1-t,6.0);
      d[i]=(Math.random()*2-1)*e;
    }
    return b;
  },

  /* ------------------- utilidades de síntesis ------------------- */
  now(){ return this.ctx.currentTime; },
  bus(pos, verbAmt){
    /* devuelve el nodo de entrada para un sonido, ya panoramizado por posición */
    const c=this.ctx, g=c.createGain();
    let out=g;
    if(pos){
      const dx=pos.x-this.lx, dy=pos.y-this.ly;
      const d=Math.hypot(dx,dy);
      const rx=-Math.sin(this.yaw), ry=Math.cos(this.yaw);
      const pan=clamp((dx*rx+dy*ry)/380, -1, 1);
      const att=1/(1+Math.pow(d/300,1.5));
      g.gain.value = att;
      let p;
      if(c.createStereoPanner){ p=c.createStereoPanner(); p.pan.value=pan; }
      else { p=c.createPanner(); p.setPosition(pan,0,0.4); }
      g.connect(p); out=p;
      // los sonidos lejanos pierden agudos
      if(d>260){
        const lp=c.createBiquadFilter(); lp.type='lowpass';
        lp.frequency.value=Math.max(700, 9000-d*9);
        out.connect(lp); out=lp;
      }
    }
    out.connect(this.sfx);
    const v=verbAmt===undefined?0.35:verbAmt;
    if(v>0){ const sg=c.createGain(); sg.gain.value=v; out.connect(sg); sg.connect(this.verb); }
    return g;
  },
  osc(type, f0, f1, t0, dur, gainNode, peak, curve){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0);
    if(f1!==f0){
      if(curve==='exp') o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t0+dur);
      else o.frequency.linearRampToValueAtTime(f1, t0+dur);
    }
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+Math.min(0.012,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(gainNode);
    o.start(t0); o.stop(t0+dur+0.02);
    return o;
  },
  noise(shape, t0, dur, gainNode, peak, filt){
    const c=this.ctx, s=c.createBufferSource();
    s.buffer=this.noiseBuf(dur, shape||'burst');
    let node=s;
    if(filt){
      const f=c.createBiquadFilter();
      f.type=filt.type||'bandpass';
      f.frequency.setValueAtTime(filt.f0, t0);
      if(filt.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20,filt.f1), t0+dur);
      f.Q.value=filt.q||1;
      s.connect(f); node=f;
    }
    const g=c.createGain();
    g.gain.setValueAtTime(peak,t0);
    node.connect(g); g.connect(gainNode);
    s.start(t0); s.stop(t0+dur+0.02);
    return s;
  },

  /* ============================ SONIDOS ============================ */
  play(name, pos, opt){
    if(!this.ok || !this.started || this.muted) return;
    opt=opt||{};
    const c=this.ctx, t=this.now()+0.001;
    const p=opt.p!==undefined?opt.p:1;      // "potencia" 0..2
    const F=this['s_'+name];
    if(!F) return;
    // limitador de voces: evita el barullo cuando hay muchos impactos
    if(name==='hit'){
      if(t-this.lastHit<0.028) return;
      this.lastHit=t;
    }
    try{ F.call(this, this.bus(pos, opt.verb), t, p, opt); }catch(e){}
  },

  /* --- impacto físico --- */
  s_hit(b,t,p){
    const c=this.ctx;
    this.noise('burst', t, 0.09+0.05*p, b, 0.55*p, {type:'bandpass', f0:1700+400*p, f1:420, q:0.9});
    this.osc('sine', 180*p, 55, t, 0.13+0.05*p, b, 0.5*p, 'exp');
    this.osc('triangle', 420, 120, t, 0.07, b, 0.18*p, 'exp');
  },
  /* --- golpe al aire --- */
  s_swing(b,t,p){
    this.noise('fall', t, 0.17, b, 0.30*p, {type:'bandpass', f0:640, f1:2800, q:1.5});
    this.osc('sine', 520, 210, t, 0.09, b, 0.05*p, 'exp');
  },
  /* --- FLASH NEGRO: el sonido estrella --- */
  s_blackflash(b,t){
    const c=this.ctx;
    // 1) preparación: silencio breve y golpe brutal
    this.osc('sine', 150, 28, t, 1.1, b, 0.78, 'exp');           // sub que se hunde
    this.osc('sine', 74, 21, t, 1.6, b, 0.42, 'exp');
    this.noise('burst', t, 0.5, b, 0.62, {type:'lowpass', f0:5200, f1:220, q:6});
    this.noise('burst', t, 0.22, b, 0.36, {type:'highpass', f0:3200, f1:9000, q:0.7});
    // 2) campana metálica invertida (FM) que resuena

  /* ====================== MÚSICA ADAPTATIVA ====================== */
  /* Escala hirajoshi (japonesa) sobre un bordón: D, E, F, A, Bb        */
  M:{ on:false, next:0, step:0, intensity:0, target:0, drone:null, mode:'menu' },
  scale:[0,2,3,7,8],
  freq(semi){ return 110*Math.pow(2, semi/12); },

  musicStart(mode){
    if(!this.ok||!this.started) return;
    this.M.mode=mode||'menu';
    if(this.M.on) return;
    this.M.on=true; this.M.next=this.now()+0.1; this.M.step=0;
    this.mus.gain.cancelScheduledValues(this.now());
    this.mus.gain.setValueAtTime(this.mus.gain.value, this.now());
    this.mus.gain.linearRampToValueAtTime(this.vol.mus, this.now()+2.0);
    this.startDrone();
  },
  musicStop(){
    if(!this.ok) return;
    this.M.on=false;
    if(this.mus){
      const t=this.now();
      this.mus.gain.cancelScheduledValues(t);
      this.mus.gain.setValueAtTime(this.mus.gain.value,t);
      this.mus.gain.linearRampToValueAtTime(0.0001,t+1.2);
    }
    if(this.M.drone){ try{ this.M.drone.forEach(n=>n.stop(this.now()+1.3)); }catch(e){} this.M.drone=null; }
  },
  startDrone(){
    const c=this.ctx, t=this.now();
    if(this.M.drone) return;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520; f.Q.value=2;
    const g=c.createGain(); g.gain.value=0.16;
    f.connect(g); g.connect(this.mus);
    // LFO lento sobre el filtro: el bordón "respira"
    const lfo=c.createOscillator(), lg=c.createGain();
    lfo.frequency.value=0.06; lg.gain.value=260;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start(t);
    const nodes=[lfo];
    [55, 55.15, 82.4, 110].forEach((fr,i)=>{
      const o=c.createOscillator(); o.type=i===3?'triangle':'sawtooth';
      o.frequency.value=fr;
      const gg=c.createGain(); gg.gain.value=i===3?0.18:0.3;
      o.connect(gg); gg.connect(f); o.start(t); nodes.push(o);
    });
    this.M.drone=nodes;
  },
  /* percusión tipo taiko */
  taiko(t, vel){
    const c=this.ctx, g=c.createGain(); g.connect(this.mus);
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(48,t+0.22);
    const og=c.createGain();
    og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.7*vel,t+0.005);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    o.connect(og); og.connect(g); o.start(t); o.stop(t+0.4);
    const s=c.createBufferSource(); s.buffer=this.noiseBuf(0.12,'burst');
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1100; f.Q.value=0.8;
    const sg=c.createGain(); sg.gain.value=0.22*vel;
    s.connect(f); f.connect(sg); sg.connect(g); s.start(t); s.stop(t+0.14);
  },
  pluck(t, semi, vel){
    const c=this.ctx;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
    const fr=this.freq(semi);
    o.type='triangle'; o.frequency.value=fr;
    o2.type='sine'; o2.frequency.value=fr*2.01;
    f.type='lowpass'; f.frequency.setValueAtTime(4200,t);
    f.frequency.exponentialRampToValueAtTime(600,t+0.9); f.Q.value=1;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16*vel,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    const g2=c.createGain(); g2.gain.value=0.3;
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.mus);
    o.start(t); o2.start(t); o.stop(t+1.2); o2.stop(t+1.2);
  },
  /* planificador con anticipación */
  tick(){
    if(!this.ok||!this.M.on||!this.started) return;
    const M=this.M;
    M.intensity += (M.target-M.intensity)*0.02;
    const bpm = M.mode==='menu'?68:(84+M.intensity*26);
    const spb = 60/bpm/2;                       // corcheas
    const look=this.now()+0.35;
    let guard=0;
    while(M.next<look && guard++<16){
      const t=M.next, s=M.step, bar=Math.floor(s/8)%4;
      const I=M.intensity;
      if(M.mode!=='menu'){
        if(s%8===0) this.taiko(t, 0.9);
        else if(s%8===4) this.taiko(t, 0.55);
        else if(I>0.35 && s%8===6) this.taiko(t, 0.35+0.2*I);
        else if(I>0.7 && (s%8===3||s%8===7)) this.taiko(t, 0.28);
      } else if(s%16===0) this.taiko(t, 0.35);

      // motivo melódico disperso
      const density = M.mode==='menu'?0.16:0.16+I*0.30;
      if((s%2===0) && this.mrand(s)<density){
        const oct = this.mrand(s+91)<0.3?12:0;
        const deg = this.scale[Math.floor(this.mrand(s+7)*this.scale.length)];
        this.pluck(t, deg+oct+(bar===3?12:0), 0.5+0.5*I);
      }
      M.next+=spb; M.step++;
    }
  },
  mrand(n){ const x=Math.sin(n*127.1+M_SEED)*43758.5453; return x-Math.floor(x); },
  setIntensity(v){ this.M.target=clamp(v,0,1); },

  /* ---------------- drenaje de la cola de la simulación ------------- */
  drain(g){
    if(!this.ok||!this.started) return;
    const q=g.sfxq; if(!q) return;
    for(let i=0;i<q.length;i++){
      const e=q[i];
      this.play(e.n, (e.x!==undefined)?{x:e.x,y:e.y}:null, {p:e.p||1, el:e.el, dur:e.d, verb:e.v});
    }
    q.length=0;
  }
};
const M_SEED = 17.13;

/* --------- desbloqueo por gesto del usuario (política de autoplay) ------- */
/* ============================ AVISO DE FALLOS ============================
   Si algo revienta a mitad de partida, la pantalla se queda negra y sin abrir
   las herramientas del navegador no hay forma de saber por que. Esto pinta el
   error ENCIMA del juego, con su archivo y su linea, y un boton para copiarlo.
   Se queda callado mientras no pase nada.                                   */
(function(){
  const vistos = new Set();
  let caja = null;
  function muestra(txt){
    if(vistos.has(txt) || vistos.size > 6) return;
    vistos.add(txt);
    if(!caja){
      caja = document.createElement('div');
      caja.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:52%;overflow:auto;'+
        'z-index:2147483647;background:#1a0508;border-top:2px solid #ff4d5e;color:#ffd9dd;'+
        'font:12px/1.5 ui-monospace,Consolas,monospace;padding:12px 14px;white-space:pre-wrap';
      const barra = document.createElement('div');
      barra.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:8px';
      barra.innerHTML = '<b style="color:#ff8b96;font:600 12px system-ui;letter-spacing:1px">FALLO EN EL JUEGO</b>';
      const cop = document.createElement('button');
      cop.textContent='Copiar';
      cop.style.cssText='background:#2c0d12;border:1px solid #ff4d5e;color:#ffd9dd;border-radius:5px;'+
        'padding:3px 10px;font:11px system-ui;cursor:pointer';
      cop.onclick=()=>{ try{ navigator.clipboard.writeText(caja.dataset.txt||''); cop.textContent='Copiado'; }catch(e){} };
      const cer = document.createElement('button');
      cer.textContent='Cerrar';
      cer.style.cssText=cop.style.cssText;
      cer.onclick=()=>{ caja.remove(); caja=null; };
      barra.appendChild(cop); barra.appendChild(cer);
      caja.appendChild(barra);
      caja.cuerpo = document.createElement('div');
      caja.appendChild(caja.cuerpo);
      document.body.appendChild(caja);
      caja.dataset.txt='';
    }
    caja.dataset.txt += txt + '\n\n';
    caja.cuerpo.textContent = caja.dataset.txt;
  }
  window.addEventListener('error', e=>{
    muestra((e.message||'error') + '\n  en ' + (e.filename||'?') + ' línea ' + e.lineno + ':' + e.colno +
      (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0,4).join('\n') : ''));
  });
  window.addEventListener('unhandledrejection', e=>{
    const r = e.reason;
    muestra('Promesa rechazada: ' + (r && (r.stack || r.message) || String(r)));
  });
})();

/* ============================================================================
   c_engine.js — Simulación determinista a 60 Hz
   Todo el estado de combate vive aquí. El render NO toca la simulación.
   ========================================================================= */

const DT = 1/60;

/* ================== RITMO DEL COMBATE ==================
   Los tres mandos que alargan y espesan las peleas. Estan juntos a proposito:
   se tocan estos numeros y nada mas. Multiplican, no sustituyen, asi que las
   proporciones entre personajes del roster se conservan intactas.          */
/* Energia maldita que le cuesta a un enemigo de la maquina cada golpe basico.
   Los basicos son gratis para todo el mundo, asi que la IA los encadenaba sin
   parar y no daba respiro. Ahora se le agota, tiene que dejar de pegar
   mientras se recarga, y ese hueco es tu turno.
   Solo afecta a la IA: entre personas nadie paga por su basico, asi que el
   equilibrio del uno contra uno se queda exactamente como estaba. */
const IA_COSTE_BASICO = 8;

const TUNE = {
  hp:      1.50,   // mas aguante: las peleas duran
  ceRegen: 0.70,   // la energia maldita vuelve mas despacio: hay que dosificar
  domGain: 0.50,   // el calibre del dominio sube la mitad de rapido
  /* Quemadura, veneno y podredumbre. Pegaban demasiado y duraban demasiado, y
     encima al bajar la regeneracion de EM la Tecnica Reversa (17 EM/s) dejo de
     poder sostenerse: lo que antes te quitabas curandote, ahora se quedaba.
     El veneno a 3 acumulaciones llegaba a 36/s, el 71% del dano de un
     personaje entero, gratis y sin gastar energia.                          */
  dotDmg:  0.60,   // los efectos continuos pegan un 40% menos
  burnDmg: 0.70,   // y la quemadura, otro 30% menos encima
  dotDur:  0.75,   // y duran un 25% menos
  /* Pericia de la IA. Multiplica su dificultad efectiva, asi que respeta las
     proporciones: un jefe de historia sigue siendo mas duro que un esbirro,
     y los cuatro escalones de entrenamiento siguen escalando. */
  aiSkill: 0.78,
  /* Tecnica Reversa. Curaba 21/s por 17 de EM/s, numeros pensados para el
     ritmo antiguo. Con la vida un 50% mas alta curaba proporcionalmente menos,
     y con la regeneracion de EM al 70% casi no se podia sostener: 10 segundos
     escasos para recuperar el 12% de la vida. Sigue teniendo su precio real,
     que no es la energia sino el tiempo: mientras curas vas al 45% de
     velocidad y no atacas.                                                  */
  /* El ataque basico no se toco cuando subi la vida un 50%, asi que quedo
     valiendo un tercio menos en la practica: 40 de daño sobre 1.860 de vida
     son el 2%. Como es el unico recurso que NO gasta energia maldita, es
     justo el que tiene que sostener el combate entre tecnica y tecnica. */
  basicDmg: 1.50,
  rctHeal: 1.55,   // cura un 55% mas
  rctCost: 0.70    // y cuesta un 30% menos
};
const TAU = Math.PI*2;

/* ---------- utilidades deterministas ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const dist=(ax,ay,bx,by)=>Math.sqrt(dist2(ax,ay,bx,by));
const angDiff=(a,b)=>{let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- entrada ---------- */
function blankInput(){ return { ax:0, ay:0, aim:0, basic:false, q:false, e:false, r:false,
  dash:false, guard:false, rct:false, dom:false, bf:false }; }

/* =========================== CLASE GAME ================================= */
class Game {
  constructor(mapId, setups, seed, opts){
    opts = opts||{};
    this.mapId = mapId;
    this.map = MAPS[mapId];
    this.rng = mulberry32(seed>>>0);
    this.seed = seed;
    this.t = 0; this.frame = 0;
    this.over = false; this.winner = null;
    /* En las misiones de aguantar oleadas, quedarse sin enemigos vivos es un
       estado NORMAL: llegara la siguiente oleada. Sin esta bandera, el motor
       lo tomaba por victoria, ponia over=true, y como step() sale de inmediato
       cuando over es true, la partida se congelaba: no podias moverte y el
       reloj tampoco avanzaba, asi que la condicion de victoria real (aguantar
       los 75 s) no llegaba a cumplirse nunca. */
    this.survival = !!(opts && opts.survival);
    /* EL VELO de una mision de ciudad. Misma idea que la cupula del dominio:
       nadie sale hasta que acabe el combate. Vive en la simulacion. */
    this.veil = (opts && opts.veil) || null;
    this.fighters = []; this.projectiles = []; this.zones = []; this.fx = [];
    this.walls = this.map.walls.map(w=>{
      const hp = wallHP(w);
      return {...w, hp, maxhp:hp, dead:false, stage:0, collapse:0, shed:0};
    });
    this.props = [];
    this.buildProps();
    this.log = [];
    this.mode = opts.mode||'duel';
    this.timeLimit = opts.timeLimit||0;
    this.shake = 0; this.hitstop = 0;
    this.events = [];   // eventos para la UI (no afectan a la sim)
    this.sfxq = [];     // cola de sonidos para el motor de audio
    setups.forEach((s,i)=>this.spawnFighter(s,i));
  }

  /* ---------------------------- atrezo ----------------------------
     Los props del mapa se convierten en muros de verdad al arrancar la
     partida: un coche es cobertura que se puede reventar, no un adorno.
     Se descarta el que caiga encima de otro muro o pegado a un punto de
     aparición, así que colocarlos a ojo en los datos es seguro.          */
  buildProps(){
    const list=this.map.props||[];
    for(let i=0;i<list.length;i++){
      const p=list[i], d=PROP[p.t];
      if(!d) continue;
      const rot = Math.abs(Math.sin(p.a||0))>0.7;
      const pw = rot? d.h : d.w, ph = rot? d.w : d.h;
      const obj = { i, t:p.t, x:p.x, y:p.y, a:p.a||0, mat:d.mat||'', dead:false, wall:null };
      this.props.push(obj);
      if(d.t==='none' || !pw || !ph) continue;
      const w = { x:p.x-pw/2, y:p.y-ph/2, w:pw, h:ph, t:d.t, hh:0, mat:d.mat||'',
                  hpMul:d.hpMul||1, burn:d.burn||0, prop:i,
                  dead:false, stage:0, collapse:0, shed:0 };
      /* si el sitio exacto está pillado, se busca el hueco libre más cercano
         en espiral fija: coloca casi todo sin tener que cuadrar a mano
         doscientas coordenadas, y sigue siendo determinista. */
      let ok = !this.rectBlocked(w);
      if(!ok){
        for(let rad=28; rad<=160 && !ok; rad+=28){
          for(let k=0;k<12 && !ok;k++){
            const ang=k/12*TAU;
            const nx=p.x+Math.cos(ang)*rad, ny=p.y+Math.sin(ang)*rad;
            if(nx-pw/2<50||ny-ph/2<50||nx+pw/2>this.map.w-50||ny+ph/2>this.map.h-50) continue;
            w.x=nx-pw/2; w.y=ny-ph/2;
            if(!this.rectBlocked(w)){ ok=true; obj.x=nx; obj.y=ny; }
          }
        }
      }
      if(!ok) continue;
      /* Antes lo pequeño (farolas, papeleras, árboles, expendedoras) se
         atravesaba andando para no convertir el mapa en un laberinto. El
         remedio era peor: se veía al personaje metido DENTRO del árbol. Ahora
         todo el atrezo choca de verdad, y lo endeble se parte con sólo
         empujarlo, así que estorba un instante y nunca deja a nadie encallado. */
      w.soft = false;
      w.frag = !!d.frag;
      w.hp = w.maxhp = wallHP(w);
      this.walls.push(w);
      obj.wall = w;
    }
  }
  rectBlocked(r){
    for(const sp of this.map.spawns)
      if(Math.abs(sp[0]-(r.x+r.w/2))<130 && Math.abs(sp[1]-(r.y+r.h/2))<130) return true;
    for(const w of this.walls){
      if(w.prop!==undefined) continue;
      if(r.x+r.w>w.x && r.x<w.x+w.w && r.y+r.h>w.y && r.y<w.y+w.h) return true;
    }
    return false;
  }

  /* ------------------------- creación ------------------------- */
  /* busca la posición libre más cercana (evita aparecer dentro de un edificio) */
  findFree(x,y,r){
    if(!this.hitWall(x,y,r)) return [x,y];
    for(let rad=24; rad<=520; rad+=24){
      for(let k=0;k<16;k++){
        const a=k/16*TAU;
        const nx=clamp(x+Math.cos(a)*rad, r+8, this.map.w-r-8);
        const ny=clamp(y+Math.sin(a)*rad, r+8, this.map.h-r-8);
        if(!this.hitWall(nx,ny,r)) return [nx,ny];
      }
    }
    return [this.map.w/2, this.map.h/2];
  }

  spawnFighter(s, idx){
    const C = CHARS[s.cid];
    let sp = s.pos || this.map.spawns[idx % this.map.spawns.length];
    sp = this.findFree(sp[0], sp[1], s.minion?15:20);
    const f = {
      uid: this.fighters.length,
      cid: s.cid, C, team: s.team!==undefined?s.team:idx, name: s.name||C.name,
      x: sp[0], y: sp[1], vx:0, vy:0, ang: idx===0?0:Math.PI, r: s.minion?15:20,
      hp: C.hp*(s.hpMul||1)*TUNE.hp*((s.mast&&s.mast.hp)||1),
      maxhp: C.hp*(s.hpMul||1)*TUNE.hp*((s.mast&&s.mast.hp)||1),
      ce: (C.noCE?(C.stamina||100):C.ce)*((s.mast&&s.mast.ce)||1),
      maxce: (C.noCE?(C.stamina||100):C.ce)*((s.mast&&s.mast.ce)||1),
      ceRegen: (C.noCE?(C.staRegen||16):C.ceRegen)*TUNE.ceRegen,
      noCE: !!C.noCE, alive:true, minion:!!s.minion, minionOwner:s.owner,
      cds:{basic:0,Q:0,E:0,R:0,dash:0,dom:0,inf:0},
      status:{}, buffs:[],
      domGauge: s.startDom||0, domain:null, domT:0,
      marks:0, evidence:0, chips:0, stolen:0, usedOnce:{},
      atk:null, bf:{arm:false, s:0, e:0, active:false},
      lastAbility:null, comboFlags:{}, aiCfg: s.ai||null, ai:null,
      input: blankInput(), prevInput: blankInput(),
      dmgDealt:0, dmgTaken:0, bfCount:0, bfChain:0, bfLast:-99, bfStreak:0, phase:0, kills:0, ceSpent:0,
      healed:0, domCount:0, copyCount:0,
      look: s.look||null, rikaT:0, repelT:0, blockHit:0, blockAng:undefined,
      /* poder: el de una maldicion de mision, o el bono de maestria del heroe */
      powMul: (s.powMul||1)*((s.mast&&s.mast.pow)||1), spdMul: s.spdMul||1,
      lifetime: s.lifetime||0, born:this.t, invuln:0, stealth:0,
      copiedAb:null, adaptWheel:{}, tag:s.tag||null, abUse:{},
      locks: s.locks||null, bfBonus: s.bfBonus||0,
      dead:false, deathT:0
    };
    if(s.ceBonus && !C.noCE){ f.maxce += s.ceBonus; f.ce = f.maxce; }
    if(s.ai) f.ai = makeAI(s.ai);
    this.fighters.push(f);
    return f;
  }

  /* encola un sonido; nunca modifica el estado de la simulación */
  snd(n,x,y,o){ if(this.sfxq.length<48) this.sfxq.push(Object.assign({n,x,y},o||{})); }
  elemOf(f){ return ELEM[f.cid]||null; }

  ally(f){ return this.fighters.find(o=>o.alive&&o.team===f.team&&o!==f&&!o.minion); }
  enemiesOf(f){ return this.fighters.filter(o=>o.alive&&o.team!==f.team); }
  nearestEnemy(f){
    let best=null,bd=1e9;
    for(const o of this.enemiesOf(f)){ if(o.stealth>0&&this.rng()<0.5) continue;
      const d=dist2(f.x,f.y,o.x,o.y); if(d<bd){bd=d;best=o;} }
    return best;
  }

  /* ------------------------- paso principal ------------------------- */
  step(inputs){
    if(this.over){ this.frame++; return; }
    this.frame++; this.t += DT;
    if(this.hitstop>0){ this.hitstop-=DT; }
    const hs = this.hitstop>0;

    // aplicar entradas: IA propia o entrada externa (jugador / red)
    let pi=0;
    for(const f of this.fighters){
      if(!f.alive) continue;
      f.prevInput=f.input;
      if(f.ai) f.input = f.ai.think(this,f);
      else { f.input = inputs[pi]||blankInput(); pi++; }
    }

    if(!hs){
      for(const f of this.fighters) this.stepFighter(f);
      this.stepProjectiles();
      this.stepZones();
      this.stepCollapse();
    }
    this.stepFX();
    if(this.shake>0) this.shake = Math.max(0,this.shake-DT*3.2);

    // condición de victoria
    const alive0 = this.fighters.some(f=>f.alive&&f.team===0&&!f.minion);
    const alive1 = this.fighters.some(f=>f.alive&&f.team===1&&!f.minion);
    if(!alive0 || (!alive1 && !this.survival)){
      this.over=true; this.winner = alive0?0:(alive1?1:-1); }
    if(this.timeLimit&&this.t>=this.timeLimit&&!this.over){
      this.over=true;
      const a=this.fighters.find(f=>f.team===0&&!f.minion), b=this.fighters.find(f=>f.team===1&&!f.minion);
      this.winner = (a.hp/a.maxhp)>=(b.hp/b.maxhp)?0:1;
    }
  }

  /* ------------------------- luchador ------------------------- */
  stepFighter(f){
    if(!f.alive) return;
    if(f.lifetime && this.t-f.born>f.lifetime){ f.alive=false; this.puff(f.x,f.y,f.C.color); return; }

    // temporizadores
    for(const k in f.cds) if(f.cds[k]>0) f.cds[k]-=DT;
    if(f.invuln>0) f.invuln-=DT;
    if(f.stealth>0) f.stealth-=DT;
    for(const k in f.status){ f.status[k].t-=DT; if(f.status[k].t<=0) delete f.status[k]; }
    f.buffs = f.buffs.filter(b=>{ b.t-=DT; return b.t>0; });

    // pasivas continuas
    this.passiveTick(f);

    if(f.rikaT>0) f.rikaT-=DT;          // cuenta atras de Rika
    if(f.repelT>0) f.repelT-=DT;        // rebote contra una guardia
    if(f.blockHit>0) f.blockHit-=DT;    // sacudida del que para el golpe

    // dominio propio
    /* El reloj del dominio corria TAMBIEN durante el hitstop. Como el corte
       cinematico que añadi dura 2 s, cada dominio perdia 2 s de los suyos, y
       el de Mahito (Auto-Encarnacion, 0,25 s) se agotaba entero dentro de la
       pausa: se abria y se cerraba sin que llegara a verse ni a surtir efecto.
       La pausa es un momento de enfasis, no parte de la duracion. */
    if(f.domain && this.hitstop<=0){
      f.domT-=DT;
      this.domainTick(f);
      if(f.domT<=0){ this.closeDomain(f); }
    }

    // estados incapacitantes
    const stunned = f.status.stun||f.status.freeze||f.status.paralysis;
    const nullified = !!f.status.nullify || !!f.status.confiscate;

    // regeneración de energía maldita
    let regen = f.ceRegen*this.mod(f,'ceRegen');
    if(f.status.noRegen) regen = 0;
    f.ce = clamp(f.ce + regen*DT, 0, f.maxce);

    // daño por estados
    if(f.status.burn) this.damage(null,f,f.status.burn.dps*TUNE.dotDmg*TUNE.burnDmg*DT,{type:'burn',silent:true});
    if(f.status.poison) this.damage(null,f,f.status.poison.dps*f.status.poison.st*TUNE.dotDmg*DT,{type:'poison',silent:true});
    if(f.status.soulrot) this.damage(null,f,9*TUNE.dotDmg*DT,{type:'soul',silent:true});
    if(f.selfDot) this.damage(null,f,f.selfDot*DT,{type:'self',silent:true});
    if(f.status.drain){ const s=Math.min(f.ce,12*DT); f.ce-=s; }

    const inp = stunned? blankInput() : f.input;

    /* ---- movimiento ---- */
    let sp = f.C.speed*this.mod(f,'speed');
    if(f.status.slow) sp *= 0.55;
    if(f.status.wet) sp *= 0.88;
    if(inp.guard && this.canSpend(f,1)) sp *= 0.5;
    if(inp.rct && !f.noCE) sp *= 0.45;
    if(f.atk && f.atk.rooted) sp *= 0.6;
    if(this.tileAt(f.x,f.y)==='water') sp *= 0.68;
    // ÍMPETU: los especialistas de corto alcance aceleran para cerrar distancia
    if(f.spdMul && f.spdMul!==1) sp *= f.spdMul;                     // maldición anclada
    if((f.C.rangeType||'').startsWith('Corto')){
      let nd=1e9;
      for(const o of this.fighters) if(o.alive&&o.team!==f.team&&!o.minion)
        nd=Math.min(nd, dist2(f.x,f.y,o.x,o.y));
      if(nd>200*200) sp *= 1.28;
    }

    let ax=inp.ax, ay=inp.ay;
    const m=Math.hypot(ax,ay); if(m>1){ax/=m;ay/=m;}
    f.vx = lerp(f.vx, ax*sp, 0.32); f.vy = lerp(f.vy, ay*sp, 0.32);

    // empuje residual
    if(f.push){ f.vx+=f.push.x; f.vy+=f.push.y; f.push.x*=0.86; f.push.y*=0.86;
      if(Math.abs(f.push.x)+Math.abs(f.push.y)<4) f.push=null; }

    // esquiva
    if(f.dashT>0){
      f.dashT-=DT;
      f.vx=Math.cos(f.dashAng)*f.dashSpd; f.vy=Math.sin(f.dashAng)*f.dashSpd;
      if(f.dashDmg){ for(const o of this.enemiesOf(f)) if(dist(f.x,f.y,o.x,o.y)<f.dashR+o.r&&!f.dashHit.has(o.uid)){
        f.dashHit.add(o.uid); this.damage(f,o,f.dashDmg,{type:'dash',status:f.dashStatus,elec:f.dashElec}); } }
      if(f.C.passive.id==='lightning') this.addFX({type:'trail',x:f.x,y:f.y,c:f.C.color,life:.35});
    }

    this.moveWithCollision(f);
    this.confineToDomain(f);
    /* dentro del velo: mismo empuje que la cupula, y depenetrate detras para
       no encajar a nadie en un edificio de la manzana */
    if(this.veil){
      const V=this.veil, R=V.r-f.r;
      const dx=f.x-V.x, dy=f.y-V.y, d=Math.hypot(dx,dy);
      if(d>R && d>1e-4){
        const nx=dx/d, ny=dy/d;
        f.x=V.x+nx*R; f.y=V.y+ny*R;
        const vn=f.vx*nx+f.vy*ny;
        if(vn>0){ f.vx-=nx*vn; f.vy-=ny*vn; }
        this.depenetrate(f);
      }
    }

    // apuntado
    /* Al bloquear te quedas encarando hacia donde empezaste: la guardia deja
       de poder girar sobre si misma para tapar cualquier angulo, y pasa a ser
       una decision con compromiso. Se suelta al dejar de bloquear. */
    if(f.guarding){
      if(f.blockAng===undefined) f.blockAng = stunned ? f.ang : inp.aim;
      f.ang = f.blockAng;
    } else {
      f.blockAng = undefined;
      if(!stunned) f.ang = inp.aim;
    }

    /* ---- reversa maldita (curación) ---- */
    if(inp.rct && !f.noCE && !stunned && !f.status.soulcut && f.hp<f.maxhp){
      const rate = f.cid==='yuta'?1.6:1.0;
      const cost = 17*TUNE.rctCost*DT;
      if(f.ce<cost && this.frame%36===0)
        this.ev('nocost', f, 'SIN ENERGÍA PARA LA TÉCNICA REVERSA');
      if(f.ce>=cost){ f.ce-=cost;
        const h0=f.hp; f.hp=Math.min(f.maxhp,f.hp+21*TUNE.rctHeal*rate*DT); f.healed+=f.hp-h0;
        if(this.frame%6===0) this.addFX({type:'heal',x:f.x,y:f.y,life:.5});
        if(this.frame%40===0) this.snd('heal', f.x, f.y); }
    }
    /* ---- refuerzo / guardia ---- */
    f.guarding = false;
    if(inp.guard && !stunned){
      const cost=8*DT;
      if(f.ce>=cost){ f.ce-=cost; f.guarding=true;
        if(this.frame%8===0) this.addFX({type:'guard',x:f.x,y:f.y,c:f.C.color,life:.25}); }
    }

    /* ---- esquiva ---- */
    if(f.dashT>0 && this.frame%3===0) this.damageWallsIn(f.x, f.y, f.r+22, 46, f);
    /* La esquiva ya no cuesta energia maldita: su limite es el enfriamiento de
       1,5 s, que es lo que de verdad regula cuanto puedes esquivar. Cobrarla
       ademas castigaba doblemente al que iba justo de energia. */
    if(inp.dash && !f.prevInput.dash && f.cds.dash<=0 && !stunned){
      f.cds.dash=1.5; f.dashT=0.17; f.dashSpd=980; f.dashAng=(Math.hypot(inp.ax,inp.ay)>0.1)?Math.atan2(inp.ay,inp.ax):f.ang;
      f.invuln=Math.max(f.invuln,0.19); f.dashHit=new Set(); f.dashDmg=0;
      this.addFX({type:'dash',x:f.x,y:f.y,a:f.dashAng,c:f.C.color,life:.3});
      this.snd('dash', f.x, f.y);
    }

    /* ---- ataque básico ---- */
    if(inp.basic && !f.prevInput.basic && !stunned){
      if(f.atk && f.bf.armWindow) { /* pulsación de Flash Negro */ }
      if(f.cds.basic<=0 && !f.atk){
        const coste = f.ai ? Math.max(f.C.basic.cost||0, IA_COSTE_BASICO) : (f.C.basic.cost||0);
        if(!coste || this.spend(f, coste)) this.startAttack(f, f.C.basic, 'basic');
      }
      else this.tryArmBF(f);
    }
    /* ---- habilidades ---- */
    if(!stunned && !nullified){
      const keys=[['q','Q',0],['e','E',1],['r','R',2]];
      for(const [ik,kk,idx] of keys){
        if(inp[ik] && !f.prevInput[ik]){
          if(f.locks && f.locks[kk]){ this.snd('locked',f.x,f.y);
            this.ev('locked',f,'Técnica '+kk+' bloqueada — sube la maestría'); continue; }
          const ab = (kk==='Q'&&f.copiedAb)?f.copiedAb:f.C.abilities[idx];
          if(ab && f.cds[kk]<=0) this.useAbility(f, ab, kk);
        }
      }
      /* ---- dominio ---- */
      if(inp.dom && !f.prevInput.dom && f.C.domain && !f.domain && f.domGauge>=100 && f.cds.dom<=0){
        if(f.locks && f.locks.dom){ this.snd('locked',f.x,f.y);
          this.ev('locked',f,'Dominio bloqueado — maestría 50'); }
        else this.openDomain(f);
      }
    }
    /* ---- Flash Negro (tecla dedicada) ---- */
    if(inp.bf && !f.prevInput.bf) this.tryArmBF(f);

    /* ---- resolución del ataque en curso ---- */
    if(f.atk) this.stepAttack(f);

    // acumulación de calibre del dominio
    f.domGauge = clamp(f.domGauge, 0, 100);
  }

  tryArmBF(f){
    if(!f.atk) return;
    if(this.t>=f.bf.s && this.t<=f.bf.e){
      f.bf.arm=true;
      f.bf.perfecto = (this.t>=f.bf.ps && this.t<=f.bf.pe);
      this.addFX({type:'bfring',x:f.x,y:f.y,life:.2});
    } else if(!f.bf.arm){
      /* pulsar fuera de tiempo lo dice, en vez de no pasar nada: sin esta
         señal no hay forma de aprender el ritmo. */
      f.bfChain=0;
      this.ev('bfmiss', f, this.t < f.bf.s ? 'DEMASIADO PRONTO' : 'DEMASIADO TARDE');
    }
  }

  /* ------------------------- ataques ------------------------- */
  startAttack(f, ab, kind){
    const windup = ab.windup!==undefined?ab.windup:0.13;
    /* ================== FLASH NEGRO, REHECHO ==================
       La ventana era de 0,055 s: tres fotogramas y medio a 60 Hz. Eso no es
       una mecanica de habilidad, es una loteria — se acertaba de casualidad y
       no se podia aprender. Ahora hay DOS ventanas concentricas:
         BUENO    ±0,13 s  (unos 8 fotogramas)  daño x2,0
         PERFECTO ±0,045 s (el centro exacto)   daño x3,0
       Se sigue premiando la precision, pero ahora existe un escalon medio que
       permite entender que te acercas en vez de acertar o nada.            */
    /* La ventana NO puede pasar del 55% de la carga. Con ±0,13 s sobre una
       carga de 0,13 s se abria en el fotograma cero: no existia la zona de
       'demasiado pronto' y cualquier clic era Flash Negro. Como consecuencia
       la racha tampoco subia nunca, porque se cobraba en cada golpe. */
    const anchoBase = Math.min(0.085, windup*0.55)
                    * (f.C.passive.id==='bf_master'?1.8:1)
                    * this.mod(f,'bfWindow',1) * (1+(f.bfBonus||0));
    const anchoFino = anchoBase*0.38;
    f.atk = { ab, kind, t:0, windup, done:false, hits:0, rooted:ab.type==='melee' };
    if(!ab.proj) this.snd('swing', f.x, f.y, {p:kind==='basic'?0.7:1.0});
    f.bf = { arm:false, perfecto:false, active:false,
             s:this.t+windup-anchoBase, e:this.t+windup+anchoBase,
             ps:this.t+windup-anchoFino, pe:this.t+windup+anchoFino,
             centro:this.t+windup };
    f.cds.basic = kind==='basic' ? (ab.cd||0.4) : 0.34;
  }

  stepAttack(f){
    const a=f.atk; a.t+=DT;
    if(!a.done && a.t>=a.windup){
      a.done=true;
      /* SEGUNDA VIA AL FLASH NEGRO: LA RACHA. Cuatro basicos seguidos que
         conecten, sin fallar ninguno y sin que te toquen, y el quinto sale
         como Flash Negro solo. Premia sostener la presion en vez del pulso.
         Da el nivel BUENO: el x3 perfecto se sigue ganando con la ventana. */
      this.resolveMelee(f, a.ab,
        f.bf.arm || (f.atk && f.atk.kind==='basic' && (f.bfStreak||0)>=4));
      const hits = a.ab.hits||1;
      if(hits>1){ for(let i=1;i<hits;i++){ const d=(a.ab.hitDelay||0.15)*i;
        this.schedule(d, ()=>{ if(f.alive) this.resolveMelee(f,a.ab,false,0.85); }); } }
    }
    if(a.t>a.windup+0.16) f.atk=null;
  }

  resolveMelee(f, ab, isBF, mul){
    mul = mul||1;
    const range = (ab.range||80), arc = (ab.arc!==undefined?ab.arc:1.5);
    // básico a distancia (Nobara, Jogo, Uraume, Kenjaku)
    if(ab.proj){
      this.fireProjectile(f, {...ab, ...ab.proj, type:'projectile', count:1, dmg:ab.dmg}, isBF);
      return;
    }
    let any=false;
    for(const o of this.enemiesOf(f)){
      const d=dist(f.x,f.y,o.x,o.y);
      if(d>range+o.r) continue;
      if(arc>0){ const a2=Math.atan2(o.y-f.y,o.x-f.x); if(Math.abs(angDiff(a2,f.ang))>arc/2) continue; }
      if(!this.los(f.x,f.y,o.x,o.y) && range>140) continue;
      any=true;
      let dmg = ab.dmg*mul;
      if(f.atk && f.atk.kind==='basic') dmg *= TUNE.basicDmg;
      if(ab.adaptive) dmg *= 1 + 0.45*(o.ce/Math.max(1,o.maxce));
      if(ab.evidenceScale) dmg *= 1 + 0.09*f.evidence;
      if(ab.execute && o.hp/o.maxhp<=ab.execute) dmg*=2;
      this.damage(f,o,dmg,{type:'melee',bf:isBF,bfPerfecto:isBF&&f.bf.perfecto,kb:ab.kb,status:ab.status,burn:ab.burn,ab});
    }
    if(any&&isBF){ f.bf.arm=false; }
    /* la racha solo la mueven los basicos: fallar uno la corta, y al cobrarla
       vuelve a cero para que no se encadene sola */
    if(f.atk && f.atk.kind==='basic'){
      if(!any)                       f.bfStreak = 0;   // fallas: se corta
      else if((f.bfStreak||0)>=4)    f.bfStreak = 0;   // la has cobrado
      else f.bfStreak = Math.min(4, (f.bfStreak||0)+1);
    }
    /* el golpe también entra en lo que tenga delante: muros, coches, vallas */
    {
      const hx=f.x+Math.cos(f.ang)*range*0.72, hy=f.y+Math.sin(f.ang)*range*0.72;
      this.damageWallsIn(hx, hy, Math.max(34, range*0.45),
                         ab.dmg*mul*(isBF?2.8:1)*0.9*((f.atk&&f.atk.kind==='basic')?TUNE.basicDmg:1), f);
    }
    this.addFX({type:'slash',x:f.x,y:f.y,a:f.ang,r:range,arc,c:isBF?'#fff':f.C.color,bf:isBF,life:.22});
  }

  /* ------------------------- habilidades ------------------------- */
  useAbility(f, ab, key){
    if(ab.requires){ for(const r of ab.requires) if(!f.comboFlags[r]) { this.ev('req',f,'Requiere '+ab.requires.join('+')); return; } }
    if(ab.once && f.usedOnce[key]) return;
    const cost = ab.cost||0;
    /* Antes fallaba en silencio: pulsabas la tecla y no pasaba nada, sin
       manera de distinguir si era el enfriamiento, un candado o la energia. */
    if(!this.spend(f,cost)){
      this.ev('nocost', f, (f.noCE?'VIGOR':'ENERGÍA MALDITA')+' INSUFICIENTE · faltan '+
              Math.ceil(cost-f.ce));
      this.snd('locked', f.x, f.y);
      return;
    }
    if(ab.selfDmg) this.damage(null,f,ab.selfDmg,{type:'self',silent:true});
    f.cds[key]=ab.cd; f.lastAbility={...ab}; f.comboFlags[key]=true;
    f.abUse[key]=(f.abUse[key]||0)+1;      // contador de usos (lo lee el tutorial)
    if(ab.once) f.usedOnce[key]=true;
    this.ev('cast',f,ab.name);

    switch(ab.type){
      case 'melee':
        if(ab.lunge){
          // embestida corta: nunca sobrepasar al objetivo (si no, el golpe quedaría a la espalda)
          const tg=this.nearestEnemy(f);
          let L=ab.lunge;
          if(tg){ const dd=dist(f.x,f.y,tg.x,tg.y);
            L=clamp(dd-(ab.range||80)*0.55, 0, ab.lunge);
            f.ang=Math.atan2(tg.y-f.y,tg.x-f.x); }
          if(L>6){ const d2=this.findFree(f.x+Math.cos(f.ang)*L, f.y+Math.sin(f.ang)*L, f.r);
            f.x=d2[0]; f.y=d2[1];
            this.addFX({type:'dash',x:f.x,y:f.y,a:f.ang,c:f.C.color,life:.25}); }
        }
        this.startAttack(f,ab,'ability'); break;
      case 'projectile': this.fireProjectile(f,ab,false); break;
      case 'beam': this.fireBeam(f,ab); break;
      case 'dash': {
        f.dashT=(ab.dist/ab.speed); f.dashSpd=ab.speed; f.dashAng=f.ang;
        f.invuln=Math.max(f.invuln, ab.iframes||0); f.dashHit=new Set();
        f.dashDmg=ab.dmg; f.dashR=ab.radius||48; f.dashStatus=ab.status; f.dashElec=ab.elec;
        this.addFX({type:'dash',x:f.x,y:f.y,a:f.ang,c:f.C.color,life:.35});
        break; }
      case 'aoe': {
        let tx=f.x,ty=f.y;
        if(ab.at==='cursor'){ const mr=ab.maxRange||400;
          tx=f.x+Math.cos(f.ang)*Math.min(mr,ab.aimDist||mr);
          ty=f.y+Math.sin(f.ang)*Math.min(mr,ab.aimDist||mr);
          if(f.input.tx!==undefined){ const dd=dist(f.x,f.y,f.input.tx,f.input.ty);
            const k=Math.min(1,mr/Math.max(1,dd)); tx=f.x+(f.input.tx-f.x)*k; ty=f.y+(f.input.ty-f.y)*k; } }
        this.zones.push({kind:'aoe',x:tx,y:ty,r:ab.radius,t:0,delay:ab.delay||0,src:f,ab,
          done:false,life:(ab.delay||0)+((ab.burn||ab.dot)?(ab.burn?ab.burn.dur:ab.dot.dur):0.35),
          tele:ab.telegraph});
        if(ab.shiki) this.addFX({type:'shiki', kind:ab.shiki, x:tx, y:ty, a:f.ang,
          c:f.C.color, life:(ab.delay||0)+1.0, hit:(ab.delay||0)});
        break; }
      case 'buff': {
        f.buffs.push({t:ab.dur, mods:ab.mods||{}, name:ab.name});
        if(ab.heal) f.hp=Math.min(f.maxhp,f.hp+ab.heal*TUNE.hp);
        if(ab.stealth) f.stealth=ab.dur;
        if(ab.simpleDomain) this.applyStatus(f,'simpleDomain',ab.dur);
        if(ab.selfDot){ f.selfDot=(f.selfDot||0)+ab.selfDot;
          this.schedule(ab.dur+8, ()=>{ f.selfDot=Math.max(0,(f.selfDot||0)-ab.selfDot); }); }
        this.addFX({type:'burst',x:f.x,y:f.y,c:f.C.color,r:70,life:.5});
        this.snd('guard', f.x, f.y);
        break; }
      case 'summon': {
        /* TOPE DE INVOCACIONES. No existia ninguno, y en tres personajes la
           duracion supera al enfriamiento -- Mahito 11s contra 10s, Megumi
           20s contra 11s, Higuruma 14s contra 12s -- asi que cada oleada se
           sumaba a la anterior y el campo se llenaba de bichos. Con las
           peleas ya mas largas era aun peor: daba tiempo a mas oleadas.
           Ahora una habilidad con count:3 nunca tiene mas de 3 vivas: la
           oleada nueva RELEVA a la vieja. Se hace caducando a las antiguas
           por su propia via de expiracion, sin tocar el sistema de muerte. */
        const vivas = this.fighters.filter(o=>o.alive && o.minion &&
                        o.minionOwner===f.uid && o.tag===ab.unit);
        for(const o of vivas) o.born = this.t - (o.lifetime||1) - 0.01;

        for(let i=0;i<ab.count;i++){
          const a=(i/ab.count)*TAU + this.rng()*0.6;
          const s=this.spawnFighter({cid:'curse_grunt',team:f.team,minion:true,owner:f.uid,
            pos:[f.x+Math.cos(a)*46,f.y+Math.sin(a)*46],lifetime:ab.dur,
            ai:{diff:0.7,style:'rush'},tag:ab.unit},this.fighters.length);
          s.maxhp=ab.uhp; s.hp=ab.uhp; s.C={...CHARS.curse_grunt,speed:ab.uspeed,
            color:f.C.color, basic:{...CHARS.curse_grunt.basic,dmg:ab.udmg}, kanji:UNIT_KANJI[ab.unit]||'呪'};
          s.r=ab.unit==='dog'?17:14;
        }
        this.snd('summon', f.x, f.y);
        break; }
      case 'special': this.special(f,ab); break;
    }
  }

  special(f, ab){
    switch(ab.fx){
      case 'boogie': {
        const o=this.nearestEnemy(f);
        if(o && dist(f.x,f.y,o.x,o.y)<600){
          const ox=f.x, oy=f.y;
          // aparece a la espalda del rival (intercambio con un escombro cargado)
          const a2=Math.atan2(o.y-f.y,o.x-f.x);
          const dest=this.findFree(o.x+Math.cos(a2)*54, o.y+Math.sin(a2)*54, f.r);
          f.x=dest[0]; f.y=dest[1]; f.ang=a2+Math.PI;
          this.addFX({type:'burst',x:ox,y:oy,c:'#8b5cf6',r:60,life:.4});
          this.addFX({type:'burst',x:f.x,y:f.y,c:'#8b5cf6',r:60,life:.4});
          f.buffs.push({t:2.0,mods:{power:1.6,bfWindow:2.0},name:'Mejor amigo'});
        }
        break; }
      case 'hairpin': {
        for(const o of this.enemiesOf(f)){
          if(o.marks>0){ const d=ab.dmg*(1+0.35*o.marks);
            this.damage(f,o,d,{type:'nail'}); o.marks=Math.max(0,o.marks-2);
            this.addFX({type:'burst',x:o.x,y:o.y,c:'#e0863c',r:ab.radius,life:.45}); } }
        this.addFX({type:'burst',x:f.x,y:f.y,c:'#e0863c',r:ab.radius,life:.4});
        break; }
      case 'resonance': {
        const o=this.enemiesOf(f).sort((a,b)=>b.marks-a.marks)[0];
        if(o && o.marks>=2){
          this.applyStatus(f,'channel',ab.channel);
          this.schedule(ab.channel, ()=>{ if(f.alive&&o.alive){
            this.damage(f,o,ab.dmg*(1+0.18*o.marks),{type:'soul',pierceGuard:true,ignoreInfinity:true});
            this.addFX({type:'resonance',x:o.x,y:o.y,life:.7}); this.shake=1.0; } });
        } else this.ev('req',f,'Necesitas 2 marcas');
        break; }
      case 'collapse': {
        const o=this.nearestEnemy(f); if(!o) break;
        let best=null,bd=1e9;
        for(const w of this.walls){ if(w.dead||w.t==='water'||w.t==='pit') continue;
          const cx=w.x+w.w/2, cy=w.y+w.h/2, d=dist2(o.x,o.y,cx,cy);
          if(d<bd&&d<300*300){bd=d;best=w;} }
        if(best){ best.dead=true; this.gridDirty=true;
          const cx=best.x+best.w/2, cy=best.y+best.h/2;
          this.zones.push({kind:'aoe',x:cx,y:cy,r:ab.radius,t:0,delay:0.45,src:f,
            ab:{dmg:ab.dmg,radius:ab.radius,kb:220},done:false,life:0.8,tele:true});
          this.addFX({type:'rubble',x:cx,y:cy,r:ab.radius,life:.9}); this.shake=0.8;
        } else { // sin edificio: daño directo reducido
          this.zones.push({kind:'aoe',x:o.x,y:o.y,r:ab.radius*0.7,t:0,delay:0.4,src:f,
            ab:{dmg:ab.dmg*0.55,radius:ab.radius*0.7},done:false,life:0.7,tele:true}); }
        break; }
      case 'copy': {
        const hitAny=this.meleeHitScan(f,ab.range||110,1.4);
        if(hitAny){ this.damage(f,hitAny,ab.dmg,{type:'melee'});
          if(hitAny.lastAbility){ f.copyCount++;
            f.copiedAb={...hitAny.lastAbility, name:'Copia: '+hitAny.lastAbility.name, cd:Math.max(3,hitAny.lastAbility.cd*0.8)};
            this.schedule(18,()=>{ f.copiedAb=null; });
            this.ev('copy',f,'Copiada: '+hitAny.lastAbility.name); } }
        break; }
      case 'chain': {
        const o=this.nearestEnemy(f);
        if(o && dist(f.x,f.y,o.x,o.y)<ab.range){
          this.damage(f,o,ab.dmg,{type:'chain'});
          const a=Math.atan2(f.y-o.y,f.x-o.x);
          o.push={x:Math.cos(a)*26,y:Math.sin(a)*26};
          this.addFX({type:'chain',x1:f.x,y1:f.y,x2:o.x,y2:o.y,life:.35}); }
        break; }
    }
  }

  meleeHitScan(f,range,arc){
    for(const o of this.enemiesOf(f)){
      const d=dist(f.x,f.y,o.x,o.y); if(d>range+o.r) continue;
      const a2=Math.atan2(o.y-f.y,o.x-f.x); if(Math.abs(angDiff(a2,f.ang))>arc/2) continue;
      return o; }
    return null;
  }

  /* ------------------------- proyectiles ------------------------- */
  fireProjectile(f, ab, isBF){
    const n=ab.count||1, spread=ab.spread||0;
    for(let i=0;i<n;i++){
      const off = n===1?0:(i/(n-1)-0.5)*spread*2;
      const a = f.ang + off + (spread&&n===1?(this.rng()-0.5)*spread:0);
      this.projectiles.push({
        x:f.x+Math.cos(a)*24, y:f.y+Math.sin(a)*24, vx:Math.cos(a)*ab.speed, vy:Math.sin(a)*ab.speed,
        r:ab.radius||8, dmg:ab.dmg, life:ab.life||1.2, src:f, team:f.team, ang:a,
        pierce:ab.pierce||0, hit:new Set(), homing:ab.homing||0, explode:ab.explode,
        status:ab.status, burn:ab.burn, mark:ab.mark, pull:ab.pull, kb:ab.kb, elec:ab.elec,
        drain:ab.drain, crescent:ab.crescent, bf:isBF, c:f.C.color, ab,
        el:this.elemOf(f)
      });
    }
    this.addFX({type:'muzzle',x:f.x+Math.cos(f.ang)*24,y:f.y+Math.sin(f.ang)*24,a:f.ang,c:f.C.color,life:.15});
    this.snd('shoot', f.x, f.y, {el:this.elemOf(f), p:ab.dmg>60?1.2:0.9});
  }

  stepProjectiles(){
    for(let i=this.projectiles.length-1;i>=0;i--){
      const p=this.projectiles[i];
      p.life-=DT;
      if(p.homing){
        const tgt=this.fighters.find(o=>o.alive&&o.team!==p.team&&!o.minion);
        if(tgt){ const want=Math.atan2(tgt.y-p.y,tgt.x-p.x);
          const cur=Math.atan2(p.vy,p.vx); const na=cur+clamp(angDiff(want,cur),-p.homing*DT,p.homing*DT);
          const sp=Math.hypot(p.vx,p.vy); p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp; p.ang=na; } }
      const ox=p.x, oy=p.y;
      p.x+=p.vx*DT; p.y+=p.vy*DT;
      let gone=false;
      if(p.life<=0) gone=true;
      if(!gone){
        /* barrido continuo: un proyectil recorre a menudo más de su propio
           diámetro por fotograma y, comprobando sólo el destino, se colaba a
           través de esquinas y paredes finas sin tocarlas */
        const hit = this.sweepWall(ox,oy,p.x,p.y,p.r,true) ||
                    (this.hitWall(p.x,p.y,p.r,true) ? {w:this.hitWall(p.x,p.y,p.r,true), x:p.x, y:p.y} : null);
        if(hit){ p.x=hit.x; p.y=hit.y;
          this.damageWall(hit.w, (p.dmg||20)*1.25, p.x, p.y, p.src); this.onProjEnd(p); gone=true; }
      }
      if(!gone) for(const o of this.fighters){
        if(!o.alive||o.team===p.team||p.hit.has(o.uid)) continue;
        if(dist(p.x,p.y,o.x,o.y)>p.r+o.r) continue;
        p.hit.add(o.uid);
        this.damage(p.src,o,p.dmg,{type:'proj',kb:p.kb,status:p.status,burn:p.burn,bf:p.bf,elec:p.elec});
        if(p.mark){ o.marks=Math.min(6,o.marks+p.mark); }
        if(p.drain){ const s=Math.min(o.ce,p.drain); o.ce-=s; if(p.src)p.src.ce=Math.min(p.src.maxce,p.src.ce+s); }
        if(p.pull){ const a=Math.atan2(p.src.y-o.y,p.src.x-o.x); o.push={x:Math.cos(a)*p.pull*DT*4,y:Math.sin(a)*p.pull*DT*4}; }
        if(p.explode){ this.onProjEnd(p); gone=true; break; }
        if(p.pierce>0) p.pierce--; else { gone=true; break; }
      }
      if(gone){ this.projectiles.splice(i,1); }
    }
  }

  onProjEnd(p){
    if(p.explode){
      this.zones.push({kind:'aoe',x:p.x,y:p.y,r:p.explode.r,t:0,delay:0,src:p.src,
        ab:{dmg:p.explode.dmg,radius:p.explode.r,burn:p.burn},done:false,life:0.3});
      this.addFX({type:'burst',x:p.x,y:p.y,c:p.c,r:p.explode.r,life:.4});
    } else this.addFX({type:'spark',x:p.x,y:p.y,c:p.c,life:.2});
  }

  /* ------------------------- rayos ------------------------- */
  fireBeam(f, ab){
    const a=f.ang, len=ab.length||600, wdt=ab.width||60;
    let end=len;
    if(!ab.pierceWalls){ for(let s=10;s<len;s+=10){
      if(this.hitWall(f.x+Math.cos(a)*s, f.y+Math.sin(a)*s, wdt*0.22, true)){ end=s; break; } } }
    for(const o of this.enemiesOf(f)){
      const dx=o.x-f.x, dy=o.y-f.y;
      const proj = dx*Math.cos(a)+dy*Math.sin(a);
      if(proj<0||proj>end+o.r) continue;
      const perp = Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));
      if(perp>wdt/2+o.r) continue;
      let dmg=ab.dmg;
      if(ab.scaleWithStolen) dmg*= 1+ (f.stolen||0)/400;
      this.damage(f,o,dmg,{type:'beam',burn:ab.burn,kb:280,ignoreInfinity:ab.destroy});
    }
    if(ab.destroy){ for(let wi=this.walls.length-1; wi>=0; wi--){ const w=this.walls[wi];
      if(w.dead||w.t==='pit'||w.t==='water') continue;
      const cx=w.x+w.w/2, cy=w.y+w.h/2, dx=cx-f.x, dy=cy-f.y;
      const proj=dx*Math.cos(a)+dy*Math.sin(a); if(proj<0||proj>end) continue;
      const perp=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));
      if(perp<wdt/2+Math.max(w.w,w.h)/2){
        if(isFinite(w.hp)) this.damageWall(w, 99999, cx, cy, f);
        else { w.dead=true; this.gridDirty=true;
          this.addFX({type:'wallbreak', x:cx, y:cy, w:w.w, h:w.h, mat:w.mat||'', life:1.0}); }
      } } }
    this.addFX({type:'beam',x:f.x,y:f.y,a,len:end,w:wdt,c:f.C.color,life:.42});
    this.snd('beam', f.x, f.y, {p:1.3, d:0.7});
    this.shake=Math.max(this.shake,0.7); this.hitstop=0.06;
  }

  /* ------------------------- zonas ------------------------- */
  stepZones(){
    for(let i=this.zones.length-1;i>=0;i--){
      const z=this.zones[i]; z.t+=DT;
      if(z.kind==='aoe'){
        if(!z.done && z.t>=z.delay){
          z.done=true;
          for(const o of this.fighters){
            if(!o.alive || (z.src && o.team===z.src.team)) continue;
            if(dist(z.x,z.y,o.x,o.y)>z.r+o.r) continue;
            this.damage(z.src,o,z.ab.dmg,{type:'aoe',kb:z.ab.kb,status:z.ab.status,burn:z.ab.burn});
          }
          this.damageWallsIn(z.x, z.y, z.r, (z.ab.dmg||40)*1.6, z.src);
          this.addFX({type:'burst',x:z.x,y:z.y,c:z.src?z.src.C.color:'#fff',r:z.r,life:.45});
          this.snd(z.ab.burn?'fire':'boom', z.x, z.y, {p:clamp(z.r/170,0.6,1.7)});
          this.shake=Math.max(this.shake,z.r>180?0.7:0.3);
        }
        if(z.done && z.ab.burn){ for(const o of this.fighters){
          if(!o.alive||(z.src&&o.team===z.src.team))continue;
          if(dist(z.x,z.y,o.x,o.y)<z.r) this.applyStatus(o,'burn',0.4,{dps:z.ab.burn.dps}); } }
      }
      if(z.t>=z.life) this.zones.splice(i,1);
    }
    // temporizadores programados
    if(this.timers) for(let i=this.timers.length-1;i>=0;i--){
      this.timers[i].t-=DT; if(this.timers[i].t<=0){ this.timers[i].fn(); this.timers.splice(i,1); } }
  }
  schedule(t,fn){ (this.timers=this.timers||[]).push({t,fn}); }

  /* ------------------------- dominios ------------------------- */
  openDomain(f){
    const D=f.C.domain;
    if(!this.spend(f,D.cost)){
      this.ev('nocost', f, 'ENERGÍA MALDITA INSUFICIENTE · faltan '+
              Math.ceil(D.cost-f.ce)+' para el dominio');
      this.snd('locked', f.x, f.y);
      return;
    }
    f.domGauge=0; f.cds.dom=6; f.domCount++;
    // colisión de dominios
    const rival=this.enemiesOf(f).find(o=>o.domain);
    if(rival){
      const mine=D.refine+this.rng()*1.2, theirs=rival.C.domain.refine+this.rng()*1.2;
      if(mine>=theirs){ this.closeDomain(rival);
        this.damage(f,rival,90,{type:'domain',ignoreInfinity:true});
        this.ev('domclash',f,'DOMINIO SUPERADO'); }
      else { this.damage(rival,f,90,{type:'domain',ignoreInfinity:true});
        this.ev('domclash',rival,'DOMINIO SUPERADO'); this.applyStatus(f,'stun',0.8); return; }
    }
    f.domain=D; f.domT=D.dur; f.domData={};
    /* LA CUPULA. Queda anclada donde se abrio (no sigue al usuario) y atrapa
       a quien estuviera dentro en ese instante. Quien estaba fuera se queda
       fuera: no se teletransporta a nadie. Se levanta hasta que el dominio
       expira o hasta que un rival abre uno mas refinado, porque el choque de
