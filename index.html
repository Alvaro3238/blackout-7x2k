function rankColor(r){ return {S:'#f0c945',A:'#5cc7ff',B:'#5fd6a0',C:'#8b8ba3'}[r]||'#8b8ba3'; }

function startStory(m){
  UI.pending=m;
  dialogue(m.brief, ()=>screenSelect('story', m));
}
/* ¿esta misión impone hechicero?  Sí la primera vez; al superarla queda libre
   para rejugarla con quien quieras. */
function storyForced(m){
  if(!m || !m.hero || !(m.heroLocked||m.heroForce)) return null;
  const done = SAVE.story[m.id] && SAVE.story[m.id].done;
  return done ? null : m.hero;
}
function launchStory(m, cid){
  const enemies=[];
  m.enemies.forEach(e=>{ for(let i=0;i<(e.n||1);i++) enemies.push({cid:e.cid,diff:e.diff,boss:e.boss,hpMul:e.hpMul}); });
  startMatch({
    mapId:m.map, heroCid:cid, enemies, allies:m.allies||[],
    mode:'story', story:m,
    timeLimit: m.kind==='survive'? m.survive : 0,
    objective: m.obj
  });
}

function dialogue(lines, done){
  clearUI(); let i=0;
  const el=h(`<div id="dialogue"><div class="dbox">
    <div class="dspk"></div><div class="dtxt"></div>
    <div class="dhint">CLIC o ESPACIO para continuar · ESC para saltar</div></div></div>`);
  root.appendChild(el);
  const spk=el.querySelector('.dspk'), txt=el.querySelector('.dtxt');
  let typing=null, full='';
  function show(){
    if(i>=lines.length){ el.remove(); UI.dlg=null; done(); return; }
    const L=lines[i]; spk.textContent=L.s; full=L.t; txt.textContent='';
    let k=0; clearInterval(typing);
    typing=setInterval(()=>{ k+=2; txt.textContent=full.slice(0,k); if(k>=full.length) clearInterval(typing); },14);
  }
  function next(){ if(txt.textContent.length<full.length){ clearInterval(typing); txt.textContent=full; }
    else { i++; show(); } }
  el.onclick=next;
  UI.dlg={next, skip:()=>{ el.remove(); clearInterval(typing); done(); }};
  show();
}
function onEscape(){
  if(UI.dlg){ const d=UI.dlg; UI.dlg=null; d.skip(); return; }
  if(UI.screen==='match'){ togglePause(); return; }
  if(UI.screen!=='title') screenTitle();
}
addEventListener('keydown',e=>{ if(escribiendo(e)) return;
  if(e.code==='Space'&&UI.dlg){ e.preventDefault(); UI.dlg.next(); } });

function rankedFlow(){
  const opp=matchmake(SAVE.ranked.mmr);
  // fase de veto: el jugador veta uno del rival
  screenSelect('ban',null,{ onPick:(banned)=>{
    let oppCid=opp.cid;
    if(oppCid===banned){ const alt=ROSTER.filter(c=>c!==banned&&CHARS[c].unlock!=='never');
      oppCid=alt[Math.floor(Math.random()*alt.length)]; }
    const myBan=ROSTER.filter(c=>isUnlocked(c))[Math.floor(Math.random()*ROSTER.filter(c=>isUnlocked(c)).length)];
    screenSelect('ranked',null,{ banned:[myBan], onPick:(mine,mapId)=>{
      startMatch({ mapId, heroCid:mine, mode:'ranked',
        enemies:[{cid:oppCid, diff:opp.diff, name:opp.n, look:(oppCid===opp.cid?opp.look:null)}],
        objective:'Duelo clasificatorio contra '+opp.n, opp, timeLimit:180 });
    }});
  }});
}

                seed:ev.m.seed, role:ev.m.role,
                objective:'Duelo en línea contra '+ev.m.opp.name, timeLimit:180}); };
            if(net.oppCid) setTimeout(go, 350);
            else { const iv=setInterval(()=>{ if(net.oppCid){ clearInterval(iv); go(); } },120);
                   setTimeout(()=>{ clearInterval(iv); go(); }, 8000); }
          }});
        }
        if(ev.t==='closed') st.innerHTML='<span style="color:#ff8090">Conexión cerrada.</span>';
        if(ev.t==='desync') st.innerHTML='<span style="color:#ff8090">Desincronía detectada en el fotograma '+ev.f+'.</span>';
      });
    try{ await net.connect(); st.innerHTML='<span style="color:#5fd6a0">Conectado.</span> Buscando rival…';
      net.queue('yuji'); }
    catch(e){ st.innerHTML='<span style="color:#ff8090">No se pudo conectar.</span> '+
      'Comprueba que el relay está levantado (<code>node server.js</code>) y que la URL es correcta.<br>'+
      '<span style="color:#8b8ba3">La escalera contra IA sigue disponible sin servidor.</span>'; }
  };
}

/* Al aceptar: a un escenario de combate al azar, vacio de gente. */
/* La mision ya NO te saca a una arena aparte: baja el VELO sobre la manzana
   de la marca y se pelea ahi mismo, con sus edificios y su calle. Es lo que
   hace que las dos ciudades sean contenido y no decorado. Los civiles se
   evacuan al caer el velo, asi que el combate sigue estando "sin gente". */
function lanzarMision(mi){
  const cid = isUnlocked(SAVE.main)?SAVE.main:(ROSTER.find(c=>isUnlocked(c))||'yuji');
  const map = MAPS[mi.mapId], R = 560;
  const dentro=(x,y)=>[clamp(x,80,map.w-80), clamp(y,80,map.h-80)];
  const yo  = dentro(mi.x - 250, mi.y + 130);
  const el  = dentro(mi.x + 200, mi.y - 110);
  startMatch({ mode:'openmission', mapId:mi.mapId, heroCid:cid, mission:mi,
    veil:{ x:mi.x, y:mi.y, r:R },
    heroPos:yo,
    enemies:[{ cid:mi.cid, diff:clamp(0.34+mi.lvl*0.07,0.3,0.95), name:mi.nom,
               hpMul:mi.hpMul, powMul:mi.powMul, spdMul:mi.spdMul, boss:true,
               pos:el }] });
}

/* ============================================================================
   h_scene3d.js — Escena 3D + cámara en tercera persona + capa HUD proyectada
   La simulación sigue siendo 2D (plano X/Y). Aquí se interpreta como un mundo
   3D: X→X, Y→Z, altura en +Y.
   ========================================================================= */

let VISDT=1/60;              // delta real para las partículas
/* impulsos de post-proceso: suben de golpe y caen solos */
const POST={ ca:0, radial:0, flash:0, flashC:[1,1,1], desat:0, bloom:0.52, time:0 };
function postReset(){ POST.ca=0; POST.radial=0; POST.flash=0; POST.desat=0; }
function postImpulse(k,v,col){ POST[k]=Math.max(POST[k],v); if(col) POST.flashC=col; }
function postUpdate(g,dt){
  /* un dt negativo (relojes que no casan entre rAF y performance.now) haría
     CRECER los impulsos en vez de apagarlos: la pantalla se quedaba en blanco */
  dt = Math.min(0.25, Math.max(0, dt||0));
  POST.time += dt;
  POST.ca    = Math.max(0, POST.ca    - dt*3.2);
  POST.radial= Math.max(0, POST.radial- dt*2.2);
  POST.flash = Math.max(0, POST.flash - dt*4.5);
  const dom = g.fighters.some(o=>o.domain);
  const low = M.hero && M.hero.alive ? clamp(1-(M.hero.hp/M.hero.maxhp)/0.30,0,1) : 0;
  POST.desat += ((dom?0.10:0) + low*0.45 - POST.desat)*Math.min(1,dt*3);
  POST.ca = Math.max(POST.ca, low*0.16);
}
const S3 = 0.05;                      // 1 píxel de simulación = 0.05 unidades 3D
const CAM3 = { yaw:0, pitch:0.34, dist:4.9, shoulder:0.85, sens:0.0026,
               shake:0, bob:0, mode:'tps' };

/* Corte cinematico al abrir un dominio. Es SOLO de cliente: ni entra en
   stateChecksum ni toca step(), igual que las particulas o el nivel de Rika.
   La pausa real la da el hitstop de la simulacion; esto solo mueve la camara
   y enciende el ojo. Si desapareciera, la partida seguiria siendo identica. */
const DOMCINE = { t:0, dur:2.0, f:null, seen:{}, g:null };
function domCineUpdate(g, dt){
  if(!g || !g.fighters) return;
  /* EL FALLO DE QUE UNAS VECES SALIERA Y OTRAS NO.
     El registro de aperturas ya vistas se indexaba por uid+contador de
     dominios. Los dos valores REEMPIEZAN en cada combate: el primer dominio
     de cualquier partida es siempre '0|1'. Como el registro nunca se vaciaba,
     a partir del segundo combate esa clave ya constaba como vista y el corte
     se saltaba en silencio. Solo volvia a aparecer cuando el contador
     superaba el maximo alcanzado en partidas anteriores, que es justo la
     intermitencia que se veia.
     Se ata el registro a la partida en curso: al cambiar de combate, se
     olvida todo lo anterior. */
  if(DOMCINE.g !== g){ DOMCINE.g=g; DOMCINE.seen={}; DOMCINE.t=0; DOMCINE.f=null; }
  for(const f of g.fighters){
    if(!f.domain || !f.alive) continue;
    const key = f.uid+'|'+(f.domCount||0);
    if(!DOMCINE.seen[key]){
      DOMCINE.seen[key]=1; DOMCINE.f=f;
      DOMCINE.dur = (f.domain.id==='authentic_mutual_love') ? 4.6 : 2.0;
      DOMCINE.t   = DOMCINE.dur;
    }
  }
  if(DOMCINE.t>0){ DOMCINE.t=Math.max(0, DOMCINE.t-dt); if(DOMCINE.t===0) DOMCINE.f=null; }
}
/* 0 fuera del corte, 1 en el sostenido, con entrada y salida suavizadas */
function domCineK(){
  if(DOMCINE.t<=0 || !DOMCINE.f) return 0;
  const T = DOMCINE.dur - DOMCINE.t;
  let k = Math.min(T/0.40, DOMCINE.t/0.50, 1);
  k = Math.max(0, Math.min(1, k));
  return k*k*(3-2*k);
}

function w3(x){ return x*S3; }

/* Altura real, en unidades 3D, de la cara superior de un muro. Es la misma
   fórmula con la que se dibuja: si aquí y allí no coinciden, la cámara choca
   con aire o se mete dentro de la piedra. */
function wallTop3(w){
  if(!w || w.dead) return 0;
  if(w.t==='pit'||w.t==='water'||w.t==='hazard'||w.t==='rail') return 0.2;
  if(w.t==='weak') return 0.22;
  if(w.rubble)     return 0.62;
  if(w.t==='low')  return 0.68;
  if(w.t==='destr')return w.hh ? Math.max(1.0, w.hh*0.17) : 1.35;
  if(w.t==='tower'){
    const h0 = w.hh ? Math.max(3.2, w.hh*0.17) : 5.0;
    return h0*(1 - (w.collapse?clamp(w.collapse/1.6,0,1):0)*0.92);
  }
  return (w.hh ? Math.max(2.4, w.hh*0.17) : 2.6) + 0.18;
}

/* ------------------------- cámara en 3ª persona ------------------------- */
function computeCamera(g, f){
  if(typeof MENU3!=='undefined' && MENU3.on) return menuCamera(g,f);
  const tx=w3(f.x), tz=w3(f.y), ty=1.35;
  const cp=Math.cos(CAM3.pitch), sp=Math.sin(CAM3.pitch);
  const fwd=[Math.cos(CAM3.yaw)*cp, -sp, Math.sin(CAM3.yaw)*cp];
  const right=[-Math.sin(CAM3.yaw),0,Math.cos(CAM3.yaw)];

  /* Distancia recortada si la cámara entra en un edificio. El muestreo es fino
     (20 cm) y tiene en cuenta la ALTURA del muro: antes cualquier bancal o
     bordillo de medio metro daba un tirón de cámara aunque se pasara por
     encima de él sin rozarlo. */
  /* El suelo mínimo de esta distancia era 1.4-1.5 unidades. A esa distancia,
     con el fov de 1.16 rad de la partida, el personaje mide el 107-114% del
     alto de pantalla: no cabe verticalmente. Cualquier momento cerca de CUALQUIER
     pared —algo constante, hay paredes por todas partes— fuerza esta vista
     imposible, y ahí es donde hombros, brazos y abrigo, todos correctos en 3D,
     se ven "fundidos" entre sí: no es geometría rota, es una cámara demasiado
     cerca para lo que intenta encuadrar. Con el suelo en 2.0 el personaje
     vuelve a caber (≈80% del alto), y sigue estando más cerca que el zoom
     manual mínimo (2.6), o sea que la cámara igual de bien evita las paredes. */
  const MIN_CAM_DIST = 2.0;
  let dist=CAM3.dist;
  for(let s=0.2;s<=dist;s+=0.2){
    const px=(tx-fwd[0]*s)/S3, pz=(tz-fwd[2]*s)/S3;
    const py=ty-fwd[1]*s;
    if(py<0.35){ dist=Math.max(MIN_CAM_DIST,s-0.2); break; }
    const w=g.hitWall(px,pz,14);
    if(w && wallTop3(w) > py-0.12){ dist=Math.max(MIN_CAM_DIST,s-0.35); break; }
  }
  const ox=right[0]*CAM3.shoulder, oz=right[2]*CAM3.shoulder;
  const cam=[tx-fwd[0]*dist+ox, ty-fwd[1]*dist, tz-fwd[2]*dist+oz];
  const tgt=[tx+ox, ty+0.15, tz+oz];

  /* --- corte de dominio: primer plano de la cara del que lo abre --- */
  const dk = domCineK();
  if(dk>0){
    const sf = DOMCINE.f;
    const sS = (typeof MODEL!=='undefined' && MODEL[sf.cid]) || null;
    const sH = (sS && sS.tall) || 1;
    const hx = w3(sf.x), hz = w3(sf.y), hy = 1.90*sH;
    const sfw=[Math.cos(sf.ang), Math.sin(sf.ang)];
    const srg=[-Math.sin(sf.ang), Math.cos(sf.ang)];
    /* empuje lento hacia la cara mientras dura el plano */
    const push = 1.02 - 0.16*(1-DOMCINE.t/DOMCINE.dur);
    let ccam=[ hx + sfw[0]*push + srg[0]*0.40, hy + 0.05, hz + sfw[1]*push + srg[1]*0.40 ];
    let ctgt=[ hx + sfw[0]*0.10,               hy + 0.00, hz + sfw[1]*0.10 ];

    /* SEGUNDO ACTO: si este hechicero trae acompañante, a los 2,1 s la camara
       deja su cara y se va a Rika saliendo del suelo. Se calcula su sitio con
       las mismas formulas que usa drawRika, leyendo _rk, para que apunte
       exactamente a donde esta y no a donde deberia estar. */
    const sS2 = (typeof MODEL!=='undefined' && MODEL[sf.cid]) || null;
    if(sS2 && sS2.rika){
      const pasado2 = DOMCINE.dur - DOMCINE.t;
      const paso2   = clamp((pasado2-1.85)/0.70, 0, 1);
      if(paso2>0){
        const mm  = sf._rk||0, RS2=(0.42+0.55*mm);
        const sub = clamp(mm/1.28,0,1);
        const fore=(0.06+0.34*mm), lado=(0.95+0.80*mm);
        const rkx = hx + sfw[0]*fore + srg[0]*lado;
        const rkz = hz + sfw[1]*fore + srg[1]*lado;
        const rky = (2.34+0.98*mm)*sH - (1-sub)*5.2*RS2;
        /* de frente y algo por debajo: se la ve salir contra el cielo */
        const rcam=[ rkx + sfw[0]*5.4 + srg[0]*1.2, Math.max(1.0, rky*0.42), rkz + sfw[1]*5.4 + srg[1]*1.2 ];
        const rtgt=[ rkx, Math.max(0.8, rky*0.70), rkz ];
        const e = paso2*paso2*(3-2*paso2);
        for(let i2=0;i2<3;i2++){ ccam[i2]+= (rcam[i2]-ccam[i2])*e; ctgt[i2]+= (rtgt[i2]-ctgt[i2])*e; }
      }
    }
    for(let i=0;i<3;i++){
      cam[i] += (ccam[i]-cam[i])*dk;
      tgt[i] += (ctgt[i]-tgt[i])*dk;
    }
  }
  if(CAM3.shake>0){
    const s=CAM3.shake*0.28;
    cam[0]+=(Math.random()-0.5)*s; cam[1]+=(Math.random()-0.5)*s; cam[2]+=(Math.random()-0.5)*s;
  }
  return {cam,tgt,fwd};
}

/* punto del suelo bajo la mirilla, en coordenadas de simulación */
function aimGroundPoint(f){
  const cp=Math.cos(CAM3.pitch), sp=Math.max(0.06,Math.sin(CAM3.pitch));
  const camY=1.35+sp*CAM3.dist;
  const t=camY/sp;
  const bx=w3(f.x)-Math.cos(CAM3.yaw)*cp*CAM3.dist + Math.cos(CAM3.yaw)*cp*t;
  const bz=w3(f.y)-Math.sin(CAM3.yaw)*cp*CAM3.dist + Math.sin(CAM3.yaw)*cp*t;
  let sx=bx/S3, sy=bz/S3;
  const d=Math.hypot(sx-f.x, sy-f.y);
  if(d>700){ const k=700/d; sx=f.x+(sx-f.x)*k; sy=f.y+(sy-f.y)*k; }
  return {x:sx, y:sy};
}

/* --------------------- materiales por escenario -------------------------- */
const MAPTEX = {
  shibuya_b5:   { floor:'tile',      wall:'concrete', tall:'concrete', destr:'steel', ftile:16 },
  shibuya_cross:{ floor:'crosswalk', wall:'concrete', tall:'glass',    destr:'rust',  ftile:9 },
  shinjuku:     { floor:'asphalt',   wall:'concrete', tall:'glass',    destr:'rust',  ftile:22 },
  jujutsu_high: { floor:'moss',      wall:'wood',     tall:'wood',     destr:'wood',  ftile:14 },
  kabukicho:    { floor:'asphalt',   wall:'neon',     tall:'neon',     destr:'rust',  ftile:16 },
  kinema:       { floor:'carpet',    wall:'concrete', tall:'concrete', destr:'wood',  ftile:12 },
  colony:       { floor:'asphalt',   wall:'concrete', tall:'glass',    destr:'rust',  ftile:20 },
  zenin:        { floor:'gravel',    wall:'shoji',    tall:'wood',     destr:'shoji', ftile:16 },
  crater:       { floor:'concrete',  wall:'concrete', tall:'concrete', destr:'rust',  ftile:16 },

  kyoto_city:   { floor:'gravel',    wall:'wood',     tall:'shoji',    destr:'wood',  ftile:40 }
};

/* ------------------------------ escena ---------------------------------- */
/* descarte barato: semiespacio de la cámara + distancia */
const CULL={cx:0,cz:0,fx:0,fz:0,far:0};
function visible(x,z,r,lejos){
  const dx=x-CULL.cx, dz=z-CULL.cz;
  const d2=dx*dx+dz*dz;
  if(d2 > CULL.far*(lejos||1)) return false;
  if(d2 < 36) return true;                       // muy cerca: siempre
  return (dx*CULL.fx+dz*CULL.fz) > -(r+3.0);     // por delante (con margen)
}

function render3D(g){
  const map=g.map, f=M.hero;
  postUpdate(g, VISDT);
  domCineUpdate(g, VISDT);
  R3.postBegin();
  const {cam,tgt}=computeCamera(g,f);
  CULL.cx=cam[0]; CULL.cz=cam[2];
  { const l=Math.hypot(tgt[0]-cam[0], tgt[2]-cam[2])||1;
    CULL.fx=(tgt[0]-cam[0])/l; CULL.fz=(tgt[2]-cam[2])/l; }
  CULL.far = Math.pow(58/(0.55+(map.fog||0.3)), 2);
  const bg=hex3(map.bg);
  const accent=hex3(map.accent), floor=hex3(map.floor);
  const menuOn = (typeof MENU3!=='undefined' && MENU3.on);
  /* en los menús la escena es un escaparate: se sube la luz y se quita niebla */
  /* en los menús la luz viene de donde mira la cámara: si no, el personaje
     que posa de espaldas al foco del mapa sale como una silueta negra */
  let light=null;
  if(menuOn){
    const dx=cam[0]-tgt[0], dz=cam[2]-tgt[2], l=Math.hypot(dx,dz)||1;
    light=[dx/l*0.62, 0.74, dz/l*0.62];
  }
  R3.begin(cam,tgt,{
    bg:  menuOn ? mixc(mixc(bg,accent,0.30),[1,1,1],0.05) : mixc(bg,[0,0,0],0.15),
    fogD: menuOn ? 0.0045 : 0.010+(map.fog||0.3)*0.012, fov:1.16, light});
  const MT = MAPTEX[g.mapId] || MAPTEX.nakano;

  /* ------------------------------- CIELO -------------------------------
     Una cupula vista desde dentro (cullFront). El degradado sale solo: el
     shader ilumina segun la normal, y en la cara interior la cenital queda
     clara y el horizonte oscuro. Sin niebla, o seria del color del fondo. */
  if(map.sky){
    const SK=hex3(map.sky.hor), ST=hex3(map.sky.top);
    const cx0=w3(map.w)/2, cz0=w3(map.h)/2, R=300;
    R3.draw('sphHi', cx0, -6, cz0, R*2, R*1.7, R*2, 0, SK,
      {noFog:true, cullFront:true, emis:0.42});
    R3.draw('disc', cx0, 120, cz0, R*1.5, 1, R*1.5, 0, ST,
      {noFog:true, noCull:true, alpha:0.55, add:true});
    if(map.sky.sun){
      const su=hex3(map.sky.sun), a=map.sky.sunA||0.7;
      const sx0=cx0+Math.cos(a)*R*0.72, sz0=cz0+Math.sin(a)*R*0.72;
      R3.draw('sph', sx0, 62, sz0, 26,26,26, 0, su, {noFog:true, alpha:0.95, add:true});
      R3.draw('sph', sx0, 62, sz0, 78,78,78, 0, su, {noFog:true, alpha:0.22, add:true, cullFront:true});
    }
    /* NUBES. Cada una son tres discos solapados de distinto tamaño, que es lo
       que le da volumen a un cumulo; una sola elipse se lee como una mancha.
       Van a la deriva despacio con el reloj de la partida, y como es un valor
       de reloj y no de simulacion no afecta a nada. */
    const NB = map.sky.nubes||10, deriva = g.t*0.9;
    for(let i=0;i<NB;i++){
      const a = i*2.3999 + deriva*0.004;
      const r = R*(0.26+0.10*(i%5));
      const bx = cx0+Math.cos(a)*r + (deriva % (R*2)) - R;
      const bz = cz0+Math.sin(a)*r;
      const by = 66+(i%4)*11;
      const e  = 1+(i%3)*0.35;
      for(let k=0;k<3;k++){
        const ox2=(k-1)*30*e, oz2=((i+k)%2?1:-1)*13*e, sc2=(k===1?1:0.72);
        R3.draw('disc', bx+ox2, by+k*3, bz+oz2,
          (58+14*(i%3))*e*sc2, 1, (34+9*(i%2))*e*sc2, 0, [1,1,1],
          {noFog:true, alpha:0.30, add:true, noCull:true});
      }
    }
  }

  // suelo lejano (horizonte) + suelo jugable
  R3.draw('box', w3(map.w)/2, -0.30, w3(map.h)/2, w3(map.w)*7, 0.2, w3(map.h)*7, 0,
    mixc(floor,[0,0,0],0.55), {});
  R3.draw('box', w3(map.w)/2, -0.06, w3(map.h)/2, w3(map.w), 0.12, w3(map.h), 0,
    mixc(floor,[1,1,1],0.18), {grid:true, tex:TEX[MT.floor], tile:MT.ftile});

  // muros y edificios
  for(const w of g.walls){
    const cx=w3(w.x+w.w/2), cz=w3(w.y+w.h/2), sx=w3(w.w), sz=w3(w.h);
    /* Un edificio alto se ve desde mas lejos, y punto: el radio de descarte
       crece con su altura en vez de haber un umbral a partir del cual se
       dibuja SIEMPRE. Con el umbral binario, subir toda la ciudad por encima
       de esa cota habria obligado a dibujar los 83 edificios cada fotograma. */
    if(!visible(cx,cz,Math.max(sx,sz)*0.5, 1+(w.hh||0)/70)) continue;
    if(w.prop!==undefined) continue;         // lo dibuja drawProps con su modelo
    if(w.t==='rail'){
      R3.draw('box',cx,0.10,cz,sx,0.16,sz,0,[0.30,0.33,0.38],{tex:TEX.steel,tile:3});
      R3.draw('box',cx,0.20,cz,sx,0.05,sz*0.6,0,[0.55,0.78,1.0],
        {alpha:0.30+0.14*Math.sin(g.t*6), add:true, noCull:true});
      continue; }
    if(w.dead){ R3.draw('box',cx,0.03,cz,sx,0.06,sz,0, mixc(floor,[0,0,0],0.5),{}); continue; }
    if(w.t==='weak'){
      drawDamaged(g, w, cx, cz, sx, sz, 0.16, TEX.steel, mixc(floor,[0.5,0.45,0.35],0.4));
      R3.draw('box',cx,0.19,cz,sx*0.9,0.03,sz*0.9,0,[0.9,0.55,0.15],{alpha:0.28,add:true});
      continue; }
    if(w.t==='water'){
      R3.draw('box',cx,0.10,cz,sx,0.14,sz,0,[0.16,0.42,0.55],
        {alpha:0.66, tex:TEX.water, tile:5, rim:0.5}); continue; }
    if(w.t==='pit'){
      R3.draw('box',cx,-0.85,cz,sx,1.6,sz,0,[0.01,0.01,0.02],{});
      R3.draw('box',cx,0.02,cz,sx*1.02,0.04,sz*1.02,0,[0.10,0.10,0.14],{}); continue; }
    if(w.rubble){ drawRubble(g,w,cx,cz,sx,sz,MT,floor); continue; }
    if(w.t==='low'){
      R3.draw('box',cx,0.30,cz,sx,0.60,sz,0, mixc(accent,[0,0,0],0.18),
        {tex:TEX[MT.wall], tile:Math.max(1,Math.round(Math.max(sx,sz)*0.8))});
      R3.draw('box',cx,0.62,cz,sx*1.03,0.06,sz*1.03,0, mixc(accent,[1,1,1],0.20),{}); continue; }
    if(w.t==='destr'){
      const h = w.hh ? Math.max(1.0, w.hh*0.17) : 1.35;
      drawDamaged(g, w, cx, cz, sx, sz, h, TEX[w.mat||MT.destr]||TEX.metal,
                  mixc([0.40,0.34,0.30], hex3(map.accent), 0.35));
      continue; }
    /* --------- torre derribable: se desploma por fases --------- */
    if(w.t==='tower'){
      const h0 = w.hh ? Math.max(3.2, w.hh*0.17) : 5.0;
      const cp = w.collapse ? clamp(w.collapse/1.6, 0, 1) : 0;
      const h  = h0*(1-cp*0.92);
      const tilt = cp*0.34*(((w.x*7+w.y*13)%2)?1:-1);
      const col = mixc(accent,[0,0,0],0.24);
      drawDamaged(g, w, cx, cz, sx, sz, Math.max(0.2,h),
                  TEX[w.mat||MT.tall]||TEX.concrete, col, tilt);
      if(!w.collapse){
        R3.draw('box',cx,h+0.09,cz,sx*1.03,0.18,sz*1.03,0, mixc(accent,[1,1,1],0.18),
          {tex:TEX.concrete, tile:2});
      }
      continue; }
    const h = w.hh ? Math.max(2.4, w.hh*0.17) : 2.6;
    const tall = h>4;
    R3.draw('box',cx,h/2,cz,sx,h,sz,0, mixc(accent,[0,0,0],0.24),
      {tex:TEX[w.mat||(tall?MT.tall:MT.wall)], tile:tall?Math.max(1,Math.round(h*0.11)):Math.max(1,Math.round(Math.max(sx,sz)*0.4))});
    R3.draw('box',cx,h+0.09,cz,sx*1.03,0.18,sz*1.03,0, mixc(accent,[1,1,1],0.18),
      {tex:TEX.concrete, tile:2});
    /* las ventanas van dentro de la propia textura: cero llamadas de dibujo extra */
  }

  // zonas telegrafiadas
  for(const z of g.zones){
    if(z.kind!=='aoe') continue;
    const col=z.src?hex3(z.src.C.color):[1,1,1];
    const r=w3(z.r);
    if(!z.done){
      const p=clamp(z.t/Math.max(0.001,z.delay),0,1);
      R3.draw('disc',w3(z.x),0.05,w3(z.y), r*2,1,r*2, 0, col, {alpha:0.16,add:true});
      R3.draw('disc',w3(z.x),0.07,w3(z.y), r*2*p,1,r*2*p, 0, col, {alpha:0.32,add:true});
    } else if(z.ab.burn){
      R3.draw('disc',w3(z.x),0.06,w3(z.y), r*2,1,r*2, 0, [1,0.42,0.14], {alpha:0.22,add:true});
    }
  }

  /* --- EL VELO de la mision: cortina oscura con borde encendido --- */
  if(g.veil){
    const V=g.veil, cx=w3(V.x), cz=w3(V.y), R=w3(V.r);
    R3.draw('sphHi', cx, -4, cz, R*2, R*1.5, R*2, 0, [0.10,0.06,0.16],
      {alpha:0.30, add:true, noCull:true});
    R3.draw('cyl', cx, R*0.42, cz, R*2, R*0.84, R*2, 0, [0.42,0.24,0.62],
      {alpha:0.16, add:true, noCull:true});
    R3.draw('cyl', cx, 0.07, cz, R*2, 0.12, R*2, 0, [0.72,0.46,1.0],
      {alpha:0.42, add:true, noCull:true});
  }

  // dominios
  for(const d of g.fighters){
    if(!d.domain) continue;
    const col=hex3(d.C.color), R=w3(d.domain.radius);
    /* La cupula se dibuja donde esta la PARED, no donde esta el usuario. Antes
       se centraba en d.x/d.y, asi que al moverse el hechicero la cupula lo
       seguia mientras la barrera real seguia anclada: se veia en un sitio y
       chocabas en otro. Ahora ambas leen domX/domY. */
    const cx=w3(d.domX!==undefined?d.domX:d.x), cz=w3(d.domY!==undefined?d.domY:d.y);
    const solida = !d.domain.noBarrier;   // Sukuna y el dominio incompleto no encierran
    /* Iba a alpha 0.075: invisible en la practica. Si encierra al jugador,
       tiene que verse que encierra. */
    const aOut = solida?0.20:0.07, aIn = solida?0.11:0.045;
    R3.draw('sphHi', cx, 0.2, cz, R*2, R*1.55, R*2, 0, col,
      {alpha:aOut, add:true, noCull:true});
    R3.draw('sphHi', cx, 0.2, cz, R*1.94, R*1.50, R*1.94, 0, mixc(col,[1,1,1],0.5),
      {alpha:aIn, add:true, noCull:true});
    if(solida){
      /* pared vertical en el borde: es lo que de verdad se lee como jaula
         cuando estas dentro, porque la cupula queda por encima de la vista */
      R3.draw('cyl', cx, R*0.55, cz, R*2, R*1.10, R*2, 0, col,
        {alpha:0.13, add:true, noCull:true});
      /* costura del suelo: marca exacta de hasta donde puedes andar */
      R3.draw('cyl', cx, 0.06, cz, R*2, 0.10, R*2, 0, mixc(col,[1,1,1],0.35),
        {alpha:0.34, add:true, noCull:true});
    }
    R3.draw('disc', cx, 0.09, cz, R*2, 1, R*2, 0, col, {alpha:0.16, add:true});
    const pulse=(g.t*0.55)%1;
    R3.draw('disc', cx, 0.11, cz, R*2*pulse, 1, R*2*pulse, 0, col, {alpha:0.18*(1-pulse), add:true});
  }

  // luchadores
  for(const o of g.fighters){ if(visible(w3(o.x),w3(o.y),2)){
    R3.greyOn = !!o._grey; drawCharacter(g,o); R3.greyOn = false; } }

  // proyectiles
  for(const p of g.projectiles){
    if(!visible(w3(p.x),w3(p.y),1)) continue;
    const c=hex3(p.c), r=Math.max(0.16,w3(p.r)*1.5);
    R3.draw('sph', w3(p.x), 0.95, w3(p.y), r*2.6,r*2.6,r*2.6, 0, c, {alpha:0.35, add:true});
    R3.draw('sph', w3(p.x), 0.95, w3(p.y), r*1.2,r*1.2,r*1.2, 0, mixc(c,[1,1,1],0.6),
      {emis:1.2, rim:0.6});
  }

  drawProps(g);
  drawStreets(g);
  CIV.draw(g);
  MOTES.draw(g);
  drawMissions(g);
  emitContinuous(g, VISDT);
  ambient(g, VISDT);
  CIV.update(g, VISDT);
  MOTES.update(g, VISDT);
  DEB.draw();
  drawFX3(g);
  if(menuOn && typeof menuStageFX==='function') menuStageFX(g);
  R3.end();
  R3.postEnd({ bloom:POST.bloom, ca:POST.ca, radial:POST.radial,
    vignette:0.40+(map.fog||0.3)*0.18, grain:0.028, flash:POST.flash,
    flashC:POST.flashC, desat:POST.desat, time:POST.time, threshold:0.74 });
}

/* ------------------- muros dañados y escombros -------------------------- */
/* El deterioro se lee de un vistazo: la pieza se ensucia, se raja, se hunde un
   poco y acaba inclinada. Las grietas son cajas finas colocadas de forma
   estable (dependen de la posición del muro, no del azar), así que no bailan
   entre fotogramas ni gastan el generador con semilla. */
function drawDamaged(g, w, cx, cz, sx, sz, h, tex, baseCol, tilt){
  const st = w.stage||0;
  const dm = clamp(1 - (w.hp/w.maxhp), 0, 1);
  const sag = st>=2 ? 0.05*(st-1) : 0;
  const col = mixc(baseCol, [0.09,0.07,0.07], dm*0.72);
  const rz  = (tilt||0) + (st>=3 ? 0.07 : (st>=2 ? 0.025 : 0));
  const long = sx>=sz;
  R3.draw('box', cx, h/2 - sag, cz, sx*(1-dm*0.05), h*(1-dm*0.06), sz*(1-dm*0.05), 0, col,
    {tex, tile:Math.max(1, Math.round(Math.max(sx,sz)*0.7)), rz});
  if(st<=0) return;
  const seed = (Math.abs(w.x*13 + w.y*7)|0);
  /* --- tizne alrededor de los impactos --- */
  for(let i=0;i<st;i++){
    const u=(((seed+i*47)%100)/100-0.5), v=(((seed+i*83)%100)/100);
    R3.draw('box',
      cx + (long? u*sx*0.7 : sx*0.51*(u>0?1:-1)),
      h*(0.25+v*0.5) - sag,
      cz + (long? sz*0.51*(u>0?1:-1) : u*sz*0.7),
      long? sx*0.30 : 0.02, h*0.42, long? 0.02 : sz*0.30,
      0, [0.05,0.045,0.05], {alpha:0.30+st*0.06, rz});
  }
  /* --- grietas: franjas negras que cruzan la pieza --- */
  const n = st*3;
  for(let i=0;i<n;i++){
    const u = (((seed + i*37)%100)/100 - 0.5);
    const v = (((seed + i*61)%100)/100);
    const px = cx + (long ? u*sx*0.88 : sx*0.52*(u>0?1:-1));
    const pz = cz + (long ? sz*0.52*(u>0?1:-1) : u*sz*0.88);
    R3.draw('box', px, h*(0.14+v*0.62) - sag, pz,
      long? sx*0.012 : 0.022, h*(0.26+v*0.38), long? 0.022 : sz*0.012,
      0, [0.02,0.02,0.03], {alpha:0.85, rz});
  }
  /* --- fase 2: se le ve la estructura --- */
  if(st>=2){
    for(let i=0;i<3;i++){
      const u=((i+0.5)/3-0.5);
      R3.draw('box',
        cx + (long? u*sx*0.62 : sx*0.5*(u>0?1:-1)),
        h*0.52 - sag,
        cz + (long? sz*0.5*(u>0?1:-1) : u*sz*0.62),
        long? sx*0.020 : sz*0.10, h*0.80, long? sz*0.10 : sz*0.020,
        0, mixc(baseCol,[0.62,0.58,0.52],0.6),
        {tex:TEX.steel, tile:1, rz});
    }
  }
  /* --- fase 3: falta un trozo --- */
  if(st>=3){
    const gx = cx + (long? sx*0.20 : 0), gz = cz + (long? 0 : sz*0.20);
    R3.draw('box', gx, h*0.60 - sag, gz,
      long? sx*0.24 : sx*0.9, h*0.34, long? sz*0.9 : sz*0.24, 0,
      [0.02,0.02,0.03], {alpha:0.92, rz});
    R3.draw('box', gx, h*0.42 - sag, gz,
      long? sx*0.13 : sx*0.55, h*0.20, long? sz*0.55 : sz*0.13, 0,
      [0.01,0.01,0.015], {alpha:0.96, rz});
  }
}

function drawRubble(g, w, cx, cz, sx, sz, MT, floor){
  const tex = TEX[w.mat||MT.destr] || TEX.concrete;

function auraColor(f){
  const a=SAVE.cosmetics&&SAVE.cosmetics.aura;

/* -------------------------------- efectos -------------------------------- */
const ELCOL = {
  fire:[1,0.45,0.12], ice:[0.70,0.90,1], elec:[0.85,0.92,1],
  blood:[0.70,0.10,0.18], void:[0.55,0.40,1], flesh:[0.65,0.85,0.75]
};

/* emisión única al nacer el efecto */
function emitFor(g,e){
  const x=w3(e.x), z=w3(e.y), c=e.c?hex3(e.c):[1,1,1];
  switch(e.type){
    case 'slash':
      PS.sparks(x+Math.cos(e.a)*w3(e.r)*0.7, 1.05, z+Math.sin(e.a)*w3(e.r)*0.7,
        e.bf?16:6, e.bf?[1,1,1]:c, e.bf?1.6:0.9);
      if(e.bf) PS.smoke(x,1.0,z,4,[0.1,0.1,0.12],1.1);
      break;
    case 'burst': {
      const r=w3(e.r);
      PS.dust(x,z, Math.min(18,6+r*2), r*1.1);
      PS.smoke(x,0.7,z, Math.min(10,3+r), mixc(c,[0.2,0.2,0.24],0.5), Math.max(0.6,r*0.35));
      PS.sparks(x,0.9,z, Math.min(24,8+r*2), c, 1+r*0.15);
      break; }
    case 'beam': {
      const L=w3(e.len);
      for(let k=0;k<10;k++){
        const d=L*(k+0.5)/10;
        PS.sparks(x+Math.cos(e.a)*d, 1.15, z+Math.sin(e.a)*d, 3, c, 1.2);
      }
      PS.implode(x,1.15,z, 14, 2.2, c);
      PS.smoke(x,1.0,z,5,[0.2,0.2,0.26],1.2);
      break; }
    case 'blackflash':
      PS.sparks(x,1.1,z, 34, [1,0.3,0.36], 2.0);
      PS.bolts(x,1.1,z, 12);
      PS.smoke(x,1.0,z, 8, [0.06,0.06,0.08], 1.4);
      PS.ash(x,1.4,z, 12);
      break;
    case 'hit': PS.sparks(x,1.1,z, 5, [1,0.92,0.75], 0.8); break;
    case 'muzzle': PS.sparks(x,1.0,z, 4, c, 0.7); break;
    case 'spark':  PS.sparks(x,1.0,z, 6, c, 0.9); break;
    case 'domainOpen': {
      const r=w3(e.r);
      PS.implode(x,1.2,z, 42, r*0.8, c);
      PS.dust(x,z, 22, r*0.5, mixc(c,[0.4,0.4,0.45],0.5));
      PS.ash(x, 2.2, z, 18);
      break; }
    case 'rubble':
      PS.dust(x,z, 16, w3(e.r)*0.7, [0.42,0.38,0.34]);
      PS.smoke(x,0.8,z, 7, [0.3,0.28,0.26], 1.3);
      break;
    case 'wallcrack': {
      PS.dust(x, z, 3+e.st*2, 0.5, [0.55,0.51,0.46]);
      PS.sparks(x, 1.0, z, 3+e.st*2, [0.75,0.70,0.62], 0.7);
      if(e.st>=2) PS.smoke(x,0.9,z, 2, [0.36,0.34,0.31], 0.6);
      break; }
    case 'wallbreak': {
      const MT=MAPTEX[g.mapId]||MAPTEX.nakano;
      const tex=TEX[e.mat||MT.destr]||TEX.concrete;
      const col=mixc(hex3(g.map.accent),[0.55,0.52,0.48],0.55);
      const ww=w3(e.w), hh=Math.max(0.9, w3(Math.max(e.w,e.h))*0.5);
      DEB.burst(x, 0.3, z, ww*0.55, hh, e.big?34:20, tex, col, e.big?1.5:1);
      PS.dust(x, z, e.big?30:18, Math.max(1.2, ww*0.6), [0.46,0.42,0.38]);
      PS.smoke(x, 1.0, z, e.big?14:8, [0.33,0.31,0.29], e.big?2.2:1.4);
      PS.shards(x, 1.1, z, 8, 1.1);
      postImpulse('ca', e.big?0.5:0.25);
      postImpulse('radial', e.big?0.35:0.15);
      break; }
    case 'elecpool': {
      const rx=w3(e.w)*0.5, rz2=w3(e.h)*0.5;
      for(let k=0;k<10;k++)
        PS.bolts(x+(Math.random()-0.5)*rx*2, 0.25, z+(Math.random()-0.5)*rz2*2, 2);
      break; }
    case 'collapseStart': {
      const ww=w3(e.w);
      PS.dust(x, z, 26, Math.max(1.6, ww*0.8), [0.44,0.41,0.37]);
      PS.smoke(x, 1.4, z, 12, [0.30,0.29,0.27], 2.4);
      postImpulse('radial', 0.4);
      break; }
    case 'resonance': PS.sparks(x,1.1,z, 20, [0.95,0.6,0.25], 1.4); break;
    case 'death':
      PS.smoke(x,0.9,z, 9, mixc(c,[0.15,0.15,0.18],0.6), 1.2);
      PS.ash(x,1.2,z, 14); PS.sparks(x,1.0,z, 10, c, 1.0);
      break;
    case 'cut': PS.sparks(x,1.05,z, 4, [1,1,1], 0.7); break;
    case 'heal': break;
    case 'bfring': break;
  }
}

/* emisiones continuas: estelas, brasas, escarcha */
let PSacc=0;
function emitContinuous(g, dt){
  PSacc+=dt;
  const step = PSacc>0.033;
  if(step) PSacc=0;
  // estelas de proyectil
  for(const p of g.projectiles){
    if(!visible(w3(p.x),w3(p.y),1)) continue;
    if(!step && Math.random()>0.35) continue;
    const c = ELCOL[p.el] || hex3(p.c);
    PS.spawn({x:w3(p.x), y:0.95, z:w3(p.y),
      vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.2)*0.6, vz:(Math.random()-0.5)*0.5,
      g:p.el==='fire'?1.2:-1.0, drag:0.90, life:0.25+Math.random()*0.25,
      s:0.11, s1:0.01, c, a:0.85, glow:1});
  }
  if(!step) return;
  // zonas ardiendo
  for(const z of g.zones){
    if(z.kind!=='aoe'||!z.done||!z.ab.burn) continue;
    if(!visible(w3(z.x),w3(z.y),w3(z.r))) continue;
    const a=Math.random()*TAU, d=Math.random()*w3(z.r);
    PS.embers(w3(z.x)+Math.cos(a)*d, 0.15, w3(z.y)+Math.sin(a)*d, 1, 0.8);
  }
  // estados sobre los luchadores
  for(const f of g.fighters){
    if(!f.alive||!visible(w3(f.x),w3(f.y),2)) continue;
    if(f.status.burn && Math.random()<0.7) PS.embers(w3(f.x),1.1,w3(f.y),1,0.7);
    if(f.status.freeze && Math.random()<0.4) PS.shards(w3(f.x),1.1,w3(f.y),1,0.5);
    if(f.status.poison && Math.random()<0.3)
      PS.spawn({x:w3(f.x)+(Math.random()-0.5), y:0.8+Math.random(), z:w3(f.y)+(Math.random()-0.5),
        vx:0,vy:0.5,vz:0, g:0.3, life:0.7, s:0.10, s1:0.02, c:[0.45,0.75,0.35], a:0.6, add:false});
    if(f.domain && Math.random()<0.9){
      const a=Math.random()*TAU, R=w3(f.domain.radius);
      PS.spawn({x:w3(f.x)+Math.cos(a)*R*0.95, y:0.2+Math.random()*3, z:w3(f.y)+Math.sin(a)*R*0.95,
        vx:0, vy:1.6+Math.random()*2, vz:0, g:0.4, drag:0.98, life:1.0,
        s:0.14, s1:0.02, c:hex3(f.C.color), a:0.7, glow:1});
    }
    if(f===M.hero && f.hp/f.maxhp<0.25 && Math.random()<0.25)
      PS.blood(w3(f.x),1.0,w3(f.y),1,0.5);
  }
}

function drawFX3(g){
  for(const e of g.fx){
    if(e.x!==undefined && !visible(w3(e.x),w3(e.y),6)) continue;
    if(!e._em){ e._em=1; emitFor(g,e);
      if(e.type==='blackflash'){ postImpulse('ca',0.55); postImpulse('flash',0.60,[1,0.88,0.90]);
        postImpulse('radial',0.75); }
      else if(e.type==='domainOpen'){ postImpulse('ca',0.38); postImpulse('radial',0.85);
        postImpulse('flash',0.30,hex3(e.c||'#ffffff')); }
      else if(e.type==='beam'){ postImpulse('ca',0.24); postImpulse('flash',0.14,hex3(e.c||'#ffffff')); }
      else if(e.type==='burst'&&e.r>150){ postImpulse('ca',0.16); postImpulse('radial',0.28); }
      else if(e.type==='death'){ postImpulse('ca',0.14); }
    }
    const p=e.t/e.life, a=1-p;
    const c=e.c?hex3(e.c):[1,1,1];
    switch(e.type){
      case 'slash': {
        // cinta curva que sigue el arco del golpe
        const col = e.bf?[1,1,1]:mixc(c,[1,1,1],0.35);
        ribbonArc(w3(e.x), 1.05, w3(e.y), e.a, w3(e.r), e.arc||1.6, p, col, a*(e.bf?0.95:0.62),
          e.bf?0.30:0.18);
        if(e.bf) ribbonArc(w3(e.x), 1.05, w3(e.y), e.a, w3(e.r)*1.14, (e.arc||1.6)*0.92, p,
          [1,0.35,0.42], a*0.55, 0.42);
        break; }
      case 'burst': {
        const r=w3(e.r)*(0.35+p*0.9);
        R3.draw('sph', w3(e.x), 0.9, w3(e.y), r*2,r*1.7,r*2, 0, c,
          {alpha:a*a*0.28, add:true, noCull:true});
        // onda de choque a ras de suelo
        R3.draw('disc', w3(e.x), 0.07, w3(e.y), r*2.2,1,r*2.2, 0, mixc(c,[1,1,1],0.4),
          {alpha:a*0.30, add:true});
        R3.draw('disc', w3(e.x), 0.09, w3(e.y), r*1.7,1,r*1.7, 0, c, {alpha:a*0.20, add:true});
        break; }
      case 'beam': {
        const L=w3(e.len), W=w3(e.w);
        const mx=w3(e.x)+Math.cos(e.a)*L/2, mz=w3(e.y)+Math.sin(e.a)*L/2;
        // núcleo blanco + halo + envoltura
        R3.draw('box', mx, 1.15, mz, L, W*0.42, W*0.42, -e.a, [1,1,1], {alpha:a*0.95, add:true});
        R3.draw('box', mx, 1.15, mz, L, W*1.0, W*1.0, -e.a, mixc(c,[1,1,1],0.4), {alpha:a*0.55, add:true});
        R3.draw('box', mx, 1.15, mz, L, W*2.1, W*2.1, -e.a, c, {alpha:a*0.18, add:true});
        // quemadura en el suelo
        R3.draw('box', mx, 0.06, mz, L, 0.03, W*1.4, -e.a, c, {alpha:a*0.30, add:true});
        // anillos a lo largo del rayo
        for(let k=1;k<=4;k++){
          const d=L*k/5, rr=W*(0.6+ (1-a)*1.4);
          R3.draw('disc', w3(e.x)+Math.cos(e.a)*d, 1.15, w3(e.y)+Math.sin(e.a)*d,
            rr,1,rr, 0, [1,1,1], {alpha:a*0.22, add:true, rz:Math.PI/2});
        }
        break; }
      case 'blackflash': {
        // núcleo negro, onda roja y grietas de luz
        R3.draw('sph', w3(e.x), 1.1, w3(e.y), 1.5*(1-p)*2,1.5*(1-p)*2,1.5*(1-p)*2, 0, [0,0,0], {alpha:a});
        R3.draw('sph', w3(e.x), 1.1, w3(e.y), (1+p*5)*2,(1+p*5)*2,(1+p*5)*2, 0, [1,0.22,0.30],
          {alpha:a*0.30, add:true, noCull:true});
        R3.draw('disc', w3(e.x), 0.10, w3(e.y), (1+p*8)*2,1,(1+p*8)*2, 0, [1,1,1], {alpha:a*0.55, add:true});
        for(let k=0;k<6;k++){
          const ang=k/6*TAU+p*1.5, len=1.5+p*5;
          R3.draw('box', w3(e.x)+Math.cos(ang)*len*0.5, 1.1, w3(e.y)+Math.sin(ang)*len*0.5,
            len, 0.10*a, 0.10*a, -ang, [1,0.45,0.5], {alpha:a*0.85, add:true});
        }
        break; }
      case 'hit':
        R3.draw('sph', w3(e.x),1.1,w3(e.y), (0.3+p*0.5)*2,(0.3+p*0.5)*2,(0.3+p*0.5)*2,0,
          [1,1,1],{alpha:a*a*0.8,add:true}); break;
      case 'spark': case 'muzzle':
        R3.draw('sph', w3(e.x),1.0,w3(e.y), (0.3*(1-p))*2,(0.3*(1-p))*2,(0.3*(1-p))*2,0,c,
          {alpha:a,add:true}); break;
      case 'domainOpen': case 'domainClose': {
        const r=w3(e.r)*(e.type==='domainOpen'?p:1-p);
        R3.draw('disc', w3(e.x),0.12,w3(e.y), r*2,1,r*2, 0, c, {alpha:a*0.55, add:true});
        R3.draw('sphHi', w3(e.x),0.2,w3(e.y), r*2,r*1.5,r*2, 0, c, {alpha:a*0.18, add:true, noCull:true});
        // pilares de energía en el borde
        if(e.type==='domainOpen') for(let k=0;k<10;k++){
          const ang=k/10*TAU;
          R3.draw('box', w3(e.x)+Math.cos(ang)*r, 2.2*p, w3(e.y)+Math.sin(ang)*r,
            0.35, 5.0*p, 0.35, 0, c, {alpha:a*0.35, add:true});
        }
        break; }
      case 'resonance':
        for(let k=0;k<3;k++){ const r=(0.4+k*0.55)*(1+p*1.6);
          R3.draw('disc', w3(e.x),0.1+k*0.5,w3(e.y), r*2,1,r*2, 0, [0.92,0.58,0.26],
            {alpha:a*0.5, add:true}); }
        break;
      case 'chain': {
        const n=12;
        for(let k=0;k<=n;k++){ const t=k/n;
          R3.draw('box', w3(e.x1+(e.x2-e.x1)*t), 1.0+Math.sin(t*Math.PI)*0.25, w3(e.y1+(e.y2-e.y1)*t),
            0.30,0.10,0.10, -Math.atan2(e.y2-e.y1,e.x2-e.x1), [0.72,0.76,0.82], {alpha:a}); }
        break; }
      case 'rubble':
        for(let k=0;k<8;k++){ const ang=k/8*TAU, r=w3(e.r)*p;
          R3.draw('box', w3(e.x)+Math.cos(ang)*r, 0.4+Math.sin(p*3)*0.7, w3(e.y)+Math.sin(ang)*r,
            0.45,0.45,0.45, ang, [0.34,0.30,0.26], {alpha:a, rz:p*2}); }
        break;
      case 'infinity': {
        // el Infinito: capas concéntricas que se detienen
        for(let k=0;k<3;k++)
          R3.draw('sphHi', w3(e.x),1.1,w3(e.y), (1.5+k*0.35+p*0.5)*2,(1.7+k*0.35+p*0.5)*2,(1.5+k*0.35+p*0.5)*2,
            0, [0.36,0.78,1], {alpha:a*0.16, add:true, noCull:true});
        break; }
      case 'heal':
        R3.draw('psph', w3(e.x)+(Math.random()-0.5)*0.8, 0.6+p*1.4, w3(e.y)+(Math.random()-0.5)*0.8,
          0.18,0.18,0.18,0,[0.37,0.9,0.66],{alpha:a,add:true}); break;
      case 'dash': case 'trail':
        R3.draw('sph', w3(e.x),0.9,w3(e.y), (0.55*a)*2,(0.55*a)*2,(0.55*a)*2,0,c,
          {alpha:a*0.45,add:true}); break;
      case 'guard':
        R3.draw('sphHi', w3(e.x),1.0,w3(e.y), 2.4,2.8,2.4,0,[0.45,0.65,1],
          {alpha:a*0.16,add:true,noCull:true}); break;
      case 'bfring':
        R3.draw('disc', w3(e.x),0.13,w3(e.y), (0.8+p*1.6)*2,1,(0.8+p*1.6)*2,0,[1,1,1],
          {alpha:a*0.6,add:true}); break;
      case 'cut':
        R3.draw('box', w3(e.x),1.0,w3(e.y), 2.2,0.06,0.06, p*3, [1,1,1],
          {alpha:a,add:true, rz:(e.x*7%3)-1}); break;
      case 'death':
        R3.draw('sphHi', w3(e.x),0.9,w3(e.y), (0.6+p*3)*2,(0.6+p*3)*2,(0.6+p*3)*2,0,c,
          {alpha:a*0.28,add:true,noCull:true}); break;
      case 'shiki': drawShikiFX(g,e); break;
    }
  }
  PS.draw();
}

/* --------------------------- HUD proyectado ------------------------------ */
function overlay3D(g){
  const S=cv.width/VW;
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,VW,VH);

  // etiquetas y barras sobre los luchadores
  for(const f of g.fighters){
    if(!f.alive||f===M.hero) continue;
    const pr=R3.project(w3(f.x), 2.35, w3(f.y), VW, VH);
    if(!pr||pr.d>60) continue;
    const fodder=f.cid==='curse_grunt'||f.cid==='transfigured';
    const w=f.minion?26:(f.isBoss?92:56);
    const sc=clamp(12/pr.d,0.45,1.25);
    const ww=w*sc;
    ctx.fillStyle='#000000aa'; ctx.fillRect(pr.x-ww/2-1,pr.y-1,ww+2,5*sc+2);
    ctx.fillStyle=f.team===M.hero.team?'#5fd6a0':(f.isBoss?'#ff3838':'#ff5f78');
    ctx.fillRect(pr.x-ww/2,pr.y,ww*clamp(f.hp/f.maxhp,0,1),5*sc);
    if(!f.minion&&!fodder){
      ctx.textAlign='center';
      ctx.font='900 '+Math.round(15*sc)+'px "Noto Serif JP",serif';
      ctx.fillStyle=f.C.color; ctx.strokeStyle='#000'; ctx.lineWidth=3*sc;
      ctx.strokeText(f.C.kanji, pr.x, pr.y-8*sc); ctx.fillText(f.C.kanji, pr.x, pr.y-8*sc);
      ctx.font='700 '+Math.round(9*sc)+'px system-ui'; ctx.fillStyle='#ffffffcc';
      ctx.fillText(f.name, pr.x, pr.y-22*sc);
    }
  }

  // números de daño flotantes
  if(SAVE.settings.dmgNum) for(const e of g.fx){
    if(e.type!=='dmgnum') continue;
    const pr=R3.project(w3(e.x), 1.9+(e.t/e.life)*1.1, w3(e.y), VW, VH);
    if(!pr) continue;
    const a=1-e.t/e.life, sc=clamp(14/pr.d,0.5,1.4);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.font=(e.bf?'900 ':'800 ')+Math.round((e.bf?24:14)*sc)+'px system-ui';
    ctx.fillStyle=e.bf?'#fff':'#ffd9de'; ctx.strokeStyle='#000'; ctx.lineWidth=3*sc;
    ctx.strokeText(e.v,pr.x,pr.y); ctx.fillText(e.v,pr.x,pr.y); ctx.globalAlpha=1;
  }

  // mirilla
  const cx=VW/2, cy=VH/2;
  const hot = M.hero.alive && !!g.enemiesOf(M.hero).find(o=>{
    const d=dist(M.hero.x,M.hero.y,o.x,o.y);
    return d<420 && Math.abs(angDiff(Math.atan2(o.y-M.hero.y,o.x-M.hero.x), M.hero.ang))<0.16; });
  ctx.strokeStyle=hot?'#ff3f5c':'#ffffffcc'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-11,cy); ctx.lineTo(cx-4,cy); ctx.moveTo(cx+4,cy); ctx.lineTo(cx+11,cy);
  ctx.moveTo(cx,cy-11); ctx.lineTo(cx,cy-4); ctx.moveTo(cx,cy+4); ctx.lineTo(cx,cy+11);
  ctx.stroke();
  ctx.fillStyle=hot?'#ff3f5c':'#ffffff66';
  ctx.beginPath(); ctx.arc(cx,cy,1.6,0,TAU); ctx.fill();

  drawMinimap(g);
  drawCenterMsg();

  if(!POINTER.locked && !M.paused && !M.ended){
    ctx.fillStyle='#0a0a12dd'; ctx.fillRect(cx-190,VH*0.62,380,54);
    ctx.strokeStyle='#c3122e'; ctx.lineWidth=1; ctx.strokeRect(cx-190,VH*0.62,380,54);
    ctx.textAlign='center'; ctx.fillStyle='#e8e6f0'; ctx.font='700 15px system-ui';
    ctx.fillText('HAZ CLIC PARA TOMAR EL CONTROL', cx, VH*0.62+24);
    ctx.font='11px system-ui'; ctx.fillStyle='#8b8ba3';
    ctx.fillText('el ratón controla la cámara · ESC para liberarlo', cx, VH*0.62+42);
  }
}

/* ------------------------ poses y reacciones ----------------------------
   SUAVIZADO. poseOf() calcula la postura desde cero cada fotograma y no tiene
   memoria: al terminar un ataque el brazo no volvia, APARECIA en reposo. Cada
   cambio de estado era un corte seco. Aqui se guarda la pose interpolada en
   f._po, un campo de cliente que no entra en stateChecksum -- igual que el
   nivel de Rika -- y se persigue a la pose objetivo. Entra rapido y sale
   despacio, que es como se lee un golpe: seco al dar, con recuperacion al
   volver. El respingo de dolor NO se suaviza: ese debe ser instantaneo.    */
const POSE_KEYS=['lean','crouch','armExt','armUp','twist','bright','swingLat','swingPhi','offArm'];
function smoothPose(g,f){
  const tgt = poseOf(g,f);
  if(!f._po){ f._po = Object.assign({}, tgt); return f._po; }
  const p=f._po, dt=Math.min(0.10, VISDT);
  for(const k of POSE_KEYS){
    const a=p[k]||0, b=tgt[k]||0;
    const sp = Math.abs(b) > Math.abs(a) ? 26 : 11;
    p[k] = a + (b-a)*Math.min(1, dt*sp);
  }
  p.flinch = tgt.flinch;
  /* 4) CONTRARROTACION DEL TORSO. El personaje siempre encara a donde apuntas,
     asi que cuerpo y cabeza giraban como una pieza rigida. Al girar, el torso
     se retrasa un poco respecto a las piernas y luego se recoloca: es la
     torsion que hace que un giro parezca un giro. */
  if(f._ang0===undefined) f._ang0=f.ang;
  let d=f.ang-f._ang0;
  while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU;
  f._ang0 += d*Math.min(1, dt*7);
  /* El lag se devuelve en una COPIA, nunca sumado a f._po. Sumandolo al
     estado persistente se acumulaba: cada fotograma añadia el giro y solo
     se decaia un 18%, asi que girando de forma sostenida el torso llegaba a
     enroscarse 110 grados en vez de quedarse en los 20 que toca. */
  const out = Object.assign({}, p);
  out.twist = p.twist + clamp(d, -0.7, 0.7)*0.85;
  return out;
}

/* ------------------------ poses y reacciones ---------------------------- */
/* Cada arma se blande distinto. El tipo de tecnica ('melee') decia COMO de
   fuerte pega, pero no CON QUE, asi que un mandoble y un punetazo compartian
   animacion. Esto agrupa las diez armas en cinco familias de gesto.        */
/* Cuanto arrastra cada peinado. La inercia solo tiene sentido en el pelo que
   cuelga: en un corte corto el desplazamiento se leia como si el casco de pelo
   se despegara del craneo. Lo que no esta en esta tabla no se mueve.       */
const HAIR_SWAY = { long:1.0, tail:1.0, bob:0.50 };

const WEAPON_CLASS = {
  none:'fist',  claws:'claws',
  katana:'blade', wrapkatana:'blade', cleaver:'blade', chainblade:'blade',
  staff:'pole',  spear:'pole',
  hammer:'heavy', gavel:'heavy', greatsword:'heavy'
};
function weaponClassOf(f){
  const S = (typeof MODEL!=='undefined' && MODEL[f.cid]) || null;
  return (S && WEAPON_CLASS[S.weapon]) || 'fist';
}

function poseOf(g,f){
  const P={ lean:0, crouch:0, armExt:0.14, armUp:0, flinch:0, dead:0, twist:0, bright:0,
            swingLat:0, swingPhi:0, offArm:0 };
  // reacción al recibir daño
  if(f.lastHurt!==undefined){
    P.flinch = clamp(1-(g.t-f.lastHurt)/0.26,0,1);
    P.lean  -= P.flinch*0.30;
    P.bright = P.flinch*0.55;
  }
  /* REBOTE: el tren superior sale despedido hacia atras y vuelve. Se calcula
     aparte del respingo de dolor porque dura mucho mas y es mas amplio. */
  if(f.repelT>0){
    const k=f.repelT/0.75, e=Math.sin(k*Math.PI)*0.9 + k*0.35;
    P.lean  -= 0.85*e;
    P.armUp += 0.34*e;
    P.armExt = Math.max(P.armExt, 0.30*e);
    P.twist += 0.22*e;
    P.bright = Math.max(P.bright, 0.35*k);
  }
  /* sacudida de quien para el golpe: corta y seca, sin perder la postura */
  if(f.blockHit>0){
    const k=f.blockHit/0.26;
    P.lean   -= 0.30*k;
    P.crouch -= 0.10*k;
    P.bright  = Math.max(P.bright, 0.55*k);
  }
  // esquiva: inclinarse en la dirección del movimiento
  if(f.dashT>0){ P.lean += 0.42; P.crouch -= 0.10; }
  // refuerzo: encogerse y cruzar los brazos
  if(f.guarding){ P.crouch -= 0.14; P.lean += 0.16; P.armExt=0.30; P.armUp=0.10; }
  // técnica reversa: manos al pecho
  if(f.input && f.input.rct && !f.noCE){ P.crouch-=0.10; P.armExt=0.05; P.armUp=0.06; }
  // ataque: pose según el tipo de técnica
  if(f.atk){
    const t=clamp(f.atk.t/Math.max(0.05,f.atk.windup),0,1.6);
    const ab=f.atk.ab, ty=ab.type||'melee';
    const wind = t<1 ? -0.35*(1-t) : 0;        // carga
    const hit  = t>=1 ? Math.max(0,1.6-t)*0.9 : 0;
    if(ty==='melee'||f.atk.kind==='basic'){
      switch(weaponClassOf(f)){
        case 'blade':
          /* Corte de lado a lado. Lo que hacia que pareciera un pinchazo era
             la extension del brazo (0,30+0,62 hacia delante); ahora se recorta
             y el peso del gesto se lo lleva el ARCO: el brazo se arma cruzado
             al pecho durante la carga y barre 2 radianes completos al cortar,
             pasando por el centro justo en el impacto. */
          P.lean  += 0.26 + wind*0.7 + hit*0.40;
          P.twist  = wind*1.75 - hit*1.30;
          P.armUp  = (t<1 ? 0.26*t : Math.max(0,1.6-t)*0.10);
          P.armExt = 0.34 + (t>=1?0.26:0.06);
          P.swingLat = (t<1) ? -1.00*t
                             : -1.00 + 2.00*clamp((t-1)/0.50, 0, 1);
          break;
        case 'pole':    /* estocada: zancada larga y brazo recto al frente */
          P.lean  += 0.58 + wind*1.5 + hit*0.35;
          P.crouch -= 0.20 + (t>=1?0.06:0);
          P.twist   = wind*0.55;
          P.armExt = 0.25 + (t>=1?0.86:0.02);
          P.offArm = (t>=1 ? 0.55 : 0.20);
          break;
        case 'heavy':   /* mazazo a dos manos: carga arriba, descarga aplastando */
          P.armUp  = (t<1 ? 0.30 + 1.05*(1-t) : Math.max(0,1.6-t)*0.22);
          P.lean  += (t<1 ? -0.30*(1-t) : 0.62) + hit*0.45;
          P.crouch -= (t>=1 ? 0.34*Math.min(1,(t-1)*3.2) : 0);
          P.twist   = wind*0.45;
          P.armExt = 0.15 + (t>=1?0.80:0.05);
          P.offArm = 0.85;
          break;
        case 'claws':   /* zarpazo bajo con las dos manos */
          P.lean  += 0.48 + wind*1.1 + hit*0.7;
          P.twist  = wind*1.25 - hit*1.05;
          P.armUp  = -0.16;
          P.swingLat = (t<1 ? 0.42*(1-t) : -0.48*Math.max(0,1.6-t));
          P.armExt = 0.25 + (t>=1?0.70:0.08);
          P.offArm = 0.60;
          break;
        default:        /* punos: directo corto y rapido, mucha cadera */
          P.lean  += 0.42 + wind*1.3 + hit*0.6;
          P.twist  = wind*0.8 - hit*0.6;
          P.armExt = 0.20 + (t>=1?0.74:0.06);
      }
    } else if(ty==='beam'||ty==='projectile'){
      P.lean += -0.24 + hit*0.5; P.armExt = 0.72; P.armUp = 0.12;
    } else if(ty==='aoe'){
      P.armUp = 0.55; P.armExt = 0.10; P.crouch -= 0.06 + hit*0.15;
    } else if(ty==='buff'){
      P.armUp = 0.42; P.armExt = 0.36; P.crouch -= 0.10; P.bright=Math.max(P.bright,0.3);
    } else if(ty==='summon'){
      P.armExt = 0.48; P.armUp = -0.18; P.lean += 0.14;
    }
  }
  // dominio abierto: brazos abiertos, ligera elevación
  if(f.domain){ P.armExt=0.44; P.armUp=0.30; P.crouch+=0.08; P.bright=Math.max(P.bright,0.22); }
  return P;
}

/* ======================================================================== */
function drawCharacter(g, f){
  if(!f.alive){
    const td=g.t-f.deathT;
    const a=clamp(1-(td-1.1)/0.9,0,1); if(a<=0) return;
    const fall=clamp(td/0.55,0,1);
    const S0=MODEL[f.cid]||MODEL._default;
    const x0=w3(f.x), z0=w3(f.y), ry0=-f.ang;
    const col0=hex3(S0.top||'#222'), sk=hex3(S0.skin);
    const dz=1.40*fall;                       // se desploma hacia delante
    const yb=Math.max(0.34, 1.05-fall*0.62);
    const fw=[Math.cos(f.ang),Math.sin(f.ang)];
    R3.draw('disc', x0, 0.03, z0, 1.4,1,1.4, 0, [0,0,0], {alpha:0.45*a});
    const B0=S0.build||1, H0=S0.tall||1;
    R3.draw('cyl', x0+fw[0]*0.32*fall, yb, z0+fw[1]*0.32*fall,
      0.56*B0, 0.92*H0, 0.42*B0, ry0, col0, {tex:TEX.coat, tile:1, rz:dz, alpha:a});
    R3.draw('cyl', x0+fw[0]*0.78*fall, yb+0.50*(1-fall)+0.10, z0+fw[1]*0.78*fall,
      0.20*B0, 0.34*H0, 0.20*B0, ry0, mixc(col0,[0,0,0],0.2), {tex:TEX.fabric, tile:1, rz:dz, alpha:a});
    R3.draw('sph', x0+fw[0]*1.02*fall, yb+0.66*(1-fall)+0.14, z0+fw[1]*1.02*fall,
      0.41*(S0.head||1), 0.44*(S0.head||1), 0.38*(S0.head||1), ry0, sk,
      {tex:TEX.skin, tile:1, alpha:a});
    R3.draw('disc', x0, 0.05, z0, 2.6*(1-a)+1.2, 1, 2.6*(1-a)+1.2, 0, hex3(f.C.color),
      {alpha:a*0.25, add:true});
    return;
  }
  if(f.minion){ drawBeast(g,f); return; }
  if(f.cid==='dummy'){ drawDummy(g,f); return; }
  /* 'look' separa el ASPECTO del kit. Panda peleaba con el cuerpo de Hakari
     porque la escalera reutiliza kits: mismo cid, distinto nombre. Con esto un
     rival puede tener su propia figura sin necesidad de un personaje entero. */
  const S = MODEL[f.look] || MODEL[f.cid] || MODEL._default;
  const x=w3(f.x), z=w3(f.y);
  const col=hex3(f.C.color);
  const skin=hex3(S.skin), hair=hex3(S.hair), top=hex3(S.top), trim=hex3(S.trim);
  /* limbCol: miembros de un color distinto al torso. Sin esto un panda sale
     entero blanco, porque brazos y piernas se derivan del color de la ropa. */
  const limbBase = S.limbCol ? hex3(S.limbCol) : top;
  const dark=mixc(limbBase,[0,0,0],0.35);

  const B=S.build||1, H=S.tall||1;
  const sc=(f.minion?0.72:1);
  const ry=-f.ang;
  const spd=Math.hypot(f.vx,f.vy);
  const bob=Math.sin(g.t*10+f.uid)*Math.min(0.055, spd*0.00035) + Math.sin(g.t*1.6+f.uid)*0.012;
  /* 3) La zancada iba con el RELOJ, no con el avance: los pies patinaban
     siempre que la velocidad no coincidiera por casualidad con el ciclo.
     Ahora la fase se acumula con la distancia recorrida, asi que un paso
     equivale a un tramo de suelo y el pie se queda donde lo pusiste. */
  if(f._gait===undefined) f._gait=f.uid;
  f._gait += spd*Math.min(0.10,VISDT)*(TAU/120);
  const stride=Math.sin(f._gait)*Math.min(0.24, spd*0.0013);
  /* 5) INERCIA DEL PELO: arrastra al arrancar y al frenar en vez de ir rigido */
  if(f._hlx===undefined){ f._hlx=0; f._hlz=0; }
  { const k=Math.min(1, VISDT*7);
    f._hlx += (f.vx*0.00055 - f._hlx)*k;
    f._hlz += (f.vy*0.00055 - f._hlz)*k; }
  const rgt=[-Math.sin(f.ang),Math.cos(f.ang)];
  const fwd=[Math.cos(f.ang),Math.sin(f.ang)];
  const PO = smoothPose(g,f);
  /* Con Rika manifestada, el golpe lo da ELLA. Yuta acompaña el gesto en vez
     de protagonizarlo: si los dos lanzan el mismo tajo a la vez, ninguno se
     lee. Se le recorta la extension del brazo y la inclinacion. */
  if(S.rika && f._rk>0.5){
    /* seguro: smoothPose devuelve una copia, no el estado guardado */
    const ceder = clamp((f._rk-0.5)/0.7, 0, 1)*0.62;
    PO.armExt *= (1-ceder); PO.lean *= (1-ceder*0.7); PO.twist *= (1-ceder*0.5);
  }
  /* LENGUAJE DE FORMA. Las maldiciones eran el mismo cuerpo humano con otro
     color: mismo esqueleto, mismas proporciones y la misma simetria perfecta.
     Estos cinco rasgos separan los dos vocabularios. Todos valen neutro por
     defecto, asi que ningun humano cambia salvo que se le declare. */
  const SH = { hunch:S.hunch||0, armLong:S.armLong||1, asym:S.asym||0,
               lumps:S.lumps||0, noNeck:!!S.noNeck };
  const LEAN = PO.lean + SH.hunch, CR = PO.crouch;   // encorvado permanente
  const LN = (h)=>Math.sin(LEAN)*h;            // desplazamiento por inclinación
  const alpha = f.stealth>0?0.35:1;
  const O = alpha<1?{alpha, rim:0.20+PO.bright*0.9}:{rim:0.20+PO.bright*0.9};
  const CLOTH = TEX[S.cloth||'fabric']||TEX.fabric;
  const TX = t=>Object.assign({tex:TEX[t], tile:1}, O);
  const K = (v)=>v*sc;
  /* Rika se calcula antes que nada: el arma y el anillo leen su nivel */
  const RK = S.rika ? rikaLevel(g,f) : 0;

  /* ======================= ANATOMÍA ========================================
     Alturas en unidades de modelo (0 = suelo, ~2.12 = coronilla) y anchos en
     múltiplos de la corpulencia. Todo pasa por B (ancho) y H (altura), que
     salen de la ficha del personaje: Aoi Todo ocupa y mide de verdad más que
     Nobara, y no es el mismo muñeco escalado.                               */
  const hs = S.head||1;
  const Y  = v => K(v*H);                                  // altura → mundo
  const PXZ = (fw2,rg2)=>[ x+fwd[0]*fw2*sc+rgt[0]*rg2*sc,
                           z+fwd[1]*fw2*sc+rgt[1]*rg2*sc ];

  /* ===================== CADENA DEL TRONCO =========================
     Hasta ahora cada pieza del torso calculaba su sitio desde el SUELO con
     LN(altura) = sin(inclinacion)*altura. Es una aproximacion lineal: al
     inclinarse mucho, las piezas se desplazan cada una por su cuenta y el
     cuerpo se desmonta por las costuras.
     Con la cadena, la pelvis nace en la cadera y cada pieza siguiente nace
     DONDE TERMINO LA ANTERIOR heredando su angulo acumulado. Es el mismo
     principio que ya usaban los miembros con seg(), extendido al tronco.
     Lo heredan tambien las maldiciones, que se dibujan con esta funcion.  */
  const CAD = (x0,y0,z0)=>{
    let cx=x0, cy=y0, cz=z0, ang=0;
    return {
      sube(alto, incl){
        ang += (incl||0);
        const h=alto*sc;
        cx += fwd[0]*Math.sin(ang)*h;
        cz += fwd[1]*Math.sin(ang)*h;
        cy += Math.cos(ang)*h;
        return [cx,cy,cz,ang];
      },
      aqui(){ return [cx,cy,cz,ang]; }
    };
  };

  /* segmento de miembro: phi 0 cuelga a plomo, +π/2 apunta al frente;
     lat abre el miembro hacia fuera girando su plano de trabajo.            */
  const seg = (px,py,pz, phi, lat, len, rad, col, opt)=>{
    const a2=f.ang+lat, fw2=[Math.cos(a2),Math.sin(a2)], ry2=-a2;
    const hx=Math.sin(phi), hv=-Math.cos(phi);
    /* 'limb' se estrecha hacia el extremo libre, que es donde va la mano o el
       pie: el volumen queda en la articulacion, como en un cuerpo real. */
    R3.draw('limb', px+fw2[0]*hx*len*0.5, py+hv*len*0.5, pz+fw2[1]*hx*len*0.5,
      rad, len, rad, ry2, col, Object.assign({rz:phi}, opt));
    return [px+fw2[0]*hx*len, py+hv*len, pz+fw2[1]*hx*len];
  };

  const SK = Object.assign({tex:TEX.skin, tile:1}, O);
  const CL = Object.assign({tex:CLOTH,   tile:1}, O);
  const FB = Object.assign({tex:TEX.fabric, tile:1}, O);
  const skinD = mixc(skin,[0,0,0],0.12);
  const sleeve = S.sleeveless ? skin : mixc(limbBase,[1,1,1],0.07);
  const sleeveT = S.sleeveless ? SK : CL;

  /* --- sombra --- */
  /* 6) La sombra era un disco plano fijo. Ahora responde a la postura: se
     encoge y se oscurece al agacharse, se estira al inclinarse, y lleva un
     halo mas ancho y tenue que hace de penumbra. */
  { const cr=1 - PO.crouch*0.55, sh=K(0.95*B)*cr;
    R3.draw('disc', x+fwd[0]*LN(0.5)*sc*0.5, 0.03, z+fwd[1]*LN(0.5)*sc*0.5,
      sh, 1, sh, 0, [0,0,0], {alpha:0.52});
    R3.draw('disc', x, 0.025, z, sh*1.55, 1, sh*1.55, 0, [0,0,0], {alpha:0.17}); }

  /* ------------------------------ PIERNAS ------------------------------- */
  if(S.robe){
    R3.draw('cone', x+fwd[0]*LN(0.6)*sc, Y(0.62+bob), z+fwd[1]*LN(0.6)*sc,
      K(1.00*B), Y(1.24), K(0.88*B), ry, mixc(top,[1,1,1],0.05),
      Object.assign({tex:TEX.coat,tile:1},O));
  } else {
    for(const sgn of [-1,1]){
      const hipW = 0.19*B;
      const [lx,lz] = PXZ(LN(0.9), hipW*sgn);
      /* el paso: el muslo va y viene, la rodilla lo acompaña con retraso */
      const sw   = stride*sgn;
      const phiT = sw*2.1 - CR*0.55;
      const phiS = phiT - 0.16 - Math.max(0,-sw)*1.1 - CR*0.75;
      const knee = seg(lx, Y(0.94+bob), lz, phiT, 0, Y(0.44), K(0.155*B), dark, FB);
      const ank  = seg(knee[0], knee[1], knee[2], phiS, 0, Y(0.44), K(0.125*B), dark, FB);
      /* pie */
      R3.draw('box', ank[0]+fwd[0]*0.07*B*sc, Y(0.055), ank[2]+fwd[1]*0.07*B*sc,
        K(0.30*B), Y(0.11), K(0.17*B), ry, mixc(dark,[0,0,0],0.35), O);
    }
  }

  /* --------------------------- CADERA Y TRONCO --------------------------- */
  /* pelvis. Era 0,36*B de ancho de lado, pero los muslos nacen a 0,19*B del
     eje y miden 0,155*B de grueso: su borde exterior quedaba en 0,284 contra
     los 0,191 de la cadera, o sea que el nacimiento de las piernas asomaba
     por fuera y por encima del hueso. A 0,58*B la cadera los cubre. */
  R3.draw('cyl', x+fwd[0]*LN(1.0)*sc, Y(1.00+bob+CR*0.4), z+fwd[1]*LN(1.0)*sc,
    K(0.52*B), Y(0.24), K(0.58*B), ry+PO.twist*0.5, dark, Object.assign({tex:CLOTH,tile:1,rz:LEAN*0.4},O));
  /* cinturón. Antes 0,53*B de ancho contra 0,52*B de la pelvis: 1,9% de
     diferencia con las alturas solapadas, el mismo patrón de z-fighting que
     ya se había arreglado entre el pelo y el cráneo. Aquí nunca se tocó, y
     como pelvis+cinturón se dibujan en TODOS los personajes y TODAS las
     poses, es el candidato que mejor explica "pasa en todos lados". Ahora
     0,58/0,40: separación de ~3 cm reales en vez de 5 mm, y de paso un
     cinturón que sobresale un poco de la cadera, que es como se ve uno de
     verdad. Comprobado con el arnés: 0 de 20 personajes con el conflicto. */
  R3.draw('box', x+fwd[0]*LN(1.05)*sc, Y(1.11+bob+CR*0.4), z+fwd[1]*LN(1.05)*sc,
    K(0.58*B), Y(0.075), K(0.40*B), ry+PO.twist*0.5, mixc(dark,[0,0,0],0.4), O);

  /* ---- el tronco, ya en cadena ----
     Arranca en la cintura y sube encadenado: cada pieza nace donde termino la
     anterior y hereda su angulo. La inclinacion se reparte entre los tres
     tramos en vez de aplicarse entera a cada uno desde el suelo. */
  /* LA JOROBA. Repartir la inclinacion entre los tres tramos (0,34+0,36+0,30)
     no es inclinarse: es CURVARSE. Con un ataque fuerte, LEAN llega a 0,86 y
     salian 33 grados de diferencia entre la base y los hombros -- una C, o sea
     chepa. Una inclinacion real gira el torso RIGIDO sobre la cadera: casi
     todo el angulo en la primera articulacion y apenas nada en las de arriba.
     Ahora la curvatura baja a 8 grados.
     Y la cadena arranca en el sitio EXACTO donde esta el cinturon, con su
     mismo desplazamiento: antes empezaba en el eje del cuerpo mientras las
     piernas y el cinturon usaban el suyo, y al inclinarse el torso se
     adelantaba respecto a las piernas. */
  const TR = CAD(x+fwd[0]*LN(1.05)*sc, Y(1.11+bob+CR*0.4), z+fwd[1]*LN(1.05)*sc);
  const pAbd = TR.sube(0.15*H, LEAN*0.30);
  R3.draw('limbS', pAbd[0], pAbd[1], pAbd[2],
    K(0.46*B), Y(0.26), K(0.31*B), ry+PO.twist*0.8,
    S.suit?mixc(top,[1,1,1],0.05):top, Object.assign({},CL,{rz:pAbd[3]}));
  const pTor = TR.sube(0.20*H, LEAN*0.10);
  R3.draw('cyl', pTor[0], pTor[1], pTor[2],
    K(0.55*B), Y(0.34), K(0.36*B), ry+PO.twist,
    S.suit?mixc(top,[1,1,1],0.05):top, Object.assign({},CL,{rz:pTor[3]}));
  /* El pectoral era una esfera suelta en mitad del pecho. Con las caras ya
     bien orientadas dejo de disimularse y se leia como una bola pegada
     encima del torso, asi que se quita: la caja toracica ya da el volumen. */
  /* Trapecio con PENDIENTE: ancho abajo y estrecho arriba, para que la linea
     del hombro no sea un escalon recto hacia el cuello. */
  const pTra = TR.sube(0.19*H, LEAN*0.06);
  R3.draw('limbS', pTra[0], pTra[1], pTra[2],
    K(0.46*B), Y(0.17), K(0.30*B), ry+PO.twist, mixc(top,[1,1,1],0.06),
    Object.assign({}, CL, {rz:Math.PI+pTra[3]}));

  /* MALDICIONES: bultos que no cierran la silueta. Colocados con el angulo
     aureo a partir del uid, asi que cada bicho tiene los suyos y no bailan
     entre fotogramas. HUMANOS: clavicula, que es lo que hace que un torso se
     lea como un pecho y no como un tubo. */
  if(SH.lumps>0){
    for(let i=0;i<SH.lumps;i++){
      const a   = i*2.3999 + f.uid*0.7;
      const hgt = 1.16 + (i%3)*0.24;
      const rad = 0.12 + ((i*7+f.uid)%5)*0.020;
      const p   = PXZ(LN(hgt)-0.08*B, (0.19+0.14*((i%2)?1:-1))*B*Math.cos(a));
      R3.draw('sph', p[0], Y(hgt+bob+CR), p[1],
        K(rad*B*1.7), K(rad*B*1.25), K(rad*B*1.5), ry+a,
        mixc(top,[0,0,0],0.20), Object.assign({tex:TEX.flesh,tile:1},O));
    }
  } else if(!S.curse && !S.robe){
    R3.draw('box', x+fwd[0]*(0.15*B+LN(1.52))*sc, Y(1.53+bob+CR), z+fwd[1]*(0.15*B+LN(1.52))*sc,
      K(0.06*B), Y(0.045), K(0.50*B), ry+PO.twist, mixc(top,[1,1,1],0.10), CL);
  }

  /* --- detalle del atuendo: franja / corbata --- */
  R3.draw('box', x+fwd[0]*(0.235*B+LN(1.30))*sc, Y(1.30+bob+CR), z+fwd[1]*(0.235*B+LN(1.30))*sc,
    K(0.05), Y(0.44), K(0.10*B), ry+PO.twist, trim,
    Object.assign({emis:0.12+PO.bright*0.5, rz:LEAN},O));

  /* La gabardina era un CONO con la base abajo, o sea una falda acampanada
     que se abria sobre las caderas. Retirada: el personaje se lee mejor con
     la silueta de las piernas limpia. Los personajes de tunica (Jogo, Uraume,
     Kenjaku, Kagero) conservan la suya, que se dibuja aparte en las piernas. */

  /* ------------------------------- BRAZOS -------------------------------- */
  const nArms = S.arms||2;
  const ext = PO.armExt + (f.atk?Math.min(0.30,f.atk.t*2.0):0);
  const armRows = nArms===4 ? [1.50, 1.24] : [1.50];
  let leadHand = null, leadLat = 0;
  armRows.forEach((rowY,row)=>{
    for(const sgn of [1,-1]){
      const lead = (sgn>0 && row===0);
      /* Hombros mas juntos. A 0,288 de complexion los brazos nacian muy
         separados del tronco, y en un personaje corpulento (Panda, 1,34) eso
         se multiplica: quedaban colgando al aire lejos del cuerpo. */
      const [sx0,sz0] = PXZ(LN(rowY), 0.245*B*sgn);
      /* En guardia los dos brazos se cruzan delante del pecho con el mismo
         alcance y el mismo ángulo, así que convergían en el MISMO punto: medido,
         los antebrazos se enterraban un 70% de su volumen y las manos un 40%,
         una masa fundida en vez de dos brazos cruzados. El de la derecha ahora
         reposa por encima y el de la izquierda por debajo (como un cruce de
         brazos real), y en los personajes de cuatro brazos (Sukuna) se separa
         además cada fila de la otra para que no choquen entre sí. Verificado con
         un arnés numérico sobre 5 complexiones (0,9 a 1,5) y el caso de 4 brazos:
         0 solapes severos entre extremidades distintas, frente a los de antes. */
      /* Ojo con la precedencia: sin los parentesis el sumando se pegaba solo
         a la rama 'else' del ternario y el desnivel se perdia en guardia. */
      const rowPad = ((nArms===4 && f.guarding) ? (row===0? 0.15 : -0.15) : 0)
                     + SH.asym*0.55*sgn;   // un hombro mas alto que el otro
      const sy0 = Y(rowY+bob+CR+PO.armUp*0.5) + (f.guarding ? K(((sgn>0?0.15:-0.12)+rowPad)*B) : 0);
      /* deltoides: redondea el hombro y tapa la unión */
      R3.draw('sph', sx0, sy0, sz0, K(0.235*B), K(0.225*B), K(0.235*B), ry,
        S.sleeveless?skin:mixc(top,[1,1,1],0.12), sleeveT);

      const sw = stride*(-sgn);
      let phi1, phi2, lat;
      if(f.guarding){
        const wc = weaponClassOf(f);
        if(nArms===4 && row===1){
          /* SUKUNA se cubre solo con los dos brazos de arriba; los de abajo
             siguen colgando, que es lo que le da su estampa. */
          phi1 = 0.14 + PO.armUp*0.4; phi2 = phi1 + 0.40; lat = 0.15*sgn;
        } else if(wc==='blade' || wc==='pole'){
          /* ARMA CRUZADA. Antes extendia el brazo al frente y la hoja quedaba
             apuntando hacia delante como una lanza. Lo que hace un espadachin
             es lo contrario: recoge los brazos contra el cuerpo y atraviesa la
             hoja DE LADO A LADO. El angulo lateral (lat) es lo que la cruza;
             el brazo se queda corto y alto, a la altura del pecho. */
          phi1 = (sgn>0 ? 0.98 : 0.72) + PO.armUp*0.5;
          phi2 = phi1 + (sgn>0 ? 0.16 : 0.30);
          lat  = (sgn>0 ? -1.32 : -0.52);
        } else {
          /* PUÑOS PARALELOS delante de la cara, como quien se cubre. */
          phi1 = 1.60 + PO.armUp*0.5; phi2 = 2.52; lat = -0.15*sgn;
        }
      } else if(lead){                     // brazo que ataca
        phi1 = 0.16 + ext*1.34 + PO.armUp*1.5 + PO.swingPhi;
        phi2 = phi1 + 0.36 - ext*0.46;
        lat  = 0.12 - ext*0.12 + PO.swingLat;
      } else {
        phi1 = 0.12 + sw*1.25 + PO.armUp*1.5 + PO.offArm*1.25;
        phi2 = phi1 + 0.34;
        lat  = 0.10*sgn;                 // el brazo cae pegado, no abierto
      }
      lat *= sgn>0?1:1;                    // lat ya lleva el signo donde toca
      if(!f.guarding && !lead) lat = 0.10*sgn - PO.swingLat*0.30;
      /* Brazos que cuelgan por debajo de la rodilla y con los dos lados
         desiguales: el gesto mas rapido de leer como "esto no es humano". */
      const AL = SH.armLong*(1+SH.asym*sgn), AR = (1+SH.asym*sgn*0.55);
      const el = seg(sx0, sy0, sz0, phi1, lat, Y(0.40*AL), K(0.125*B*AR), sleeve,
        Object.assign({}, sleeveT, {emis:(lead&&f.atk)?0.35:0}));
      const wr = seg(el[0], el[1], el[2], phi2, lat, Y(0.36*AL), K(0.104*B*AR),
        S.sleeveless?skin:mixc(sleeve,[0,0,0],0.06), sleeveT);
      /* codo */
      R3.draw('sph', el[0], el[1], el[2], K(0.135*B), K(0.135*B), K(0.135*B), ry, sleeve, sleeveT);
      /* mano: no una bola suelta, un puño orientado como el antebrazo */
      const a2=f.ang+lat, fw2=[Math.cos(a2),Math.sin(a2)];
      const hd=[Math.sin(phi2), -Math.cos(phi2)];
      const hx2=wr[0]+fw2[0]*hd[0]*Y(0.07), hy2=wr[1]+hd[1]*Y(0.07), hz2=wr[2]+fw2[1]*hd[0]*Y(0.07);
      /* Un solo puño. Antes se dibujaban DOS piezas en el mismo centro exacto:
         esta caja (el puño orientado) y una esfera sobrante de la version
         anterior, la "bola suelta" que el propio comentario de arriba dice
         haber sustituido — pero que nunca se borro. La caja gira con rz y la
         esfera no, asi que se atravesaban entre si de forma permanente: las
         esquinas de la caja salian del elipsoide (3,40 frente a 1,0) y la
         esfera sobresalia 1,5 mm de la caja. En las dos manos, de los 20
         personajes, en todas las poses. Se elimina la esfera. */
      R3.draw('box', hx2, hy2, hz2, K(0.165*B), K(0.145*B), K(0.125*B), -a2, skinD,
        Object.assign({}, SK, {rz:phi2}));
      if(lead){ leadHand = [hx2, hy2, hz2]; leadLat = lat; }
    }
  });
  if(leadHand) drawWeapon(g,f,S, leadHand[0], leadHand[1], leadHand[2], ry, sc, O, leadLat);

  /* ------------------------------- CABEZA -------------------------------- */
  const HY = Y(1.90+bob+CR+PO.armUp*0.15);          // centro de la cabeza
  const [HX,HZ] = PXZ(LN(1.85), 0);
  const HW = 0.375*hs, HH = 0.44*hs, HD = 0.405*hs;  // ancho, alto, fondo
  /* cuello */
  R3.draw('cyl', ...(()=>{ const p=PXZ(LN(1.66),0); return [p[0], Y(1.66+bob+CR), p[1]]; })(),
    K(SH.noNeck?0.30*B:0.18*B), Y(SH.noNeck?0.07:0.20), K(SH.noNeck?0.30*B:0.18*B),
    ry, skinD, SK);

  if(S.volcano){
    R3.draw('cone', HX, HY+K(0.10), HZ, K(0.72), K(0.86), K(0.72), ry,
      [0.22,0.13,0.11], Object.assign({tex:TEX.lava,tile:1},O));
    R3.draw('disc', HX, HY+K(0.50), HZ, K(0.28), 1, K(0.28), 0, [1,0.42,0.10], {alpha:0.9, add:true});
    R3.draw('sph', HX, HY+K(0.48), HZ, K(0.32),K(0.20),K(0.32), 0, [1,0.5,0.12], {alpha:0.5, add:true});
  } else {
    /* cráneo + mandíbula: dos piezas, para que tenga cara y no sea una bola */
    /* la cabeza es lo que mas se mira: sphHi (18x28) en vez de sph (9x14) */
    R3.draw('sphHi', HX, HY+K(0.03), HZ, K(HD), K(HH), K(HW), ry, skin,
      Object.assign({tex:S.stitched?TEX.stitch:TEX.skin, tile:1}, O));
    R3.draw('sph', HX+fwd[0]*0.03*sc, HY-K(0.10), HZ+fwd[1]*0.03*sc,
      K(HD*0.92), K(HH*0.52), K(HW*0.86), ry, mixc(skin,[0,0,0],0.05),
      Object.assign({tex:TEX.skin, tile:1}, O));
    /* orejas */
    for(const s2 of [-1,1]){
      const p=PXZ(LN(1.85)-0.02, HW*0.50*s2);
      R3.draw('sph', p[0], HY+K(0.01), p[1], K(0.07), K(0.13), K(0.05), ry, skinD, SK);
    }
    /* El pelo se dibujaba con medidas pensadas para la cabeza antigua (0,54 de
       ancho). Con el cráneo nuevo (0,375) la melena era MÁS GRANDE que la
       cabeza: le tapaba media cara y quedaba a la misma profundidad que los
       ojos, así que las dos capas se peleaban por el mismo píxel. Se pasa el
       factor de la cabeza para que siempre quede justo por encima del cráneo. */
    const hw = HAIR_SWAY[S.style] || 0;
    drawHair(g,f,S,HX-f._hlx*hw,HZ-f._hlz*hw,HY,ry,sc,hair,O,fwd,hs*0.72);
  }

  /* ------------------------- CARA Y RASGOS -------------------------------
     Todo lo de la cara se coloca respecto al CENTRO DE LA CABEZA y hundido en
     su superficie. Antes salía del centro del cuerpo, así que al inclinarse o
     al cambiar de estatura los ojos se despegaban y flotaban por delante.  */
  /* Los rasgos van escalonados en profundidad: cada capa sale ~0,015 por
     delante de la anterior. Si dos quedan a la misma distancia el z-buffer no
     sabe cuál va delante y se ven a trozos, mezcladas. */
  const FACE = (fw2, up, side)=>{
    const p = PXZ(LN(1.85) + fw2*hs, side*hs);
    return [p[0], HY + K(up*hs), p[1]];
  };
  const FD = 0.19, alp = {alpha:alpha};

  if(!S.volcano){
    /* boca */
    { const q=FACE(0.178, -0.112, 0);
      R3.draw('box', q[0],q[1],q[2], K(0.018), K(0.024), K(0.112*hs), ry,
        mixc(skin,[0.35,0.12,0.14],0.6), alp); }
    /* nariz: sobresale de verdad, así que no compite con nada */
    { const q=FACE(0.186, -0.034, 0);
      R3.draw('box', q[0],q[1],q[2], K(0.052), K(0.056), K(0.048*hs), ry, skinD, alp); }
  }

  /* --- segundo rostro de Sukuna en la nuca --- */
  if(S.faces===2){
    const q=FACE(-FD*0.75, -0.02, 0);
    R3.draw('sph', q[0],q[1],q[2], K(0.26), K(0.28), K(0.26), ry,
      mixc(skin,[1,0.85,0.85],0.25), Object.assign({tex:TEX.skin,tile:1},O));
    for(const s2 of [-1,1]){
      const e=FACE(-FD*0.95, 0.02, 0.09*s2);
      R3.draw('sph', e[0],e[1],e[2], K(0.075),K(0.05),K(0.05), ry, [0.9,0.1,0.15],
        {emis:0.7, alpha:alpha});
    }
  }
  /* --- marcas de Sukuna --- */
  if(S.markings){
    for(const s2 of [-1,1]){
      const q=FACE(FD*0.88, 0.02, 0.115*s2);
      R3.draw('box', q[0],q[1],q[2], K(0.12),K(0.030),K(0.026), ry, [0.05,0.02,0.03], alp);
      const p2=PXZ(0.20*B, 0.28*B*s2);
      R3.draw('box', p2[0], Y(1.36), p2[1], K(0.03),Y(0.26),K(0.11), ry, [0.05,0.02,0.03], alp);
    }
  }

  /* --- ojos y accesorios de la cara ---
     El brillo del corte de dominio se calcula AQUI, antes de ramificar por
     tipo de cara. Estaba dentro de la rama de ojos normales, asi que Gojo
     (venda), Jogo (cabeza-volcan) y Kagero (mascara de ceniza) abrian su
     dominio sin que se les encendiera nada. Los tres tienen dominio. */
  const domGlow = (typeof DOMCINE!=='undefined' && DOMCINE.f===f) ? domCineK() : 0;
  /* Jogo no tiene cara, pero si un ojo unico en la frente: se le enciende aqui,
     y no dentro del bloque del volcan, porque alli FACE y domGlow todavia no
     existen (zona muerta temporal del const) y lanzaria ReferenceError. */
  if(S.volcano && domGlow>0.01){
    const q3=FACE(FD*0.95, 0.02, 0);
    R3.draw('sph', q3[0],q3[1],q3[2], K(0.16),K(0.20),K(0.16), ry, [1,0.62,0.18],
      {alpha:0.95*domGlow*alpha, add:true, emis:2.6});
    R3.draw('sph', q3[0],q3[1],q3[2], K(0.44),K(0.48),K(0.44), ry, [1,0.5,0.12],
      {alpha:0.30*domGlow*alpha, add:true, cullFront:true});
  }
  /* --- PANDA: orejas, antifaz y hocico. Va aqui, despues de FACE, porque
     todos los rasgos se colocan sobre la superficie del craneo. --- */
  if(S.panda){
    for(const s2 of [-1,1]){                       // orejas redondas
      const p=PXZ(LN(1.85)-0.11*hs, 0.30*hs*s2);
      R3.draw('sph', p[0], HY+K(0.33*hs), p[1], K(0.21*hs),K(0.21*hs),K(0.15*hs), ry,
        hex3('#17171b'), Object.assign({tex:TEX.fur,tile:1},O));
    }
    for(const s2 of [-1,1]){                       // antifaz alrededor del ojo
      const q=FACE(0.126, 0.018, 0.100*s2);
      R3.draw('sph', q[0],q[1],q[2], K(0.135),K(0.165),K(0.115), ry,
        hex3('#17171b'), Object.assign({tex:TEX.fur,tile:1},O));
    }
    { const mz=FACE(0.158, -0.062, 0);             // hocico
      R3.draw('sph', mz[0],mz[1],mz[2], K(0.15),K(0.115),K(0.17), ry,
        mixc(skin,[1,1,1],0.30), Object.assign({tex:TEX.fur,tile:1},O));
      const nz=FACE(0.208, -0.034, 0);             // nariz
      R3.draw('sph', nz[0],nz[1],nz[2], K(0.055),K(0.042),K(0.070), ry,
        hex3('#17171b'), alp); }
  }
  if(S.blindfold){
    const q=FACE(0.01, 0.045, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.44*hs),K(0.175*hs),K(0.46*hs), ry, [0.04,0.04,0.06],
      Object.assign({tex:TEX.fabric,tile:1},O));
    const e=FACE(FD*1.02, 0.045, 0);
    R3.draw('box', e[0],e[1],e[2], K(0.035),K(0.10*hs),K(0.28*hs), ry, hex3('#5cc7ff'),
      {emis:0.8+2.0*domGlow, alpha:alpha});
    if(domGlow>0.01){                     // el Seis Ojos atravesando la venda
      const q2=FACE(FD*1.06, 0.045, 0.085);
      R3.draw('sph', q2[0],q2[1],q2[2], K(0.13),K(0.11),K(0.13), ry, hex3('#5cc7ff'),
        {alpha:0.85*domGlow*alpha, add:true, emis:2.4});
      R3.draw('sph', q2[0],q2[1],q2[2], K(0.34),K(0.30),K(0.34), ry, hex3('#5cc7ff'),
        {alpha:0.28*domGlow*alpha, add:true, cullFront:true});
    }
  } else if(S.goggles){
    const q=FACE(0.02, 0.15, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.44*hs),K(0.12*hs),K(0.46*hs), ry, [0.08,0.08,0.10],
      Object.assign({tex:TEX.metal,tile:1},O));
    const e=FACE(FD*1.0, 0.15, 0);
    R3.draw('box', e[0],e[1],e[2], K(0.03),K(0.075*hs),K(0.34*hs), ry, [0.55,0.72,0.85],
      {emis:0.25+1.8*domGlow, alpha:0.75*alpha});
  } else if(S.mask){
    const q=FACE(FD*0.55, -0.01, 0);
    R3.draw('cone', q[0],q[1],q[2], K(0.36*hs),K(0.36*hs),K(0.36*hs), ry-Math.PI/2,
      hex3('#e8e0c8'), Object.assign({tex:TEX.bone,tile:1},O));
    if(domGlow>0.01){
      const e2=FACE(FD*1.02, 0.05, 0.075);
      R3.draw('box', e2[0],e2[1],e2[2], K(0.03),K(0.045),K(0.15), ry, hex3(f.C.color),
        {alpha:0.9*domGlow*alpha, add:true, emis:2.2});
    }
  } else if(S.ashMask){
    const q=FACE(FD*0.9, -0.01, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.08),K(0.36*hs),K(0.34*hs), ry, hex3('#d8d0c0'),
      Object.assign({tex:TEX.bone,tile:1},O));
    for(const s2 of [-1,1]){
      const e=FACE(FD*1.05, 0.04, 0.10*s2);
      const lit2 = (domGlow>0.01 && s2===1);
      R3.draw('box', e[0],e[1],e[2],
        K(lit2?0.045:0.03), K(lit2?0.075:0.045), K(lit2?0.13:0.09), ry, [0.9,0.75,0.35],
        {emis:0.9+2.2*domGlow*(lit2?1:0), alpha:alpha});
      if(lit2)
        R3.draw('sph', e[0],e[1],e[2], K(0.30),K(0.28),K(0.30), ry, [1,0.85,0.4],
          {alpha:0.30*domGlow*alpha, add:true, cullFront:true});
    }
  } else if(!S.curse){
    /* ojos hundidos en la cuenca + ceja: pegados a la cara, no delante */
    for(const s2 of [-1,1]){
      const sd = 0.088*s2;
      /* 1· cuenca: caja plana pegada a la mejilla, no una esfera que sobresale */
      const soc=FACE(0.150, 0.020, sd);
      R3.draw('box', soc[0],soc[1],soc[2], K(0.030),K(0.072*hs),K(0.106*hs), ry,
        mixc(skin,[0,0,0],0.38), alp);
      /* 2· blanco del ojo */
      const e=FACE(0.170, 0.020, sd);
      R3.draw('box', e[0],e[1],e[2], K(0.016),K(0.046*hs),K(0.080*hs), ry,
        [0.93,0.93,0.96], alp);
      /* 3· iris */
      const ir=FACE(0.182, 0.018, sd);
      const lit = (domGlow>0.01 && s2===1);
      R3.draw('box', ir[0],ir[1],ir[2], K(0.012),K(0.040*hs),K(0.042*hs), ry,
        lit ? mixc(hex3(f.C.color),[1,1,1],0.35)
            : mixc(hex3(f.C.color),[0.04,0.04,0.07],0.62),
        lit ? {alpha:alpha, emis:2.2*domGlow} : alp);
      if(lit)
        R3.draw('sph', ir[0],ir[1],ir[2], K(0.085),K(0.075),K(0.085), ry,
          hex3(f.C.color), {alpha:0.5*domGlow*alpha, add:true, cullFront:true});
      /* 4· párpado, por encima del ojo: distinta altura, sin conflicto */
      const li=FACE(0.176, 0.052, sd);
      R3.draw('box', li[0],li[1],li[2], K(0.022),K(0.024*hs),K(0.088*hs), ry,
        mixc(skin,[0,0,0],0.18), alp);
      /* 5· ceja, más arriba todavía */
      const br=FACE(0.168, 0.090, 0.092*s2);
      R3.draw('box', br[0],br[1],br[2], K(0.020),K(0.026*hs),K(0.104*hs), ry,
        mixc(hair,[0,0,0],0.25), Object.assign({rz:0.16*s2}, alp));
    }
    /* arco superciliar: sin el, la cara es una superficie plana con cosas
       pegadas; con el, hay craneo debajo */
    { const bw=FACE(0.146, 0.116, 0);
      R3.draw('box', bw[0],bw[1],bw[2], K(0.052),K(0.040*hs),K(0.34*hs), ry,
        mixc(skin,[0,0,0],0.10), alp); }
  } else {
    for(const s2 of [-1,1]){
      const e=FACE(FD*0.86, 0.025, 0.115*s2);
      R3.draw('sph', e[0],e[1],e[2], K(0.11),K(0.11),K(0.11), ry, col,
        {emis:1.2, alpha:alpha});
    }
  }
  if(S.glasses){
    const q=FACE(FD*1.02, 0.025, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.035),K(0.085*hs),K(0.42*hs), ry, [0.85,0.9,0.95],
      {alpha:0.5*alpha, emis:0.25});
  }
  if(S.scar){
    const q=FACE(FD*0.93, -0.02, 0.095);
    R3.draw('box', q[0],q[1],q[2], K(0.02),K(0.115*hs),K(0.022), ry, [0.55,0.28,0.28], alp);
  }
  if(S.stitchHead){
    const q=FACE(FD*0.92, 0.155, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.04),K(0.04),K(0.40*hs), ry, [0.35,0.25,0.30], alp);
  }
  if(S.foreheadMark){
    const q=FACE(FD*1.0, 0.145, 0);
    R3.draw('box', q[0],q[1],q[2], K(0.02),K(0.085*hs),K(0.045*hs), ry, [0.75,0.25,0.35],
      {emis:0.4, alpha:alpha});
  }
  if(S.hornsBig){
    for(const s2 of [-1,1]){
      const q=FACE(-0.04, 0.22, 0.145);
      const p2=PXZ(LN(1.85)-0.04*hs, 0.145*hs*s2);
