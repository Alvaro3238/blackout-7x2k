      R3.draw('cone', p2[0], HY+K(0.22*hs), p2[1], K(0.15),K(0.42),K(0.15), ry,
        hex3('#e8dcc0'), Object.assign({tex:TEX.bone,tile:1},O));
    }
  }

  /* --- rueda dhármica de Mahoraga --- */
  if(S.wheel){
    const wy=HY+K(0.95), spin=g.t*(1.2+(f.adaptWheel?Object.keys(f.adaptWheel).length*0.35:0));
    R3.draw('cyl', x, wy, z, K(1.05),K(0.07),K(1.05), spin, hex3('#e8e0c8'),
      Object.assign({tex:TEX.bone,tile:1},O));
    for(let k=0;k<8;k++){
      const a=spin+k/8*TAU;
      R3.draw('box', x+Math.cos(a)*0.40*sc, wy, z+Math.sin(a)*0.40*sc,
        K(0.62),K(0.05),K(0.07), -a, hex3('#d8cfb4'), O);
    }
    R3.draw('sph', x, wy, z, K(0.26),K(0.14),K(0.26), 0, [1,0.85,0.4], {emis:0.8, alpha:alpha});
  }

  /* --- capucha levantada --- */
  if(S.hoodUp){
    R3.draw('sph', HX-fwd[0]*0.05*sc, HY+K(0.05), HZ-fwd[1]*0.05*sc,
      K(0.56*hs),K(0.60*hs),K(0.56*hs), ry, mixc(top,[1,1,1],0.08),
      Object.assign({tex:TEX.coat,tile:1},O));
  }

  /* --- cuello alto del uniforme (Yuta) --- */
  if(S.collar){
    const p=PXZ(LN(1.64), 0);
    R3.draw('cyl', p[0], Y(1.66+bob+CR), p[1],
      K(0.30*B), Y(0.24), K(0.28*B), ry+PO.twist, mixc(top,[1,1,1],0.18),
      Object.assign({tex:CLOTH,tile:1,rz:LEAN},O));
    const q=PXZ(0.19*B+LN(1.62), 0);
    R3.draw('box', q[0], Y(1.64+bob+CR), q[1],
      K(0.05), Y(0.20), K(0.30*B), ry+PO.twist, trim, Object.assign({emis:0.16},O));
  }

  /* --- el anillo de Rika colgado al cuello --- */
  if(S.ring){
    /* Al abrir el dominio, el anillo deja de colgar del cuello: sube a la
       altura de la cara, se enciende y de ahi sale ella. Es el gesto que
       anuncia la manifestacion. */
    const RG = ringLevel(g,f);
    const cy=K((1.38+bob+CR)*H) + K(RG*0.62*H),
          pulse=0.22+RK*0.55+RG*2.2+Math.sin(g.t*2.6)*0.08;
    const px2=x+fwd[0]*(0.23*B+LN(1.15)+RG*0.30)*sc, pz2=z+fwd[1]*(0.23*B+LN(1.15)+RG*0.30)*sc;
    if(RG>0.02){
      const rr=K(0.085)*(1+RG*2.4);
      R3.draw('cyl', px2, cy, pz2, rr*1.9, K(0.02), rr*1.9, ry+g.t*3.0, RIKA.glow,
        {alpha:0.55*RG, add:true, rz:1.35, noCull:true});
      R3.draw('sph', px2, cy, pz2, K(0.55*RG),K(0.55*RG),K(0.55*RG), 0, RIKA.glow,
        {alpha:0.30*RG, add:true, cullFront:true});
    }
    R3.draw('box', px2, K((1.56+bob+CR)*H), pz2, K(0.018),K(0.34),K(0.018), ry,
      hex3('#232733'), O);
    R3.draw('cyl', px2, cy, pz2, K(0.085),K(0.024),K(0.085), ry, hex3('#e0cf94'),
      Object.assign({tex:TEX.metal,tile:1,emis:pulse,rz:1.35},O));
    if(RK>0.55)
      R3.draw('sph', px2, cy, pz2, K(0.22),K(0.22),K(0.22), 0, RIKA.glow,
        {alpha:0.16*clamp(RK-0.55,0,1)*alpha, add:true});
  }

  /* --- Rika --- */
  if(S.rika) drawRika(g,f,S,x,z,sc,ry,B,H,O,RK);

  /* --- estados y auras --- */
  drawFighterFX(g,f,x,z,sc,col,alpha,B,H);
}

/* ------------------------------ pelo ------------------------------------ */
function drawHair(g,f,S,x,z,hy,ry,sc,hair,O,fwd,hs){
  hs=hs||1;
  const K=v=>v*sc*hs;
  const L=v=>v*sc*hs;   // desplazamientos laterales, también a escala
  const rgt=[-Math.sin(f.ang),Math.cos(f.ang)];
  const HT=Object.assign({tex:TEX.fur,tile:1},O);
  switch(S.style){
    case 'spiky':
      R3.draw('sph', x-fwd[0]*0.03*sc*hs, hy+K(0.20), z-fwd[1]*0.03*sc*hs, K(0.50),K(0.40),K(0.50), ry, hair, HT);
      for(let k=0;k<5;k++){
        const a=(k/5)*TAU+0.4;
        R3.draw('cone', x+Math.cos(a)*0.13*sc*hs, hy+K(0.30), z+Math.sin(a)*0.13*sc*hs,
          K(0.17),K(0.30),K(0.17), ry, hair, HT);
      }
      break;
    case 'bob':
      R3.draw('sph', x, hy+K(0.16), z, K(0.54),K(0.50),K(0.54), ry, hair, HT);
      R3.draw('cyl', x-fwd[0]*0.05*sc*hs, hy-K(0.10), z-fwd[1]*0.05*sc*hs, K(0.46),K(0.28),K(0.42), ry, hair, HT);
      break;
    case 'tail':
      R3.draw('sph', x, hy+K(0.18), z, K(0.49),K(0.42),K(0.49), ry, hair, HT);
      R3.draw('cyl', x-fwd[0]*0.28*sc*hs, hy-K(0.06), z-fwd[1]*0.28*sc*hs, K(0.16),K(0.62),K(0.16),
        ry, hair, HT);
      break;
    case 'long':
      R3.draw('sph', x, hy+K(0.18), z, K(0.52),K(0.44),K(0.52), ry, hair, HT);
      R3.draw('box', x-fwd[0]*0.16*sc*hs, hy-K(0.32), z-fwd[1]*0.16*sc*hs, K(0.30),K(0.80),K(0.44), ry, hair, HT);
      break;
    case 'bun':
      R3.draw('sph', x, hy+K(0.18), z, K(0.50),K(0.42),K(0.50), ry, hair, HT);
      R3.draw('sph', x-fwd[0]*0.12*sc*hs, hy+K(0.34), z-fwd[1]*0.12*sc*hs, K(0.30),K(0.28),K(0.30), ry, hair, HT);
      break;
    case 'undercut':
      R3.draw('sph', x, hy+K(0.22), z, K(0.48),K(0.34),K(0.48), ry, hair, HT);
      R3.draw('cyl', x, hy-K(0.02), z, K(0.44),K(0.16),K(0.44), ry, mixc(hair,[0,0,0],0.6), O);
      break;
    case 'messy':
      R3.draw('sph', x, hy+K(0.20), z, K(0.54),K(0.44),K(0.54), ry, hair, HT);
      for(let k=0;k<3;k++)
        R3.draw('box', x+rgt[0]*(k-1)*0.16*sc*hs, hy+K(0.26), z+rgt[1]*(k-1)*0.16*sc*hs,
          K(0.14),K(0.20),K(0.30), ry+k*0.4, hair, HT);
      break;
    case 'slick':
      R3.draw('sph', x-fwd[0]*0.04*sc*hs, hy+K(0.22), z-fwd[1]*0.04*sc*hs, K(0.50),K(0.34),K(0.50), ry, hair, HT);
      break;
    case 'patch':
      R3.draw('sph', x, hy+K(0.20), z, K(0.52),K(0.42),K(0.52), ry, hair, HT);
      R3.draw('box', x, hy+K(0.18), z, K(0.52),K(0.06),K(0.10), ry, mixc(hair,[0,0,0],0.5), O);
      break;
    case 'horns':
      R3.draw('sph', x, hy+K(0.20), z, K(0.48),K(0.38),K(0.48), ry, hair, HT);
      for(const s2 of [-1,1])
        R3.draw('cone', x+rgt[0]*0.18*s2*sc-fwd[0]*0.08*sc*hs, hy+K(0.40), z+rgt[1]*0.18*s2*sc-fwd[1]*0.08*sc*hs,
          K(0.13),K(0.42),K(0.13), ry, hair, Object.assign({emis:0.35},O));
      break;
    case 'short': default:
      R3.draw('sph', x-fwd[0]*0.02*sc*hs, hy+K(0.20), z-fwd[1]*0.02*sc*hs, K(0.50),K(0.40),K(0.50), ry, hair, HT);
      break;
    case 'none': break;
  }
}

/* ------------------------------ armas ----------------------------------- */
function drawWeapon(g,f,S,hx,hy,hz,ry0,sc,O,swing){
  const K=v=>v*sc;
  /* El arma se orientaba SIEMPRE hacia donde mira el personaje, ignorando el
     arco del brazo: hiciera el gesto que hiciera, la hoja apuntaba de punta
     hacia delante y el golpe se leia como una estocada. Ahora sigue el barrido
     del brazo que ataca, asi que un tajo cruza de verdad de lado a lado. */
  const a2 = f.ang + (swing||0);
  const ry = -a2;
  const fwd=[Math.cos(a2),Math.sin(a2)];
  const atk = f.atk ? clamp(f.atk.t*5,0,1) : 0;
  // en reposo el arma cuelga inclinada; al golpear se alinea al frente
  /* en guardia la hoja se cruza mas: diagonal marcada en vez de colgando */
  /* con los brazos recogidos y el arma cruzada de lado, la inclinacion propia
     de la hoja tiene que ser suave: la diagonal la pone el angulo lateral. */
  const rz = f.guarding ? -0.48 : lerp(-0.72, 0.12, atk);
  const cz = Math.cos(rz), sz2 = Math.sin(rz);
  /* punto a lo largo del arma, respetando la inclinación */
  const P = (d)=>[ hx+fwd[0]*d*cz*sc, hy+d*sz2*sc, hz+fwd[1]*d*cz*sc ];
  const MT=Object.assign({tex:TEX.metal,tile:1,rz},O);
  const WT=Object.assign({tex:TEX.wood, tile:1,rz},O);
  const BT=Object.assign({tex:TEX.bone, tile:1,rz},O);
  switch(S.weapon){
    case 'staff': {                       // Nube Juguetona (bastón de tres secciones)
      const c=P(0.35);
      R3.draw('box', c[0],c[1],c[2], K(2.2),K(0.13),K(0.13), ry, hex3('#6a5a3c'), WT);
      for(const s2 of [-1,1]){ const e=P(0.35+s2*0.92);
        R3.draw('box', e[0],e[1],e[2], K(0.22),K(0.19),K(0.19), ry, hex3('#c8b070'), MT); }
      break; }
    case 'katana': {
      const c=P(0.80), h=P(-0.05), gd=P(0.14);
      R3.draw('box', c[0],c[1],c[2], K(1.45),K(0.10),K(0.035), ry, hex3('#e4ebf2'),
        Object.assign({tex:TEX.metal,tile:1,emis:0.16,rz},O));
      R3.draw('box', h[0],h[1],h[2], K(0.30),K(0.10),K(0.10), ry, hex3('#22222c'), Object.assign({rz},O));
      R3.draw('box', gd[0],gd[1],gd[2], K(0.05),K(0.24),K(0.24), ry, hex3('#b09040'), MT);
      break; }
    case 'cleaver': {                     // hoja roma de Nanami
      const c=P(0.60), h=P(0.02);
      R3.draw('box', c[0],c[1],c[2], K(1.0),K(0.26),K(0.05), ry, hex3('#ccd2da'), MT);
      R3.draw('box', h[0],h[1],h[2], K(0.26),K(0.11),K(0.11), ry, hex3('#3a3020'), WT);
      break; }
    case 'chainblade': {
      const c=P(0.44);
      R3.draw('box', c[0],c[1],c[2], K(0.78),K(0.14),K(0.035), ry, hex3('#d4dae2'), MT);
      for(let k=1;k<=7;k++){ const e=P(-k*0.19);
        R3.draw('sph', e[0],e[1]-K(k*0.03),e[2], K(0.09),K(0.09),K(0.09), ry, hex3('#7a828e'), MT); }
      break; }
    case 'hammer': {                      // martillo de Nobara
      const c=P(0.34), hd=P(0.68);
      R3.draw('box', c[0],c[1],c[2], K(0.66),K(0.09),K(0.09), ry, hex3('#5a4630'), WT);
      R3.draw('box', hd[0],hd[1],hd[2], K(0.22),K(0.22),K(0.36), ry, hex3('#9096a0'), MT);
      break; }
    case 'gavel': {
      const c=P(0.30), hd=P(0.58);
      R3.draw('box', c[0],c[1],c[2], K(0.54),K(0.08),K(0.08), ry, hex3('#4a3524'), WT);
      R3.draw('cyl', hd[0],hd[1],hd[2], K(0.26),K(0.34),K(0.26), ry, hex3('#6a4c2e'),
        Object.assign({tex:TEX.wood,tile:1},O));
      break; }
    case 'spear': {
      const c=P(0.60), tip=P(1.68);
      R3.draw('box', c[0],c[1],c[2], K(2.0),K(0.08),K(0.08), ry, hex3('#44444e'), MT);
      R3.draw('cone', tip[0],tip[1],tip[2], K(0.18),K(0.46),K(0.18), ry,
        hex3('#ffe14d'), Object.assign({emis:0.6, rz:rz-Math.PI/2},O));
      break; }
    case 'greatsword': {
      const c=P(1.05);
      R3.draw('box', c[0],c[1],c[2], K(2.1),K(0.38),K(0.08), ry, hex3('#efe8d2'), BT);
      break; }
    case 'wrapkatana': {                  // la katana envuelta de Yuta Okkotsu
      const bl=P(0.80), hl=P(-0.05), gd=P(0.16), pom=P(-0.24);
      const rk=f._rk||0, hot=clamp(rk-0.50,0,1);
      /* núcleo de acero */
      R3.draw('box', bl[0],bl[1],bl[2], K(1.42),K(0.105),K(0.036), ry, hex3('#e6edf6'),
        Object.assign({tex:TEX.metal,tile:1,emis:0.10+hot*0.28,rz},O));
      /* halo violeta: el filo se carga cuando Rika se manifiesta */
      if(hot>0.02)
        R3.draw('box', bl[0],bl[1],bl[2], K(1.50),K(0.16),K(0.085), ry, RIKA.glow,
          {alpha:(0.08+0.17*hot)*(O.alpha!==undefined?O.alpha:1), add:true, rz, noCull:true});
      /* vendas a tramos, deshilachadas */
      for(const d of [0.34,0.70,1.06]){ const wp=P(d);
        R3.draw('box', wp[0],wp[1],wp[2], K(0.17),K(0.135),K(0.070), ry, hex3('#c6bda6'),
          Object.assign({tex:TEX.bandage,tile:1,rz},O)); }
      /* guarda ovalada, empuñadura trenzada y pomo */
      R3.draw('cyl', gd[0],gd[1],gd[2], K(0.19),K(0.040),K(0.19), ry, hex3('#8c7a4e'),
        Object.assign({tex:TEX.metal,tile:1,rz:rz-Math.PI/2},O));
      R3.draw('box', hl[0],hl[1],hl[2], K(0.34),K(0.098),K(0.090), ry, hex3('#1b2032'),
        Object.assign({tex:TEX.stitch,tile:2,rz},O));
      R3.draw('box', pom[0],pom[1],pom[2], K(0.065),K(0.12),K(0.11), ry, hex3('#9aa4b4'),
        Object.assign({tex:TEX.metal,tile:1,rz},O));
      break; }
    case 'claws': {
      for(const s2 of [-1,1]){ const e=P(0.24);
        R3.draw('cone', e[0], e[1]+K(0.07*s2), e[2], K(0.07),K(0.34),K(0.07), ry,
          hex3('#e6dece'), Object.assign({tex:TEX.bone,tile:1, rz:rz-Math.PI/2},O)); }
      break; }
  }
}

/* --------------------------- maniquí de paja ---------------------------- */
function drawDummy(g,f){
  const x=w3(f.x), z=w3(f.y), ry=-f.ang;
  const hurt = f.lastHurt!==undefined ? clamp(1-(g.t-f.lastHurt)/0.30,0,1) : 0;
  const sway = Math.sin((g.t-(f.lastHurt||0))*15)*hurt*0.16 + Math.sin(g.t*0.9)*0.012;
  const straw = mixc([0.79,0.66,0.41],[1,0.55,0.45],hurt*0.5);
  R3.draw('disc', x, 0.03, z, 1.5,1,1.5, 0, [0,0,0], {alpha:0.5});
  /* base de piedra */
  R3.draw('cyl', x, 0.14, z, 1.5, 0.28, 1.5, ry, [0.30,0.29,0.28], {tex:TEX.concrete, tile:1});
  /* poste */
  R3.draw('cyl', x, 0.95, z, 0.34, 1.6, 0.34, ry, [0.36,0.26,0.15],
    {tex:TEX.wood, tile:2, rz:sway*0.4});
  /* cuerpo de paja */
  R3.draw('cyl', x+Math.sin(sway)*0.30, 1.72, z, 1.30, 1.36, 1.20, ry, straw,
    {tex:TEX.tatter, tile:2, rim:0.2, rz:sway});
  /* cuerdas */
  for(const h of [1.35, 1.72, 2.10])
    R3.draw('cyl', x+Math.sin(sway)*(h-1.0)*0.3, h, z, 1.36, 0.10, 1.26, ry,
      [0.52,0.40,0.20], {tex:TEX.bandage, tile:2, rz:sway});
  /* cabeza */
  R3.draw('sph', x+Math.sin(sway)*0.46, 2.56, z, 0.86, 0.86, 0.82, ry, straw,
    {tex:TEX.tatter, tile:1, rim:0.25, rz:sway});
  /* diana pintada en el pecho */
  const fwd=[Math.cos(f.ang),Math.sin(f.ang)];
  for(let i=0;i<3;i++){
    const r=0.90-i*0.28;
    R3.draw('cyl', x+fwd[0]*0.62+Math.sin(sway)*0.30, 1.78, z+fwd[1]*0.62,
      r, 0.02+i*0.004, r, ry-Math.PI/2,
      i%2? [0.92,0.92,0.90] : [0.78,0.14,0.16],
      {rz:-Math.PI/2 + sway});
  }
  /* brazos de palo */
  for(const s2 of [-1,1]){
    const rg=[-Math.sin(f.ang),Math.cos(f.ang)];
    R3.draw('cyl', x+rg[0]*1.05*s2+Math.sin(sway)*0.34, 2.08, z+rg[1]*1.05*s2,
      0.20, 1.05, 0.20, ry+Math.PI/2, [0.34,0.24,0.14],
      {tex:TEX.wood, tile:1, rz:Math.PI/2});
  }
}

/* ==========================================================================
   RIKA ORIMOTO — 折本 里香
   La maldición ligada a Yuta. No es un invocador: ella está SIEMPRE ahí,
   y lo que cambia es cuánto se deja ver. Tres estados continuos:
     · jirón      (m < 0.6)  velo de pelo y niebla sobre su hombro
     · parcial    (m ~ 1.0)  cabeza, fauces y un brazo colosal
     · plena      (m > 1.2)  cuerpo entero, costillar, cola y dos brazos
   Todo esto es puramente visual: jamás toca el estado de la simulación
   (se guarda en f._rk, que no entra en stateChecksum).
   ========================================================================= */
const RIKA = {
  bone : '#a89d84',      // hueso viejo de la corona y las garras
  skin : '#8e8598',      // carne pálida, lila apagado
  deep : '#171122',      // huecos, encías, sombra interna
  hair : '#0b0b13',
  glow : [0.80,0.45,1.00],   // violeta de su energía maldita
  warm : [1.00,0.58,0.84]    // rosa del corazón: el amor que la ató
};

/* nivel de manifestación, suavizado entre fotogramas */
/* REDISEÑO DE RIKA. Antes acompañaba a Yuta el combate entero, subiendo y
   bajando de opacidad segun la energia maldita: estaba siempre y no impresionaba
   nunca. Ahora NO existe fuera de la Expansion de Dominio. Yuta pelea solo con
   su katana, y al abrir el dominio se pone el anillo y ella se manifiesta
   entera y opaca. Concentrar su aparicion en un momento le da el peso que
   tenia diluido.                                                            */
function rikaLevel(g,f){
  let t = 0;
  /* En el escaparate del selector no hay combate ni dominio, pero Yuta sin
     Rika no es Yuta: se la manifiesta para que su ficha la enseñe. Es solo
     presentacion, no toca nada de la partida. */
  if(typeof MENU3!=='undefined' && MENU3.on) return (f._rk = 1.30);
  if(f.domain && f.alive){
    /* la manifestacion no es instantanea: primero el anillo, luego ella */
    const pasado = domTiempo(f);
    /* ACTO II. Antes empezaba a asomar a los 2,1 s y no terminaba de salir
       hasta los 3,7, con el corte acabandose a los 4,6: casi todo el plano la
       pillaba a medio enterrar. Ahora arranca a los 1,9 -- justo cuando la
       camara empieza a girar hacia ella -- y esta fuera del todo a los 3,0,
       asi que queda mas de segundo y medio de ella entera en pantalla. */
    t = 1.55 * clamp((pasado-1.90)/1.30, 0, 1);
    /* Una vez invocada, se queda: dos minutos desde que cae el dominio. En la
       practica eso es el resto del combate (la mediana ronda los 40 s), que es
       justo la idea -- abrir el dominio la trae al mundo y ya no se va.
       _rikaHasta es campo de cliente: no entra en stateChecksum. */
    /* la cuenta atras la lleva la simulacion en f.rikaT */
  } else if(f.alive && f.rikaT>0){
    t = 1.55;
  }
  if(!f.alive) t=0;
  if(f._rk===undefined) f._rk=t;
  const sp = t>f._rk ? 7.0 : 3.2;
  f._rk += (t-f._rk)*Math.min(1, VISDT*sp);
  return f._rk;
}
/* 0 fuera del dominio, 1 mientras Yuta se pone el anillo. Es la ventana en la
   que la mano sube, el anillo se enciende y todavia no hay Rika. */
/* Tiempo transcurrido desde que se abrio el dominio, EN TIEMPO REAL.
   No se puede sacar de f.domT: ese reloj esta PARADO durante el hitstop, y el
   corte cinematico de Yuta ES un hitstop de 4,6 s. Usando domT, Rika no
   empezaba a salir hasta que la animacion habia terminado. El reloj del corte
   (DOMCINE) si corre durante la pausa, porque es de cliente y va con VISDT. */
function domTiempo(f){
  if(typeof DOMCINE!=='undefined'){
    if(DOMCINE.f===f && DOMCINE.t>0) return DOMCINE.dur - DOMCINE.t;
    if(f.domain) return 99;              // el corte ya paso: manifestada del todo
  }
  const d=(f.domain&&f.domain.dur)||8;
  return d-(f.domT!==undefined?f.domT:d);
}

function ringLevel(g,f){
  if(!f.domain || !f.alive) return 0;
  const pasado = domTiempo(f);
  /* ACTO I, 0 a 2,1 s: sube a la cara, se enciende y se sostiene mientras la
     camara esta en primer plano. Antes se apagaba al segundo. */
  return clamp(pasado/0.35,0,1) * clamp((2.05-pasado)/0.50,0,1);
}

function drawRika(g, f, S, x, z, sc, ry, B, H, O, m){
  if(m<=0.03) return;
  const t=g.t;
  const fwd=[Math.cos(f.ang),Math.sin(f.ang)], rgt=[-Math.sin(f.ang),Math.cos(f.ang)];
  const A0 = (O.alpha!==undefined?O.alpha:1);
  const full = clamp((m-0.52)/0.62, 0, 1);           // 0 jirón → 1 manifestación plena
  /* espectral cuando apenas asoma; carne maciza cuando se manifiesta del todo */
  /* RIKA OPACA. La curva era 0,16+0,62*m: no llegaba a solida hasta m=1,35,
     asi que pasaba casi todo el combate translucida y se le veian por dentro
     las piezas que la componen. Ahora sube deprisa y es OPACA de m=0,42 en
     adelante -- con energia maldita a medias ya lo esta. Por debajo del umbral
     se desvanece del todo en vez de quedarse a medio camino, que era lo que
     la hacia parecer un montaje de cajas transparentes. */
  let   al   = clamp((m-0.12)*3.4, 0, 1)*A0;
  const RS   = (0.42+0.55*m)*sc;
  const flt  = Math.sin(t*1.45+f.uid*0.7)*0.16 + Math.sin(t*2.9+f.uid)*0.05;

  /* estado de combate */
  const at   = f.atk ? clamp(f.atk.t/Math.max(0.05,f.atk.windup),0,1.8) : 0;
  const key  = f.atk&&f.atk.ab ? f.atk.ab.key : null;
  const lunge= f.atk ? clamp((at-0.5)*1.9,0,1)*clamp(1.9-at,0,1) : 0;
  const beam = key==='E' ? clamp(at*1.2,0,1) : 0;
  const hurt = f.lastHurt!==undefined ? clamp(1-(t-f.lastHurt)/0.30,0,1) : 0;

  /* --- anclaje: se alza POR ENCIMA de Yuta y un paso hacia el enemigo,
     para que desde la cámara en tercera persona quede recortada contra el
     cielo en vez de taparle a él --- */
  /* Se alza a la DERECHA del hechicero, no delante: desde la camara en
     tercera persona queda recortada contra el fondo y deja libre la linea
     de tiro y la vista del enemigo. Sigue adelantandose al atacar. */
  const fore = (0.06+0.34*m)*sc + lunge*0.80*sc;
  const side = (0.95+0.80*m)*sc;
  const rx  = x + fwd[0]*fore + rgt[0]*side;
  const rz3 = z + fwd[1]*fore + rgt[1]*side;
  /* EMERGE DEL SUELO. Mientras se manifiesta esta hundida y sube: al principio
     solo asoma el craneo, luego las fauces, y al final el cuerpo
     entero. 'subida' va de 0 (enterrada) a 1 (fuera del todo). */
  const subida = clamp(m/1.28, 0, 1);
  const hy  = (2.34+0.98*m)*H*sc + flt*RS - lunge*0.26*sc
            - (1-subida)*5.2*RS;
  /* si la cámara se le mete dentro, se desvanece (nunca tapa la partida) */
  const cam = R3.cam||[0,0,0];
  const prox = clamp((Math.hypot(rx-cam[0], hy-1.2-cam[1], rz3-cam[2])-1.5)/2.8, 0, 1);
  al *= 0.10+0.90*prox;
  if(al<0.02) return;

  const bone=hex3(RIKA.bone), skin=hex3(RIKA.skin),
        deep=hex3(RIKA.deep), hair=hex3(RIKA.hair);
  const GH = {alpha:al, rim:0.14+0.12*full+hurt*0.30};
  const K  = v=>v*RS;

  /* helper de miembro: phi = 0 cuelga a plomo, π/2 apunta al frente;
     lat abre el brazo hacia fuera girando su plano de trabajo */
  const limb=(sx0,sy0,sz0, phi, lat, len, rad, col, texn, opt)=>{
    const a2=f.ang+lat, fw2=[Math.cos(a2),Math.sin(a2)], ry2=-a2;
    const hx=Math.sin(phi), hyv=-Math.cos(phi);
    const cx=sx0+fw2[0]*hx*len*0.5, cy=sy0+hyv*len*0.5, cz2=sz0+fw2[1]*hx*len*0.5;
    /* AQUI ESTABA LA RAIZ DE LOS BRAZOS SUELTOS. meshCyl va de -0,5 a +0,5, o
       sea que su escala Y es la altura ENTERA, no la mitad. Este helper pasaba
       len*0.5 pero devolvia el extremo a distancia len: cada tramo se dibujaba
       a la mitad de largo aunque la articulacion siguiente se colocaba donde
       tocaba. Resultado: un hueco de len/4 en cada punta y unos cilindros
       flotando sueltos alrededor de Rika. */
    R3.draw('cyl', cx, cy, cz2, rad, len, rad, ry2, col,
      Object.assign({tex:TEX[texn], tile:1, rz:phi}, GH, opt||{}));
    return [sx0+fw2[0]*hx*len, sy0+hyv*len, sz0+fw2[1]*hx*len];
  };

  /* --- el suelo se abre por donde sale --- */
  if(subida < 0.995){
    const e = 1-subida;
    R3.draw('disc', rx, 0.05, rz3, K(3.4-e*1.2), 1, K(3.4-e*1.2), 0, RIKA.deep,
      {alpha:0.55*A0});
    R3.draw('disc', rx, 0.07, rz3, K(4.6-e*1.6), 1, K(4.6-e*1.6), 0, RIKA.glow,
      {alpha:0.22*A0*e, add:true});
    for(let i=0;i<9;i++){                       // esquirlas levantadas
      const a=i*0.698+f.uid*0.4, r=(1.5+((i*7)%5)*0.22)*RS;
      R3.draw('cone', rx+Math.cos(a)*r, K(0.30+((i*3)%4)*0.16), rz3+Math.sin(a)*r,
        K(0.22), K(0.70+((i*5)%3)*0.24), K(0.22), ry+a,
        mixc(RIKA.deep,[0.30,0.26,0.34],0.5),
        {tex:TEX.concrete, tile:1, alpha:al*(0.35+0.55*e), rz:0.22*Math.cos(a)});
    }
  }

  /* ------------------- halo de energía maldita ------------------- */
  R3.draw('sph', rx, hy-0.55*RS, rz3, K(1.45), K(1.95), K(1.45), 0, RIKA.glow,
    {alpha:(0.06+0.12*m)*A0, add:true, cullFront:true});
  if(full>0.1)
    R3.draw('sph', rx, hy-0.20*RS, rz3, K(2.30), K(2.90), K(2.30), 0, RIKA.glow,
      {alpha:0.05*full*A0, add:true, cullFront:true});

  /* ------------------- cuerpo y sudario ------------------- */
  /* cuanto menos manifiesta, menos cuerpo tiene: sólo cabeza y melena */
  if(full>0.06){
    /* El cuerpo llevaba encima su propio tope (0,34+0,34*full = 0,68 maximo),
       asi que ni con al=1 llegaba a ser opaco. Ahora sigue a la opacidad
       general y solo se retrasa un poco al principio de manifestarse. */
    const bA=Math.min(al, 0.30+0.70*full*2);
    /* cuello */
    R3.draw('cyl', rx-fwd[0]*0.06*RS, hy-0.54*RS, rz3-fwd[1]*0.06*RS,
      K(0.44), K(0.56), K(0.42), ry, mixc(skin,[0,0,0],0.10),
      Object.assign({tex:TEX.bone,tile:1}, GH));
    /* pecho estrecho: de él salen los dos brazos */
    R3.draw('cyl', rx-fwd[0]*0.04*RS, hy-0.98*RS, rz3-fwd[1]*0.04*RS,
      K(0.96), K(0.80), K(0.84), ry, mixc(skin,[0,0,0],0.06),
      Object.assign({tex:TEX.bone,tile:1}, GH));
    /* COSTILLAR. El pecho era un cilindro liso. En la obra las costillas son
       lo primero que se le ve: siete pares de arcos de hueso claro sobre la
       caja, estrechandose hacia abajo y cayendo hacia fuera, con el esternon
       partiendolos por el medio. */
    if(full>0.18){
      const hueso = mixc(bone,[1,1,1],0.38);
      for(let i=0;i<7;i++){
        const p=i/6;
        const yy   = hy-(0.58+p*0.78)*RS;
        const anch = 0.50 - p*0.13;
        const prof = 0.40 - p*0.06;
        for(const sg of [-1,1]){
          const px = rx  + fwd[0]*prof*RS + rgt[0]*anch*0.52*sg*RS;
          const pz = rz3 + fwd[1]*prof*RS + rgt[1]*anch*0.52*sg*RS;
          R3.draw('box', px, yy, pz, K(0.17), K(0.135), K(anch*1.06), ry,
            hueso, Object.assign({tex:TEX.bone, tile:1, rz:0.34*sg}, GH));
        }
        /* el arco se cierra por el costado */
        for(const sg of [-1,1]){
          const px = rx  + fwd[0]*prof*0.30*RS + rgt[0]*anch*0.96*sg*RS;
          const pz = rz3 + fwd[1]*prof*0.30*RS + rgt[1]*anch*0.96*sg*RS;
          R3.draw('box', px, yy-0.09*RS, pz, K(anch*0.72), K(0.125), K(0.16), ry,
            mixc(hueso,[0,0,0],0.12), Object.assign({tex:TEX.bone, tile:1, rz:0.20*sg}, GH));
        }
      }
      /* esternon */
      R3.draw('box', rx+fwd[0]*0.46*RS, hy-0.96*RS, rz3+fwd[1]*0.46*RS,
        K(0.19), K(1.02), K(0.19), ry, mixc(hueso,[1,1,1],0.15),
        Object.assign({tex:TEX.bone, tile:1}, GH));
    }

    /* vientre */
    if(full>0.22)
    R3.draw('cyl', rx-fwd[0]*0.04*RS, hy-1.58*RS, rz3-fwd[1]*0.04*RS,
      K(0.80), K(0.72), K(0.70), ry, mixc(skin,[0,0,0],0.18),
      Object.assign({tex:TEX.tatter,tile:2}, GH));
    /* COLA. Rika no tiene piernas: por debajo del vientre el cuerpo se afila
       en una cola negra que ondea, como la de un genio, y se pierde cerca del
       suelo. Antes era un unico cono violaceo y parecia una falda. Son nueve
       tramos que se estrechan y serpentean, cada uno un poco mas oscuro. */
    if(full>0.18){
      const negro = mixc(RIKA.deep,[0.10,0.08,0.13],0.35);
      /* ARRANQUE ALINEADO CON EL TORSO. La cola salia de rx/rz3 pelados
         mientras el vientre esta corrido a rx-fwd*0,04: nacia medio paso por
         delante de su propio cuerpo. Ahora comparte eje exacto con el vientre
         y su primer tramo va METIDO dentro de el, asi que el empalme no se ve. */
      let cx2=rx-fwd[0]*0.04*RS, cz2=rz3-fwd[1]*0.04*RS, cy2=hy-1.95*RS;
      /* Entre el vientre y el suelo hay menos de una unidad de sitio. Antes se
         metian NUEVE cilindros de 1,24 de alto en ese hueco: se apilaban
         traslucidos unos encima de otros y se veia una escalera de losas
         negras en vez de una cola. Ahora son seis y cada uno mide lo que le
         toca del hueco real, asi que se tocan sin solaparse. */
      const TRAMOS = 6;
      const caida = Math.max(0.10, (cy2-0.10)/TRAMOS);
      /* mismo fallo de convencion que en los brazos: la Y de meshCyl es la
         altura entera. Con 0,62 los tramos no llegaban a tocarse y la cola se
         veia como una pila de rodajas sueltas. */
      const semi  = caida*1.10;
      for(let i=0;i<TRAMOS;i++){
        const p=i/(TRAMOS-1);
        const on=Math.sin(t*1.5 - i*0.55 + f.uid)*0.30*p;      // serpenteo
        /* Arranque fino: 0,52 contra los 0,80 del vientre. Salia tan gordo
           como el torso y tapaba las costillas, el corazon y los brazos. */
        const w2=(0.52 - p*0.34)*RS;
        R3.draw('cyl', cx2, cy2, cz2, w2, semi, w2*0.86, ry+on*0.5,
          mixc(negro,[0.26,0.20,0.30],p*0.35),
          {tex:TEX.tatter, tile:2, alpha:bA*(1-p*0.20), rim:0.06+0.10*(1-p), rz:on*0.30});
        /* el desplazamiento va DESPUES de dibujar: el tramo 0 nace sin
           serpenteo ni avance, clavado bajo el torso */
        cx2 += rgt[0]*on*0.30*RS + fwd[0]*0.02*RS;
        cz2 += rgt[1]*on*0.30*RS + fwd[1]*0.02*RS;
        cy2 -= caida;
      }
      /* punta afilada */
      R3.draw('cone', cx2, cy2+caida*0.30, cz2, K(0.17), caida*0.95, K(0.17), ry,
        negro, {tex:TEX.tatter, tile:1, alpha:bA*0.7, rz:Math.PI});
    }
    /* corazón: el único punto cálido de toda ella */
    R3.draw('sph', rx+fwd[0]*0.34*RS, hy-1.30*RS, rz3+fwd[1]*0.34*RS,
      K(0.30+0.06*Math.sin(t*3.4)), K(0.30), K(0.30), 0, RIKA.warm,
      {alpha:(0.30+0.40*full)*A0, add:true});
    /* jirones que ondean */
    for(let i=0; i<(full>0.40?4:0); i++){
      const a=i*1.57+0.4, sw=Math.sin(t*1.3+i*1.1)*0.22;
      R3.draw('box',
        rx+(fwd[0]*Math.cos(a)+rgt[0]*Math.sin(a))*0.86*RS,
        hy-(2.05+Math.sin(t*1.7+i)*0.12)*RS,
        rz3+(fwd[1]*Math.cos(a)+rgt[1]*Math.sin(a))*0.86*RS,
        K(0.20), K(1.30), K(0.07), ry+a, mixc(skin,[0.42,0.36,0.48],0.45),
        {tex:TEX.tatter, tile:2, alpha:al*0.46*full, rim:0.10, rz:sw});
    }
  }

  /* --- espinazo: lo que el jugador ve desde su propia espalda --- */
  if(full>0.28){
    for(let i=0;i<5;i++){
      const p=i/4;
      R3.draw('sph', rx-fwd[0]*(0.62+p*0.06)*RS, hy-(0.90+p*0.90)*RS, rz3-fwd[1]*(0.62+p*0.06)*RS,
        K(0.26-p*0.06), K(0.24-p*0.05), K(0.34-p*0.10), ry, mixc(bone,[0,0,0],0.28),
        {tex:TEX.bone, tile:1, alpha:al, rim:GH.rim});
    }
    /* sello maldito grabado en la nuca */
    R3.draw('box', rx-fwd[0]*0.72*RS, hy-0.30*RS, rz3-fwd[1]*0.72*RS,
      K(0.05), K(0.26), K(0.26), ry, RIKA.glow,
      {alpha:(0.14+0.20*full)*A0, add:true});
  }

  /* --- los tubos de la espalda: cuatro conductos que le nacen del espinazo,
     se curvan hacia fuera y respiran luz por la boca --- */
  if(full>0.18){
    const tubeCol = mixc(bone,[0,0,0],0.22);
    for(let i=0;i<4;i++){
      const s2  = (i<2) ? -1 : 1;              // dos por lado
      const k   = i%2;                         // el interior, mas corto
      const off = (0.30+k*0.30)*s2;
      const bx  = rx  - fwd[0]*0.55*RS + rgt[0]*off*RS;
      const bz  = rz3 - fwd[1]*0.55*RS + rgt[1]*off*RS;
      const by  = hy  - (0.34+k*0.30)*RS;
      const sway= Math.sin(t*1.6 + i*1.25 + f.uid)*0.13;
      const latA= (0.34+0.22*k)*s2 + sway*0.5;
      const p1  = limb(bx, by, bz, Math.PI*0.88 + sway, latA,
                       K(0.66-0.08*k), K(0.16), tubeCol, 'bone');
      const p2  = limb(p1[0], p1[1], p1[2], Math.PI*0.68 + sway*1.4, latA*1.3,
                       K(0.50), K(0.125), tubeCol, 'bone');
      R3.draw('sph', p2[0], p2[1], p2[2], K(0.155), K(0.155), K(0.155), ry,
        RIKA.glow, {alpha:(0.28+0.34*full)*A0, add:true});
    }
  }

  /* ------------------------------ cráneo ------------------------------ */
  R3.draw('sph', rx+fwd[0]*0.08*RS, hy, rz3+fwd[1]*0.08*RS, K(1.34), K(1.04), K(1.12), ry, skin,
    Object.assign({tex:TEX.bone, tile:1}, GH));
  R3.draw('sph', rx-fwd[0]*0.18*RS, hy+0.30*RS, rz3-fwd[1]*0.18*RS,
    K(1.00), K(0.60), K(1.02), ry, bone, Object.assign({tex:TEX.bone,tile:1}, GH));

  /* --- TUBOS DE LA CABEZA. Le nacen de la nuca y de los laterales del
     craneo, se curvan hacia atras y respiran luz por la boca. Son lo que mas
     la identifica de lejos junto con la corona. --- */
  if(full>0.12){
    const tubo = mixc(RIKA.bone?hex3(RIKA.bone):bone,[0,0,0],0.30);
    /* Van en HAZ, muy juntos, y bajan por la ESPALDA. Antes salian abiertos
       en abanico hacia los lados de la cabeza, que no es lo que se ve: nacen
       de la nuca pegados unos a otros y caen a lo largo del espinazo. */
    for(let i=0;i<6;i++){
      const s2 = (i%2)?1:-1, k=Math.floor(i/2);
      const off=(0.09+k*0.085)*s2;                  // separacion minima: haz
      const bx=rx-fwd[0]*(0.52+k*0.07)*RS+rgt[0]*off*RS;
      const bz=rz3-fwd[1]*(0.52+k*0.07)*RS+rgt[1]*off*RS;
      const by=hy-(0.04+k*0.10)*RS;
      const on=Math.sin(t*1.7+i*0.9+f.uid)*0.11;
      const latA=off*0.55+on*0.35;
      /* phi negativo = hacia atras y abajo: pegados a la espalda */
      const p1=limb(bx,by,bz, -0.46+on,       latA,      1.05*RS, K(0.175), tubo, 'bone');
      const p2=limb(p1[0],p1[1],p1[2], -0.16+on*1.2, latA*1.2, 0.92*RS, K(0.145), tubo, 'bone');
      R3.draw('sph', p2[0],p2[1],p2[2], K(0.19),K(0.19),K(0.19), ry, RIKA.glow,
        {alpha:(0.30+0.34*full)*A0, add:true});
    }
  }

  /* QUITADA: aqui iba una corona de hasta siete pinchos de hueso abiertos en
     abanico sobre el craneo. Lo mas alto de Rika pasa a ser su propia cabeza. */

  /* ------------------------------ fauces ------------------------------ */
  const maw = 0.10 + beam*0.80 + (f.domain?0.40:0) + lunge*0.30;
  /* LA BOCA ESTABA EN EL PECHO, NO EN LA CARA. El craneo llega hasta -0,66
     y la mandibula bajaba hasta -1,16: medio cuerpo de mandibula colgando por
     debajo de la barbilla, apoyada sobre el torso y las costillas. Sube 0,25 y
     se hace mas compacta para caber en la cara. */
  const jy  = hy - 0.20*RS;
  /* LA BOCA ERA MAS ANCHA QUE LA CARA. El craneo es un elipsoide: mide 1,12
     de medio ancho SOLO en su punto mas gordo, y la boca no esta ahi, esta
     medio paso por delante y por debajo. A la altura de la mandibula la cara
     ya solo mide 1,08 de medio ancho, y la mandibula media 1,07: sus esquinas
     cuadradas asomaban justo por el borde redondo del craneo, y al abrirse en
     dominio se descolgaba a una altura donde la cara mide 0,64 y sobresalia
     mas del doble. Encia, mandibula, garganta y colmillos van estrechados
     para caber dentro de la silueta, y la mandibula mas que la encia, que es
     como encaja una mandibula de verdad. */
  /* EL HUECO. Toda la boca va alojada en una cuenca oscura excavada en el
     morro. No basta con ponerla detras: tiene que CONTENER a las tres piezas.
     Medido, la encia sobresalia 0,14 por delante de la cara y los colmillos
     0,18, y el hueco se quedaba 0,20 corto por delante. Ahora la caja del
     hueco abarca de sobra a encia, mandibula y colmillos, y las tres se han
     retrasado hasta quedar dentro de la cara.
     Ajuste fino: a ras de la cara la boca se hundia demasiado, asi que sale
     0,05 y luego otros 0,04. La MANDIBULA se adelanta con ella: iba 0,09 por
     detras de la encia y la boca se leia partida en dos escalones. El hueco
     crece a la par, asi que las tres piezas siguen contenidas en el.
     Ultimo empujon: el craneo es un elipsoide y a la altura del labio de
     arriba su superficie llegaba casi hasta el morro de la encia, asi que la
     cabeza pasaba POR ENCIMA del labio y se lo comia. Con este medio paso mas
     el labio queda claramente por delante de la cara a su propia altura. */
  R3.draw('box', rx+fwd[0]*0.58*RS, jy-0.10*RS, rz3+fwd[1]*0.58*RS,
    K(0.35), K(0.46), K(0.54), ry, deep,
    {alpha:al, rim:0.02});
  /* encía superior */
  /* meshBox va de -1 a +1 (su escala es media anchura) pero meshSphere va de
     -0,5 a +0,5 (la suya es el diametro). El craneo, K(1.12) de esfera, mide
     0,71 de medio ancho REAL; la encia, K(0.74) de caja, medía 0,94. La boca
     era un 32% mas ancha que la cara por mezclar las dos convenciones. */
  R3.draw('box', rx+fwd[0]*0.64*RS, jy+0.06*RS, rz3+fwd[1]*0.64*RS,
    K(0.26), K(0.15), K(0.46), ry, mixc(skin,[1,1,1],0.20),
    Object.assign({tex:TEX.teeth,tile:2}, GH));
  /* mandíbula inferior: se descuelga al abrir */
  /* La mandibula colgaba tan arriba que su caja se metia DENTRO de la encia:
     no habia hueco de boca, y los colmillos de arriba atravesaban la de abajo
     y asomaban por fuera.
     LA MANDIBULA SE QUEDA DONDE ESTABA: misma altura, misma profundidad,
     mismo ancho que siempre. Lo unico que cambia es DONDE nacen los
     colmillos: a 0,88 en vez de a 0,55, o sea justo delante del morro de la
     mandibula y todavia clavados en la encia. Asi cuelgan por fuera del labio
     en lugar de atravesarla, sin necesidad de abrir la boca ni de mover
     ninguna pieza de sitio. */
  const ljy = jy - (0.20+maw*0.49)*RS;
  R3.draw('box', rx+fwd[0]*(0.68+maw*0.06)*RS, ljy, rz3+fwd[1]*(0.68+maw*0.06)*RS,
    K(0.18), K(0.16), K(0.62), ry, mixc(skin,[1,1,1],0.10),
    Object.assign({tex:TEX.teeth,tile:2}, GH));
  /* colmillos: la firma de Rika, modelados uno a uno */
  const nF = 3 + Math.round(full*3);
  for(let i=0;i<nF;i++){
    /* QUITADOS los dos de los extremos. Caian en u = ±0,5, o sea en la esquina
       misma de la encia, y desde delante asomaban por el borde de la cara en
       vez de quedarse dentro de la boca. */
    if(nF>3 && (i===0 || i===nF-1)) continue;
    const u=(i/(nF-1||1))-0.5;
    const fx=rx+fwd[0]*0.78*RS+rgt[0]*u*0.76*RS, fz=rz3+fwd[1]*0.78*RS+rgt[1]*u*0.76*RS;
    const L1=(0.15-Math.abs(u)*0.06)*(0.7+0.5*full);
    /* METIDOS HACIA ADENTRO. Estaban a 0,88, o sea con la punta 0,10 POR
       DELANTE del morro: de perfil se veian despegados de la cara, colgando
       en el aire. A 0,78 quedan por dentro del morro. Para que ahi no choquen
       con la mandibula, ella pierde profundidad (0,26 -> 0,18): su barbilla
       se mete un poco y deja el escalon donde se apoyan los dientes. */
    R3.draw('cone', fx, jy-(0.05+L1*0.5)*RS, fz, K(0.11),K(L1),K(0.11), ry, bone,
      Object.assign({tex:TEX.bone,tile:1, rz:Math.PI}, GH));
    /* QUITADA la fila de abajo: con la boca cerrada no hay hueco donde pueda
       existir sin meterse dentro de la encia. Manda la fila de arriba, que es
       la que se le ve a Rika. */
  }
  /* garganta */
  R3.draw('box', rx+fwd[0]*0.46*RS, (jy+ljy)*0.5, rz3+fwd[1]*0.46*RS,
    K(0.16), Math.abs(jy-ljy)*0.42, K(0.32), ry, deep, {alpha:al});
  /* luz que sube por la garganta al canalizar Amor Puro / en dominio */
  const glowM=Math.max(beam, f.domain?0.7:0);
  if(glowM>0.05)
    R3.draw('sph', rx+fwd[0]*0.54*RS, (jy+ljy)*0.5, rz3+fwd[1]*0.54*RS,
      K(0.22), Math.abs(jy-ljy)*0.45+K(0.05), K(0.26), 0, RIKA.glow,
      {alpha:0.28*glowM*A0, add:true});

  /* --------------------------- cuencas y ojos --------------------------- */
  for(const s2 of [-1,1]){
    const ex=rx+fwd[0]*0.62*RS+rgt[0]*0.36*s2*RS, ez=rz3+fwd[1]*0.62*RS+rgt[1]*0.36*s2*RS;
    R3.draw('sph', ex, hy+0.26*RS, ez, K(0.40), K(0.44), K(0.40), ry, deep, {alpha:al, rim:0.05});
    R3.draw('sph', ex+fwd[0]*0.09*RS, hy+0.26*RS, ez+fwd[1]*0.09*RS,
      K(0.21+0.03*Math.sin(t*5+s2)), K(0.23), K(0.21), ry,
      hurt>0.1?mixc(RIKA.glow,[1,0.3,0.35],hurt):RIKA.glow,
      {alpha:(0.40+0.32*full)*A0, add:true, emis:0.8});
  }
  /* QUITADO: aqui iba un tercer ojo en mitad de la frente. Rika tiene dos. */

  /* la lágrima que nunca se le seca */
  if(full>0.14)
  R3.draw('box', rx+fwd[0]*0.66*RS+rgt[0]*0.36*RS, hy-0.16*RS,
    rz3+fwd[1]*0.66*RS+rgt[1]*0.36*RS,
    K(0.05), K(0.34), K(0.07), ry, RIKA.warm, {alpha:0.42*al, add:true});

  /* ------------------------------ melena ------------------------------ */
  /* una mata continua (no tablones sueltos) que envuelve el cráneo por detrás */
  R3.draw('sph', rx-fwd[0]*0.20*RS, hy+0.02*RS, rz3-fwd[1]*0.20*RS,
    K(1.40), K(1.24), K(1.30), ry, hair,
    {tex:TEX.hairlong, tile:1, alpha:al, rim:0.10});
  /* QUITADO: aqui iba un cono de melena de 3,01 de alto colgando de la nuca.
     Con la base ancha abajo y el vertice arriba caia por detras hasta 0,33
     POR DEBAJO DEL SUELO, asi que por la espalda no se leia como pelo sino
     como un embudo negro pegado a la parte baja de Rika. Se queda solo el
     casquete sobre el craneo y los mechones que enmarcan la cara. */
  /* y sólo unos pocos mechones sueltos, largos, que enmarcan la cara */
  const strands = 2 + Math.round(full*2);
  for(let i=0;i<strands;i++){
    const sgn = i%2===0?1:-1, tier=Math.floor(i/2);
    const sw=Math.sin(t*1.25+i*0.9)*0.14 + Math.sin(t*0.6+i)*0.07;
    const ln=(1.25+1.45*full)*(0.85-tier*0.18);
    const oz=sgn*(0.56+tier*0.14), ox=0.16-tier*0.24;
    R3.draw('box',
      rx + fwd[0]*ox*RS + rgt[0]*oz*RS + fwd[0]*sw*0.22*RS,
      hy + (0.06-ln*0.5)*RS,
      rz3+ fwd[1]*ox*RS + rgt[1]*oz*RS + fwd[1]*sw*0.22*RS,
      K(0.22), K(ln*0.5), K(0.17), ry+sgn*0.22, hair,
      {tex:TEX.hairlong, tile:1, alpha:al, rim:0.10, rz:sw*0.5});
  }
  /* ------------------------- brazos colosales ------------------------- */
  const nArms = full>0.30 ? 2 : 1;
  for(let k=0;k<nArms;k++){
    const sg = k===0 ? 1 : -1;
    /* Brazos colosales y ABIERTOS. Eran demasiado finos y demasiado pegados
       al cuerpo: colgaban como los de una persona grande. Se separan del
       tronco, se engordan y se abren casi en horizontal, que es la silueta
       que la hace enorme aunque la cabeza sea del mismo tamaño. */
    /* El hombro estaba a 1,05 del eje con radio 0,38: su borde interno caia a
       0,67 mientras el pecho acaba en 0,53. Sobraban 0,14 de aire, asi que el
       brazo entero nacia despegado del tronco. */
    const sx0 = rx + rgt[0]*0.74*sg*RS, sz0 = rz3 + rgt[1]*0.74*sg*RS;
    const sy0 = hy - 0.86*RS;
    R3.draw('sph', sx0, sy0, sz0, K(0.76), K(0.70), K(0.76), ry, skin,
      Object.assign({tex:TEX.bone,tile:1}, GH));
    const swing = Math.sin(t*1.1+k*2.1)*0.07;
    /* AL EMERGER se apoya: los brazos se abren del todo y las manos bajan a
       clavarse en el suelo, como quien se iza de un agujero. Al terminar de
       salir vuelven a su postura abierta normal. */
    const emerg = 1-subida;
    const lat   = sg*(1.24 - lunge*0.88) * (1 + emerg*0.30);
    const phi1  = lerp(0.78 + swing + lunge*0.62 + (key==='Q'?0.14:0), 1.46, emerg);
    const phi2  = lerp(phi1 + 0.30 - lunge*0.22, phi1 + 0.62, emerg);
    const el = limb(sx0,sy0,sz0, phi1, lat, 1.52*RS, K(0.52), skin, 'tatter');
    /* codo: sin bola, los dos tramos se leian como dos piezas distintas */
    R3.draw('sph', el[0], el[1], el[2], K(0.56), K(0.56), K(0.56), ry, skin,
      Object.assign({tex:TEX.bone,tile:1}, GH));
    const wr = limb(el[0],el[1],el[2], phi2, lat, 1.34*RS, K(0.43),
                    mixc(skin,[1,1,1],0.08), 'bone');
    /* mano */
    R3.draw('sph', wr[0], wr[1], wr[2], K(0.58), K(0.50), K(0.58), ry, skin,
      Object.assign({tex:TEX.bone,tile:1}, GH));
    /* garras */
    const a2=f.ang+lat, fw2=[Math.cos(a2),Math.sin(a2)], rg2=[-Math.sin(a2),Math.cos(a2)];
    for(let c=0;c<4;c++){
      const ca=(c-1.5)*0.26;
      const cph=phi2+0.48-lunge*0.55;
      const dx=Math.sin(cph), dy=-Math.cos(cph);
      const bx=wr[0]+rg2[0]*ca*0.34*RS, bz=wr[2]+rg2[1]*ca*0.34*RS;
      const L=0.62+lunge*0.30;          // garras de verdad, no uñas
      R3.draw('cone',
        bx+fw2[0]*dx*L*0.5*RS, wr[1]+dy*L*0.5*RS, bz+fw2[1]*dx*L*0.5*RS,
        K(0.125), K(L*1.45), K(0.125), -a2, bone,
        Object.assign({tex:TEX.bone,tile:1, rz:Math.PI+cph}, GH));
    }
    if(lunge>0.12)
      R3.draw('sph', wr[0], wr[1], wr[2], K(0.70), K(0.55), K(0.70), 0, RIKA.glow,
        {alpha:0.20*lunge*A0, add:true, noCull:true});
  }

  /* --------------------- pavesas que la acompañan --------------------- */
  if(full>0.25){
    if(f._rkP===undefined) f._rkP=0;
    f._rkP -= VISDT;
    if(f._rkP<=0){
      f._rkP = 0.11;
      PS.spawn({ x:rx+(Math.random()-0.5)*2.2*RS, y:hy-1.6*RS+Math.random()*2.4*RS,
                 z:rz3+(Math.random()-0.5)*2.2*RS,
                 vx:0, vy:0.30+Math.random()*0.45, vz:0, g:0.22, drag:0.97,
                 life:0.9+Math.random()*0.7, s:0.085, s1:0.01,
                 c:RIKA.glow, c1:RIKA.warm, a:0.5*full, glow:1, ground:false });
    }
  }
}

/* -------------------- auras, estados y anillos --------------------------- */
/* --------------------------------------------------------------------------
   Halos y estados.
   REGLA: nada de esferas que envuelvan al personaje con `noCull`. Una esfera
   sin descarte de caras dibuja tambien su mitad delantera, que queda ENTRE la
   camara y el cuerpo y lo cubre con un velo aditivo: por eso los personajes
   parecian semitransparentes, con las texturas lavadas. Todos los halos usan
   ahora `cullFront`, que pinta solo la cara interior, asi el resplandor sale
   por detras y alrededor de la silueta y nunca por encima.
   -------------------------------------------------------------------------- */
function auraShell(x,y,z, rx,ry2,rz2, col, a){
  R3.draw('sph', x, y, z, rx, ry2, rz2, 0, col, {alpha:a, add:true, cullFront:true});
}
function drawFighterFX(g,f,x,z,sc,col,alpha,B,H){
  const isHero=f===M.hero;
  if(!f.noCE && f.ce>f.maxce*0.35){
    const k=0.55+0.45*(f.ce/f.maxce), pu=1+Math.sin(g.t*4+f.uid)*0.05;
    const ac=auraColor(f);
    auraShell(x, 1.05*sc*H, z, 2.05*k*pu*sc*B, 2.9*k*pu*sc*H, 2.05*k*pu*sc*B, ac, 0.10*k);
    /* y un charco de energia a los pies, que es donde se lee sin estorbar */
    R3.draw('disc', x, 0.06, z, 2.5*k*sc*B, 1, 2.5*k*sc*B, 0, ac, {alpha:0.10*k, add:true});
  }
  if(f.guarding){
    auraShell(x, 1.0*sc*H, z, 2.4*sc*B, 2.9*sc*H, 2.4*sc*B, [0.45,0.65,1], 0.20);
    R3.draw('disc', x, 0.08, z, 2.6*sc, 1, 2.6*sc, 0, [0.45,0.65,1], {alpha:0.18, add:true});
  }
  if(f.status.simpleDomain)
    R3.draw('disc', x, 0.10, z, 2.6,1,2.6, 0, [0.35,0.85,0.60], {alpha:0.35, add:true});
  if(f.status.freeze)
    auraShell(x, 1.0*sc*H, z, 2.2*sc*B, 2.8*sc*H, 2.2*sc*B, [0.55,0.85,0.95], 0.42);
  if(f.status.burn)
    auraShell(x, 1.1*sc*H, z, 2.1*sc*B, 2.9*sc*H, 2.1*sc*B, [1,0.45,0.12], 0.38);
  if(f.status.soulcut)
    R3.draw('disc', x, 0.12, z, 2.2,1,2.2, 0, [0.9,0.25,0.45], {alpha:0.30, add:true});

  if(f.atk && g.t>=f.bf.s-0.14 && g.t<=f.bf.e+0.05){
    const win=g.t>=f.bf.s&&g.t<=f.bf.e;
    const p=clamp((f.bf.e-g.t)/((f.bf.e-f.bf.s)+0.14),0,1);
    const r=(1.0+p*2.4)*sc;
    R3.draw('disc', x, 0.14, z, r*2, 1, r*2, 0, [1,1,1], {alpha:win?0.55:0.22, add:true});
  }
  if(f.bf.arm)
    auraShell(x, 1.1*sc*H, z, 2.2*sc*B, 2.6*sc*H, 2.2*sc*B, [1,1,1], 0.24);

  if(!isHero){
    const mc = f.team===M.hero.team?[0.37,0.84,0.63]:(f.isBoss?[1,0.22,0.22]:[1,0.37,0.48]);
    R3.draw('disc', x, 0.09, z, 1.5*sc,1,1.5*sc, 0, mc, {alpha:0.28, add:true});
  }
}

   SHIKIGAMI Y BESTIAS

const BEAST = {
  dog:    { name:'Perro Divino',  h:0.62, len:1.05, tex:'fur' },
  isomer: { name:'Isómero',       h:0.85, len:0.7,  tex:'stitch' },
  curse:  { name:'Maldición',     h:0.95, len:0.7,  tex:'stitch' },
  judge:  { name:'Judgeman',      h:1.6,  len:0.5,  tex:'coat' }
};

function drawBeast(g, f){
  const kind = f.tag || 'curse';
  const x=w3(f.x), z=w3(f.y), col=hex3(f.C.color);
  const ry=-f.ang, fwd=[Math.cos(f.ang),Math.sin(f.ang)], rgt=[-Math.sin(f.ang),Math.cos(f.ang)];
  const spd=Math.hypot(f.vx,f.vy);
  const gait=Math.sin(g.t*13+f.uid)*Math.min(0.16, spd*0.0009);
  const bob=Math.sin(g.t*13+f.uid)*Math.min(0.05, spd*0.0003);
  const O={rim:0.32};
  const dark=mixc(col,[0.02,0.02,0.04],0.62);

  R3.draw('disc', x, 0.03, z, 1.0, 1, 1.0, 0, [0,0,0], {alpha:0.45});

  if(kind==='dog'){
    const white = (f.uid%2)===0;
    const body = white? hex3('#e6e6ee') : hex3('#181820');
    const FT=Object.assign({tex:TEX.fur,tile:2},O);
    // tronco
    R3.draw('box', x, 0.60+bob, z, 1.10, 0.46, 0.44, ry, body, FT);
    // cuello y cabeza
    const hx=x+fwd[0]*0.62, hz=z+fwd[1]*0.62;
    R3.draw('box', hx, 0.72+bob, hz, 0.34, 0.30, 0.32, ry, body, FT);
    R3.draw('box', hx+fwd[0]*0.24, 0.66+bob, hz+fwd[1]*0.24, 0.26, 0.18, 0.22, ry,
      mixc(body,[0,0,0],0.25), FT);
    for(const s2 of [-1,1]){
      R3.draw('cone', hx+rgt[0]*0.12*s2, 0.92+bob, hz+rgt[1]*0.12*s2, 0.13,0.22,0.13, ry, body, FT);
      R3.draw('sph', hx+fwd[0]*0.14+rgt[0]*0.10*s2, 0.76+bob, hz+fwd[1]*0.14+rgt[1]*0.10*s2,
        0.09,0.09,0.09, ry, col, {emis:1.1});
    }
    // patas
    for(let i=0;i<4;i++){
      const fz=(i<2?0.36:-0.34), sd=(i%2?1:-1);
      const sw=gait*(i%2===0?1:-1)*(i<2?1:-1);
      R3.draw('box', x+fwd[0]*(fz+sw)+rgt[0]*0.20*sd, 0.24, z+fwd[1]*(fz+sw)+rgt[1]*0.20*sd,
        0.15,0.48,0.15, ry, dark, O);
    }
    // cola
    R3.draw('cone', x-fwd[0]*0.66, 0.72+bob, z-fwd[1]*0.66, 0.14,0.42,0.14,
      ry, body, Object.assign({tex:TEX.fur,tile:1,rz:0.9},O));
    return;
  }

  if(kind==='judge'){                       // Judgeman: figura de la Justicia
    const dcol=hex3('#2e2e40');
    R3.draw('cyl', x, 0.55, z, 0.26,1.10,0.26, ry, dcol, Object.assign({tex:TEX.coat,tile:1},O));
    R3.draw('cyl', x, 1.42, z, 0.62,0.72,0.52, ry, dcol, Object.assign({tex:TEX.coat,tile:1},O));
    R3.draw('sph', x, 1.92, z, 0.44,0.48,0.44, ry, dcol, Object.assign({tex:TEX.coat,tile:1},O));
    // brazos-balanza
    for(const s2 of [-1,1]){
      R3.draw('box', x+rgt[0]*0.42*s2, 1.62, z+rgt[1]*0.42*s2, 0.10,0.10,0.72, ry, dcol, O);
      R3.draw('disc', x+rgt[0]*0.74*s2, 1.36, z+rgt[1]*0.74*s2, 0.44,1,0.44, 0,
        hex3('#7fd3c9'), {alpha:0.85, emis:0.4});
      R3.draw('box', x+rgt[0]*0.74*s2, 1.50, z+rgt[1]*0.74*s2, 0.03,0.26,0.03, ry, dcol, O);
    }
    R3.draw('box', x+fwd[0]*0.30, 1.96, z+fwd[1]*0.30, 0.05,0.10,0.30, ry,
      hex3('#7fd3c9'), {emis:1.0});
    return;
  }

  /* --- maldiciones e isómeros: masa deforme --- */
  const T = kind==='isomer' ? TEX.stitch : TEX.stitch;
  R3.draw('sph', x, 0.62+bob, z, 0.95, 0.90, 0.85, ry, col, Object.assign({tex:T,tile:1},O));
  R3.draw('sph', x+rgt[0]*0.26, 0.94+bob, z+rgt[1]*0.26, 0.48,0.44,0.44, ry,
    mixc(col,[1,1,1],0.12), Object.assign({tex:T,tile:1},O));
  R3.draw('sph', x-rgt[0]*0.22, 1.02+bob, z-rgt[1]*0.22, 0.40,0.42,0.40, ry,
    mixc(col,[0,0,0],0.18), Object.assign({tex:T,tile:1},O));
  // ojos
  for(const s2 of [-1,1])
    R3.draw('sph', x+fwd[0]*0.36+rgt[0]*0.16*s2, 0.94+bob, z+fwd[1]*0.36+rgt[1]*0.16*s2,
      0.15,0.15,0.15, ry, [1,0.9,0.4], {emis:1.3});
  // extremidades
  for(const s2 of [-1,1]){
    const sw=gait*s2;
    R3.draw('box', x+rgt[0]*0.50*s2+fwd[0]*sw, 0.62+bob, z+rgt[1]*0.50*s2+fwd[1]*sw,
      0.36,0.16,0.16, ry, dark, O);
    R3.draw('cone', x+rgt[0]*0.70*s2+fwd[0]*sw, 0.62+bob, z+rgt[1]*0.70*s2+fwd[1]*sw,
      0.09,0.24,0.09, ry, hex3('#e0d8c8'), Object.assign({tex:TEX.bone,tile:1,rz:-1.4},O));
  }
  for(const s2 of [-1,1])
    R3.draw('box', x+rgt[0]*0.22*s2, 0.18, z+rgt[1]*0.22*s2, 0.18,0.40,0.18, ry, dark, O);
}

/* ---- shikigami manifestados como efecto puntual (Nue, Elefante) --------- */
function drawShikiFX(g, e){
  const p=e.t/e.life, a=clamp(1-p,0,1);
  const x=w3(e.x), z=w3(e.y);
  const fwd=[Math.cos(e.a||0),Math.sin(e.a||0)], rgt=[-Math.sin(e.a||0),Math.cos(e.a||0)];
  const ry=-(e.a||0);
  const hit=e.hit||0;
  const O={rim:0.4};

  if(e.kind==='nue'){
    // cae en picado y sale volando
    const dive = e.t<hit ? (1-e.t/Math.max(0.01,hit)) : 0;
    const rise = e.t>hit ? (e.t-hit)*2.4 : 0;
    const y = 1.0 + dive*7.0 + rise*3.2;
    const flap = Math.sin(g.t*22)*0.5;
    const body=hex3('#5a6a9a');
    R3.draw('sph', x, y, z, 1.05,0.85,1.85, ry, body, Object.assign({tex:TEX.scale,tile:2,rim:0.6},O));
    R3.draw('sph', x, y, z, 1.5,1.2,2.4, ry, [0.45,0.65,1], {alpha:0.16, add:true, noCull:true});
    R3.draw('sph', x+fwd[0]*1.05, y+0.14, z+fwd[1]*1.05, 0.62,0.58,0.76, ry,
      mixc(body,[1,1,1],0.10), Object.assign({tex:TEX.scale,tile:1,rim:0.6},O));
    for(const s2 of [-1,1]){
      R3.draw('box', x+rgt[0]*1.55*s2, y+0.34, z+rgt[1]*1.55*s2, 1.5,0.11,3.0, ry,
        mixc(body,[0.55,0.72,1],0.45), Object.assign({rz:flap*s2*0.35, tex:TEX.scale, tile:2, rim:0.7},O));
      R3.draw('box', x+rgt[0]*1.55*s2, y+0.34, z+rgt[1]*1.55*s2, 1.6,0.03,3.1, ry,
        [0.6,0.8,1], {alpha:0.30, add:true, rz:flap*s2*0.35});
    }
    R3.draw('cone', x-fwd[0]*1.45, y, z-fwd[1]*1.45, 0.32,1.3,0.32, ry,
      body, Object.assign({tex:TEX.scale,tile:1,rz:1.5,rim:0.5},O));
    for(const s2 of [-1,1])
      R3.draw('sph', x+fwd[0]*1.30+rgt[0]*0.20*s2, y+0.24, z+fwd[1]*1.30+rgt[1]*0.20*s2,
        0.20,0.20,0.20, ry, [1,0.95,0.4], {emis:1.6});
    // descarga eléctrica al impactar
    if(e.t>hit && e.t<hit+0.35){
      for(let k=0;k<7;k++){
        const ang=k/7*TAU+g.t*3;
        R3.draw('box', x+Math.cos(ang)*1.2, 0.9, z+Math.sin(ang)*1.2, 2.2,0.07,0.07,
          -ang, [0.7,0.85,1], {alpha:0.85, add:true});
      }
      R3.draw('disc', x, 0.10, z, 5.0,1,5.0, 0, [0.6,0.8,1], {alpha:0.5, add:true});
    }
    return;
  }

  if(e.kind==='elephant'){
    const grow = clamp(e.t/Math.max(0.01,hit+0.15),0,1);
    const s = 0.5+grow*1.0;
    const y = 1.5*s;
    const body=hex3('#8a8a9a');
    const BT=Object.assign({tex:TEX.concrete,tile:1,rim:0.45},O);
    R3.draw('sph', x, y, z, 3.4*s,2.6*s,4.2*s, ry, body, BT);
    // cabeza
    const hx=x+fwd[0]*2.3*s, hz=z+fwd[1]*2.3*s;
    R3.draw('sph', hx, y+0.25*s, hz, 2.0*s,1.9*s,1.7*s, ry, body, BT);
    // orejas
    for(const s2 of [-1,1])
      R3.draw('box', hx+rgt[0]*1.25*s*s2, y+0.35*s, hz+rgt[1]*1.25*s*s2,
        0.9*s,1.7*s,0.16*s, ry, mixc(body,[0,0,0],0.15), BT);
    // trompa
    for(let k=0;k<5;k++){
      const t=k/5;
      R3.draw('sph', hx+fwd[0]*(0.9+k*0.42)*s, y-(0.2+k*0.32)*s, hz+fwd[1]*(0.9+k*0.42)*s,
        (0.55-t*0.22)*s,(0.55-t*0.22)*s,(0.55-t*0.22)*s, ry, body, BT);
    }
    // colmillos
    for(const s2 of [-1,1])
      R3.draw('cone', hx+fwd[0]*1.0*s+rgt[0]*0.6*s*s2, y-0.35*s, hz+fwd[1]*1.0*s+rgt[1]*0.6*s*s2,
        0.22*s,1.1*s,0.22*s, ry, hex3('#e8e0cc'), Object.assign({tex:TEX.bone,tile:1,rz:-1.1},O));
    // patas
    for(let i=0;i<4;i++){
      const fz=(i<2?1.1:-1.2)*s, sd=(i%2?1:-1);
      R3.draw('cyl', x+fwd[0]*fz+rgt[0]*1.1*s*sd, 0.75*s, z+fwd[1]*fz+rgt[1]*1.1*s*sd,
        0.85*s,1.6*s,0.85*s, ry, mixc(body,[0,0,0],0.2), BT);
    }
    // torrente de agua
    if(e.t>hit){
      const wp=(e.t-hit)/Math.max(0.01,e.life-hit);
      R3.draw('disc', x, 0.12, z, 16*wp, 1, 16*wp, 0, [0.35,0.7,0.95], {alpha:0.26*(1-wp), add:true});
      for(let k=0;k<10;k++){
        const ang=k/10*TAU;
        R3.draw('sph', x+Math.cos(ang)*7*wp, 0.6+Math.sin(wp*3)*1.1, z+Math.sin(ang)*7*wp,
          1.4,1.4,1.4, 0, [0.4,0.75,1], {alpha:0.22*(1-wp), add:true});
      }
    }
    return;
  }
}

/* ============================================================================
   m_particles.js — Sistema de partículas (solo visual, fuera de la simulación)
   Nunca toca el estado del combate: se alimenta de los efectos que emite el
   motor, así que no puede romper el determinismo del netcode.
   ========================================================================= */

const PS = {
  list: [], max: 340, t: 0,

  spawn(o){
    if(this.list.length >= this.max) this.list.shift();
    this.list.push({
      x:o.x, y:o.y, z:o.z,
      vx:o.vx||0, vy:o.vy||0, vz:o.vz||0,
      g:o.g!==undefined?o.g:-6, drag:o.drag!==undefined?o.drag:0.90,
      life:o.life||0.6, max:o.life||0.6,
      s0:o.s||0.16, s1:o.s1!==undefined?o.s1:0,
      c:o.c||[1,1,1], c1:o.c1||null,
      a:o.a!==undefined?o.a:0.9,
      add:o.add!==false, glow:o.glow||0, spin:o.spin||0, rz:o.rz||0,
      shape:o.shape||'p', trail:o.trail||0, ground:o.ground!==false
    });
  },

  /* ---------------- emisores con carácter propio ---------------- */
  sparks(x,y,z,n,c,pw){
    pw=pw||1;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, e=Math.random()*Math.PI*0.6;
      const sp=(2.5+Math.random()*7)*pw;
      this.spawn({x,y,z, vx:Math.cos(a)*Math.cos(e)*sp, vy:Math.sin(e)*sp+2,
        vz:Math.sin(a)*Math.cos(e)*sp, g:-11, drag:0.86,
        life:0.22+Math.random()*0.32, s:0.09+Math.random()*0.08, s1:0.01,
        c, c1:[1,0.95,0.8], a:1, glow:1});
    }
  },
  embers(x,y,z,n,pw){
    pw=pw||1;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=(0.6+Math.random()*2.2)*pw;
      this.spawn({x,y,z, vx:Math.cos(a)*sp, vy:1.2+Math.random()*2.6, vz:Math.sin(a)*sp,

  },
  shards(x,y,z,n,pw){

      const a=Math.random()*TAU, sp=(2+Math.random()*5)*pw;

    }
  },
  blood(x,y,z,n,pw){
    pw=pw||1;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=(1.5+Math.random()*4.5)*pw;
      this.spawn({x,y,z, vx:Math.cos(a)*sp, vy:1+Math.random()*3.5, vz:Math.sin(a)*sp,
        g:-13, drag:0.92, life:0.6+Math.random()*0.5, s:0.11+Math.random()*0.09, s1:0.03,
        c:[0.62,0.05,0.12], a:0.95, add:false, glow:0});
    }
  },
  bolts(x,y,z,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=3+Math.random()*7;
      this.spawn({x,y,z, vx:Math.cos(a)*sp, vy:(Math.random()-0.3)*5, vz:Math.sin(a)*sp,
        g:0, drag:0.80, life:0.10+Math.random()*0.14, s:0.5, s1:0.05,

  },
  smoke(x,y,z,n,c,pw){
    pw=pw||1;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=(0.5+Math.random()*1.8)*pw;

        g:0.6, drag:0.93, life:0.8+Math.random()*0.8,
        s:0.4*pw, s1:1.5*pw, c:c||[0.30,0.30,0.36], a:0.28, add:false, glow:0});
    }
  },
  dust(x,z,n,r,c){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=r*(0.7+Math.random()*0.8);
      this.spawn({x, y:0.10, z, vx:Math.cos(a)*sp, vy:0.4+Math.random()*1.0, vz:Math.sin(a)*sp,
        g:-1.6, drag:0.90, life:0.5+Math.random()*0.6, s:0.22, s1:0.8,
        c:c||[0.45,0.42,0.40], a:0.34, add:false});
    }
  },
  ash(x,y,z,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=0.3+Math.random()*1.2;
      this.spawn({x,y,z, vx:Math.cos(a)*sp, vy:0.4+Math.random()*1.2, vz:Math.sin(a)*sp,
        g:0.5, drag:0.96, life:1.4+Math.random()*1.4, s:0.07, s1:0.02,
        c:[0.75,0.72,0.66], a:0.5, add:false});
    }
  },
  /* implosión: partículas que caen hacia un punto (Azul, dominios) */
  implode(x,y,z,n,r,c){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, e=(Math.random()-0.5)*1.4, d=r*(0.6+Math.random()*0.6);
      const px=x+Math.cos(a)*d, py=y+e*d*0.5, pz=z+Math.sin(a)*d;
      const sp=d*2.4;
      this.spawn({x:px,y:py,z:pz, vx:-Math.cos(a)*sp, vy:-e*sp*0.4, vz:-Math.sin(a)*sp,
        g:0, drag:0.99, life:0.42, s:0.13, s1:0.02, c:c||[0.4,0.65,1], a:0.95, glow:1});
    }
  },

  /* ------------------------------ ciclo --------------------------------- */
  update(dt){
    dt=Math.min(dt,0.05);
    const L=this.list;
    for(let i=L.length-1;i>=0;i--){
      const p=L[i];
      p.life-=dt;
      if(p.life<=0){ L.splice(i,1); continue; }
      p.vy+=p.g*dt;
      const d=Math.pow(p.drag, dt*60);
      p.vx*=d; p.vy*=d; p.vz*=d;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      if(p.ground && p.y<0.05){ p.y=0.05; p.vy*=-0.28; p.vx*=0.7; p.vz*=0.7; }
      if(p.spin) p.rz+=p.spin*dt;
    }
  },
  draw(){
    const L=this.list;
    for(let i=0;i<L.length;i++){
      const p=L[i];
      const k=p.life/p.max, u=1-k;
      const s=p.s0+(p.s1-p.s0)*u;
      const col=p.c1? mixc(p.c,p.c1,u*0.8) : p.c;
      const al=p.a*(p.shape==='bolt'?Math.pow(k,0.5):k);
      if(p.shape==='bolt'){
        R3.draw('box', p.x,p.y,p.z, s, s*0.10, s*0.10, p.rz, col,
          {alpha:al, add:true, rz:p.rz*0.7});
      } else if(p.shape==='shard'){
        R3.draw('box', p.x,p.y,p.z, s*1.9, s*0.5, s*0.5, p.rz, col,
          {alpha:al, add:p.add, rz:p.rz});
      } else {
        R3.draw('psph', p.x,p.y,p.z, s,s,s, 0, col,
          {alpha:al, add:p.add, emis:p.glow});
      }
    }
  },
  clear(){ this.list.length=0; }
};

/* ---------------- cinta curva para los cortes ---------------------------- */
function ribbonArc(x,y,z, ang, radius, arc, prog, col, alpha, thick){
  const N=9;
  for(let i=0;i<N;i++){
    const t0=(i/N-0.5)*arc, t1=((i+1)/N-0.5)*arc;
    const tm=(t0+t1)/2;
    const a=ang+tm;
    const rr=radius*(0.62+prog*0.5);
    const px=x+Math.cos(a)*rr, pz=z+Math.sin(a)*rr;
    const seg=Math.abs(t1-t0)*rr*1.25;
    const fade=1-Math.abs(tm)/(arc*0.5)*0.55;
    R3.draw('box', px, y+Math.sin(tm*1.2)*0.10, pz,
      seg, (thick||0.16)*fade, (thick||0.16)*0.35, -(a+Math.PI/2),
      col, {alpha:alpha*fade, add:true});
  }
}

/* ============================================================================
   ESCOMBROS — cascotes con peso
   ----------------------------------------------------------------------------
   Cajas con textura que vuelan, giran sobre dos ejes, rebotan, se asientan y
   se apagan. Igual que las partículas: puramente visual, nunca toca la
   simulación ni consume el generador aleatorio con semilla.
   ========================================================================= */
const DEB = {
  list: [], max: 120,

  spawn(o){
    if(this.list.length >= this.max) this.list.shift();
    this.list.push({
      x:o.x, y:o.y, z:o.z,
      vx:o.vx, vy:o.vy, vz:o.vz,
      sx:o.sx, sy:o.sy, sz:o.sz,
      ry:o.ry||0, rz:o.rz||0, spinY:o.spinY||0, spinZ:o.spinZ||0,
      life:o.life, max:o.life, rest:0,
      tex:o.tex||null, tile:o.tile||1, col:o.col||[0.5,0.48,0.45]
    });
  },

  /* revienta un muro: n cascotes salidos de su volumen */
  burst(x, y, z, ww, hh, n, tex, col, power){
    power = power||1;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU;
      const sp=(1.4+Math.random()*5.2)*power;
      const s=(0.16+Math.random()*0.34)*Math.min(2.2, 0.5+Math.max(ww,hh)*0.55);
      this.spawn({
        x: x+(Math.random()-0.5)*ww, y: y+Math.random()*hh, z: z+(Math.random()-0.5)*ww,
        vx: Math.cos(a)*sp, vy: 1.6+Math.random()*4.6*power, vz: Math.sin(a)*sp,
        sx: s*(0.7+Math.random()*0.9), sy: s*(0.5+Math.random()*0.8), sz: s*(0.7+Math.random()*0.9),
        ry: Math.random()*TAU, rz: Math.random()*TAU,
        spinY: (Math.random()-0.5)*7, spinZ: (Math.random()-0.5)*7,
        life: 2.6+Math.random()*2.4, tex, tile:1, col
      });
    }
  },

  update(dt){
    dt=Math.min(dt,0.05);
    const L=this.list;
    for(let i=L.length-1;i>=0;i--){
      const p=L[i];
      p.life-=dt;
      if(p.life<=0){ L.splice(i,1); continue; }
      if(p.rest) continue;                       // ya asentado: no gasta cuentas
      p.vy -= 15.5*dt;
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      p.ry+=p.spinY*dt; p.rz+=p.spinZ*dt;
      const floor=p.sy*0.5;
      if(p.y<floor){
        p.y=floor;
        if(Math.abs(p.vy)<1.1){                  // se queda quieto
          p.vy=0; p.vx*=0.4; p.vz*=0.4; p.spinY=0; p.spinZ=0;
          p.rz=0;                                // cae de plano
          if(Math.hypot(p.vx,p.vz)<0.25){ p.rest=1; p.life=Math.min(p.life,3.2); }
        } else {
          p.vy=-p.vy*0.34;
          p.vx*=0.62; p.vz*=0.62; p.spinY*=0.5; p.spinZ*=0.5;
        }
      }
    }
  },

  draw(){
    const L=this.list;
    for(let i=0;i<L.length;i++){
      const p=L[i];
      const k=p.life/p.max;
      const al = k>0.28 ? 1 : k/0.28;            // se desvanece al final
      R3.draw('box', p.x,p.y,p.z, p.sx,p.sy,p.sz, p.ry, p.col,
        al>=0.999 ? {tex:p.tex, tile:p.tile, rz:p.rz, rim:0.12}
                  : {tex:p.tex, tile:p.tile, rz:p.rz, rim:0.12, alpha:al});
    }
  },
  clear(){ this.list.length=0; }
};
