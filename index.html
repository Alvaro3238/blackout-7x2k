/* ------------------------------ RESULTADO ------------------------------- */
/* Vuelca al perfil lo que ha pasado en el combate. Se llama una sola vez por
   partida y desde aquí, no desde applyRanked, para que cuenten igual la
   historia, el combate libre, la clasificatoria y el juego en línea. */
function recordMatch(cfg, win, f, g, stats){
  const S=SAVE.stats;
  S.matches++;
  if(win) S.wins++; else S.losses++;
  S.bf      += stats.bf||0;
  S.dmg     += stats.dmg||0;
  S.taken   += stats.taken||0;
  S.heal    += f.healed||0;
  S.kills   += f.kills||0;
  S.domains += f.domCount||0;
  S.copies  += f.copyCount||0;
  S.time    += g.t;
  S.bestBF  = Math.max(S.bestBF||0, stats.bf||0);
  S.bestDmg = Math.max(S.bestDmg||0, Math.round(stats.dmg||0));
  if(win && (stats.taken||0)<=0) S.noHitWins=(S.noHitWins||0)+1;
  const c=charStat(cfg.heroCid);
  c.matches++; if(win) c.wins++;
  c.dmg+=stats.dmg||0; c.bf+=stats.bf||0; c.domains+=f.domCount||0; c.time+=g.t;
  S.last=Date.now();
}

function endMatch(win){
  const g=M.g, cfg=M.cfg, f=M.hero;
  if(!g||!f||!cfg) return;          // la partida ya se cerró antes del recuento
  M.endT=null;
  const stats={ dmg:f.dmgDealt, taken:f.dmgTaken, bf:f.bfCount, time:g.t };
  if(cfg.mode!=='train' && cfg.mode!=='tutorial') recordMatch(cfg, win, f, g, stats);
  let extra='', title=win?'VICTORIA':'DERROTA', col=win?'#5fd6a0':'#ff3f5c';
  let unlocked=[];
  if(POINTER.locked && document.exitPointerLock) document.exitPointerLock();
  AU.setIntensity(0.08);
  AU.play(win?'win':'lose', null, {verb:0.5});

  if(cfg.mode==='story'&&win){
    const m=cfg.story;
    const hpP=f.hp/f.maxhp, tScore=clamp(1-(g.t/180),0,1);
    const score=hpP*0.5+tScore*0.3+clamp(f.bfCount/4,0,1)*0.2;
    const rank= score>0.78?'S':score>0.58?'A':score>0.38?'B':'C';
    stats.rank=rank;
    const prev=SAVE.story[m.id];
    SAVE.story[m.id]={done:true, rank:(prev&&'SABC'.indexOf(prev.rank)<'SABC'.indexOf(rank))?prev.rank:rank,
      best:Math.min(prev&&prev.best||1e9, Math.round(g.t))};
    if(m.unlock){ (Array.isArray(m.unlock)?m.unlock:[m.unlock]).forEach(c=>{ SAVE.unlocked[c]=true; unlocked.push(c); }); }
    extra=`<div class="row" style="justify-content:center;gap:26px;margin:16px 0">
      <div style="text-align:center"><div class="badge" style="color:${rankColor(rank)}">${rank}</div>
      <div class="sub" style="font-size:10px">VALORACIÓN</div></div></div>`;
    title='MISIÓN COMPLETADA';
  }
  if(cfg.mode==='openmission' && win && cfg.mission){
    marcarMision(cfg.mission);
    refrescarMisiones();          // su hueco lo ocupa una marca nueva
    title='MALDICIÓN EXORCIZADA';
  }
  if(cfg.mode==='ranked'){
    const d=applyRanked(cfg.opp, win, stats);
    const rk=rankOf(SAVE.ranked.mmr);
    extra=`<div style="text-align:center;margin:14px 0">
      <div style="font-size:30px;font-weight:900;color:${d>0?'#5fd6a0':'#ff5f78'}">${d>0?'+':''}${d} PC</div>
      <div class="sub">${SAVE.ranked.mmr} PC · <span style="color:${rk.color}">${rk.kanji} ${rk.name}</span></div>
      ${SAVE.ranked.placements<5?`<div class="sub">Colocación ${SAVE.ranked.placements}/5</div>`:''}
    </div>`;
    ROSTER.forEach(c=>{ if(isUnlocked(c)&&!SAVE.unlocked[c]&&String(CHARS[c].unlock).startsWith('ranked'))
      { SAVE.unlocked[c]=true; unlocked.push(c); } });
  }
  if(M.net) M.net.reportResult(win);

  /* ---------------- Fragmentos y maestría ---------------- */
  const rw=computeRewards(cfg, win, stats);
  const gained=addCoins(rw.coins);
  SAVE.stats.coinsEarned=(SAVE.stats.coinsEarned||0)+gained;
  const mx=addXP(cfg.heroCid, rw.xp);
  const mp=masteryProgress(cfg.heroCid);
  if(mx.after>mx.before) setTimeout(()=>AU.play('levelup',null,{verb:0.45}), 700);
  setTimeout(()=>AU.play('coin'), 380);
  const rewardBlock=`
    <div class="panel" style="margin-top:12px;text-align:left">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div style="font-size:11px;letter-spacing:.14em;color:#8b8ba3">RECOMPENSAS</div>
        <div style="font-size:22px;font-weight:900;color:var(--gold)">+${gained.toLocaleString('es')} ${CUR.kanji}</div>
      </div>
      <div class="sub" style="font-size:10.5px;margin-top:6px">${rw.notes.join(' · ')}</div>
      <div class="row" style="justify-content:space-between;margin-top:12px;font-size:11.5px">
        <span>Maestría de ${CHARS[cfg.heroCid].name}</span>
        <b style="color:var(--gold)">${mx.after>mx.before?`Nivel ${mx.before} → ${mx.after}`:`Nivel ${mp.lv}`} · +${mx.amount} XP</b>
      </div>
      <div class="bar st" style="margin-top:4px;height:9px"><i style="width:${mp.p*100}%"></i></div>
      ${mx.gained.length?`<div style="margin-top:10px">${mx.gained.map(x=>
        `<div style="color:#f0c945;font-size:12px;font-weight:700">▲ NIVEL ${x.lv} — ${x.what}</div>`).join('')}</div>`:''}
    </div>`;

  /* títulos conseguidos con este combate: se anuncian en el resultado, no con
     un aviso flotante que taparía la pantalla */
  refreshTitles(true);
  const gotTitles = TITLES.filter(t=>SAVE.titles.owned[t.id] && !SAVE.titles.seen[t.id]);
  gotTitles.forEach(t=>SAVE.titles.seen[t.id]=1);
  ACC.flush();

  const finish=()=>{
    UI.screen='result'; clearUI(); stopMatch();
    const el=layer(`
      <div class="wrap" style="max-width:600px;text-align:center">
        <div style="font-size:44px;font-weight:900;letter-spacing:.2em;color:${col}">${title}</div>
        ${extra}
        ${rewardBlock}
        <div class="panel" style="margin-top:12px;text-align:left">
          <div class="kv"><span>Daño infligido</span><b>${Math.round(stats.dmg)}</b></div>
          <div class="kv"><span>Daño recibido</span><b>${Math.round(stats.taken)}</b></div>
          <div class="kv"><span>Flashes Negros</span><b>${stats.bf}</b></div>
          <div class="kv"><span>Duración</span><b>${stats.time.toFixed(1)} s</b></div>
        </div>
        ${gotTitles.length?`<div class="panel" style="margin-top:12px">
          <div style="font-size:11px;letter-spacing:.14em;color:#f0c945">${gotTitles.length>1?'TÍTULOS CONSEGUIDOS':'TÍTULO CONSEGUIDO'}</div>
          <div style="margin-top:9px">${gotTitles.map(t=>`
            <div class="row" style="align-items:center;gap:11px;justify-content:center;margin:5px 0">
              <div style="font-family:'Noto Serif JP',serif;font-size:24px;font-weight:900;color:${t.color}">${t.jp}</div>
              <div style="text-align:left"><div style="font-size:13px;font-weight:700;color:${t.color}">${t.name}</div>
                <div class="sub" style="font-size:10px">${t.desc}</div></div>
            </div>`).join('')}</div>
        </div>`:''}
        ${unlocked.length?`<div class="panel" style="margin-top:12px">
          <div style="font-size:11px;letter-spacing:.14em;color:#f0c945">DESBLOQUEADO</div>
          <div class="row" style="justify-content:center;gap:14px;margin-top:10px">
            ${unlocked.map(c=>`<div style="text-align:center"><div style="font-size:38px;color:${CHARS[c].color};
              font-family:'Noto Serif JP',serif">${CHARS[c].kanji}</div>
              <div style="font-size:11px">${CHARS[c].name}</div></div>`).join('')}
          </div></div>`:''}
        <div class="menu">
          <button class="btn" id="again">Reintentar</button>
          <button class="btn gold" id="toshop">Ir a la tienda</button>
          <button class="btn" id="back">Continuar</button>
        </div>
      </div>`);
    el.querySelector('#again').onclick=()=>{
      /* Reintentar una mision ya exorcizada no tiene sentido: si la ganaste,
         el boton lleva de vuelta a la ciudad. */
      if(cfg.mode==='openmission' && win && cfg.mission) startOpenWorld(cfg.mission.mapId);
      else startMatch(cfg);
    };
    el.querySelector('#toshop').onclick=()=>screenShop('mastery');
    el.querySelector('#back').onclick=()=>{
      if(cfg.mode==='story'&&win&&cfg.story.after){ dialogue(cfg.story.after, screenStory); }
      else if(cfg.mode==='story') screenStory();
      else if(cfg.mode==='ranked') screenRanked();
      /* Tras una mision se vuelve a la CIUDAD de la que saliste, no al menu:
         la mision es una excursion desde el mundo abierto, no un modo aparte.
         Al reentrar se reponen las marcas, asi que la que acabas de exorcizar
         ya no esta y ha aparecido otra en su lugar. */
      else if(cfg.mode==='openmission' && cfg.mission) startOpenWorld(cfg.mission.mapId);
      else if(cfg.mode==='open') screenWorld();
      else screenTitle();
    };
  };
  finish();
}


/* ========================================================================
   INTRO — 4 segundos, siempre, sin saltar.
   Lienzo 2D propio por encima de todo, con su bucle. Cuando acaba se borra
   solo y llama a seguir(), que es lo que arrancaba el juego antes.
   El sonido se sintetiza con el mismo motor de audio del juego (AU.osc y
   AU.noise sobre el bus de efectos), no hay ficheros que cargar.
   ==================================================================== */
function introEpica(seguir){
  /* RED DE SEGURIDAD. Si cualquier cosa de aqui dentro falla -- el audio, la
     fuente, el lienzo -- el juego NO se puede quedar en negro: se quita la
     capa y se entra al menu igual. Y por si algo se atasca sin lanzar error,
     hay ademas un temporizador que la remata pase lo que pase. */
  let cerrada=false;
  const NODOS_REF=[];
  const cerrar=(corta)=>{
    if(cerrada) return; cerrada=true;
    /* Si la intro se corta antes de tiempo (error o temporizador de rescate)
       hay sonido ya PROGRAMADO en el futuro que seguiria saliendo solo. Se
       para uno por uno. */
    if(corta) try{ NODOS_REF.forEach(n=>{ try{ n.stop(); }catch(e){} }); }catch(e){}
    try{ const c=document.getElementById('introcv'); if(c) c.remove(); }catch(e){}
    try{ const a=document.getElementById('introaviso'); if(a) a.remove(); }catch(e){}
    try{ if(AU.ok && AU.started) AU.musicStart('menu'); }catch(e){}
    try{ seguir(); }catch(e){ console.error(e); }
  };
  setTimeout(()=>cerrar(true), 20000);
  try{
  const cvI = document.createElement('canvas');
  cvI.id='introcv';
  cvI.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9999;background:#000;display:block';
  document.body.appendChild(cvI);
  const x = cvI.getContext('2d');
  let W=0,H=0,DPR=1;
  const medir=()=>{ DPR=Math.min(2, window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    cvI.width=Math.round(W*DPR); cvI.height=Math.round(H*DPR);
    x.setTransform(DPR,0,0,DPR,0,0); };
  medir(); window.addEventListener('resize', medir);

  /* ---------------------------- guion -------------------------------
     El truco para que el titulo sorprenda no es que aparezca fuerte, es
     el SILENCIO de antes. A los 2,85 s se corta todo de golpe -- fuego,
     brasas nuevas, sonido -- y quedan tres cuartos de segundo de negro
     absoluto con solo dos latidos. De ahi sale el golpe.
     ------------------------------------------------------------------ */
  const T_FUEGO=1.15, T_LLENO=2.25, T_CORTE=2.85, T_GOLPE=3.66,
        T_SALIDA=5.45, DUR=6.10;

  const BR=[];
  function brasa(px,py,fuerza){
    BR.push({ x:px, y:py, vx:(Math.random()-0.5)*46*fuerza,
      vy:-(38+Math.random()*130)*fuerza, r:0.7+Math.random()*2.6,
      v:0, vmax:0.45+Math.random()*1.4, c:Math.random() });
  }

  /* --------------------------- sonido ------------------------------- */
  const NODOS=NODOS_REF;                // todo lo que suene queda fichado aqui
  const O=(...a)=>{ try{ const n=AU.osc(...a);   if(n) NODOS.push(n); }catch(e){} };
  const N=(...a)=>{ try{ const n=AU.noise(...a); if(n) NODOS.push(n); }catch(e){} };
  let sonando=false;
  function suena(){ try{
    /* Ya NO se mira ctx.state aqui. Ese era el fallo por el que la intro salia
       muda: ctx.resume() es ASINCRONO, asi que en el instante justo despues de
       llamarlo el estado sigue siendo 'suspended' y esta linea abortaba el
       sonido entero. Ahora suena() solo se llama cuando la promesa de resume()
       ya ha resuelto, asi que si llega aqui es que el audio esta vivo. */
    if(sonando || !AU.ok || !AU.ctx) return;
    sonando=true;
    const t=AU.now()+0.02, S=AU.sfx, V=AU.sfxVerb||AU.sfx;

    /* 1. TENSION — SIN RUIDO.
       El siseo de aspersor venia de un lecho de ruido marron sonando dos
       segundos y medio y de veinticuatro chasquidos agudos encima. Fuera los
       dos. En su lugar, tres notas graves solapadas, cada una mas fuerte que
       la anterior: la envolvente de AU.osc decae sola, asi que la sensacion
       de que algo crece se consigue apilandolas, no alargando una. */
    [[0.00,0.15],[0.85,0.26],[1.62,0.42]].forEach(([off,pk])=>{
      O('sine', 36, 44, t+off, Math.max(0.3, T_CORTE-off-0.02), S, pk);
    });
    O('sine', 54, 66, t+0.55, T_CORTE-0.57, S, 0.13);   // la quinta, abre el acorde
    O('triangle', 108, 132, t+1.20, T_CORTE-1.22, S, 0.035);

    /* 2. EL FUEGO: un solo barrido GRAVE y corto. El de antes subia a 3400 Hz
       y por eso silbaba; este baja de 900 a 200. */
    N('burst', t+T_FUEGO, 0.50, S, 0.24, {type:'lowpass', f0:900, f1:200, q:0.9});
    O('sine', 88, 150, t+T_FUEGO, 0.80, S, 0.10, 'exp');

    /* 3. tres golpes de tambor, cada uno mas cerca y mas fuerte */
    for(let i=0;i<3;i++)
      O('sine', 124, 44, t+T_FUEGO+0.40+i*0.40, 0.32, S, 0.26+i*0.09, 'exp');

    /* 4. SILENCIO. Dos latidos y nada mas. */
    O('sine', 62, 38, t+T_CORTE+0.22, 0.24, S, 0.15, 'exp');
    O('sine', 62, 36, t+T_CORTE+0.56, 0.26, S, 0.21, 'exp');

    /* 5. EL GOLPE: percusion grave y campana. La onda cuadrada que caia hasta
       28 Hz era lo que sonaba a pedorreta -- una cuadrada por debajo de 40 Hz
       no da grave, da zumbido. Fuera. La campana son tres parciales
       inarmonicos (1, 2.76, 5.40), que es lo que le da el filo metalico. */
    O('sine', 190, 48, t+T_GOLPE, 1.05, S, 0.92, 'exp');
    N('burst', t+T_GOLPE, 0.26, S, 0.30, {type:'lowpass', f0:2800, f1:400, q:0.9});
    [1, 2.76, 5.40].forEach((r,i)=>
      O('sine', 233*r, 233*r, t+T_GOLPE+0.01, 2.6-i*0.55, S, 0.19/(i+1)));
    N('burst', t+T_GOLPE+0.02, 1.10, V, 0.24, {type:'bandpass', f0:1200, f1:300, q:0.9});

    /* 6. COLA: una nota grave sostenida que se apaga limpia. Nada de barridos
       hacia el infrasonido, que es de donde salia el ruido del final. */
    O('sine',  55,  55, t+T_GOLPE+0.30, 2.6, S, 0.24);
    O('sine', 110, 110, t+T_GOLPE+0.30, 2.1, S, 0.07);
    O('sine', 165, 165, t+T_GOLPE+0.45, 1.6, S, 0.030);
    }catch(e){ console.warn('intro sin sonido:', e); }
  }

  /* Politica de autoplay: el aviso SOLO sale si el navegador tiene el audio
     dormido. Empaquetado como app de escritorio no aparece nunca. */
  /* Despertar el audio de verdad. AU.resume() arranca ademas la musica del
     menu, que sonaria ENCIMA de la intro y se cargaria justo el silencio del
     que vive el golpe: se apaga aqui y se reanuda en cerrar(). */
  function despierta(){
    try{
      if(!AU.ok) AU.init();
      if(!AU.ctx) return Promise.resolve(false);
      const pr = AU.ctx.state==='running' ? Promise.resolve() : AU.ctx.resume();
      return Promise.resolve(pr).then(()=>{
        AU.started = true;
        try{ AU.musicStop(); }catch(e){}
        return AU.ctx.state==='running';
      }, ()=>false);
    }catch(e){ return Promise.resolve(false); }
  }
  let aviso=null;
  try{ if(!AU.ok) AU.init(); }catch(e){}
  if(!AU.ctx || AU.ctx.state!=='running'){
    aviso=document.createElement('div');
    aviso.id='introaviso';
    aviso.style.cssText='position:fixed;inset:0;z-index:10000;display:flex;align-items:center;'+
      'justify-content:center;flex-direction:column;gap:14px;background:#000;cursor:pointer;'+
      'font-family:Georgia,serif;color:#e9e2f2;letter-spacing:6px';
    aviso.innerHTML='<div style="font-size:52px;color:#ff7a2a;text-shadow:0 0 30px #ff5a10">黒閃</div>'+
      '<div style="font-size:12px;letter-spacing:5px;color:#7d7d96">PULSA PARA EMPEZAR</div>';
    document.body.appendChild(aviso);
    /* El reloj de la animacion NO arranca hasta que el audio esta vivo de
       verdad, para que imagen y sonido vayan clavados. */
    const arranca=()=>{
      despierta().then(()=>{
        if(aviso){ aviso.remove(); aviso=null; }
        t0=performance.now(); ult=t0; suena();
      });
    };
    aviso.addEventListener('pointerdown', arranca, {once:true});
    window.addEventListener('keydown', function k(){ if(aviso){ arranca(); }
      window.removeEventListener('keydown', k); });
  } else despierta().then(()=>{ t0=performance.now(); ult=t0; suena(); });

  /* ---------------------------- bucle -------------------------------- */
  let t0=performance.now(), ult=t0;
  function paso(){
   if(cerrada) return;
   try{
    const ahora=performance.now();
    let dt=(ahora-ult)/1000; ult=ahora;
    if(!(dt>0)||dt>0.1) dt=1/60;
    if(aviso){ requestAnimationFrame(paso); return; }
    const T=(ahora-t0)/1000;

    /* nivel del fuego: sube, se mantiene y DESAPARECE de golpe en el corte */
    let nivel=0;
    if(T>=T_FUEGO && T<T_CORTE) nivel=Math.min(1,(T-T_FUEGO)/(T_LLENO-T_FUEGO));
    const enSilencio = (T>=T_CORTE && T<T_GOLPE);
    const trasGolpe = Math.max(0, T-T_GOLPE);
    const golpe = T>=T_GOLPE;
    const salida = Math.max(0, Math.min(1,(T-T_SALIDA)/(DUR-T_SALIDA)));

    const sac = golpe ? Math.exp(-trasGolpe*6.5)*17 : 0;
    x.setTransform(DPR,0,0,DPR,0,0);
    if(sac>0.2) x.translate((Math.random()-0.5)*sac, (Math.random()-0.5)*sac);
    x.fillStyle='#000'; x.fillRect(-40,-40,W+80,H+80);

    /* --- resplandor --- */
    const baseY = H*(1.04 - nivel*0.52);
    if(nivel>0.001){
      const g=x.createRadialGradient(W/2, baseY+H*0.1, 0, W/2, baseY+H*0.1, H*0.95);
      g.addColorStop(0,'rgba(255,132,36,'+(0.42*nivel).toFixed(3)+')');
      g.addColorStop(0.45,'rgba(184,42,18,'+(0.20*nivel).toFixed(3)+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=g; x.fillRect(0,0,W,H);
    }

    /* --- lenguas de fuego --- */
    if(nivel>0.001){
      x.globalCompositeOperation='lighter';
      const capas=[[0.00,'#5c1206',1.00],[0.35,'#c23a10',0.72],[0.62,'#ff8a1e',0.42],[0.80,'#ffd88a',0.20]];
      for(const [off,col,esc] of capas){
        x.beginPath(); x.moveTo(-30,H+30);
        for(let px=-30; px<=W+30; px+=13){
          const f=px*0.011;
          const l = Math.sin(f + T*7.5)*0.5 + Math.sin(f*2.3 - T*5.1)*0.3 + Math.sin(f*0.6 + T*3.2)*0.2;
          x.lineTo(px, baseY - ((nivel*H*0.62*esc)*(0.62+0.55*l) + off*H*0.10));
        }
        x.lineTo(W+30,H+30); x.closePath();
        x.fillStyle=col; x.globalAlpha=0.55*nivel; x.fill();
      }
      x.globalAlpha=1; x.globalCompositeOperation='source-over';
    }

    /* --- brasas: en el silencio no nacen, solo se apagan las que quedan --- */
    if(nivel>0.05 && Math.random()<nivel*0.9) for(let i=0;i<3;i++)
      brasa(Math.random()*W, baseY-Math.random()*H*0.25*nivel, 0.7+nivel);
    if(golpe && trasGolpe<0.10) for(let i=0;i<120;i++)
      brasa(W/2+(Math.random()-0.5)*W*0.75, H*0.54, 2.6);
    x.globalCompositeOperation='lighter';
    for(let i=BR.length-1;i>=0;i--){
      const b=BR[i]; b.v+=dt;
      if(b.v>b.vmax){ BR.splice(i,1); continue; }
      b.x+=b.vx*dt + Math.sin(b.v*7+b.c*9)*13*dt; b.y+=b.vy*dt; b.vy*=0.985;
      const k=1-b.v/b.vmax;
      x.fillStyle = b.c<0.55 ? 'rgba(255,168,60,'+(k*0.9).toFixed(3)+')'
                             : 'rgba(255,236,190,'+(k*0.85).toFixed(3)+')';
      x.beginPath(); x.arc(b.x,b.y,b.r*k,0,6.283); x.fill();
    }
    x.globalCompositeOperation='source-over';

    /* --- kanji ardiendo, se apaga con el corte --- */
    if(!enSilencio && !golpe){
      const kA=Math.max(0,Math.min(1,(T-1.55)/0.55));
      if(kA>0.01){
        x.save(); x.globalAlpha=kA;
        x.textAlign='center'; x.textBaseline='middle';
        x.font='700 '+Math.round(Math.min(W,H)*0.30)+'px Georgia, serif';
        x.shadowColor='#ff5a10'; x.shadowBlur=60;
        x.fillStyle='rgba(255,150,50,0.92)';
        x.fillText('黒閃', W/2, H*0.46);
        x.restore();
      }
    }

    /* --- el silencio: negro y dos latidos que apenas se ven --- */
    if(enSilencio){
      for(const lat of [T_CORTE+0.22, T_CORTE+0.56]){
        const d=T-lat;
        if(d>0 && d<0.45){
          const k=Math.exp(-d*7);
          const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.85);
          g.addColorStop(0,'rgba(120,18,6,'+(0.20*k).toFixed(3)+')');
          g.addColorStop(1,'rgba(0,0,0,0)');
          x.fillStyle=g; x.fillRect(0,0,W,H);
        }
      }
    }

    /* --- destello del golpe --- */
    if(golpe && trasGolpe<0.6){
      x.fillStyle='rgba(255,246,230,'+(Math.exp(-trasGolpe*9)*0.97).toFixed(3)+')';
      x.fillRect(-40,-40,W+80,H+80);
    }

    /* --- titulo: entra de golpe, sin transicion previa --- */
    if(golpe){
      const e=Math.min(1, trasGolpe/0.22);
      const esc=1.85-0.85*(1-Math.pow(1-e,3));
      x.save();
      x.translate(W/2, H*0.47); x.scale(esc,esc);
      x.textAlign='center'; x.textBaseline='middle';
      const G=Math.min(W,H);
      x.globalAlpha=(1-salida);
      x.font='700 '+Math.round(G*0.085)+'px Georgia, serif';
      x.shadowColor='#ff6a18'; x.shadowBlur=34;
      x.fillStyle='#f4efff';
      x.fillText('JUJUTSU KAISEN', 0, -G*0.055);
      x.shadowBlur=54; x.shadowColor='#ff4a08';
      x.font='700 '+Math.round(G*0.155)+'px Georgia, serif';
      const gr=x.createLinearGradient(0,-G*0.09,0,G*0.06);
      gr.addColorStop(0,'#fff3df'); gr.addColorStop(0.5,'#ff9a2e'); gr.addColorStop(1,'#b8280a');
      x.fillStyle=gr;
      x.fillText('BLACKOUT', 0, G*0.035);
      x.shadowBlur=0; x.globalAlpha*=0.75;
      x.font='400 '+Math.round(G*0.030)+'px Georgia, serif';
      x.fillStyle='#8a7fa0';
      x.fillText('呪 術 廻 戦   —   黒 閃', 0, G*0.135);
      x.restore();
    }

    if(salida>0){ x.fillStyle='rgba(0,0,0,'+salida.toFixed(3)+')'; x.fillRect(-40,-40,W+80,H+80); }

    if(T<DUR) requestAnimationFrame(paso);
    else { try{ window.removeEventListener('resize', medir); }catch(e){} cerrar(); }
   }catch(e){ console.error('intro:', e); cerrar(true); }
  }
  requestAnimationFrame(paso);
  }catch(e){ console.error('intro:', e); cerrar(true); }
}

/* ------------------------------ ARRANQUE -------------------------------- */
(function boot(){
  const ok = R3.init(cv3);
  if(ok){ R3.resize(VW,VH); buildTextures(); }
  else console.warn('WebGL no disponible: se usa el renderizador 2D clásico.');
  ACC.boot();                 // recupera la última sesión si la hay
  if(!SAVE.stats.first) SAVE.stats.first=Date.now();
  applyPalette();
  refreshTitles(true);        // sin avisos: solo poner al día lo ya conseguido
  /* EL TUTORIAL SALE SIEMPRE AL ARRANCAR, salvo que haya una cuenta guardada.
     Antes bastaba con haberlo hecho o saltado UNA vez -- se recordaba incluso
     como invitado, con la marca 'jjk_tut' en disco -- asi que quien juega sin
     registrarse no volvia a verlo nunca. Ahora la unica condicion que lo
     silencia es tener sesion iniciada: si has guardado tu cuenta, se entiende
     que ya sabes jugar; si entras como invitado, se te ofrece cada vez.
     Sigue teniendo su boton de saltar bien visible. */
  const conCuenta = !!(typeof ACC!=='undefined' && ACC.user);
  introEpica(()=>{
    if(!conCuenta) screenTutorialIntro();
    else screenTitle();
  });
})();

</script>
