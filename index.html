       dominios de aqui arriba ya cierra al perdedor y con el se va su pared. */
    /* Rika pasa a ser estado de SIMULACION, no solo un efecto visual: si el
       golpe de Yuta depende de que ella este, tiene que salir de un dato que
       los dos clientes calculen igual. Dura dos minutos desde el dominio. */
    if(MODEL[f.cid] && MODEL[f.cid].rika) f.rikaT = 120;
    f.domX=f.x; f.domY=f.y; f.domTrap={};
    if(!D.noBarrier){
      for(const o of this.fighters){
        if(!o.alive) continue;
        if(dist(o.x,o.y,f.x,f.y) <= D.radius-o.r) f.domTrap[o.uid]=1;
      }
    }
    /* Pausa dramatica al abrir dominio. Vive DENTRO de step(), que es lo que
       la hace segura en linea: hitstop se descuenta con DT fijo y los dos
       clientes llegan al mismo numero. El contador de fotogramas sigue
       avanzando, asi que el lockstep no se descuadra. */
    /* El de Yuta es una escena de dos actos y necesita mas tiempo. Sale del
       id del dominio, que es un dato fijo, asi que los dos clientes de una
       partida en linea calculan la misma pausa. */
    this.shake=1.4; this.hitstop = (D.id==='authentic_mutual_love') ? 4.6 : 2.0;
    this.snd('domain', f.x, f.y, {v:0.6});
    this.ev('domain',f,D.name);
    this.addFX({type:'domainOpen',x:f.x,y:f.y,r:D.radius,c:f.C.color,life:1.0});

    if(D.id==='idle_death_gamble'){
      const p = Math.min(0.72, 1/239 + 0.052*f.chips);   // era 0,92 con 0,08/ficha
      const win = this.rng()<p;
      f.domData.jackpot = win;
      if(win){ f.domT=Math.max(f.domT, 4.183); f.chips=0;
        this.snd('jackpot', f.x, f.y, {v:0.5});
        this.ev('jackpot',f,'¡JACKPOT! 4:11'); }
      else this.ev('miss',f,'Sin premio...');
    }
    if(D.id==='deadly_sentencing'){
      const o=this.nearestEnemy(f);
      if(o){
        if(f.evidence>=9 && o.hp/o.maxhp<0.35){
          this.ev('sentence',f,'PENA DE MUERTE');
          this.damage(f,o,o.hp+9999,{type:'sentence',ignoreInfinity:true,pierceGuard:true});
        } else if(f.evidence>=6){
          this.ev('sentence',f,'CONFISCACIÓN');
          this.applyStatus(o,'confiscate',8); o.ce=0;
        } else { this.ev('sentence',f,'Pruebas insuficientes'); this.applyStatus(o,'slow',4); }
      }
    }
    if(D.burst){ // dominio en ráfaga (Mahito): barato y repetible, pero mucho menos daño
      f.cds.dom=9;
      for(const o of this.enemiesOf(f)) if(dist(f.x,f.y,o.x,o.y)<D.radius)
        this.damage(f,o,82,{type:'domain',ignoreInfinity:true,pierceGuard:true,status:{soulrot:5}});
    }
  }

  closeDomain(f){
    if(!f.domain) return;
    this.addFX({type:'domainClose',x:f.x,y:f.y,r:f.domain.radius,c:f.C.color,life:.6});
    this.snd('domainOff', f.x, f.y);
    f.domain=null; f.domT=0; f.domData={};
  }

  domainTick(f){
    const D=f.domain;
    // el dominio se ancla al lanzador
    const R=D.radius;
    for(const o of this.enemiesOf(f)){
      const inside = dist(f.x,f.y,o.x,o.y)<R;
      if(!inside) continue;
      const immune = o.status.simpleDomain || o.noCE;   // Dominio Simple / sin energía maldita
      if(immune){ if(this.frame%30===0) this.ev('negate',o,'Acierto garantizado anulado'); continue; }
      switch(D.id){
        case 'infinite_void':
          this.applyStatus(o,'paralysis',0.25);
          this.damage(f,o,12*DT,{type:'domain',silent:true,ignoreInfinity:true}); break;
        case 'malevolent_shrine':
          this.damage(f,o,60*DT,{type:'domain',silent:true,ignoreInfinity:true,pierceGuard:true});
          if(this.frame%10===0) this.addFX({type:'cut',x:o.x+(this.rng()-.5)*50,y:o.y+(this.rng()-.5)*50,life:.2});
          break;
        case 'soul_unleash':
          this.damage(f,o,42*DT,{type:'soul',silent:true,ignoreInfinity:true,pierceGuard:true});
          this.applyStatus(o,'soulcut',0.3); break;
        case 'chimera_shadow':
          this.damage(f,o,16*DT,{type:'domain',silent:true});
          if(this.frame%90===0){ const s=this.spawnFighter({cid:'curse_grunt',team:f.team,minion:true,
            pos:[f.x+(this.rng()-.5)*160,f.y+(this.rng()-.5)*160],lifetime:6,ai:{diff:.7,style:'rush'},tag:'dog'},0);
            s.C={...CHARS.curse_grunt,color:f.C.color,kanji:'玉'}; }
          break;
        case 'coffin_iron_mountain':
          this.damage(f,o,26*DT,{type:'burn',silent:true,ignoreInfinity:true});
          this.applyStatus(o,'slow',0.3); break;
        case 'authentic_mutual_love':
          this.damage(f,o,20*DT,{type:'domain',silent:true}); break;
        case 'profuse_womb':
          this.damage(f,o,34*DT,{type:'domain',silent:true,ignoreInfinity:true});
          this.applyStatus(o,'noRegen',0.3); break;
        case 'deadly_sentencing':
          // dentro del tribunal la violencia está prohibida
          this.applyStatus(o,'nullify',0.3);
          this.damage(f,o,26*DT,{type:'domain',silent:true,ignoreInfinity:true}); break;
        case 'self_embodiment': break;
        case 'ashen_treasury':
          this.damage(f,o,30*DT+(f.stolen||0)*0.02*DT,{type:'domain',silent:true,ignoreInfinity:true});
          this.applyStatus(o,'drain',0.3); break;
        case 'idle_death_gamble':
          if(f.domData.jackpot) this.damage(f,o,22*DT,{type:'domain',silent:true});
          break;
      }
    }
    // efectos sobre el propio lanzador
    if(D.id==='idle_death_gamble'&&f.domData.jackpot){ f.ce=f.maxce; f.hp=Math.min(f.maxhp,f.hp+38*DT); }   // era 70/s
    if(D.id==='authentic_mutual_love'){ for(const k of ['Q','E','R']) if(f.cds[k]>0) f.cds[k]-=DT*1.5;
      f.ce=Math.min(f.maxce,f.ce+22*DT); }
    if(D.id==='chimera_shadow'){ /* velocidad gestionada en mod() */ }
  }

  /* ------------------------- daño ------------------------- */
  damage(src, tgt, amount, o){
    o=o||{};
    if(!tgt.alive||amount<=0) return 0;
    /* el agua conduce: un golpe eléctrico en un charco alcanza a todos los
       que estén metidos en él, incluido quien lo lanzó si se descuida */
    if(o.elec && !o.chained){
      const pool=this.waterAt(tgt.x,tgt.y);
      if(pool){
        for(const o2 of this.fighters){
          if(!o2.alive || o2===tgt) continue;
          if(this.waterAt(o2.x,o2.y)!==pool) continue;
          this.damage(src, o2, amount*0.55, {...o, chained:true, kb:0});
          this.addFX({type:'spark', x:o2.x, y:o2.y, c:'#bfe4ff', life:.3});
        }
        this.addFX({type:'elecpool', x:pool.x+pool.w/2, y:pool.y+pool.h/2,
                    w:pool.w, h:pool.h, life:.5});
        this.snd('zap', tgt.x, tgt.y, {p:1.2});
      }
    }
    if(tgt.invuln>0 && !o.ignoreInvuln && o.type!=='burn' && o.type!=='poison' && o.type!=='self') return 0;

    // Infinito de Gojo
    if(tgt.C.passive.id==='infinity' && !o.ignoreInfinity && src && !src.noCE
       && tgt.cds.inf<=0 && tgt.ce>=18 && !tgt.status.nullify){
      tgt.ce-=18; tgt.cds.inf=0.85;
      this.addFX({type:'infinity',x:tgt.x,y:tgt.y,life:.3}); this.ev('infinity',tgt,'INFINITO');
      this.snd('infinity', tgt.x, tgt.y);
      return 0;
    }

    let dmg = amount;
    // modificadores del atacante
    if(src){
      dmg *= this.mod(src,'power');
      if(src.C.passive.id==='overtime' && (this.t>50 || src.hp/src.maxhp<0.50)) dmg*=1.30;
    if(src.C.passive.id==='cores' && src.usedOnce.core) dmg*=1.25;   // núcleo nuevo
    if(src.powMul && src.powMul!==1) dmg*=src.powMul;                // maldición anclada
    /* Con Rika manifestada, Yuta pega el DOBLE. Es la contrapartida de que
       ella ya no acompañe siempre: el dominio deja de ser solo un momento
       bonito y pasa a cambiar el combate. */
    if(src.rikaT>0) dmg*=2;
      if(src.status.ratioMark) {}
    }
    // marca de Nanami (7:3)
    if(tgt.status.ratio) dmg*=1.85;
    // marcas de Nobara
    if(tgt.marks>0 && src && src.cid==='nobara') dmg*=1+0.12*Math.min(4,tgt.marks);
    // congelado
    if(tgt.status.freeze) dmg*=1.25;
    // mojado + eléctrico
    if(o.elec && tgt.status.wet) dmg*=1.4;
    // Flash Negro
    /* x3 si fue perfecto, x2 si entro en la ventana amplia, y +12% por cada
       eslabon de la cadena hasta cuatro seguidos -- el record de la obra. */
    /* La racha se cortaba con CUALQUIER daño, y muchos no vienen de un rival:
       una quemadura, un veneno, la podredumbre, el coste en vida de una
       tecnica propia, el fuego de un barril. Ardiendo, la racha se reiniciaba
       SESENTA VECES POR SEGUNDO y era imposible llenarla.
       Solo la corta un golpe de un enemigo. */
    if(src && src.team!==tgt.team) tgt.bfStreak = 0;
    if(o.bf){
      dmg *= (o.bfPerfecto ? 3.0 : 2.0);
      if(src && src.bfChain) dmg *= 1 + 0.12*Math.min(4, src.bfChain);
    }
    // corte de alma: ignora mitigación
    const soulPierce = o.type==='soul'||o.pierceGuard;
    // guardia / refuerzo
    if(tgt.guarding && !soulPierce){
      dmg*=0.45;
      /* REPELIDO. Estrellarse contra una guardia devuelve el golpe: el
         atacante rebota y se queda quieto 0,75 s, lo que dura la animacion.
         Solo con golpes de contacto, y no encadenable: mientras dure el
         rebote no puede volver a dispararse. */
      if(src && src.alive && (o.type==='melee'||o.type==='dash') && !(src.repelT>0)){
        src.repelT = 0.75;
        /* El que bloquea acusa el golpe con un retroceso corto -- sin quedarse
           quieto, porque el castigo es para quien se estrella. Sin esto,
           bloquear no se sentia: al defensor no le pasaba nada en pantalla. */
        tgt.blockHit = 0.26;
        this.applyStatus(src,'stun',0.75);
        this.shake=Math.max(this.shake,0.55); this.hitstop=Math.max(this.hitstop,0.09);
        this.ev('repel', src, 'REPELIDO');
        this.snd('hit', src.x, src.y, {p:0.55});
        this.addFX({type:'bfring', x:tgt.x, y:tgt.y, life:.28});
      }
    }
    // reducción de daño de buffs
    if(!soulPierce){ const dr=this.modAdd(tgt,'dr'); dmg*= (1-clamp(dr,0,0.8)); }
    dmg *= tgt.C.dmgTaken||1;
    // adaptación de Mahoraga
    if(tgt.C.passive.id==='wheel'){
      const k=o.type||'x'; tgt.adaptWheel[k]=(tgt.adaptWheel[k]||0)+1;
      const n=tgt.adaptWheel[k];
      if(n>4) dmg*=Math.max(0.08,1-(n-4)*0.22);
    }
    // Diezmo del jefe
    if(tgt.C.passive.id==='tithe' && src){ /* gestionado en spend() */ }

    dmg=Math.max(1,dmg);
    tgt.hp-=dmg; tgt.dmgTaken+=dmg; tgt.lastHurt=this.t;
    if(src){ src.dmgDealt+=dmg; src.domGauge=clamp(src.domGauge+dmg*0.13*TUNE.domGain,0,100); }
    tgt.domGauge=clamp(tgt.domGauge+dmg*0.09*TUNE.domGain,0,100);

    // fichas de Hakari
    if(src && src.C.passive.id==='gambler' && o.type==='melee') src.chips=Math.min(12,src.chips+1);
    // pruebas de Higuruma
    if(tgt.C.passive.id==='prosecutor') tgt.evidence=Math.min(10,tgt.evidence+1);
    if(src && src.C.passive.id==='prosecutor' && src.tagJudge) src.evidence=Math.min(10,src.evidence+1);
    // veneno de Choso
    if(src && src.C.passive.id==='poison_blood'){
      const st=Math.min(3,(tgt.status.poison?tgt.status.poison.st:0)+1);
      this.applyStatus(tgt,'poison',4,{dps:12,st}); }
    // toque de Mahito
    if(src && src.C.passive.id==='idle_transfig' && o.type==='melee') this.applyStatus(tgt,'soulrot',4);
    // cuerpo volcánico
    if(src && o.type==='melee' && tgt.C.passive.id==='volcano') this.damage(null,src,8,{type:'burn',silent:true});
    // rayo: mojado
    if(src && src.C.passive.id==='frost' && o.type!=='burn'){}

    // estados aplicados
    if(o.status) for(const k in o.status) this.applyStatus(tgt,k,o.status[k]);
    if(o.burn) this.applyStatus(tgt,'burn',o.burn.dur,{dps:o.burn.dps});
    if(o.ab&&o.ab.delayed){ const dd=o.ab.delayed;
      this.schedule(dd.delay,()=>{ if(tgt.alive&&src&&src.alive)
        this.damage(src,tgt,dd.dmg,{type:'delayed'}); }); }

    // empuje
    if(o.kb&&src){ const a=Math.atan2(tgt.y-src.y,tgt.x-src.x);
      tgt.push={x:Math.cos(a)*o.kb*0.055,y:Math.sin(a)*o.kb*0.055}; }

    // Flash Negro: recompensas
    if(o.bf&&src){
      const perf=!!o.bfPerfecto;
      /* CADENA: encadenar Flashes Negros sube el bono. Se corta al fallar la
         ventana o al pasar cuatro segundos sin otro, no al recibir un golpe:
         castigar eso convertiria la mecanica en algo que solo funciona si vas
         ganando. Cuatro es el maximo, que es el record de la obra. */
      if(this.t - (src.bfLast||-99) < 4.0) src.bfChain=Math.min(4,(src.bfChain||0)+1);
      else src.bfChain=0;
      src.bfLast=this.t;
      src.ce=Math.min(src.maxce, src.ce + (perf?32:20)); src.bfCount++;
      src.buffs.push({t:8,mods:{power:perf?1.30:1.18},name:'Comprensión'});
      src.domGauge=clamp(src.domGauge+(perf?20:12)*TUNE.domGain,0,100);
      this.shake=perf?1.7:1.2; this.hitstop=perf?0.19:0.13;
      this.addFX({type:'blackflash',x:tgt.x,y:tgt.y,life:.55});
      this.snd('blackflash', tgt.x, tgt.y, {v:perf?1.0:0.8});
      this.ev('blackflash',src,
        (perf?'FLASH NEGRO PERFECTO':'FLASH NEGRO')+
        (src.bfChain?' ×'+(src.bfChain+1):''));
    } else if(!o.silent){
      this.addFX({type:'hit',x:tgt.x,y:tgt.y,c:'#fff',life:.2});
      this.snd(o.elec?'zap':'hit', tgt.x, tgt.y, {p:clamp(dmg/55,0.5,1.9)});
      this.hitstop=Math.max(this.hitstop, dmg>60?0.05:0.02);
    }
    if(!o.silent) this.addFX({type:'dmgnum',x:tgt.x,y:tgt.y-24,v:Math.round(dmg),bf:!!o.bf,life:.8});

    // pasiva de Kenjaku
    /* ======================= FASES DE JEFE ==========================
       Todos los enemigos usaban el mismo cerebro con cuatro estilos, asi que
       un jefe se comportaba igual con toda la vida que con un hilo. Ahora un
       jefe cambia dos veces: al 55% y al 22%. Sube dano, aguante y agresividad,
       se limpia de estados y se anuncia. Vive en la simulacion y sale solo de
       la vida, que es un dato que los dos clientes comparten.            */
    if(tgt.isBoss && tgt.alive){
      const fr = tgt.hp/tgt.maxhp;
      if(fr<=0.55 && (tgt.phase||0)<1){
        tgt.phase=1; tgt.status={};
        tgt.buffs.push({t:9999, mods:{power:1.26, speed:1.10, dr:0.12}, name:'Segunda fase'});
        this.shake=1.5; this.hitstop=0.22;
        this.ev('phase', tgt, 'SEGUNDA FASE');
        this.snd('domain', tgt.x, tgt.y, {v:0.45});
        this.addFX({type:'burst',x:tgt.x,y:tgt.y,c:tgt.C.color,r:170,life:.8});
      } else if(fr<=0.22 && (tgt.phase||0)<2){
        tgt.phase=2; tgt.status={};
        tgt.buffs.push({t:9999, mods:{power:1.34, speed:1.16}, name:'Última fase'});
        tgt.domGauge=Math.max(tgt.domGauge, 92);   // le queda una carta
        this.shake=1.9; this.hitstop=0.28;
        this.ev('phase', tgt, 'ÚLTIMA FASE');
        this.snd('domain', tgt.x, tgt.y, {v:0.6});
        this.addFX({type:'burst',x:tgt.x,y:tgt.y,c:'#ff3f5c',r:220,life:1.0});
      }
    }

    /* Tres Nucleos: el primer nucleo que revienta no lo mata, lo cambia. */
    if(tgt.hp<=tgt.maxhp*0.20 && tgt.C.passive.id==='cores' && !tgt.usedOnce.core){
      tgt.usedOnce.core=true; tgt.hp+=Math.round(300*TUNE.hp); tgt.status={};
      this.ev('core',tgt,'NÚCLEO ROTO'); this.snd('domain',tgt.x,tgt.y,{v:0.4});
      this.addFX({type:'burst',x:tgt.x,y:tgt.y,c:'#e3ddcc',r:140,life:.7}); }

    if(tgt.hp<=tgt.maxhp*0.25 && tgt.C.passive.id==='brain_swap' && !tgt.usedOnce.swap){
      tgt.usedOnce.swap=true; tgt.hp+=220; tgt.status={};
      this.ev('swap',tgt,'TRASPLANTE'); this.addFX({type:'burst',x:tgt.x,y:tgt.y,c:'#a06be0',r:120,life:.7}); }

    if(tgt.hp<=0){ tgt.hp=0; tgt.alive=false; tgt.deathT=this.t;
      if(src)src.kills++;
      this.closeDomain(tgt);
      this.addFX({type:'death',x:tgt.x,y:tgt.y,c:tgt.C.color,life:1.0});
      this.snd('death', tgt.x, tgt.y, {p:tgt.minion?0.6:1.2});
      this.shake=Math.max(this.shake,1.0);
      if(!tgt.minion) this.ev('down',tgt,tgt.name+' ha caído'); }
    return dmg;
  }

  applyStatus(f,k,t,extra){
    /* Blindaje contra estados ETERNOS. Si una habilidad olvida declarar la
       duracion, t llega como undefined; al multiplicarlo se vuelve NaN, y
       NaN-DT sigue siendo NaN mientras NaN<=0 es falso, asi que el estado no
       caducaba JAMAS. Le paso al incendio del escenario: ardias hasta morir.
       Con esto, un olvido futuro produce un estado corto, no uno infinito. */
    if(!isFinite(t)) t = 2.0;
    if(k==='freeze' && !f.status.freeze) this.snd('ice', f.x, f.y);
    if(k==='soulcut'&&f.C.passive.id==='wheel') t*=0.5;
    /* Un unico punto para acortar los efectos continuos: da igual que vengan
       de una habilidad, de una pasiva o de un barril del escenario. */
    if(k==='burn'||k==='poison'||k==='soulrot') t*=TUNE.dotDur;
    const cur=f.status[k];
    f.status[k]=Object.assign({t:Math.max(cur?cur.t:0,t)},extra||{});
  }

  /* ------------------------- energía maldita ------------------------- */
  canSpend(f,c){ return f.ce>=c; }
  spend(f,c){
    if(c<=0) return true;
    if(f.ce<c) return false;
    f.ce-=c; f.ceSpent+=c;
    if(f.noCE) return true;   // el vigor no es energía maldita: nadie puede recaudarlo
    // Diezmo: el jefe roba el 10% de todo lo gastado
    for(const o of this.fighters){
      if(o.alive&&o.team!==f.team&&o.C.passive.id==='tithe'){
        const steal=c*0.10; o.stolen=(o.stolen||0)+steal;
        o.ce=Math.min(o.maxce,o.ce+steal); o.hp=Math.min(o.maxhp,o.hp+steal*0.8);
        if(o.domain&&o.domain.id==='ashen_treasury'){ o.ce=Math.min(o.maxce,o.ce+c*0.3); o.stolen+=c*0.3; }
      } }
    return true;
  }

  mod(f,key,base){
    let v=base!==undefined?base:1;
    for(const b of f.buffs) if(b.mods&&b.mods[key]!==undefined) v*=b.mods[key];
    if(key==='speed'&&f.domain&&f.domain.id==='chimera_shadow') v*=1.45;
    if(key==='power'&&f.domain&&f.domain.id==='authentic_mutual_love') v*=1.35;
    if(key==='ceRegen'&&f.domain&&f.domain.id==='authentic_mutual_love') v*=3;
    if(key==='power'&&f.status.weaken) v*=0.7;
    return v;
  }
  modAdd(f,key){ let v=0; for(const b of f.buffs) if(b.mods&&b.mods[key]!==undefined) v+=b.mods[key]; return v; }

  passiveTick(f){
    const P=f.C.passive;
    /* 9/s era demasiado con las peleas ya alargadas: la regeneracion es plana
       y no depende de la energia maldita, asi que al bajar el ritmo general se
       comia una fraccion cada vez mayor del dano entrante. A 6/s sigue siendo
       su identidad (aguante) sin volverlo inmatable. */
    if(P.id==='idle_transfig'){ if(this.t-(f.lastHurt||0)>4) f.hp=Math.min(f.maxhp,f.hp+4*DT); }
    if(P.id==='frost'){ let n=0; for(const o of this.enemiesOf(f)) if(o.status.freeze)n++;
      if(n) f.ce=Math.min(f.maxce,f.ce+6*n*DT); }
    if(P.id==='overtime'&&this.t>50) f.ceRegen=f.C.ceRegen*1.25;
    const tile=this.tileAt(f.x,f.y);
    if(tile==='water') this.applyStatus(f,'wet',1.2);
    if(tile==='hazard') this.damage(null,f,18*DT,{type:'burn',silent:true});
    /* raíl electrificado: quema por contacto y aturde a intervalos */
    if(tile==='rail'){
      this.damage(null,f,26*DT,{type:'elec',silent:true,elec:true});
      if(this.frame%34===0){
        this.applyStatus(f,'stun',0.16);
        this.addFX({type:'spark',x:f.x,y:f.y,c:'#bfe4ff',life:.24});
        this.snd('zap', f.x, f.y, {p:0.7});
      }
    }
  }

  /* ------------------------- colisión ------------------------- */
  /* ¿Cuánto se solapa este círculo con un muro sólido, y hacia dónde hay que
     empujarlo para sacarlo? Devuelve el vector mínimo de separación del muro
     MÁS hundido, o null si está limpio. Consulta pura, no toca nada. */
  wallPush(x,y,r){
    let bd=-1, bx=0, by=0;
    for(const w of this.walls){
      if(w.dead||w.soft) continue;
      if(w.t==='water'||w.t==='hazard'||w.t==='rail') continue;
      const ox = Math.min(x+r, w.x+w.w) - Math.max(x-r, w.x);
      if(ox<=0) continue;
      const oy = Math.min(y+r, w.y+w.h) - Math.max(y-r, w.y);
      if(oy<=0) continue;
      /* se sale por el lado más cercano: el eje de menor solape */
      let d, dx=0, dy=0;
      if(ox<oy){ d=ox; dx = (x < w.x+w.w*0.5) ? -ox : ox; }
      else     { d=oy; dy = (y < w.y+w.h*0.5) ? -oy : oy; }
      if(d>bd){ bd=d; bx=dx; by=dy; }
    }
    return bd<0 ? null : [bx,by,bd];
  }

  /* Saca a un luchador de dentro de la geometría. Sin esto, cualquier cosa que
     nazca encima de él (los cascotes de un muro derribado, el hueco que deja un
     suelo que cede, la explanada de un edificio que se desploma) lo dejaba
     atrapado PARA SIEMPRE: todos los destinos posibles estaban dentro del muro,
     así que moveWithCollision los rechazaba todos y no volvía a moverse. */
  depenetrate(f){
    for(let it=0; it<6; it++){
      const p=this.wallPush(f.x,f.y,f.r);
      if(!p) return true;
      f.x += p[0]*1.05; f.y += p[1]*1.05;
      f.x=clamp(f.x,f.r+4,this.map.w-f.r-4);
      f.y=clamp(f.y,f.r+4,this.map.h-f.r-4);
    }
    /* sigue encerrado (un patio cerrado de cascotes): se le reubica en el hueco
       libre más cercano. Es un teletransporte de medio metro, no un atajo. */
    if(this.hitWall(f.x,f.y,f.r)){
      const d=this.findFree(f.x,f.y,f.r);
      if(d[0]!==f.x || d[1]!==f.y){
        f.x=d[0]; f.y=d[1]; f.vx=0; f.vy=0;
        this.addFX({type:'spark',x:f.x,y:f.y,c:'#cfd6e4',life:.22});
      }
      return false;
    }
    return true;
  }

  /* Aparta a todo el que esté dentro de un rectángulo recién creado. Se llama
     ANTES de meter cascotes o un socavón en this.walls. */
  evictFrom(rx,ry,rw,rh){
    for(const o of this.fighters){
      if(!o.alive) continue;
      if(o.x+o.r<=rx || o.x-o.r>=rx+rw || o.y+o.r<=ry || o.y-o.r>=ry+rh) continue;
      /* empuje hacia el borde más cercano del rectángulo */
      const dl=o.x-rx, dr=rx+rw-o.x, dt=o.y-ry, db=ry+rh-o.y;
      const m=Math.min(dl,dr,dt,db);
      if(m===dl)      o.x = rx-o.r-2;
      else if(m===dr) o.x = rx+rw+o.r+2;
      else if(m===dt) o.y = ry-o.r-2;
      else            o.y = ry+rh+o.r+2;
      o.x=clamp(o.x,o.r+4,this.map.w-o.r-4);
      o.y=clamp(o.y,o.r+4,this.map.h-o.r-4);
      this.depenetrate(o);
    }
  }

  /* Un intento de desplazamiento por ejes separados: permite deslizarse a lo
     largo de una pared en vez de clavarse en ella. */
  slide(f,dx,dy,k){
    if(dx){ const nx=f.x+dx; const w=this.hitWall(nx,f.y,f.r);
            if(!w) f.x=nx; else if(k) this.scrape(f,w,nx,f.y,k); }
    if(dy){ const ny=f.y+dy; const w=this.hitWall(f.x,ny,f.r);
            if(!w) f.y=ny; else if(k) this.scrape(f,w,f.x,ny,k); }
  }

  /* Chocar contra algo endeble (papelera, farola, boca de riego, bidón, caja)
     lo revienta en vez de frenarte en seco. Cuanto más rápido vas, antes cede.
     Así el atrezo pequeño se ve, tapa un instante y nunca te deja encallado. */
  scrape(f,w,x,y,k){
    if(!w.frag || !isFinite(w.hp)) return;
    const spd=Math.hypot(f.vx,f.vy);
    this.damageWall(w, (90 + spd*0.5)*DT*k, x, y, f);
  }

  /* Pared del dominio. Vive en step(), con DT fijo, sin azar y sin leer nada
     del cliente, asi que los dos extremos de una partida en linea calculan
     exactamente la misma barrera. Tras empujar se llama a depenetrate para no
     reabrir el viejo fallo de quedarse encajado dentro de un muro.         */
  confineToDomain(f){
    for(const o of this.fighters){
      if(!o.domain || !o.alive || o.domain.noBarrier) continue;
      if(!o.domTrap || !o.domTrap[f.uid]) continue;
      const R = o.domain.radius - f.r;
      if(R<=0) continue;
      const dx=f.x-o.domX, dy=f.y-o.domY, d=Math.hypot(dx,dy);
      if(d>R && d>1e-4){
        const nx=dx/d, ny=dy/d;
        f.x=o.domX+nx*R; f.y=o.domY+ny*R;
        const vn=f.vx*nx+f.vy*ny;      // frena solo la componente contra la pared
        if(vn>0){ f.vx-=nx*vn; f.vy-=ny*vn; }
        this.depenetrate(f);
      }
    }
  }

  moveWithCollision(f){
    /* Barrido por tramos: a 980 px/s la esquiva avanza 16 px por fotograma y un
       único test de destino puede saltarse una esquina entera. Se parte el
       desplazamiento en pasos nunca mayores que medio radio. */
    const dx=f.vx*DT, dy=f.vy*DT;
    const len=Math.hypot(dx,dy);
    const steps=Math.min(6, Math.max(1, Math.ceil(len/(f.r*0.5))));
    for(let i=0;i<steps;i++) this.slide(f, dx/steps, dy/steps, 1/steps);

    f.x=clamp(f.x,f.r+4,this.map.w-f.r-4);
    f.y=clamp(f.y,f.r+4,this.map.h-f.r-4);

    /* separación entre luchadores: ahora respeta los muros. Antes empujaba a
       ciegas y dos personajes apretados contra una pared se enterraban en ella
       hasta 16 px, o sea casi todo el cuerpo. */
    for(const o of this.fighters){
      if(o===f||!o.alive) continue;
      const d=dist(f.x,f.y,o.x,o.y), md=f.r+o.r;
      if(d<md&&d>0.01){ const a=Math.atan2(f.y-o.y,f.x-o.x), push=(md-d)*0.5;
        this.slide(f, Math.cos(a)*push, Math.sin(a)*push); }
    }
    /* red de seguridad: si algo lo ha metido dentro de la geometría, sale */
    this.depenetrate(f);
  }

  /* ---------- navegación: rejilla + campo de distancias (BFS) ---------- */
  ensureGrid(){
    if(this.grid && !this.gridDirty) return;
    const CELL=40;
    this.cell=CELL;
    this.cols=Math.ceil(this.map.w/CELL); this.rows=Math.ceil(this.map.h/CELL);
    const g=new Uint8Array(this.cols*this.rows);
    for(let cy=0;cy<this.rows;cy++) for(let cx=0;cx<this.cols;cx++){
      const x=cx*CELL+CELL/2, y=cy*CELL+CELL/2;
      g[cy*this.cols+cx]=this.hitWall(x,y,17)?1:0;
    }
    this.grid=g; this.gridDirty=false; this.flow=null; this.flowKey=-1;
  }
  flowTo(tx,ty){
    this.ensureGrid();
    const C=this.cell;
    const gx=clamp(Math.floor(tx/C),0,this.cols-1), gy=clamp(Math.floor(ty/C),0,this.rows-1);
    const key=gy*this.cols+gx;
    if(this.flow && this.flowKey===key && this.frame-this.flowFrame<24) return this.flow;
    const N=this.cols*this.rows, d=new Int32Array(N).fill(-1);
    let start=key;
    if(this.grid[start]){ // objetivo dentro de un muro: buscar celda libre cercana
      for(let rad=1;rad<8&&this.grid[start];rad++){
        for(let dy=-rad;dy<=rad;dy++) for(let dx=-rad;dx<=rad;dx++){
          const nx=gx+dx, ny=gy+dy;
          if(nx<0||ny<0||nx>=this.cols||ny>=this.rows) continue;
          if(!this.grid[ny*this.cols+nx]){ start=ny*this.cols+nx; dy=rad; dx=rad; break; }
        } }
    }
    if(this.grid[start]) return null;
    const q=new Int32Array(N); let qh=0,qt=0;
    q[qt++]=start; d[start]=0;
    while(qh<qt){
      const c=q[qh++], cx=c%this.cols, cy=(c/this.cols)|0, nd=d[c]+1;
      for(let k=0;k<4;k++){
        const nx=cx+(k===0?1:k===1?-1:0), ny=cy+(k===2?1:k===3?-1:0);
        if(nx<0||ny<0||nx>=this.cols||ny>=this.rows) continue;
        const ni=ny*this.cols+nx;
        if(this.grid[ni]||d[ni]>=0) continue;
        d[ni]=nd; q[qt++]=ni;
      }
    }
    this.flow=d; this.flowKey=key; this.flowFrame=this.frame;
    return d;
  }
  flowAngle(field, x, y){
    if(!field) return null;
    const C=this.cell;
    const cx=clamp(Math.floor(x/C),0,this.cols-1), cy=clamp(Math.floor(y/C),0,this.rows-1);
    const here=field[cy*this.cols+cx];
    if(here<0) return null;
    let best=here, ba=null;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=this.cols||ny>=this.rows) continue;
      const ni=ny*this.cols+nx, v=field[ni];
      if(v<0) continue;
      if(dx&&dy){ if(this.grid[cy*this.cols+nx]||this.grid[ny*this.cols+cx]) continue; }
      if(v<best){ best=v; ba=Math.atan2((ny*C+C/2)-y,(nx*C+C/2)-x); }
    }
    return ba;
  }

  /* Consulta pura: NUNCA daña nada. Antes restaba vida a los muros
     destructibles aquí dentro, y como los chequeos de línea de visión de la IA
     pasan por esta misma función, los edificios se deshacían solos con solo
     mirarlos. El daño vive ahora en damageWall(), y se llama a mano. */
  hitWall(x,y,r,proj){
    for(const w of this.walls){
      if(w.dead||w.soft) continue;
      if(w.t==='water'||w.t==='hazard'||w.t==='rail') continue;   // se pisan, no se chocan
      if(proj && w.t==='low') continue;
      if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return w;
    }
    return null;
  }

  /* Barrido exacto de un cuadrado de lado 2r que va de (x1,y1) a (x2,y2).
     Por Minkowski equivale a un PUNTO contra el muro engordado en r, así que
     basta el test de rebanadas de toda la vida: sin muestreo, sin agujeros y
     más barato que comprobar ocho posiciones sueltas. Antes se comprobaba sólo
     el destino, y un proyectil que rozaba la esquina de un edificio a mitad de
     trayecto la atravesaba sin enterarse. */
  sweepWall(x1,y1,x2,y2,r,proj){
    const dx=x2-x1, dy=y2-y1;
    let bt=2, bw=null;
    for(const w of this.walls){
      if(w.dead||w.soft) continue;
      if(w.t==='water'||w.t==='hazard'||w.t==='rail') continue;
      if(proj && w.t==='low') continue;
      const mnx=w.x-r, mxx=w.x+w.w+r, mny=w.y-r, mxy=w.y+w.h+r;
      let t0=0, t1=1;
      if(dx===0){ if(x1<=mnx||x1>=mxx) continue; }
      else { let a=(mnx-x1)/dx, b2=(mxx-x1)/dx; if(a>b2){const s=a;a=b2;b2=s;}
             if(a>t0) t0=a; if(b2<t1) t1=b2; if(t0>t1) continue; }
      if(dy===0){ if(y1<=mny||y1>=mxy) continue; }
      else { let a=(mny-y1)/dy, b2=(mxy-y1)/dy; if(a>b2){const s=a;a=b2;b2=s;}
             if(a>t0) t0=a; if(b2<t1) t1=b2; if(t0>t1) continue; }
      if(t0<bt){ bt=t0; bw=w; }
    }
    return bw ? {w:bw, t:bt, x:x1+dx*bt, y:y1+dy*bt} : null;
  }

  /* ===================== ROTURA ===================== */
  /* amt es daño real: un puñetazo raspa, un Hueco Púrpura abre un boquete. */
  damageWall(w, amt, x, y, src){
    if(!w || w.dead || w.collapse || !isFinite(w.hp) || amt<=0) return 0;
    w.hp -= amt;
    const st = clamp(Math.floor((1 - w.hp/w.maxhp)*4), 0, 3);
    if(st > w.stage){
      w.stage = st;
      this.addFX({type:'wallcrack', x:x!==undefined?x:w.x+w.w/2, y:y!==undefined?y:w.y+w.h/2,
                  st, life:0.4});
      this.snd('wallcrack', x, y, {p:0.72+st*0.16});
    }
    if(w.hp<=0) this.breakWall(w, x, y, src);
    return amt;
  }

  /* daña todos los muros dentro de un radio (explosiones, dominios, barridos) */
  damageWallsIn(x, y, r, amt, src){
    for(let i=this.walls.length-1;i>=0;i--){
      const w=this.walls[i];
      if(w.dead||!isFinite(w.hp)) continue;
      const cx=clamp(x, w.x, w.x+w.w), cy=clamp(y, w.y, w.y+w.h);
      const d=Math.hypot(x-cx, y-cy);
      if(d>r) continue;
      this.damageWall(w, amt*(1-0.55*(d/r)), cx, cy, src);
    }
  }

  breakWall(w, x, y, src){
    if(w.t==='tower'){ this.startCollapse(w, src); return; }
    w.dead = true; w.stage = 4; this.gridDirty = true;
    const cx=w.x+w.w/2, cy=w.y+w.h/2;
    if(w.prop!==undefined && this.props[w.prop]) this.props[w.prop].dead=true;
    /* suelo que cede: donde estaba la plancha queda un vacío */
    if(w.t==='weak'){
      /* quien estuviera de pie encima se cae al borde: si no, el socavón nace
         debajo de sus pies y se queda dentro del agujero sin salida */
      for(const o of this.fighters){
        if(!o.alive) continue;
        if(o.x>w.x-o.r && o.x<w.x+w.w+o.r && o.y>w.y-o.r && o.y<w.y+w.h+o.r)
          this.damage(src||null, o, 22, {type:'debris'});
      }
      this.evictFrom(w.x, w.y, w.w, w.h);
      this.walls.push({ x:w.x, y:w.y, w:w.w, h:w.h, t:'pit', hh:0, mat:'',
        hp:Infinity, maxhp:Infinity, dead:false, stage:0, collapse:0, shed:0 });
      this.addFX({type:'wallbreak', x:cx, y:cy, w:w.w, h:w.h, mat:w.mat||'', life:1.1});
      this.snd('wallbreak', cx, cy, {p:1.2});
      this.shake=Math.max(this.shake,0.6);
      this.ev('wall', src, 'El suelo se ha hundido');
      return;
    }
    /* lo que arde, arde: barriles y madera dejan un incendio */
    if(w.burn){
      this.zones.push({ kind:'aoe', x:cx, y:cy, r:64+w.burn*34, t:0, delay:0.04,
        life:4.5+w.burn, done:false, src:null,
        ab:{ dmg:16*w.burn, kb:150, burn:{dps:15*w.burn, dur:2.5} } });
    }
    /* lo que queda en pie: un montón de cascotes en el centro, cobertura baja.
       Se abre paso por los lados, que es justo la gracia de tirar un muro. */
    if(w.w*w.h > 11000 && !w.noRubble){
      const rw=Math.max(46, w.w*0.42), rh=Math.max(46, w.h*0.42);
      this.evictFrom(cx-rw/2, cy-rh/2, rw, rh);
      this.walls.push({ x:cx-rw/2, y:cy-rh/2, w:rw, h:rh,
        t:'low', rubble:true, mat:w.mat, hp:Infinity, maxhp:Infinity,
        dead:false, stage:0, collapse:0, shed:0 });
    }
    this.addFX({type:'wallbreak', x:cx, y:cy, w:w.w, h:w.h, mat:w.mat||'', life:1.1});
    this.snd('wallbreak', cx, cy, {p:clamp(Math.max(w.w,w.h)/220, 0.7, 1.6)});
    this.shake = Math.max(this.shake, clamp(Math.max(w.w,w.h)/340, 0.25, 0.85));
    /* quien esté pegado al muro se lleva la esquirla */
    for(const o of this.fighters){
      if(!o.alive) continue;
      const px=clamp(o.x, w.x, w.x+w.w), py=clamp(o.y, w.y, w.y+w.h);
      if(dist(o.x,o.y,px,py) < o.r+46){
        this.damage(src||null, o, 26, {type:'debris', kb:190});
      }
    }
    this.ev('wall', src, 'Estructura derribada');
  }

  /* ------- colapso de un edificio entero, por fases ------- */
  startCollapse(w, src){
    if(w.collapse) return;
    w.collapse = 1e-4;                 // >0 marca "cayendo"
    w.collapseBy = src ? src.uid : -1;
    this.gridDirty = true;
    this.addFX({type:'collapseStart', x:w.x+w.w/2, y:w.y+w.h/2, w:w.w, h:w.h, mat:w.mat||'', life:1.6});
    this.snd('collapse', w.x+w.w/2, w.y+w.h/2);
    this.shake = Math.max(this.shake, 1.0);
    this.ev('wall', src, 'El edificio se viene abajo');
  }
  stepCollapse(){
    for(let i=this.walls.length-1;i>=0;i--){
      const w=this.walls[i];
      if(!w.collapse || w.dead) continue;
      const before=w.collapse;
      w.collapse += DT;
      /* durante la caída aplasta lo que haya debajo y alrededor */
      if(w.collapse<1.5){
        const pad = 30 + w.collapse*90;
        for(const o of this.fighters){
          if(!o.alive) continue;
          if(o.x>w.x-pad && o.x<w.x+w.w+pad && o.y>w.y-pad && o.y<w.y+w.h+pad){
            if(this.frame%8===0){
              const a=Math.atan2(o.y-(w.y+w.h/2), o.x-(w.x+w.w/2));
              this.damage(null, o, 34, {type:'debris', kb:260, ang:a});
              this.applyStatus(o,'stun',0.25);
            }
          }
        }
        if(this.frame%9===0) this.shake=Math.max(this.shake,0.55);
      }
      if(before<0.55 && w.collapse>=0.55) this.snd('wallbreak', w.x+w.w/2, w.y+w.h/2, {p:0.65});
      if(w.collapse>=1.6){
        /* lo que queda: una explanada de cascotes que sirve de cobertura */
        w.dead=true; this.gridDirty=true;
        this.evictFrom(w.x+w.w*0.10, w.y+w.h*0.10, w.w*0.80, w.h*0.80);
        this.walls.push({ x:w.x+w.w*0.10, y:w.y+w.h*0.10, w:w.w*0.80, h:w.h*0.80,
          t:'low', rubble:true, mat:w.mat, hp:Infinity, maxhp:Infinity,
          dead:false, stage:0, collapse:0, shed:0 });
        this.addFX({type:'wallbreak', x:w.x+w.w/2, y:w.y+w.h/2, w:w.w*1.3, h:w.h*1.3,
                    mat:w.mat||'', big:1, life:1.6});
        this.snd('collapseEnd', w.x+w.w/2, w.y+w.h/2);
        this.shake=Math.max(this.shake,1.2);
      }
    }
  }
  tileAt(x,y){
    for(const w of this.walls){ if(w.dead) continue;
      if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h&&(w.t==='water'||w.t==='hazard'||w.t==='rail')) return w.t; }
    return null;
  }
  /* charco de agua que contiene un punto (para la descarga eléctrica) */
  waterAt(x,y){
    for(const w of this.walls){ if(w.dead||w.t!=='water') continue;
      if(x>w.x-6&&x<w.x+w.w+6&&y>w.y-6&&y<w.y+w.h+6) return w; }
    return null;
  }
  los(x1,y1,x2,y2){
    const d=dist(x1,y1,x2,y2), steps=Math.ceil(d/14);
    for(let i=1;i<steps;i++){ const t=i/steps;
      if(this.hitWall(x1+(x2-x1)*t, y1+(y2-y1)*t, 3, true)) return false; }
    return true;
  }

  /* ------------------------- efectos y eventos ------------------------- */
  addFX(o){ o.t=0; this.fx.push(o); if(this.fx.length>420) this.fx.shift(); }
  stepFX(){ for(let i=this.fx.length-1;i>=0;i--){ const e=this.fx[i]; e.t+=DT;
    if(e.type==='dmgnum'){ e.y-=26*DT; }
    if(e.t>=e.life) this.fx.splice(i,1); } }
  puff(x,y,c){ this.addFX({type:'burst',x,y,c,r:40,life:.35}); }
  ev(kind,f,msg){ this.events.push({kind,name:f?f.name:'',msg,t:this.t}); if(this.events.length>60) this.events.shift(); }
}

const UNIT_KANJI={dog:'玉',isomer:'異',curse:'呪',judge:'判'};
/* color sonoro por hechicero */
const ELEM={ jogo:'fire', uraume:'ice', kashimo:'elec', choso:'blood', yuji:'blood',
             sukuna:'fire', gojo:'void', kenjaku:'void', mahito:'flesh' };

/* ============================== IA ====================================== */
function makeAI(cfg){
  const diff = clamp((cfg.diff!==undefined?cfg.diff:0.7)*TUNE.aiSkill, 0, 1);   // 0..1
  const style = cfg.style||'balanced';
  let state='approach', tState=0, reaction=0, strafeDir=1, wander=0;
  let lastX=0,lastY=0,stuckT=0,unstickT=0,unstickA=0;
  return {
    cfg,
    think(g,f){
      const inp=blankInput();
      const tgt=g.nearestEnemy(f);
      tState-=DT; reaction-=DT;
      if(!tgt){ return inp; }

      /* un jefe herido apunta mejor, reacciona antes y encadena mas: la fase
         no solo le sube numeros, le cambia la cabeza */
      const fase = f.phase||0;
      const d=dist(f.x,f.y,tgt.x,tgt.y);
      const a=Math.atan2(tgt.y-f.y,tgt.x-f.x);
      /* Antes, a dificultad alta, (1-diff) tendia a 0 y la IA apuntaba con
         precision perfecta. Ahora hay un error minimo irreducible. */
      const err=((1-diff)*0.85+0.055)*(1-fase*0.28)*(g.rng()-0.5);
      inp.aim=a+err;
      inp.tx=tgt.x; inp.ty=tgt.y;

      // rango preferido según el personaje
      const rt=f.C.rangeType||'Corto';
      let want = rt.startsWith('Corto')?95 : rt.startsWith('Medio')?230 : rt.startsWith('Largo')?350 : 170;
      if(style==='rush') want=Math.min(want,90);
      if(style==='zoner') want=Math.max(want,300);
      if(style==='turtle') want=Math.max(want,200);

      // huir y curarse (solo si de verdad hay margen: curarse bajo fuego es una trampa)
      const lowHP = f.hp/f.maxhp < 0.28;
      const healDist = rt.startsWith('Corto') ? 470 : 340;
      if(lowHP && !f.noCE && f.ce>=58 && d>healDist && diff>0.4){ inp.rct=true; want=Math.max(want,d); }

      // movimiento
      if(tState<=0){ tState=0.5+g.rng()*0.7; strafeDir=g.rng()<0.5?-1:1; wander=(g.rng()-0.5)*0.7; }
      let mvA;
      if(d>want+40){
        mvA=a+wander*0.5;
        if(d>150 || !g.los(f.x,f.y,tgt.x,tgt.y)){
          const fa=g.flowAngle(g.flowTo(tgt.x,tgt.y), f.x, f.y);
          if(fa!==null) mvA=fa;
        }
      }
      else if(d<want-50) mvA=a+Math.PI+wander*0.5;
      else mvA=a+Math.PI/2*strafeDir;

      /* Detección de atasco. Antes esperaba 1,1 s y luego salía en una
         dirección AL AZAR, que la mitad de las veces era otra vez contra el
         muro: se veía al personaje frotándose la esquina segundo y medio.
         Ahora reacciona en medio segundo y elige un rumbo que de verdad esté
         despejado, en abanico a partir del que quería seguir. */
      stuckT+=DT;
      if(stuckT>=0.4){
        /* condición precisa: lleva medio segundo sin avanzar Y tiene geometría
           delante. Antes exigía además que el objetivo estuviera lejos, así que
           un enemigo cercano al otro lado de un murete lo dejaba frotándose la
           pared indefinidamente. */
        if(dist(f.x,f.y,lastX,lastY)<22 &&
           g.sweepWall(f.x,f.y, f.x+Math.cos(mvA)*46, f.y+Math.sin(mvA)*46, f.r+3)){
          unstickT=0.5; unstickA=mvA+Math.PI; let uc=-1;
          for(const dv of [1.05,-1.05,1.6,-1.6,2.2,-2.2,Math.PI]){
            const c=mvA+dv;
            const h=g.sweepWall(f.x,f.y, f.x+Math.cos(c)*90, f.y+Math.sin(c)*90, f.r+2);
            if(!h){ unstickA=c; break; }
            if(h.t>uc){ uc=h.t; unstickA=c; }
          }
        }
        lastX=f.x; lastY=f.y; stuckT=0;
      }
      if(unstickT>0){ unstickT-=DT; mvA=unstickA; }

      // salir de una zona de efecto telegrafiada
      let fleeZone=null;
      for(const z of g.zones){
        if(z.done||z.kind!=='aoe'||!z.src||z.src.team===f.team) continue;
        const dz=dist(f.x,f.y,z.x,z.y);
        if(dz<z.r+26 && g.rng()<0.55+diff*0.45){ fleeZone=z; break; }
      }
      if(fleeZone){
        const az=Math.atan2(f.y-fleeZone.y, f.x-fleeZone.x);
        mvA=az;
        if(f.cds.dash<=0 && g.rng()<0.10+diff*0.12) inp.dash=true;
      }

      // navegación: elegir la menor desviación libre (lookahead)
      /* Se prueba el rumbo deseado y desviaciones cada vez mayores, y se coge
         el PRIMERO que esté despejado de verdad (barrido, no sólo el punto de
         llegada). Si ninguno lo está se coge el de MÁS HOLGURA, nunca media
         vuelta: dar media vuelta al topar creaba un vaivén infinito en los
         pasillos estrechos y dejaba combates sin resolver. */
      const LA=56, sgn=strafeDir;
      let bestA=null, bestClear=-1, bestFallback=mvA;
      const devs=[0];
      for(const k of [0.35,0.7,1.05,1.45,1.9,2.4,Math.PI]){ devs.push(k*sgn, -k*sgn); }
      for(const dv of devs){
        const c=mvA+dv;
        const hit=g.sweepWall(f.x,f.y, f.x+Math.cos(c)*LA, f.y+Math.sin(c)*LA, f.r+2);
        if(!hit){ bestA=c; break; }
        const clear=hit.t*LA - Math.abs(dv)*7;      // penaliza desviarse mucho
        if(clear>bestClear){ bestClear=clear; bestFallback=c; }
      }
      if(bestA===null) bestA=bestFallback;
      inp.ax=Math.cos(bestA); inp.ay=Math.sin(bestA);

      // esquivar proyectiles entrantes
      if(diff>0.35){
        for(const p of g.projectiles){
          if(p.team===f.team) continue;
          if(dist(p.x,p.y,f.x,f.y)>230) continue;
          const pa=Math.atan2(p.vy,p.vx), toMe=Math.atan2(f.y-p.y,f.x-p.x);
          if(Math.abs(angDiff(pa,toMe))<0.32){
            if(g.rng()<diff*0.14){ inp.dash=true;
              inp.ax=Math.cos(pa+Math.PI/2); inp.ay=Math.sin(pa+Math.PI/2); }
            break; }
        }
      }

      // cierre agresivo de distancia (personajes de corto alcance)
      if(rt.startsWith('Corto') && d>want+55 && f.cds.dash<=0 && f.ce>=12
         && g.los(f.x,f.y,tgt.x,tgt.y) && g.rng()<0.16+diff*0.16){
        inp.dash=true; inp.ax=Math.cos(a); inp.ay=Math.sin(a);
      }

      // guardia
      /* Bloqueaba el 2% de los fotogramas y solo a bocajarro: en la practica
         no bloqueaba nunca, asi que el rebote contra la guardia no llegaba a
         verse jamas atacando a la IA. */
      if(diff>0.32 && !f.noCE && f.ce>22 && d<170 && g.rng()<0.042*(0.5+diff)) inp.guard=true;

      // atacar
      const basicRange=(f.C.basic.proj?300:f.C.basic.range+22);
      if(d<basicRange && f.cds.basic<=0 && reaction<=0 && f.ce>=Math.max(f.C.basic.cost||0, IA_COSTE_BASICO)){
        inp.basic=true; reaction=(1-diff)*0.28*(1-fase*0.30);
        // intento de Flash Negro
        /* El Flash Negro multiplica el dano por 2,5. Que la IA lo clavara casi
           una de cada dos veces es lo que mas la hacia sentir injusta: es la
           mecanica de habilidad del jugador, no un pasivo del rival. */
        if(g.rng()<0.05+diff*0.20) g.schedule(0.13,()=>{ if(f.alive) f.bfPending=true; });
      }
      if(f.bfPending){ inp.bf=true; f.bfPending=false; }

      // habilidades
      const abs=f.C.abilities;
      for(let i=0;i<abs.length;i++){
        const ab=abs[i], k=['Q','E','R'][i];
        if(!ab||f.cds[k]>0||f.ce<(ab.cost||0)) continue;
        if(f.locks&&f.locks[k]) continue;
        let ok=false;
        if(ab.type==='melee'||ab.type==='special') ok = d < (ab.range||ab.maxRange||130)+40;
        else if(ab.type==='dash') ok = d>110 && d<(ab.dist||250)+80;
        else if(ab.type==='projectile') ok = d<520 && g.los(f.x,f.y,tgt.x,tgt.y);
        else if(ab.type==='beam') ok = d<(ab.length||600) && Math.abs(angDiff(a,f.ang))<0.3;
        else if(ab.type==='aoe') ok = d<(ab.maxRange||ab.radius+120);
        else if(ab.type==='buff') ok = d<400;
        else if(ab.type==='summon') ok = true;
        if(ab.requires) ok = ok && ab.requires.every(r=>f.comboFlags[r]);
        if(ok && g.rng()<((0.030+diff*0.075)*(1+fase*0.55))){ inp[['q','e','r'][i]]=true; break; }
      }

      // dominio
      if(f.C.domain && f.domGauge>=100 && !f.domain && !(f.locks&&f.locks.dom) && d<f.C.domain.radius*0.8 && g.rng()<0.05*(0.4+diff))
        inp.dom=true;

      return inp;
    }
  };
}

/* ---- estadísticas: plantilla única, para crear y para migrar ---- */
function blankStats(){
  return { matches:0, wins:0, losses:0, bf:0, domains:0, dmg:0, taken:0, heal:0,
           kills:0, coinsEarned:0, time:0, bestBF:0, bestDmg:0, noHitWins:0,
           copies:0, byChar:{}, first:0, last:0 };
}
function charStat(cid){
  const b=SAVE.stats.byChar || (SAVE.stats.byChar={});
  return b[cid] || (b[cid]={ matches:0, wins:0, dmg:0, bf:0, domains:0, time:0 });
}

const SAVE = {
  v:3,
  name:'Hechicero',         // nombre que se enseña en el perfil
  story:{},                 // { missionId: {done:true, rank:'S', best:sec} }
  unlocked:{},              // desbloqueados por historia / rango / compra
  owned:{},                 // comprados con Fragmentos
  coins:600,                // Fragmentos (呪片)
  xp:{},                    // XP de maestría por personaje
  upg:{},                   // mejoras permanentes de cuenta
  main:'yuji',              // personaje equipado: el que sale en el perfil
  cosmetics:{ aura:'none', palette:'crimson' },
  cosOwned:{ aura:{none:1}, palette:{crimson:1} },
  ranked:{ mmr:0, placements:0, wins:0, losses:0, streak:0, best:0, bestStreak:0,
           history:[], season:1 },
  stats:{ matches:0, wins:0, losses:0, bf:0, domains:0, dmg:0, taken:0, heal:0,
          kills:0, coinsEarned:0, time:0, bestBF:0, bestDmg:0, noHitWins:0,
          copies:0, byChar:{}, first:0, last:0 },
  titles:{ owned:{}, equipped:'iniciado', seen:{} },
  tutorial:{ done:false, at:0 },
  settings:{ shake:true, dmgNum:true, aiDiff:0.7, invertY:false, sens:100,
             vol:{sfx:1.0, mus:0.55}, muted:false, quality:1, post:true, menu3d:true }
};

function isUnlocked(cid){
  const c=CHARS[cid]; if(!c) return false;
  if(c.unlock===0) return true;
  if(c.unlock==='never') return false;
  if(SAVE.unlocked[cid]||SAVE.owned[cid]) return true;
  const [kind,val]=String(c.unlock).split(':');
  if(kind==='story') return !!(SAVE.story['m'+val]&&SAVE.story['m'+val].done);
  if(kind==='ranked') return RANK_INDEX(SAVE.ranked.mmr)>=parseInt(val,10);
  return false;
}
/* ¿se puede comprar en la tienda aunque no cumplas el requisito? Sí: dos vías. */
function unlockReason(cid){
  const c=CHARS[cid]; if(!c||c.unlock===0) return '';
  if(c.unlock==='never') return 'No jugable';
  const [kind,val]=String(c.unlock).split(':');
  if(kind==='story') return 'Completa la misión '+val+' de Historia, o cómpralo';
  if(kind==='ranked') return 'Alcanza '+RANKS[parseInt(val,10)].name+' en clasificatoria, o cómpralo';
  return '';
}
function exportSave(){ return btoa(unescape(encodeURIComponent(JSON.stringify(SAVE)))); }
/* Rellena los huecos de un guardado antiguo con los valores nuevos.
   Se usa igual al importar un código que al cargar una cuenta del disco. */
function migrateSave(o){
  const d={ name:'Hechicero', owned:{}, coins:600, xp:{}, upg:{}, main:'yuji',
            cosmetics:{aura:'none',palette:'crimson'},
            cosOwned:{aura:{none:1},palette:{crimson:1}},
            titles:{owned:{},equipped:'iniciado',seen:{}},
            tutorial:{done:false,at:0} };
  for(const k in d) if(o[k]===undefined) o[k]=d[k];
  const st=blankStats();
  if(!o.stats) o.stats=st;
  else for(const k in st) if(o.stats[k]===undefined) o.stats[k]=st[k];
  if(!o.titles.owned) o.titles.owned={};
  if(!o.titles.seen)  o.titles.seen={};
  if(!o.titles.equipped) o.titles.equipped='iniciado';
  if(o.ranked && o.ranked.bestStreak===undefined) o.ranked.bestStreak=Math.max(0,o.ranked.streak||0);
  if(o.settings && o.settings.menu3d===undefined) o.settings.menu3d=true;
  o.v=3;
  return o;
}
function importSave(code){
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(o&&o.v){
      migrateSave(o);
      Object.assign(SAVE,o);
      if(typeof applyPalette==='function') applyPalette();
      if(typeof refreshTitles==='function') refreshTitles(true);

}
