/* ========================= CIVILES DE FONDO ==============================
   Gente andando por la ciudad. Vive ENTERAMENTE EN EL CLIENTE, igual que las
   particulas: no esta en g.fighters, no entra en stateChecksum, no toca
   g.rng ni step(). Si borraras este bloque la partida simularia exactamente
   igual, y por eso no puede desincronizar una partida en linea.
   Se mantienen alrededor de la camara y se reciclan al alejarse, asi que un
   mapa gigante cuesta lo mismo que uno pequeño.                          */
/* ======================= MUNDO ABIERTO: MISIONES =========================
   Cada mision es una marca de energia maldita en la pared de un edificio.
   Se generan de forma DETERMINISTA a partir del mapa (misma semilla, mismas
   misiones), asi que dos jugadores del mismo mundo ven lo mismo y el guardado
   puede recordar cuales estan hechas por su indice.                        */
/* Catalogo de maldiciones ancladas. Antes solo habia cinco entradas y el
   techo era el nivel 7: la ciudad se quedaba corta enseguida. Ahora hay doce,
   con formas y grados muy distintos, y el techo sube al 14. */
const CURSE_POOL = [
  { cid:'curse_grunt',   nom:'Residuo de grado 4',      base:1 },
  { cid:'curse_grunt',   nom:'Espectro de grado 3',     base:2 },
  { cid:'transfigured',  nom:'Humano transfigurado',    base:2 },
  { cid:'transfigured',  nom:'Molde de alma retorcida', base:3 },
  { cid:'curse_special', nom:'Maldición de grado 2',    base:4 },
  { cid:'curse_special', nom:'Maldición de grado 1',    base:5 },
  { cid:'mahito',        nom:'Espectro registrado',     base:6 },
  { cid:'jogo',          nom:'Vestigio volcánico',      base:7 },
  { cid:'choso',         nom:'Pintura maldita',         base:7 },
  { cid:'uraume',        nom:'Servidor de la era Heian',base:8 },
  { cid:'kashimo',       nom:'Reencarnado del Culling', base:9 },
  { cid:'mahoraga',      nom:'General de la rueda',     base:11 }
];
const MISION_HIST = [
  'Los vecinos dejaron de usar el portal hace nueve días. Dicen que el ascensor se para solo en una planta que no existe.',
  'Un aula entera soñó lo mismo durante una semana. Al octavo día uno no despertó.',
  'La energía maldita se acumula donde alguien fue humillado a diario durante años. Esta oficina lleva veinte.',
  'Aquí hubo un accidente que los periódicos llamaron negligencia. Los que quedaron lo llamaron otra cosa.',
  'El local cerró en tres semanas. Nadie recuerda haber entrado nunca, pero todos recuerdan la puerta.',
  'Un residuo se alimenta del rencor de una escalera de vecinos. Ha aprendido sus nombres.',
  'La marca está a la altura de los ojos de un niño. Eso ya dice bastante.',
  'Alguien selló esto mal, deprisa y sin registrarlo. El sello aguantó doce años.'
];
const MIS_ACTIVAS = 14;
/* Una mision cualquiera, deducida SOLO de su indice: la nº 0 es siempre la
   misma, y la nº 350 tambien. Asi hay misiones infinitas sin guardar ninguna
   lista: basta con recordar cuales estan hechas. */
function makeMission(mapId, k){
  const map=MAPS[mapId]; if(!map || !map.grid) return null;
  const rnd=mulberry32(((mapId==='tokyo_city'?0x0BEB:0x0CAF) + k*2654435761)>>>0);
  const edif=map.walls.filter(w=>(w.t==='tall'||w.t==='destr') && w.hh>0);
  if(!edif.length) return null;
  {
    const idx=Math.floor(rnd()*edif.length);
    const w=edif[idx];
    /* cara del edificio donde se pinta la marca */
    const cara=Math.floor(rnd()*4);
    const mx = cara===0 ? w.x-6 : cara===1 ? w.x+w.w+6 : w.x+w.w*0.5;
    const my = cara===2 ? w.y-6 : cara===3 ? w.y+w.h+6 : w.y+w.h*0.5;
    const p  = CURSE_POOL[Math.min(CURSE_POOL.length-1, Math.floor(rnd()*CURSE_POOL.length))];
    const lvl= p.base + Math.floor(rnd()*3);                 // 1..13
    const hpMul  = +(0.55 + lvl*0.20 + rnd()*0.25).toFixed(2);
    const powMul = +(0.70 + lvl*0.11 + rnd()*0.15).toFixed(2);
    const spdMul = +(0.82 + lvl*0.045 + rnd()*0.12).toFixed(2);
    const peso   = hpMul*0.9 + powMul*1.25 + spdMul*0.6;
    return {
      i:k, mapId, x:mx, y:my, cara, wall:idx,
      cid:p.cid, nom:p.nom, lvl, hpMul, powMul, spdMul,
      coins: Math.round(150 + peso*135),
      xp:    Math.round(60  + peso*72),
      hist:  MISION_HIST[Math.floor(rnd()*MISION_HIST.length)],
      arena: null
    };
  }
}

/* Las MIS_ACTIVAS primeras que sigan sin hacer. Al exorcizar una, la siguiente
   del catalogo ocupa su hueco: siempre hay catorce marcas en la ciudad. */
function openMissions(mapId){
  const out=[];
  for(let k=0; k<4000 && out.length<MIS_ACTIVAS; k++){
    if(SAVE.open && SAVE.open[mapId+':'+k]) continue;
    const m=makeMission(mapId,k);
    if(m) out.push(m);
  }
  return out;
}
function misionesHechas(mapId){
  if(!SAVE.open) return 0;
  return Object.keys(SAVE.open).filter(k=>k.indexOf(mapId+':')===0).length;
}
/* clave de guardado: mundo + indice */
function misionHecha(m){ return !!(SAVE.open && SAVE.open[m.mapId+':'+m.i]); }
function marcarMision(m){ if(!SAVE.open) SAVE.open={}; SAVE.open[m.mapId+':'+m.i]=1;
  if(typeof ACC!=='undefined') ACC.touch(); }
/* Repone el tablero: la marca exorcizada deja sitio a una nueva. */
function refrescarMisiones(){
  if(M.cfg && M.cfg.mode==='open') M.missions = openMissions(M.cfg.mapId);
}

/* ==================== RESIDUOS POR LA CALLE ==============================
   Entre marca y marca la ciudad estaba muerta: solo se caminaba. Estos son
   posos de energia maldita que se acumulan en las esquinas; al pasar por
   encima los absorbes y te devuelven energia y unos pocos Fragmentos.
   Viven en el CLIENTE y solo existen en mundo abierto, que es de un jugador:
   no entran en stateChecksum ni pueden desincronizar nada.               */
const MOTES = {
  list:[], mapId:null, rnd:mulberry32(0x51F0|0), cupo:14,

  sitio(g,f){
    const G=g.map.grid; if(!G) return null;
    const paso=G.cell+G.street, m=G.street/2, eje=m-G.street*0.18;
    for(let k=0;k<18;k++){
      const horiz=this.rnd()<0.5, lado=this.rnd()<0.5?1:-1;
      let x,y;
      if(horiz){
        y = G.oy + Math.floor(this.rnd()*(G.rows+1))*paso - m + lado*eje;
        x = f.x + (this.rnd()-0.5)*1500;
      } else {
        x = G.ox + Math.floor(this.rnd()*(G.cols+1))*paso - m + lado*eje;
        y = f.y + (this.rnd()-0.5)*1500;
      }
      if(x<90||y<90||x>g.map.w-90||y>g.map.h-90) continue;
      if(g.hitWall(x,y,18)) continue;
      if(dist2(x,y,f.x,f.y) < 260*260) continue;      // no a los pies
      return { x, y, ph:this.rnd()*TAU };
    }
    return null;
  },

  update(g, dt){
    if(!M.cfg || M.cfg.mode!=='open' || !g.map.grid){ this.list.length=0; return; }
    const f=M.hero; if(!f) return;
    if(this.mapId!==g.mapId){ this.mapId=g.mapId; this.list.length=0; }
    while(this.list.length<this.cupo){ const p=this.sitio(g,f); if(!p) break; this.list.push(p); }
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.ph += dt*2.2;
      if(dist2(p.x,p.y,f.x,f.y) < 62*62){
        f.ce = Math.min(f.maxce, f.ce + f.maxce*0.16);
        const g2 = addCoins(9);
        SAVE.stats.coinsEarned=(SAVE.stats.coinsEarned||0)+g2;
        if(typeof AU!=='undefined' && AU.ok) AU.play('coin');
        PS.spawn && PS.spawn({x:p.x,y:p.y,c:'#a06be0'});
        const nn=this.sitio(g,f); if(nn) this.list[i]=nn; else this.list.splice(i,1);
      } else if(dist2(p.x,p.y,f.x,f.y) > 1700*1700){
        const nn=this.sitio(g,f); if(nn) this.list[i]=nn; else this.list.splice(i,1);
      }
    }
  },

  draw(g){
    if(!this.list.length) return;
    for(const p of this.list){
      const x=w3(p.x), z=w3(p.y);
      if(!visible(x,z,1)) continue;
      const y=0.75+Math.sin(p.ph)*0.16;
      R3.draw('sph', x, y, z, 0.42,0.42,0.42, p.ph, [0.62,0.34,0.86], {alpha:0.9, add:true, emis:1.6});
      R3.draw('sph', x, y, z, 1.05,1.05,1.05, 0, [0.62,0.34,0.86], {alpha:0.22, add:true, cullFront:true});
      R3.draw('disc', x, 0.05, z, 1.5, 1, 1.5, 0, [0.62,0.34,0.86], {alpha:0.18, add:true});
    }
  }
};

const CIV = {
  list:[], mapId:null, rnd:mulberry32(0xC17E5|0),
  cupo(){ const q=(typeof SAVE!=='undefined'&&SAVE.settings.quality)||1;
          return Math.round(30*clamp(q,0.5,1.2)); },

  /* --------- carriles de acera, deducidos de la reticula del mapa ---------
     Una acera es la franja de calle pegada a los edificios. Como la reticula
     es conocida, no hace falta buscar sitio: se anda POR el carril y por
     construccion nunca se pisa un edificio.                               */
  /* El carril coincide con el EJE DE LA ACERA, no con el de la calzada:
     antes andaban por mitad de la carretera. */
  carrilX(G,i,lado){ const m=G.street/2; return G.ox + i*(G.cell+G.street) - m + lado*(m-G.street*0.18); },
  carrilY(G,j,lado){ const m=G.street/2; return G.oy + j*(G.cell+G.street) - m + lado*(m-G.street*0.18); },

  nuevo(g,f){
    const G=g.map.grid; if(!G) return null;
    for(let k=0;k<20;k++){
      const eje  = this.rnd()<0.5 ? 'h' : 'v';
      const lado = this.rnd()<0.5 ? 1 : -1;
      let x,y,idx;
      if(eje==='h'){
        idx = Math.floor(this.rnd()*(G.rows+1));
        y   = this.carrilY(G, idx, lado);
        x   = f.x + (this.rnd()-0.5)*1700;
      } else {
        idx = Math.floor(this.rnd()*(G.cols+1));
        x   = this.carrilX(G, idx, lado);
        y   = f.y + (this.rnd()-0.5)*1700;
      }
      if(x<80||y<80||x>g.map.w-80||y>g.map.h-80) continue;
      if(g.hitWall(x,y,16)) continue;
      const t=this.rnd();
      return { x, y, eje, idx, lado, dir:this.rnd()<0.5?1:-1,
               spd:46+this.rnd()*26, ph:this.rnd()*TAU,
               /* La media de estatura del plantel es 1,03 (de 0,96 de Nobara
                  a 1,10 de Gojo): los civiles se centran ahi para que midan
                  exactamente lo mismo que un hechicero. */
               alto:0.98+this.rnd()*0.12, corp:0.90+this.rnd()*0.22,
               huir:0,
               ropa: t<0.32?[0.15,0.16,0.21] : t<0.58?[0.27,0.22,0.24]
                   : t<0.78?[0.19,0.25,0.31] : [0.33,0.29,0.23],
               piel:[0.80+this.rnd()*0.13, 0.66+this.rnd()*0.11, 0.55+this.rnd()*0.11],
               /* cara de trollface: blanca de tebeo, no tono de piel */
               cara:[0.93+this.rnd()*0.05, 0.91+this.rnd()*0.05, 0.87+this.rnd()*0.05],
               pelo:[0.07+this.rnd()*0.08, 0.06+this.rnd()*0.06, 0.07+this.rnd()*0.07] };
    }
    return null;
  },

  update(g, dt){
    /* bajo el velo la calle se vacia: la gente ya no esta */
    if(!g || !g.map || !g.map.civ || !g.map.grid || g.veil){ this.list.length=0; return; }
    const f = M.hero; if(!f) return;
    if(this.mapId!==g.mapId){ this.mapId=g.mapId; this.list.length=0; }
    dt = Math.min(0.05, dt);
    const G=g.map.grid, cupo=this.cupo();
    while(this.list.length<cupo){ const c=this.nuevo(g,f); if(!c) break; this.list.push(c); }

    for(let i=this.list.length-1;i>=0;i--){
      const c=this.list[i];
      if(dist2(c.x,c.y,f.x,f.y) > 1600*1600){
        const nn=this.nuevo(g,f); if(nn) this.list[i]=nn; else this.list.splice(i,1);
        continue;
      }
      /* huir de los hechiceros: no son gente normal */
      let dmin=1e9, cerca=null;
      for(const o of g.fighters){ if(!o.alive) continue;
        const d=dist2(o.x,o.y,c.x,c.y); if(d<dmin){ dmin=d; cerca=o; } }
      if(cerca && dmin < 340*340){
        c.huir=1;
        const s=(c.eje==='h') ? (c.x-cerca.x) : (c.y-cerca.y);
        c.dir = s>=0 ? 1 : -1;
      } else c.huir = Math.max(0, c.huir-dt*0.7);

      const v=c.spd*(1+c.huir*1.7);
      if(c.eje==='h'){ c.x += c.dir*v*dt; c.y = this.carrilY(G,c.idx,c.lado); }
      else           { c.y += c.dir*v*dt; c.x = this.carrilX(G,c.idx,c.lado); }
      c.ph += v*dt*0.085;

      /* borde del mapa o edificio atravesado en el carril: media vuelta */
      if(c.x<80||c.y<80||c.x>g.map.w-80||c.y>g.map.h-80 || g.hitWall(c.x,c.y,15)) c.dir=-c.dir;
      /* de vez en cuando dobla la esquina y cambia de acera */
      if(!c.huir && this.rnd()<0.004){
        if(c.eje==='h'){ c.eje='v'; c.idx=Math.round((c.x-G.ox)/(G.cell+G.street)); }
        else           { c.eje='h'; c.idx=Math.round((c.y-G.oy)/(G.cell+G.street)); }
        c.lado = this.rnd()<0.5?1:-1;
        c.dir  = this.rnd()<0.5?1:-1;
      }
    }
  },

  draw(g){
    if(!g.map.civ || !this.list.length) return;
    for(const c of this.list){
      const x=w3(c.x), z=w3(c.y);
      if(!visible(x,z,1.2)) continue;
      /* MISMA escala que un hechicero: se usa la tabla de alturas del rig
         (tobillo 0,10 · rodilla 0,52 · cadera 0,96 · pecho 1,42 · hombro 1,50
         · cuello 1,66 · cabeza 1,90), asi que un civil y un personaje miden
         lo mismo y se leen como la misma especie. */
      const ang = (c.eje==='h') ? (c.dir>0?0:Math.PI) : (c.dir>0?Math.PI/2:-Math.PI/2);
      const H=c.alto, B=c.corp, ry=-ang;
      const fw=[Math.cos(ang),Math.sin(ang)], rg=[-Math.sin(ang),Math.cos(ang)];
      const Y=v=>v*H;
      const paso=Math.sin(c.ph)*0.42*(1+c.huir*0.5);
      const bob =Math.abs(Math.cos(c.ph))*0.030*H;
      const CL={tex:TEX.fabric, tile:1}, SK={tex:TEX.skin, tile:1};
      const oscuro=mixc(c.ropa,[0,0,0],0.38);

      const seg=(px,py,pz,phi,len,rad,col,opt)=>{
        const hx=Math.sin(phi), hv=-Math.cos(phi);
        R3.draw('cyl', px+fw[0]*hx*len*0.5, py+hv*len*0.5, pz+fw[1]*hx*len*0.5,
          rad, len, rad, ry, col, Object.assign({rz:phi}, opt));
        return [px+fw[0]*hx*len, py+hv*len, pz+fw[1]*hx*len];
      };

      R3.draw('disc', x, 0.03, z, 0.90*B, 1, 0.90*B, 0, [0,0,0], {alpha:0.46});
      for(const sg of [-1,1]){
        const lx=x+rg[0]*0.18*B, lz=z+rg[1]*0.18*B;
        const rodilla=seg(lx+rg[0]*0, Y(0.96)+bob, lz, paso*sg, Y(0.44), 0.145*B, oscuro, CL);
        seg(rodilla[0], rodilla[1], rodilla[2], paso*sg-0.16, Y(0.44), 0.120*B, oscuro, CL);
      }
      R3.draw('cyl', x, Y(1.12)+bob, z, 0.50*B, Y(0.34), 0.34*B, ry, oscuro, CL);
      R3.draw('cyl', x, Y(1.42)+bob, z, 0.52*B, Y(0.38), 0.35*B, ry, c.ropa, CL);
      for(const sg of [-1,1])
        seg(x+rg[0]*0.29*B*sg, Y(1.50)+bob, z+rg[1]*0.29*B*sg, -paso*sg*0.75, Y(0.62), 0.108*B,
            mixc(c.ropa,[1,1,1],0.06), CL);
      R3.draw('cyl', x, Y(1.66)+bob, z, 0.17*B, Y(0.16), 0.17*B, ry, c.piel, SK);
      R3.draw('sph', x, Y(1.90)+bob, z, 0.40, 0.44, 0.375, ry, c.cara, SK);
      R3.draw('sph', x, Y(1.96)+bob, z, 0.42, 0.32, 0.40, ry, c.pelo, {tex:TEX.fur, tile:1});

      /* CARA. Solo se dibuja de cerca: a 30 civiles en pantalla, ocho piezas
         de cara cada uno serian 240 llamadas que no se aprecian de lejos. */
      if(dist2(c.x,c.y,M.hero.x,M.hero.y) < 430*430){
        const tinta=[0.09,0.07,0.07];
        const FX=(d,up,side)=>[ x+fw[0]*d+rg[0]*side, Y(1.90)+bob+up, z+fw[1]*d+rg[1]*side ];
        /* sonrisa ancha, de oreja a oreja, curvada en tres tramos */
        for(let k=-1;k<=1;k++){
          const q=FX(0.186-Math.abs(k)*0.022, -0.115+Math.abs(k)*0.062, k*0.132);
          R3.draw('box', q[0],q[1],q[2], 0.030, 0.052, 0.180, ry, tinta, {rz:-k*0.55});
        }
        /* la hilera de dientes */
        { const q=FX(0.196,-0.082,0);
          R3.draw('box', q[0],q[1],q[2], 0.020, 0.038, 0.300, ry, [0.96,0.95,0.91], {}); }
        /* ojos rasgados y cejas arqueadas */
        for(const sg of [-1,1]){
          const e=FX(0.188, 0.058, sg*0.118);
          R3.draw('box', e[0],e[1],e[2], 0.026, 0.032, 0.105, ry, tinta, {rz:sg*0.30});
          const b=FX(0.180, 0.120, sg*0.118);
          R3.draw('box', b[0],b[1],b[2], 0.022, 0.027, 0.125, ry, tinta, {rz:-sg*0.44});
        }
      }
    }
  }
};

/* ===================== CALZADA, ACERAS Y PASOS =========================
   Todo se deduce de la reticula del mapa y se dibuja solo alrededor de la
   camara: no ocupa memoria ni son muros.
   Reparto de la calle, de fuera a dentro: ACERA pegada a la manzana (36% del
   ancho por lado), bordillo, y CALZADA en el centro. Los civiles y el atrezo
   van sobre la acera, y los pasos de cebra la cruzan de acera a acera sin
   invadir el carril.                                                       */
function drawStreets(g){
  const G=g.map.grid; if(!G) return;
  const f=M.hero; if(!f) return;
  const paso=G.cell+G.street, med=G.street/2;
  const acera=G.street*0.36, cen=med-acera/2;      // eje de la acera
  const calz = med-acera;                          // media calzada
  const i0=Math.max(0,Math.floor((f.x-950-G.ox)/paso)), i1=Math.min(G.cols,Math.ceil((f.x+950-G.ox)/paso));
  const j0=Math.max(0,Math.floor((f.y-950-G.oy)/paso)), j1=Math.min(G.rows,Math.ceil((f.y+950-G.oy)/paso));
  const cLinea=[0.78,0.76,0.68], cAcera=[0.46,0.45,0.43], cBord=[0.60,0.59,0.56], cCebra=[0.86,0.85,0.80];

  /* --- ACERAS: un anillo alrededor de cada manzana, pegado a ella --- */
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){
    const bx=G.ox+i*paso, by=G.oy+j*paso;          // esquina de la manzana
    const cx=w3(bx+G.cell/2), cz=w3(by+G.cell/2);
    if(!visible(cx,cz,w3(G.cell))) continue;
    const L=w3(G.cell+acera*2), A=w3(acera);
    for(const s2 of [-1,1]){
      /* lados norte/sur y este/oeste del anillo */
      R3.draw('box', cx, 0.05, cz+s2*w3(G.cell/2+acera/2), L, 0.10, A, 0, cAcera,
        {tex:TEX.tile, tile:5});
      R3.draw('box', cx+s2*w3(G.cell/2+acera/2), 0.05, cz, A, 0.10, L, 0, cAcera,
        {tex:TEX.tile, tile:5});
      /* bordillo, en el borde exterior */
      R3.draw('box', cx, 0.09, cz+s2*w3(G.cell/2+acera), L, 0.06, w3(7), 0, cBord, {});
      R3.draw('box', cx+s2*w3(G.cell/2+acera), 0.09, cz, w3(7), 0.06, L, 0, cBord, {});
    }
  }

  /* --- EJE DE LA CALZADA: linea discontinua por el centro de la calle --- */
  for(let i=i0;i<=i1;i++){
    const cx=w3(G.ox+i*paso-med);
    for(let j=j0;j<j1;j++) for(let k=0;k<4;k++){
      const z=w3(G.oy+j*paso+G.cell*(0.15+k*0.22));
      if(visible(cx,z,1)) R3.draw('box', cx, 0.03, z, 0.16, 0.02, 1.4, 0, cLinea, {alpha:0.55});
    }
  }
  for(let j=j0;j<=j1;j++){
    const cz=w3(G.oy+j*paso-med);
    for(let i=i0;i<i1;i++) for(let k=0;k<4;k++){
      const x=w3(G.ox+i*paso+G.cell*(0.15+k*0.22));
      if(visible(x,cz,1)) R3.draw('box', x, 0.03, cz, 1.4, 0.02, 0.16, 0, cLinea, {alpha:0.55});
    }
  }

  /* --- PASOS DE CEBRA: cruzan solo la calzada, de acera a acera --- */
  const cebra=(cx,cz,horiz)=>{
    if(!visible(cx,cz,w3(med))) return;
    for(let k=0;k<6;k++){
      const d=w3((k-2.5)*(calz*2)/6.5);
      if(horiz) R3.draw('box', cx+d, 0.04, cz, w3(calz*0.24), 0.02, w3(calz*1.9), 0, cCebra, {alpha:0.85});
      else      R3.draw('box', cx, 0.04, cz+d, w3(calz*1.9), 0.02, w3(calz*0.24), 0, cCebra, {alpha:0.85});
    }
  };
  for(let i=i0;i<=i1;i++) for(let j=j0;j<j1;j++)
    cebra(w3(G.ox+i*paso-med), w3(G.oy+j*paso+G.cell/2), false);
  for(let j=j0;j<=j1;j++) for(let i=i0;i<i1;i++)
    cebra(w3(G.ox+i*paso+G.cell/2), w3(G.oy+j*paso-med), true);
}

/* Marca de energia maldita en la pared. Late, gira y se apaga si ya la hiciste.
   Guarda en M.aimMis la que este bajo la mirilla, que es lo que lee el HUD. */
function drawMissions(g){
  if(!M.missions || !M.missions.length) return;
  M.aimMis=null;
  let mejor=1e9;
  for(const mi of M.missions){
    if(misionHecha(mi)) continue;
    const x=w3(mi.x), z=w3(mi.y), y=1.55;
    if(!visible(x,z,2)) continue;
    const d=Math.hypot(x-w3(M.hero.x), z-w3(M.hero.y));
    if(d>34) continue;
    const pu=0.55+0.45*Math.sin(g.t*2.2+mi.i);
    const col=[0.62,0.34,0.86];
    R3.draw('disc', x, 0.06, z, 2.6, 1, 2.6, 0, col, {alpha:0.20*pu, add:true});
    R3.draw('sph', x, y, z, 1.15, 1.35, 1.15, g.t*0.5+mi.i, col,
      {alpha:0.30+0.22*pu, add:true, cullFront:true});
    for(let k=0;k<3;k++){
      const a=g.t*(0.7+k*0.3)+k*2.1+mi.i;
      R3.draw('box', x, y+(k-1)*0.42, z, 1.5-k*0.22, 0.10, 0.10, a, col,
        {alpha:0.85, add:true, emis:1.4});
      R3.draw('box', x, y+(k-1)*0.42, z, 0.10, 0.10, 1.5-k*0.22, a, col,
        {alpha:0.85, add:true, emis:1.4});
    }
    /* ¿esta bajo la mirilla? la mirilla es el centro de la pantalla */
    const pr=R3.project(x, y, z, VW, VH);
    if(pr){
      const dd=Math.hypot(pr.x-VW/2, pr.y-VH/2);
      if(dd<110 && dd<mejor){ mejor=dd; M.aimMis=mi; }
    }
  }
}

function drawProps(g){
  const P3=g.props; if(!P3) return;
  for(let i=0;i<P3.length;i++){
    const p=P3[i];
    const x=w3(p.x), z=w3(p.y);
    if(!visible(x,z,2.2)) continue;
    drawProp(g,p,x,z,-(p.a||0));
  }
}

/* ============================================================================
   p_menu3d.js — Escena 3D en directo detrás de los menús
   ----------------------------------------------------------------------------
   Monta una partida de un solo luchador que NUNCA se simula: se le avanza el
   reloj a mano para que respire, gire y encienda su aura, pero no hay entradas,
   ni IA, ni proyectiles, ni checksum. Es sólo un escaparate, así que no puede
   tocar nada de lo que depende el netcode.
   ========================================================================= */

const MENU3 = {
  on:false, g:null, raf:0, last:0, t:0,
  cid:null, mapId:null, mode:'title',
  spin:0, ashT:0,
  /* encuadre: la pantalla de inicio deja al personaje a la derecha para que el
     menú respire; el perfil lo mete en su marco de la izquierda */
  frame:{ yaw:0.9, pitch:0.16, dist:5.6, height:1.25, side:0.0, look:1.30 }
};

/* mapas con horizonte abierto: se ve el personaje, no una pared a diez centímetros */
const MENU_MAPS = ['shibuya_cross','kabukicho','shinjuku','crater','colony'];
function menuMapFor(cid){
  const f = (CHARS[cid]&&CHARS[cid].faction)||'';
  if(f==='Maldiciones') return 'kabukicho';
  let h=0; for(let i=0;i<cid.length;i++) h=(h*31+cid.charCodeAt(i))|0;
  return MENU_MAPS[Math.abs(h)%MENU_MAPS.length];
}

/* arranca (o reencuadra) la escena de menú */
function menuScene(mode, cid, greyed){
  if(typeof R3==='undefined' || !R3.ok) return;
  if(SAVE.settings.menu3d===false){ menuStop(); return; }
  cid = cid || SAVE.main || 'yuji';
  /* Aqui estaba el fallo: si el personaje no estaba desbloqueado se
     SUSTITUIA por otro que si lo estuviera, asi que al pasar el raton por uno
     bloqueado veias a un tercero. Ahora solo se sustituye si la ficha no
     existe; el candado ya se comunica con el gris y con el aviso. */
  if(!CHARS[cid]) cid = ROSTER.find(c=>isUnlocked(c)) || 'yuji';
  MENU3.mode = mode;

  /* encuadres por pantalla */
  /* side positivo desplaza la cámara a su derecha, o sea: mueve al personaje
     hacia la IZQUIERDA de la pantalla. El perfil lo quiere en su marco de la
     izquierda; la pantalla de inicio, a la derecha del menú. */
  MENU3.frame =
      mode==='profile' ? { yaw:0.62, pitch:0.10, dist:3.9, height:1.20, side: 2.85, look:1.16 }
    : mode==='pick'    ? (MODEL[cid]&&MODEL[cid].rika
        /* Yuta no cabe solo: Rika mide casi nueve unidades de envergadura,
           asi que su ficha necesita mas distancia y mirar mas arriba. */
        ? { yaw:0.72, pitch:0.16, dist:6.6, height:1.9, side:-0.10, look:2.4 }
        : { yaw:0.72, pitch:0.08, dist:3.6, height:1.16, side:-0.10, look:1.12 })
    :                    { yaw:0.90, pitch:0.12, dist:4.3, height:1.24, side:-2.05, look:1.22 };

  MENU3.grey = !!greyed;                       // refrescar siempre el apagado
  if(MENU3.on && MENU3.cid===cid){ return; }   // ya montada con el mismo actor

  const mapId = menuMapFor(cid);
  MENU3.cid=cid; MENU3.mapId=mapId;
  const map=MAPS[mapId], sp=map.spawns[0];
  MENU3.g = new Game(mapId, [{cid, team:0, name:'', pos:[sp[0], sp[1]]}], 12345, {mode:'menu'});
  const f = MENU3.g.fighters[0];
  const spot = menuSpot(MENU3.g);
  f.x=spot[0]; f.y=spot[1];
  f.ang = 0; f.ce = f.maxce;
  MENU3.spin = 0; MENU3.t = 0; MENU3.grey = !!greyed;

  /* la escena de menú vive en M para que render3D y drawCharacter la vean */
  M.g = MENU3.g; M.hero = f; M.paused=false; M.ended=false;
  PS.clear(); DEB.clear();
  MENU3.on = true;
  MENU3.last = performance.now();
  postReset();
  if(!MENU3.raf) MENU3.raf = requestAnimationFrame(menuLoop);
}

/* busca el claro más despejado del mapa: nada de posar detrás de un muro */
function menuSpot(g){
  const map=g.map;
  let best=[map.w/2, map.h/2], bestR=-1;
  for(let iy=1; iy<=6; iy++) for(let ix=1; ix<=8; ix++){
    const x=map.w*ix/9, y=map.h*iy/7;
    let r=0;
    for(const rr of [70,130,200,280,360]){ if(g.hitWall(x,y,rr)) break; r=rr; }
    if(r>bestR){ bestR=r; best=[x,y]; }
  }
  return best;
}

function menuStop(){
  MENU3.on=false;
  if(MENU3.raf){ cancelAnimationFrame(MENU3.raf); MENU3.raf=0; }
  MENU3.g=null; MENU3.cid=null;
  if(typeof R3!=='undefined' && R3.ok && R3.gl){
    const gl=R3.gl; gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.clearColor(0.02,0.02,0.03,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  }
}

/* cambia de actor sin reconstruir la pantalla */
function menuSetChar(cid){
  if(!MENU3.on) return;
  MENU3.cid=null;
  menuScene(MENU3.mode, cid);
}

function menuLoop(){
  if(!MENU3.on){ MENU3.raf=0; return; }
  MENU3.raf = requestAnimationFrame(menuLoop);
  const now=performance.now();
  let dt=(now-MENU3.last)/1000; MENU3.last=now;
  if(!(dt>0)) dt=1/60;
  if(dt>0.2) dt=0.2;
  MENU3.t += dt;
  const g=MENU3.g; if(!g) return;

  /* el reloj avanza a mano: nada de step(), nada de simulación */
  g.t += dt;
  VISDT = dt;

  const f=g.fighters[0];
  /* gira despacio sobre sí mismo y respira */
  MENU3.spin += dt*0.20;
  /* Arranca DE FRENTE. La camara se coloca en el angulo (yaw + PI) respecto
     al personaje, asi que para que le veas la cara su orientacion tiene que
     valer justo eso. Antes f.ang empezaba en 0 con la camara a 0,72 rad: 221
     grados girado, o sea la espalda. A partir de ahi sigue girando despacio
     sobre si mismo, que es lo que se queria. */
  f.ang = MENU3.spin + (MENU3.frame ? MENU3.frame.yaw : 0) + Math.PI;
  f._grey = !!MENU3.grey;
  f.ce = Math.min(f.maxce, f.ce + f.maxce*0.18*dt);
  if(f.ce>=f.maxce) f.ce = f.maxce*(0.55+0.45*Math.sin(MENU3.t*0.35));

  /* ceniza cayendo, un puñado por segundo */
  MENU3.ashT -= dt;
  if(MENU3.ashT<=0){
    MENU3.ashT = 0.12;
    const cx=w3(f.x), cz=w3(f.y);
    PS.spawn({ x:cx+(Math.random()-0.5)*13, y:5+Math.random()*4, z:cz+(Math.random()-0.5)*13,
      vx:(Math.random()-0.5)*0.25, vy:-0.35-Math.random()*0.4, vz:(Math.random()-0.5)*0.25,
      g:0.05, drag:0.995, life:7+Math.random()*4, s:0.055, s1:0.02,
      c:[0.72,0.70,0.66], a:0.42, add:false, ground:false });
  }

  PS.update(dt); DEB.update(dt);
  render3D(g);
  if(typeof AU!=='undefined' && AU.ok){ AU.tick(); AU.lx=f.x; AU.ly=f.y; AU.yaw=0; AU.drain(g); }
}

/* cámara orbital del menú: la usa computeCamera cuando MENU3.on */
function menuCamera(g,f){
  const F=MENU3.frame;
  const yaw = F.yaw + Math.sin(MENU3.t*0.11)*0.30 - MENU3.spin*0.55;
  const cp=Math.cos(F.pitch), sp=Math.sin(F.pitch);
  const fwd=[Math.cos(yaw)*cp, -sp, Math.sin(yaw)*cp];
  const right=[-Math.sin(yaw),0,Math.cos(yaw)];
  const tx=w3(f.x), tz=w3(f.y);
  const bob=Math.sin(MENU3.t*0.5)*0.05;
  const ty=F.height+bob;
  const ox=right[0]*F.side, oz=right[2]*F.side;
  const cam=[tx-fwd[0]*F.dist+ox, ty-fwd[1]*F.dist, tz-fwd[2]*F.dist+oz];
  const tgt=[tx+ox, F.look+bob, tz+oz];
  return {cam,tgt,fwd};
}

/* --------- luz de escenario: sin esto el menú es una silueta negra -------- */
function menuStageFX(g){
  const f=g.fighters[0]; if(!f) return;
  const x=w3(f.x), z=w3(f.y);
  const col=auraColor(f), t=MENU3.t;
  /* charco de luz bajo los pies */
  R3.draw('disc', x, 0.045, z, 7.0, 1, 7.0, 0, mixc(col,[1,1,1],0.55), {alpha:0.075, add:true});
  R3.draw('disc', x, 0.055, z, 3.4+Math.sin(t*0.7)*0.12, 1, 3.4, 0, col, {alpha:0.12, add:true});
  R3.draw('disc', x, 0.065, z, 1.7, 1, 1.7, 0, mixc(col,[1,1,1],0.7), {alpha:0.16, add:true});
  /* contraluz: separa la silueta del fondo */
  R3.draw('sph', x, 1.15, z, 3.4, 4.2, 3.4, 0, mixc(col,[1,1,1],0.35),
    {alpha:0.075, add:true, cullFront:true});
  /* dos haces verticales que giran despacio */
  for(let i=0;i<2;i++){
    const a=t*0.22+i*Math.PI;
    R3.draw('cyl', x+Math.cos(a)*1.5, 2.6, z+Math.sin(a)*1.5, 0.5, 5.2, 0.5, 0,
      mixc(col,[1,1,1],0.5), {alpha:0.030, add:true, noCull:true});
  }
  /* anillo de suelo que respira */
  const p=(t*0.28)%1;
  R3.draw('disc', x, 0.075, z, 2.0+p*5.5, 1, 2.0+p*5.5, 0, col, {alpha:0.10*(1-p), add:true});
}

function fmtNum(n){ return Math.round(n||0).toLocaleString('es'); }

/* ============================== PERFIL =================================== */
function screenProfile(tab){
  UI.screen='profile'; clearUI(); stopMatch();
  refreshTitles();
  tab=tab||'Historia';
  const S=SAVE.stats, R=SAVE.ranked;
  const cid=SAVE.main||'yuji', C=CHARS[cid]||CHARS.yuji;
  const t=titleOf(SAVE.titles.equipped);
  const rk=rankOf(SAVE.ranked.mmr);
  const total=S.wins+S.losses;
  const wr= total? Math.round(S.wins/total*100) : 0;
  const done=STORY.filter(m=>SAVE.story[m.id]&&SAVE.story[m.id].done).length;
  const sRanks=STORY.filter(m=>SAVE.story[m.id]&&SAVE.story[m.id].rank==='S').length;
  const unlockedN=ROSTER.filter(c=>isUnlocked(c)).length;
  const mastTotal=ROSTER.reduce((a,c)=>a+masteryLv(c),0);
  const bestChar=ROSTER.slice().sort((a,b)=>masteryLv(b)-masteryLv(a))[0];
  const byC=S.byChar||{};
  const favorite=Object.keys(byC).sort((a,b)=>(byC[b].matches||0)-(byC[a].matches||0))[0];
  const owned=titlesOwned().length;

  const stat=(v,l,cls)=>`<div class="stat ${cls||''}"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;

  /* --------- tabla de uso por personaje --------- */
  const rows=ROSTER.filter(c=>byC[c]&&byC[c].matches)

            <div class="kv"><span>Mejor marca</span><b>${R.best}</b></div>

            <div class="kv"><span>Mejor racha</span><b>${R.bestStreak||0}</b></div>
            <div class="kv"><span>Fragmentos</span><b>${fmtNum(SAVE.coins)}</b></div>

            </div>
            ${rows?`<div class="scroll" style="max-height:150px"><table>
              <tr><th>Personaje</th><th>Comb.</th><th>Vict.</th><th>%</th><th>Daño</th><th>FN</th><th>Maes.</th></tr>

              <div class="sub" style="font-size:10.5px">Pulsa uno conseguido para equiparlo</div>

            <div class="segbar">${cats.map(c=>`<div class="seg ${c===tab?'on':''}" data-cat="${c}">${c}</div>`).join('')}</div>

/* ------------------ elegir el personaje del perfil ---------------------- */
function screenMainPick(back){
  UI.screen='mainpick'; clearUI();
  const cards=ROSTER.map(c=>{
    const C=CHARS[c], ok=isUnlocked(c);
    return `<div class="cc ${ok?'':'locked'} ${SAVE.main===c?'sel':''}" data-c="${c}">
      <div class="k" style="color:${C.color}">${C.kanji}</div>
      <div class="n">${C.name}</div>
      <div class="g">MAESTRÍA ${masteryLv(c)}</div>
    </div>`; }).join('');
  const el=layer(`
    <div class="wrap" style="max-width:900px">
      <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:14px">
        <div><h2>Personaje del perfil</h2>
          <div class="sub">El que posa en la pantalla de inicio y encabeza tu ficha.</div></div>
        <button class="btn sm" data-back>← Volver</button>
      </div>
      <div class="panel"><div class="grid-chars">${cards}</div></div>
    </div>`);
  el.classList.add('see3d','rightside');
  on('[data-back]',()=>screenProfile(back),el);
  el.querySelectorAll('[data-c]').forEach(n=>{
    n.onmouseenter=()=>{ if(isUnlocked(n.dataset.c)) menuSetChar(n.dataset.c); };
    n.onclick=()=>{
      const c=n.dataset.c;
      if(!isUnlocked(c)){ AU.play('locked'); return; }
      SAVE.main=c; ACC.flush(); screenProfile(back);
    };
  });
  menuScene('profile', SAVE.main);
}

/* ============================ CUENTA ==================================== */
let ACCTAB='estado';
function screenAccount(tab, msg, cls){
  UI.screen='account'; clearUI(); stopMatch();
  ACCTAB = tab||ACCTAB||'estado';
  const logged=ACC.logged();
  if(ACCTAB==='estado' && !logged) ACCTAB='entrar';

  const tabs=[['estado','Mi cuenta'],['entrar','Iniciar sesión'],['crear','Crear perfil'],
              ['nube','Servidor'],['codigo','Código de guardado']];
  const seg=tabs.filter(t=>t[0]!=='estado'||logged)

  let body='';

    const u=ACC.user;
    body=`

        <div class="kv"><span>Perfil</span><b>${u.u}</b></div>

      </div>
      <div class="panel" style="margin-top:12px">
        <div style="font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:10px">CAMBIAR CONTRASEÑA</div>
        <div class="field"><label>Contraseña actual</label><input type="password" id="p0"></div>
        <div class="field"><label>Nueva contraseña</label><input type="password" id="p1"></div>
        <div class="field"><label>Repite la nueva</label><input type="password" id="p2"></div>
        <button class="btn sm" id="chpw">Cambiar contraseña</button>

      <div class="panel" style="margin-top:12px">

          <button class="btn sm" id="del" style="margin-left:auto;border-color:#5c1a26;color:#ff8090">Borrar este perfil</button>
        </div>
        <div class="notice" style="margin-top:10px">Borrar el perfil elimina su progreso de este equipo y pide la contraseña. No se puede deshacer.</div>
      </div>`;
  }
  else if(ACCTAB==='entrar'){
    const list=ACC.all();
    body=`
      <div class="panel">
        ${list.length?`<div style="font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:9px">PERFILES EN ESTE EQUIPO</div>
          ${list.map(u=>`<div class="userrow ${ACC.user&&ACC.user.k===u.k?'on':''}" data-u="${u.u}">
            <div class="ua" style="color:var(--gold)">${(u.u[0]||'?').toUpperCase()}</div>
            <div style="flex:1"><div style="font-size:13px;font-weight:700">${u.u}</div>
              <div class="sub" style="font-size:10px">Último acceso ${fmtDate(u.seen)} ·
              ${(u.save&&u.save.stats&&u.save.stats.matches)||0} combates</div></div>
            <div style="font-size:16px;color:#3a3d52">›</div></div>`).join('')}`
          :`<div class="notice">Todavía no hay ningún perfil creado en este equipo. Ve a «Crear perfil».</div>`}
      </div>
      <div class="panel" style="margin-top:12px">
        <div class="field"><label>Usuario</label><input type="text" id="u" value="" spellcheck="false"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="p"></div>
        <button class="btn" id="go">Entrar</button>
      </div>`;
  }
  else if(ACCTAB==='crear'){
    body=`
      <div class="panel">
        <div class="notice" style="margin-bottom:14px">
          El progreso que lleves ahora mismo se conserva: al crear el perfil se guarda dentro de él.
          ${STORE.kind==='disco'?'':'<br><b style="color:#ff8090">Aviso:</b> este navegador no permite guardar en disco, así que el perfil solo durará esta sesión.'}
        </div>
        <div class="field"><label>Nombre de usuario</label><input type="text" id="u" spellcheck="false" placeholder="3 a 16 caracteres"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="p1" placeholder="mínimo 4 caracteres"></div>
        <div class="field"><label>Repite la contraseña</label><input type="password" id="p2"></div>
        <button class="btn gold" id="go">Crear perfil</button>
      </div>`;
  }
  else if(ACCTAB==='nube'){
    const u=ACC.user;
    body=`
      <div class="panel">
        <div class="notice" style="margin-bottom:12px">
          Opcional. Vincula tu perfil al <b>server.js</b> incluido para llevarte el progreso a otro
          ordenador. La contraseña nunca sale de este equipo: solo viaja el hash.
        </div>
        <div class="field"><label>Dirección del servidor</label>
          <input type="text" id="url" value="${SYNC.url||SYNC.defaultUrl()}" spellcheck="false"></div>
        ${logged&&!ACC.srvCred?`<div class="field"><label>Tu contraseña (solo para vincular)</label>
          <input type="password" id="spw" placeholder="la de este perfil"></div>`:''}
        ${logged?`
        <div class="kv"><span>Estado</span><b>${u.srv?('Vinculada como '+u.srv.user):'Sin vincular'}</b></div>
        <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn sm" id="reg">Registrar en el servidor</button>
          <button class="btn sm" id="lin">Vincular cuenta existente</button>
          <button class="btn sm gold" id="push" ${u.srv?'':'disabled'}>Subir progreso</button>
          <button class="btn sm blue" id="pull" ${u.srv?'':'disabled'}>Bajar progreso</button>
          <button class="btn sm" id="unl" ${u.srv?'':'disabled'} style="margin-left:auto">Desvincular</button>
        </div>

  }
  else {
    body=`
      <div class="panel">
        <div class="sub" style="margin-bottom:8px">Código de guardado — la salida de emergencia: funciona siempre, con cuenta o sin ella.</div>

          <button class="btn sm" id="reset" style="margin-left:auto;border-color:#5c1a26;color:#ff8090">Borrar progreso</button>
        </div>
      </div>`;

    <div class="wrap" style="max-width:720px">
      <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:12px">
        <div><h2>Cuenta y guardado</h2>
          <div class="sub">${logged?('Sesión abierta como <b>'+ACC.user.u+'</b>'):'Jugando como invitado'} · ${STORE.kind==='disco'?'guardado en este equipo':'solo memoria'}</div></div>
        <button class="btn sm" data-back>← Volver</button>

      <div class="segbar">${seg}</div>

  if(ACCTAB==='entrar'){
    el.querySelectorAll('[data-u]').forEach(n=>n.onclick=()=>{
      el.querySelector('#u').value=n.dataset.u; el.querySelector('#p').focus(); });
    const doLogin=()=>{
      const r=ACC.login(el.querySelector('#u').value, el.querySelector('#p').value);
      if(r.ok){ AU.play('levelup'); screenAccount('estado', r.msg, 'ok'); }
      else { AU.play('locked'); say(r.msg,'err'); }
    };
    el.querySelector('#go').onclick=doLogin;
    el.querySelector('#p').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
  }
  if(ACCTAB==='crear'){
    const doReg=()=>{
      const r=ACC.register(el.querySelector('#u').value, el.querySelector('#p1').value, el.querySelector('#p2').value);
      if(r.ok){ AU.play('levelup'); refreshTitles(true); screenAccount('estado', r.msg, 'ok'); }
      else { AU.play('locked'); say(r.msg,'err'); }
    };
    el.querySelector('#go').onclick=doReg;
    el.querySelector('#p2').onkeydown=e=>{ if(e.key==='Enter') doReg(); };
  }
  if(ACCTAB==='estado'){
    el.querySelector('#save').onclick=()=>{ const disk=ACC.flush();
      say(disk?'Progreso guardado en este equipo.':'Guardado en memoria: este navegador no permite escribir en disco.', disk?'ok':'err'); };
    el.querySelector('#logout').onclick=()=>{ ACC.logout(); screenAccount('entrar','Sesión cerrada. Vuelves a jugar como invitado.','ok'); };

      say(r.msg, r.ok?'ok':'err');
    };
    el.querySelector('#del').onclick=()=>{

      const r=ACC.remove(ACC.user.u, pw);
      if(r.ok) screenAccount('entrar', r.msg, 'ok'); else say(r.msg,'err');
    };
  }
  if(ACCTAB==='nube' && logged){
    const url=()=>{ SYNC.setUrl(el.querySelector('#url').value.trim()); };
    const pw =()=>{ const i=el.querySelector('#spw'); return i?i.value:''; };
    window.syncRender=()=>{ const d=el.querySelector('#syncmsg');
      if(d){ d.textContent=SYNC.msg; d.className='msgline '+(SYNC.state==='error'?'err':'ok'); } };
    el.querySelector('#reg').onclick=()=>{ url(); SYNC.link('register', pw()); };
    el.querySelector('#lin').onclick=()=>{ url(); SYNC.link('login', pw()); };
    el.querySelector('#push').onclick=()=>{ url(); SYNC.push(); };
    el.querySelector('#pull').onclick=()=>{ url(); SYNC.pull(); };
    el.querySelector('#unl').onclick=()=>{ SYNC.unlink(); screenAccount('nube','Vínculo eliminado.','ok'); };
  }
  if(ACCTAB==='codigo'){
    el.querySelector('#copy').onclick=()=>{
      const i=el.querySelector('#code'); i.select();

      catch(e){ say('Cópialo a mano: Ctrl+C.','err'); } };
    el.querySelector('#load').onclick=()=>{
      if(importSave(el.querySelector('#code').value)){ ACC.flush();
        say('Progreso cargado.','ok'); setTimeout(()=>screenAccount(ACCTAB,'Progreso cargado.','ok'),300); }
      else say('Ese código no es válido.','err'); };
    el.querySelector('#reset').onclick=()=>{
      if(!confirm('¿Borrar todo el progreso de la partida en curso?')) return;
      resetSave(); refreshTitles(true); ACC.flush();
      screenAccount(ACCTAB,'Progreso borrado.','ok'); };
  }

  menuScene('profile', SAVE.main);
}

/* ============================================================================
   s_tutorial.js — Entrenamiento guiado con maniquí
   ----------------------------------------------------------------------------
   Once pasos que enseñan TODOS los botones y TODAS las capas del combate, cada
   uno con su condición de superado leída del estado real del luchador. El
   controlador vive fuera de la simulación: solo mira, nunca toca (salvo los
   empujoncitos declarados en `setup`, que preparan la situación de cada paso).
   ========================================================================= */

const TUT_CID = 'yuji';   // tiene arsenal completo y dominio: sirve de ejemplo

const TUT_STEPS = [
  { id:'move', key:'W A S D', title:'Muévete',
    text:'Usa <b>WASD</b> para desplazarte por el patio. Camina hasta soltar las piernas.',
    goal:'Recorre 12 metros',
    init:(f,S)=>{ S.d=0; S.px=f.x; S.py=f.y; },
    tick:(g,f,S)=>{ S.d += dist(f.x,f.y,S.px,S.py); S.px=f.x; S.py=f.y;
                    return clamp(S.d/240,0,1); } },

  { id:'look', key:'RATÓN', title:'Mira alrededor',
    text:'Mueve el <b>ratón</b> para girar la cámara. Adonde apuntas es adonde atacas.',
    goal:'Gira la cámara',
    init:(f,S)=>{ S.y0=CAM3.yaw; S.acc=0; S.py=CAM3.yaw; },
    tick:(g,f,S)=>{ S.acc += Math.abs(angDiff(CAM3.yaw, S.py)); S.py=CAM3.yaw;
                    return clamp(S.acc/2.2,0,1); } },

  { id:'basic', key:'CLIC', title:'Golpea',
    text:'<b>Clic izquierdo</b> para atacar. Acércate al maniquí y encádenale tres golpes.',
    goal:'3 impactos en el maniquí',
    init:(f,S,g)=>{ S.n=0; S.hp=TUTOR.dummy?TUTOR.dummy.hp:0; },
    tick:(g,f,S)=>{ const d=TUTOR.dummy;
      if(d && d.hp < S.hp-0.5){ S.n++; S.hp=d.hp; }
      return clamp(S.n/3,0,1); } },

  { id:'dash', key:'ESPACIO', title:'Esquiva',
    text:'<b>Espacio</b> te lanza en la dirección que lleves, y te hace intocable un instante. Cuesta energía maldita.',
    goal:'Esquiva dos veces',
    init:(f,S)=>{ S.n=0; S.was=0; },
    tick:(g,f,S)=>{ if(f.dashT>0 && !S.was) S.n++; S.was = f.dashT>0?1:0;
                    return clamp(S.n/2,0,1); } },

  { id:'guard', key:'MAYÚS', title:'Refuerzo',
    text:'Mantén <b>Mayús</b> para cubrirte de energía maldita: reduce el daño mientras la gastes.',
    goal:'Aguanta el refuerzo 1,5 s',
    init:(f,S)=>{ S.t=0; },
    tick:(g,f,S)=>{ if(f.guarding) S.t+=DT; return clamp(S.t/1.5,0,1); } },

  { id:'q', key:'Q', title:'Primera técnica',

const TUTOR = {
  on:false, i:0, S:{}, dummy:null, done:false, box:null, doneT:0,

  start(){
    /* startMatch llama a stopMatch, que apaga el tutorial: hay que encenderlo
       DESPUÉS de montar el combate, no antes. */
    startMatch({ mapId:'jujutsu_high', heroCid:TUT_CID, mode:'tutorial',
      enemies:[{cid:'dummy', diff:0}],
      objective:'Entrenamiento' });
    this.on=true; this.i=0; this.S={}; this.done=false; this.doneT=0;
    const g=M.g, f=M.hero;
    this.dummy = g.fighters[1];
    /* el maniquí ni piensa ni se mueve ni golpea */
    this.dummy.ai=null; this.dummy.speed=0;
    const sp=g.map.spawns[0];
    f.x=sp[0]; f.y=sp[1];
    this.dummy.x=sp[0]+260; this.dummy.y=sp[1];
    this.dummy.ang=Math.PI;
    f.locks=null;                          // en el tutorial no hay candados
    this.buildBox();
    this.enter(0);
  },
  stop(){ this.on=false; if(this.box){ this.box.remove(); this.box=null; } },

  enter(i){
    this.i=i; this.S={};
    const st=TUT_STEPS[i]; if(!st) return;
    if(st.init) st.init(M.hero, this.S, M.g);
    this.render(0);
    AU.play('ui');
  },

  /* se llama una vez por fotograma desde el bucle principal */
  tick(){
    if(!this.on || !M.g || !M.hero) return;
    if(this.done){
      this.doneT += VISDT;
      if(this.doneT>2.6) this.finish();
      return;
    }
    const st=TUT_STEPS[this.i]; if(!st) return;
    /* el maniquí no puede caer: es de paja, pero es eterno */
    if(this.dummy){ this.dummy.alive=true;
      if(this.dummy.hp < 1500) this.dummy.hp = this.dummy.maxhp; }
    let p=0;
    try{ p = clamp(st.tick(M.g, M.hero, this.S), 0, 1); }catch(e){ p=0; }
    this.render(p);
    if(p>=1){
      AU.play('levelup', null, {verb:0.4});
      showMsg('¡'+st.title.toUpperCase()+'!', 1.0);
      if(this.i+1 < TUT_STEPS.length) this.enter(this.i+1);
      else { this.done=true; this.doneT=0; this.render(1); }
    }
  },

  buildBox(){
    if(this.box) this.box.remove();
    const el=h(`<div id="tutbox">
      <div class="tstep"></div>
      <div class="ttitle"></div>
      <div class="ttext"></div>
      <div class="tgoal"><span class="tkey"></span><span class="tgt"></span></div>
      <div class="tbar"><i></i></div>
      <button class="btn sm tskip">Saltar el entrenamiento</button>
    </div>`);
    document.body.appendChild(el);
    this.box=el;
    el.querySelector('.tskip').onclick=()=>{ this.done=true; this.finish(); };
  },
  render(p){
    if(!this.box) return;
    const st=TUT_STEPS[this.i];
    if(this.done){
      this.box.querySelector('.tstep').textContent='ENTRENAMIENTO COMPLETADO';
      this.box.querySelector('.ttitle').textContent='Ya sabes pelear';
      this.box.querySelector('.ttext').innerHTML=
        'Eso es todo el repertorio. Lo demás es tuyo: maestría, tienda, historia y clasificatoria.';
      this.box.querySelector('.tkey').textContent='';
      this.box.querySelector('.tgt').textContent='';
      this.box.querySelector('.tbar i').style.width='100%';
      return;
    }
    this.box.querySelector('.tstep').textContent='PASO '+(this.i+1)+' DE '+TUT_STEPS.length;
    this.box.querySelector('.ttitle').textContent=st.title;
    this.box.querySelector('.ttext').innerHTML=st.text;
    this.box.querySelector('.tkey').textContent=st.key;
    this.box.querySelector('.tgt').textContent=st.goal;
    this.box.querySelector('.tbar i').style.width=Math.round(p*100)+'%';
  },

  finish(){
    this.on=false;
    const first = !(SAVE.tutorial && SAVE.tutorial.done) && !STORE.get('jjk_tut');
    SAVE.tutorial = { done:true, at:Date.now() };
    STORE.set('jjk_tut','1');        // vale también para partidas de invitado
    let reward=0;
    if(first){ reward=1200; addCoins(reward); SAVE.stats.coinsEarned=(SAVE.stats.coinsEarned||0)+reward; }
    refreshTitles(true);
    ACC.flush();
    if(this.box){ this.box.remove(); this.box=null; }
    stopMatch();
    UI.screen='tutdone'; clearUI();
    const el=layer(`
      <div class="wrap" style="max-width:560px;text-align:center">
        <div style="font-size:38px;font-weight:900;letter-spacing:.18em;color:#5fd6a0">ENTRENAMIENTO</div>
        <div class="sub" style="margin-top:8px">Ya conoces todos los botones y todas las capas del combate.</div>
        ${reward?`<div class="panel" style="margin-top:16px">

          <div style="font-size:30px;font-weight:900;color:var(--gold);margin-top:6px">
            +${reward.toLocaleString('es')} ${CUR.kanji}</div>
          <div class="sub" style="font-size:11px">Para estrenar la tienda.</div>
        </div>`:''}
        <div class="panel" style="margin-top:14px;text-align:left">
          <div class="notice">Puedes repetirlo cuando quieras desde <b>Entrenamiento → Repetir tutorial</b>.</div>
        </div>

    el.querySelector('#again').onclick=()=>TUTOR.start();

/* ============================================================================
   f_match.js — Ejecución del combate, render y bucle principal
   ========================================================================= */

let RAF=null, acc=0, lastT=0;
const M={ g:null, cfg:null, hero:null, cam:{x:0,y:0,z:1}, hud:null, paused:false,
          net:null, netFrame:0, waitFrames:0, waves:null, ended:false, msg:null, msgT:0,
          localBuf:new Map() };

/* Los avisos flotantes cuelgan de document.body, no de la capa de interfaz,
   asi que clearUI() no los toca. Solo se ocultaban desde updateHUD, que deja
   de ejecutarse al terminar el combate: se quedaban congelados en su ultimo
   estado sobre el menu. Se apagan a mano aqui.
   Y el lienzo 2D conserva el ultimo fotograma dibujado -- numeros de daño,
   mirilla, barras -- si nadie lo borra. */
function limpiarPantalla(){
  ['noceavis','mistip','cgtip','brujula'].forEach(id=>{
    const e=document.getElementById(id); if(e) e.style.display='none';
  });
  try{ if(typeof ctx!=='undefined' && ctx) ctx.clearRect(0,0,VW,VH); }catch(e){}
}

function stopMatch(){
  limpiarPantalla();
  if(typeof TUTOR!=='undefined' && TUTOR.on) TUTOR.stop();
  if(RAF){ cancelAnimationFrame(RAF); RAF=null; }
  if(M.endT){ clearTimeout(M.endT); M.endT=null; }   // resultado pendiente: se cancela
  if(M.net){ M.net.close(); M.net=null; }
  if(typeof menuStop==='function') menuStop();
  M.g=null; M.hero=null; M.ended=false; M.paused=false;
  if(M.hud){ M.hud.remove(); M.hud=null; }
}

function startMatch(cfg){
  stopMatch(); clearUI();
  /* Las marcas de mision se quedaban en M.missions al salir del mundo abierto,
     asi que reaparecian flotando en misiones de Historia y en clasificatoria.
     Toda partida arranca sin marcas; el mundo abierto las repone despues. */
  M.missions = null; M.aimMis = null;
  UI.screen='match'; M.cfg=cfg; M.ended=false; M.paused=false;
  const seed = cfg.seed!==undefined?cfg.seed:(Math.floor(Math.random()*1e9));
  const setups=[];
  const heroTeam = 0;
  const rankedMode = cfg.mode==='ranked'||cfg.mode==='online';
  // en las misiones con hechicero impuesto el arsenal va "prestado": sin candados
  /* arsenal "prestado": sin candados de maestría. Ocurre en las misiones con
     hechicero impuesto y en TODO el entrenamiento, que es una caja de arena. */
  const lent = !!(cfg.story && (cfg.story.heroLocked || cfg.story.heroForce)) || cfg.mode==='train';
  setups.push({cid:cfg.heroCid, team:heroTeam, name:'TÚ',
    pos: cfg.heroPos||undefined,
    locks: lent?null:locksFor(cfg.heroCid),
    mast: masteryScale(cfg.heroCid, cfg.mode),
    ceBonus: rankedMode?0:upgVal('reserve'),
    bfBonus: rankedMode?0:upgVal('instinct')});
  (cfg.allies||[]).forEach((a,i)=>setups.push({cid:a.cid, team:heroTeam,
    ai:{diff:a.diff||0.7, style:'balanced'}, name:CHARS[a.cid].name,
    pos:[MAPS[cfg.mapId].spawns[0][0]+90+i*60, MAPS[cfg.mapId].spawns[0][1]+70]}));

  const spawnEnemy=(e,i)=>{
    const map=MAPS[cfg.mapId], base=map.spawns[1%map.spawns.length];
    const a=(i/6)*TAU;
    return { cid:e.cid, team:1, name:e.name||CHARS[e.cid].name,
      ai:{diff:e.diff!==undefined?e.diff:0.6, style:e.style||'balanced'},
      pos: e.pos ? e.pos
         : [clamp(base[0]+Math.cos(a)*(i?110:0), 60, map.w-60),
            clamp(base[1]+Math.sin(a)*(i?110:0), 60, map.h-60)],
      hpMul:e.hpMul, startDom:e.boss?40:0, boss:e.boss, look:e.look||null,
      powMul:e.powMul, spdMul:e.spdMul };
  };
  const initial = cfg.mode==='story'&&cfg.story&&cfg.story.kind==='survive'
    ? cfg.enemies.slice(0,3) : cfg.enemies;
  /* EN LINEA NO HAY ENEMIGOS DE IA. cfg.enemies solo lo traen historia, mundo
     abierto y entrenamiento; en un duelo en linea llega sin definir y este
     forEach reventaba, asi que el bloque de mas abajo -- el que arma de verdad
     la partida en linea -- no llegaba a ejecutarse nunca y la pantalla se
     quedaba en negro. */
  (initial||[]).forEach((e,i)=>setups.push(spawnEnemy(e,i+1)));

  /* --- EN LÍNEA: los dos clientes deben construir EXACTAMENTE la misma partida.
     El orden lo fija el rol (0/1), no quién eres tú, y ningún luchador lleva IA. --- */
  if(cfg.mode==='online'){
    const map=MAPS[cfg.mapId];
    const oc = cfg.oppCid || (cfg.enemies&&cfg.enemies[0]&&cfg.enemies[0].cid) || 'yuji';
    const p0 = cfg.role===0 ? cfg.heroCid : oc;
    const p1 = cfg.role===0 ? oc : cfg.heroCid;
    setups.length=0;
    /* En línea NO se aplican candados de maestría: cada cliente solo conoce la
       suya, así que aplicarlos rompería el determinismo del lockstep. Los duelos
       en línea se juegan siempre con el arsenal completo. */
    setups.push({cid:p0, team:0, name: cfg.role===0?'TÚ':(cfg.oppName||'Rival'), pos:map.spawns[0]});
    setups.push({cid:p1, team:1, name: cfg.role===1?'TÚ':(cfg.oppName||'Rival'), pos:map.spawns[1]});
  }

  M.g=new Game(cfg.mapId, setups, seed, {mode:cfg.mode, veil:cfg.veil||null,
    /* En mundo abierto no hay rivales: sin esto el motor daria la partida por
       ganada al instante y congelaria la simulacion. */
    survival: !!(cfg.story && cfg.story.kind==='survive') || cfg.mode==='open'});
  M.hero=M.g.fighters[cfg.mode==='online' ? (cfg.role||0) : 0];
  M.g.fighters.forEach(f=>{ const s=setups[f.uid]; if(s&&s.boss) f.isBoss=true; });
  M.net=cfg.net||null; M.netFrame=0; M.waitFrames=0; M.localBuf=new Map();
  PS.clear(); DEB.clear();
  M.waves = (cfg.story&&cfg.story.kind==='survive')
    ? { t:0, every:6.5, pool:cfg.enemies, spawnFn:spawnEnemy } : null;
  M.cam.x=M.hero.x; M.cam.y=M.hero.y;
  M.cam.z = clamp(VW/1750, 0.55, 1.0);
  { const e=M.g.fighters.find(o=>o.team!==M.hero.team);
    CAM3.yaw = e?Math.atan2(e.y-M.hero.y, e.x-M.hero.x):0;
    CAM3.pitch=0.34; CAM3.dist=4.9; CAM3.shake=0; }
  buildHUD();
  AU.musicStart('combat'); AU.setIntensity(0.25);
  if((cfg.story&&cfg.story.tut)||cfg.mode==='train') showControls();
  showMsg(MAPS[cfg.mapId].name.toUpperCase(), 1.6);
  lastT=performance.now(); acc=0; postReset();
  RAF=requestAnimationFrame(loop);
}

/* ------------------------------ BUCLE ----------------------------------- */
function loop(now){
  RAF=requestAnimationFrame(loop);
  let dt=(now-lastT)/1000; lastT=now;
  if(!(dt>0)) dt=1/60;
  if(dt>0.25)dt=0.25;
  if(!M.paused && M.g && !M.ended){
    acc+=dt;
    let guard=0;
    while(acc>=DT && guard<5){
      acc-=DT; guard++;
      tickSim();
    }
  }
  VISDT=dt; PS.update(dt); DEB.update(dt);
  if(TUTOR.on) TUTOR.tick();
  render();
  updateHUD();
  audioFrame(dt);
}

/* ---------------------------- AUDIO POR FOTOGRAMA ------------------------ */
let HB=0;
function audioFrame(dt){
  if(!AU.ok) return;
  AU.tick();
  const g=M.g;
  if(!g||!M.hero){ return; }
  // oyente: la posición del héroe y la orientación de la cámara
  AU.lx=M.hero.x; AU.ly=M.hero.y; AU.yaw=R3.ok?CAM3.yaw:M.hero.ang;
  AU.drain(g);
  /* Rika: se la oye al cruzar cada umbral de manifestación.
     Es puramente de cliente (lee _rk, un campo visual), así que no
     interviene en la simulación ni en el checksum del netcode. */
  for(const o of g.fighters){
    if(!o.alive || o.cid!=='yuta') continue;
    const lv=o._rk||0, was=o._rkS===undefined?lv:o._rkS;
    if(lv>1.32 && was<=1.32)      AU.play('rika', {x:o.x,y:o.y}, {p:1.25, verb:0.60});
    else if(lv>0.92 && was<=0.92) AU.play('rika', {x:o.x,y:o.y}, {p:0.85, verb:0.45});
    o._rkS=lv;
  }
  // intensidad musical adaptativa
  const hp=M.hero.hp/M.hero.maxhp;
  const foes=g.fighters.filter(o=>o.alive&&o.team!==M.hero.team&&!o.minion);
  let near=0; for(const o of foes) near=Math.max(near, clamp(1-dist(M.hero.x,M.hero.y,o.x,o.y)/700,0,1));
  const dom=g.fighters.some(o=>o.domain)?0.45:0;
  AU.setIntensity(clamp(0.20+near*0.45+(1-hp)*0.35+dom, 0, 1));
  // latido cuando estás a punto de caer
  if(M.hero.alive && hp<0.25 && !M.ended && !M.paused){
    HB-=dt; if(HB<=0){ HB=0.55+hp*1.8; AU.play('hb', null, {verb:0.1}); }
  } else HB=0;
}

function tickSim(){
  const g=M.g;
  const mine=readInput();
  if(M.net && M.net instanceof OnlineAdapter){
    /* ---------------- lockstep determinista ----------------
       La entrada local NO se aplica en el fotograma en que se pulsa: se
       programa para F+NET_DELAY, exactamente igual que le llega al rival.
       Además se cuantiza con packInput/unpackInput para que ambos clientes
       consuman bit a bit los mismos números.                              */
    const target = g.frame+NET_DELAY;
    // una sola entrada por fotograma objetivo: si nos quedamos esperando al
    // rival, el fotograma local no avanza y volveríamos a generar otra entrada
    // distinta de la que el rival ya recibió → desincronía.
    if(!M.localBuf.has(target)){
      M.localBuf.set(target, unpackInput(packInput(mine)));
      M.net.sendInput(target, mine);
    }

    const localNow = M.localBuf.get(g.frame) || blankInput();
    const remote   = M.net.getInput(g.frame);
    if(g.frame<NET_DELAY){ g.step([blankInput(), blankInput()]); return; }
    if(!remote){ M.waitFrames++; return; }   // esperar al rival
    M.waitFrames=0;
    const fr = g.frame;                 // step() incrementa g.frame: guardar el índice
    const order = M.cfg.role===0?[localNow,remote]:[remote,localNow];
    g.step(order);
    M.localBuf.delete(fr);
    M.net.buf.delete(fr);
    if(g.frame%120===0) M.net.sendChecksum(g.frame, stateChecksum(g));
  } else {
    g.step([mine]);
  }
  // oleadas del modo supervivencia
  if(M.waves){ M.waves.t+=DT;
    /* si has limpiado el campo, la siguiente oleada entra ya: esperar 6,5 s
       mirando un escenario vacio no es jugar */
    const vivos=g.fighters.filter(f=>f.alive&&f.team!==M.hero.team).length;
    if(vivos===0 && M.waves.t>0.8) M.waves.t=M.waves.every;
    if(M.waves.t>=M.waves.every){ M.waves.t=0;
      const alive=g.fighters.filter(f=>f.alive&&f.team!==M.hero.team).length;
      if(alive<7){ const e=M.waves.pool[Math.floor(g.rng()*M.waves.pool.length)];
        const s=M.waves.spawnFn(e, 1+Math.floor(g.rng()*5)); g.spawnFighter(s, g.fighters.length);
        g.ev('wave',null,'Nueva oleada'); } } }
  checkEnd();
}

function checkEnd(){
  if(M.ended) return;
  const g=M.g, cfg=M.cfg, st=cfg.story;
  const foeTeam = 1-M.hero.team;
  const heroDead=!M.hero.alive;
  let win=null;
  if(heroDead) win=false;
  else if(st&&st.kind==='survive'){ if(g.t>=st.survive) win=true; }
  else if(st&&st.bossFlee){ const b=g.fighters.find(f=>f.isBoss);
    if(b&&(!b.alive||b.hp/b.maxhp<=st.bossFlee)) win=true; }
  else { const foes=g.fighters.filter(f=>f.team===foeTeam&&!f.minion);
    if(foes.length&&foes.every(f=>!f.alive)) win=true; }
  if(win===null && cfg.timeLimit && g.t>=cfg.timeLimit && !st){
    const foe=g.fighters.find(f=>f.team===foeTeam&&!f.minion);
    win = (M.hero.hp/M.hero.maxhp) >= (foe?foe.hp/foe.maxhp:0);
  }
  if(win!==null){ M.ended=true; M.endT=setTimeout(()=>endMatch(win), 900); }
}

/* ------------------------------ ENTRADA --------------------------------- */
/* En mundo abierto el clic no ataca si estas apuntando a una marca: abre su
   ficha. Se engancha una sola vez sobre el lienzo. */
function openWorldClick(){
  if(!M.cfg || M.cfg.mode!=='open') return false;
  if(!M.aimMis || M.paused) return false;
  screenMission(M.aimMis);
  return true;
}

function readInput(){
  const i=blankInput();
  if(M.paused||!M.hero||!M.hero.alive) return i;
  if(R3.ok){
    /* --- tercera persona: movimiento relativo a la cámara --- */
    const yaw=CAM3.yaw;
    const fx=Math.cos(yaw), fy=Math.sin(yaw);
    const rx=-Math.sin(yaw), ry=Math.cos(yaw);
    const fw=(KEY.KeyW?1:0)-(KEY.KeyS?1:0), st=(KEY.KeyD?1:0)-(KEY.KeyA?1:0);
    i.ax=fx*fw+rx*st; i.ay=fy*fw+ry*st;
    i.aim=yaw;
    const gp=aimGroundPoint(M.hero); i.tx=gp.x; i.ty=gp.y;
  } else {
    i.ax=(KEY.KeyD?1:0)-(KEY.KeyA?1:0);
    i.ay=(KEY.KeyS?1:0)-(KEY.KeyW?1:0);
    const w=screenToWorld(MOUSE.x,MOUSE.y);
    i.aim=Math.atan2(w.y-M.hero.y, w.x-M.hero.x);
    i.tx=w.x; i.ty=w.y;
  }
  i.basic=MOUSE.down; i.bf=MOUSE.down;
  i.q=!!KEY.KeyQ; i.e=!!KEY.KeyE; i.r=!!KEY.KeyR;
  i.dash=!!KEY.Space||MOUSE.rdown; i.guard=!!KEY.ShiftLeft||!!KEY.ShiftRight;
  i.rct=!!KEY.KeyC; i.dom=!!KEY.KeyF;
  return i;
}
function screenToWorld(sx,sy){
  return { x:(sx-VW/2)/M.cam.z+M.cam.x, y:(sy-VH/2)/M.cam.z+M.cam.y };
}
function worldToScreen(wx,wy){
  return { x:(wx-M.cam.x)*M.cam.z+VW/2, y:(wy-M.cam.y)*M.cam.z+VH/2 };
}

/* ------------------------------ RENDER ---------------------------------- */
function render(){
  if(!M.g) return;
  if(R3.ok){
    CAM3.shake = SAVE.settings.shake ? M.g.shake : 0;
    render3D(M.g); overlay3D(M.g); return;
  }
  render2D();
}
function render2D(){
  if(!M.g) return;
  const g=M.g, map=g.map, S=cv.width/VW;
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,VW,VH);

  // cámara
  if(M.hero){ const tx=M.hero.x, ty=M.hero.y;
    M.cam.x=lerp(M.cam.x,tx,0.12); M.cam.y=lerp(M.cam.y,ty,0.12); }
  let shx=0,shy=0;
  if(g.shake>0&&SAVE.settings.shake){ shx=(Math.random()-0.5)*g.shake*16; shy=(Math.random()-0.5)*g.shake*16; }

  ctx.fillStyle=map.bg; ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2+shx, VH/2+shy); ctx.scale(M.cam.z,M.cam.z); ctx.translate(-M.cam.x,-M.cam.y);

  // suelo
  ctx.fillStyle=map.floor; ctx.fillRect(0,0,map.w,map.h);
  ctx.strokeStyle=map.accent+'22'; ctx.lineWidth=1;
  for(let x=0;x<map.w;x+=120){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,map.h);ctx.stroke(); }
  for(let y=0;y<map.h;y+=120){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(map.w,y);ctx.stroke(); }

  // muros
  for(const w of g.walls){
    if(w.dead){ ctx.fillStyle='#00000033'; ctx.fillRect(w.x,w.y,w.w,w.h); continue; }
    if(w.t==='water'){ ctx.fillStyle='#2a6a8033'; ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.strokeStyle='#4aa3ff44'; ctx.strokeRect(w.x,w.y,w.w,w.h); continue; }
    if(w.t==='pit'){ ctx.fillStyle='#000'; ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.strokeStyle='#ffffff18'; ctx.lineWidth=3; ctx.strokeRect(w.x,w.y,w.w,w.h); continue; }
    if(w.t==='low'){ ctx.fillStyle=map.accent+'55'; ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.strokeStyle=map.accent+'99'; ctx.lineWidth=1; ctx.strokeRect(w.x,w.y,w.w,w.h); continue; }
    const off=Math.min(26,(w.hh||20)*0.22);
    ctx.fillStyle='#00000066'; ctx.fillRect(w.x+4,w.y+4,w.w,w.h);
    ctx.fillStyle=w.t==='destr'?'#3a2f2a':map.accent+'66';
    ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle=w.t==='destr'?'#4a3b33':map.accent+'aa';
    ctx.fillRect(w.x,w.y-off,w.w,w.h);
    ctx.strokeStyle='#ffffff1a'; ctx.lineWidth=1; ctx.strokeRect(w.x,w.y-off,w.w,w.h);
    if(w.t==='destr'&&w.hp<260){ ctx.fillStyle='#ff3f5c'+Math.round((1-w.hp/260)*160).toString(16).padStart(2,'0');
      ctx.fillRect(w.x,w.y-off,w.w,w.h); }
  }

  // dominios
  for(const f of g.fighters){
    if(!f.domain) continue;
    const D=f.domain, R=D.radius;
    const grd=ctx.createRadialGradient(f.x,f.y,R*0.15,f.x,f.y,R);
    grd.addColorStop(0,f.C.color+'22'); grd.addColorStop(0.75,f.C.color+'33'); grd.addColorStop(1,f.C.color+'05');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(f.x,f.y,R,0,TAU); ctx.fill();
    ctx.strokeStyle=f.C.color+'cc'; ctx.lineWidth=3; ctx.setLineDash([16,10]);
    ctx.lineDashOffset=-g.t*40; ctx.stroke(); ctx.setLineDash([]);
    ctx.save(); ctx.globalAlpha=0.10; ctx.fillStyle=f.C.color;
    ctx.font='900 '+Math.round(R*0.9)+'px "Noto Serif JP",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(D.kanji, f.x, f.y); ctx.restore();
  }

  // zonas
  for(const z of g.zones){
    if(z.kind!=='aoe') continue;
    const p=clamp(z.t/Math.max(0.001,z.delay),0,1);
    if(!z.done){
      ctx.strokeStyle=(z.src?z.src.C.color:'#fff')+'cc'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,TAU); ctx.stroke();
      ctx.fillStyle=(z.src?z.src.C.color:'#fff')+'22';
      ctx.beginPath(); ctx.arc(z.x,z.y,z.r*p,0,TAU); ctx.fill();
    } else if(z.ab.burn){
      ctx.fillStyle='#ff7a3022'; ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,TAU); ctx.fill();
    }
  }

  // proyectiles
  for(const p of g.projectiles){
    ctx.save();
    if(p.crescent){ ctx.translate(p.x,p.y); ctx.rotate(p.ang);
      ctx.strokeStyle=p.c; ctx.lineWidth=4; ctx.beginPath();
      ctx.arc(0,0,p.r*1.6,-0.9,0.9); ctx.stroke(); }
    else{ ctx.shadowColor=p.c; ctx.shadowBlur=14;
      ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      ctx.fillStyle='#ffffffcc'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.45,0,TAU); ctx.fill(); }
    ctx.restore();
  }

  // efectos por debajo
  drawFX(g,false);

  // luchadores
  const order=[...g.fighters].sort((a,b)=>a.y-b.y);
  for(const f of order) drawFighter(g,f);

  drawFX(g,true);
  ctx.restore();

  // viñeta
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VH*0.85);
  vg.addColorStop(0,'#00000000'); vg.addColorStop(1,'#000000'+Math.round((map.fog||0.3)*255).toString(16).padStart(2,'0'));
  ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);

  drawMinimap(g);
  drawCenterMsg();
}

function drawFighter(g,f){
  if(!f.alive){
    const a=clamp(1-(g.t-f.deathT)/1.2,0,1);
    if(a<=0) return;
    ctx.globalAlpha=a*0.5; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill(); ctx.globalAlpha=1; return;
  }
  const isHero = f===M.hero;
  ctx.save();
  if(f.stealth>0) ctx.globalAlpha=0.32;

  // sombra
  ctx.fillStyle='#00000066'; ctx.beginPath(); ctx.ellipse(f.x,f.y+f.r*0.7,f.r*0.9,f.r*0.38,0,0,TAU); ctx.fill();

  // aura de energía maldita
  if(!f.noCE && f.ce>f.maxce*0.5){
    ctx.globalAlpha*=0.35; ctx.strokeStyle=f.C.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r+5+Math.sin(g.t*4+f.uid)*2,0,TAU); ctx.stroke(); ctx.globalAlpha/=0.35;
  }
  if(f.guarding){ ctx.strokeStyle='#8ab6ff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r+9,0,TAU); ctx.stroke(); }
  if(f.status.simpleDomain){ ctx.strokeStyle='#5fd6a0'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r+16,0,TAU); ctx.stroke(); ctx.setLineDash([]); }
  if(f.status.freeze){ ctx.fillStyle='#8fd8f055'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r+7,0,TAU); ctx.fill(); }
  if(f.status.burn){ ctx.fillStyle='#ff7a3044'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r+6,0,TAU); ctx.fill(); }

  // cuerpo
  ctx.fillStyle=f.minion?'#1a1a24':'#0e0f16';
  ctx.strokeStyle=f.C.color; ctx.lineWidth=isHero?3:2;
  ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill(); ctx.stroke();

  // kanji
  ctx.fillStyle=f.C.color; ctx.font='900 '+Math.round(f.r*1.25)+'px "Noto Serif JP",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(f.C.kanji||'呪', f.x, f.y+1);

  // dirección
  ctx.strokeStyle=f.C.color; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(f.x+Math.cos(f.ang)*(f.r+2), f.y+Math.sin(f.ang)*(f.r+2));
  ctx.lineTo(f.x+Math.cos(f.ang)*(f.r+11), f.y+Math.sin(f.ang)*(f.r+11)); ctx.stroke();

  // anillo de Flash Negro
  if(f.atk && g.t>=f.bf.s-0.14 && g.t<=f.bf.e+0.04){
    const win = g.t>=f.bf.s&&g.t<=f.bf.e;
    const p = clamp((f.bf.e-g.t)/((f.bf.e-f.bf.s)+0.14),0,1);
    ctx.strokeStyle= win?'#ffffff':'#ffffff55'; ctx.lineWidth=win?4:2;
    ctx.beginPath(); ctx.arc(f.x,f.y, f.r+6+p*26, 0, TAU); ctx.stroke();
  }
  if(f.bf.arm){ ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r+4,0,TAU); ctx.stroke(); }

  ctx.restore();

  // barra de vida sobre enemigos y aliados
  if(!isHero){
    const w=f.minion?30:(f.isBoss?86:52), y=f.y-f.r-14;
    ctx.fillStyle='#000000aa'; ctx.fillRect(f.x-w/2-1,y-1,w+2,6);
    ctx.fillStyle=f.team===M.hero.team?'#5fd6a0':(f.isBoss?'#ff3838':'#ff5f78');
    ctx.fillRect(f.x-w/2,y,w*clamp(f.hp/f.maxhp,0,1),4);
    const fodder = f.cid==='curse_grunt'||f.cid==='transfigured';
    if(!f.minion && !fodder){ ctx.fillStyle='#ffffffaa'; ctx.font='700 9px system-ui'; ctx.textAlign='center';
      ctx.fillText(f.name, f.x, y-5); }
  }
}

function drawFX(g, top){
  for(const e of g.fx){
    const p=e.t/e.life, a=1-p;
    switch(e.type){
      case 'slash': if(top) break;
        ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.a);
        ctx.strokeStyle=e.c; ctx.globalAlpha=a*0.9; ctx.lineWidth=e.bf?9:5;
        ctx.beginPath(); ctx.arc(0,0,e.r*(0.55+p*0.5),-e.arc/2,e.arc/2); ctx.stroke();
        ctx.restore(); ctx.globalAlpha=1; break;
      case 'burst': if(top) break;
        ctx.strokeStyle=e.c; ctx.globalAlpha=a; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(0.25+p*0.85),0,TAU); ctx.stroke();
        ctx.fillStyle=e.c+'22'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(0.25+p*0.85),0,TAU); ctx.fill();
        ctx.globalAlpha=1; break;
      case 'beam': if(top) break;
        ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.a); ctx.globalAlpha=a;
        const grd=ctx.createLinearGradient(0,-e.w/2,0,e.w/2);
        grd.addColorStop(0,e.c+'00'); grd.addColorStop(0.5,'#ffffff'); grd.addColorStop(1,e.c+'00');
        ctx.fillStyle=grd; ctx.fillRect(0,-e.w/2,e.len,e.w);
        ctx.fillStyle=e.c+'88'; ctx.fillRect(0,-e.w*0.8,e.len,e.w*1.6);
        ctx.restore(); ctx.globalAlpha=1; break;
      case 'hit': if(!top) break;
        ctx.fillStyle='#fff'; ctx.globalAlpha=a;
        ctx.beginPath(); ctx.arc(e.x,e.y,9*(1+p*1.6),0,TAU); ctx.fill(); ctx.globalAlpha=1; break;
      case 'blackflash': if(!top) break;
        ctx.save(); ctx.globalAlpha=a;
        ctx.strokeStyle='#fff'; ctx.lineWidth=6;
        for(let k=0;k<6;k++){ const ang=k/6*TAU+p*2;
          ctx.beginPath(); ctx.moveTo(e.x+Math.cos(ang)*20, e.y+Math.sin(ang)*20);
          ctx.lineTo(e.x+Math.cos(ang)*(60+p*90), e.y+Math.sin(ang)*(60+p*90)); ctx.stroke(); }
        ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(e.x,e.y,34*(1-p),0,TAU); ctx.fill();
        ctx.strokeStyle='#ff2f4e'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(e.x,e.y,44*(1+p),0,TAU); ctx.stroke();
        ctx.restore(); ctx.globalAlpha=1; break;
      case 'dmgnum': if(!top||!SAVE.settings.dmgNum) break;
        ctx.globalAlpha=a; ctx.textAlign='center';
        ctx.font=(e.bf?'900 26px':'800 15px')+' system-ui';
        ctx.fillStyle=e.bf?'#fff':'#ffd9de';
        ctx.strokeStyle='#000'; ctx.lineWidth=3;
        ctx.strokeText(e.v,e.x,e.y); ctx.fillText(e.v,e.x,e.y); ctx.globalAlpha=1; break;
      case 'domainOpen': if(top) break;
        ctx.strokeStyle=e.c; ctx.globalAlpha=a*0.9; ctx.lineWidth=8;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r*p,0,TAU); ctx.stroke(); ctx.globalAlpha=1; break;
      case 'domainClose': if(top) break;
        ctx.strokeStyle=e.c; ctx.globalAlpha=a; ctx.lineWidth=5;
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r*(1-p),0,TAU); ctx.stroke(); ctx.globalAlpha=1; break;
      case 'resonance': if(!top) break;
        ctx.globalAlpha=a; ctx.strokeStyle='#e0863c'; ctx.lineWidth=4;
        for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(e.x,e.y,(20+k*26)*(1+p),0,TAU); ctx.stroke(); }
        ctx.globalAlpha=1; break;
      case 'chain': if(top) break;
        ctx.globalAlpha=a; ctx.strokeStyle='#9aa3b0'; ctx.lineWidth=4; ctx.setLineDash([8,6]);
        ctx.beginPath(); ctx.moveTo(e.x1,e.y1); ctx.lineTo(e.x2,e.y2); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha=1; break;
      case 'rubble': if(top) break;
        ctx.globalAlpha=a; ctx.fillStyle='#6a5a4a';
        for(let k=0;k<10;k++){ const ang=k/10*TAU;
          ctx.fillRect(e.x+Math.cos(ang)*e.r*p-5, e.y+Math.sin(ang)*e.r*p-5, 11,11); }
        ctx.globalAlpha=1; break;
      case 'infinity': if(!top) break;
        ctx.globalAlpha=a; ctx.strokeStyle='#5cc7ff'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(e.x,e.y,30+p*14,0,TAU); ctx.stroke();
        ctx.fillStyle='#5cc7ff'; ctx.font='700 11px system-ui'; ctx.textAlign='center';
        ctx.fillText('∞',e.x,e.y-38); ctx.globalAlpha=1; break;
      case 'heal': if(!top) break;
        ctx.globalAlpha=a; ctx.fillStyle='#5fd6a0';
        ctx.beginPath(); ctx.arc(e.x+(Math.random()-0.5)*22, e.y-p*30, 3, 0, TAU); ctx.fill();
        ctx.globalAlpha=1; break;
      case 'guard': if(top) break;
        ctx.globalAlpha=a*0.5; ctx.strokeStyle='#8ab6ff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(e.x,e.y,26+p*8,0,TAU); ctx.stroke(); ctx.globalAlpha=1; break;
      case 'dash': if(top) break;
        ctx.save(); ctx.globalAlpha=a*0.7; ctx.translate(e.x,e.y); ctx.rotate(e.a);
        ctx.fillStyle=e.c; ctx.fillRect(-60*p,-3,60,6); ctx.restore(); ctx.globalAlpha=1; break;
      case 'trail': if(top) break;
        ctx.globalAlpha=a*0.5; ctx.fillStyle=e.c;
        ctx.beginPath(); ctx.arc(e.x,e.y,6*a,0,TAU); ctx.fill(); ctx.globalAlpha=1; break;
      case 'spark': case 'muzzle': if(top) break;
        ctx.globalAlpha=a; ctx.fillStyle=e.c;
        ctx.beginPath(); ctx.arc(e.x,e.y,7*(1-p),0,TAU); ctx.fill(); ctx.globalAlpha=1; break;
      case 'cut': if(!top) break;
        ctx.globalAlpha=a; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(e.x-18,e.y-18); ctx.lineTo(e.x+18,e.y+18); ctx.stroke();
        ctx.globalAlpha=1; break;
      case 'death': if(top) break;
        ctx.globalAlpha=a; ctx.strokeStyle=e.c; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(e.x,e.y,20+p*70,0,TAU); ctx.stroke(); ctx.globalAlpha=1; break;
      case 'bfring': if(!top) break;
        ctx.globalAlpha=a; ctx.strokeStyle='#fff'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(e.x,e.y,24+p*30,0,TAU); ctx.stroke(); ctx.globalAlpha=1; break;
    }
  }
}

const MINI = { big:false };
function drawMinimap(g){
  /* Con M se agranda. En un mapa de 5400 px el minimapa de 170 no sirve para
     orientarse; grande ocupa media pantalla y se leen las marcas. */
  const mw = MINI.big ? Math.min(VW*0.52, VH*0.78*g.map.w/g.map.h) : 170;
  const mh = Math.round(mw*g.map.h/g.map.w);
  const x = MINI.big ? (VW-mw)/2 : VW-mw-16;
  const y = MINI.big ? (VH-mh)/2 : VH-mh-16;
  const s = mw/g.map.w;
  ctx.fillStyle='#05050ad9'; ctx.fillRect(x,y,mw,mh);
  ctx.strokeStyle='#242637'; ctx.lineWidth=1; ctx.strokeRect(x,y,mw,mh);
  for(const w of g.walls){ if(w.dead||w.t==='water') continue;
    ctx.fillStyle=w.t==='low'?'#2a2c3d':'#3a3d52';
    ctx.fillRect(x+w.x*s,y+w.y*s,Math.max(1,w.w*s),Math.max(1,w.h*s)); }
  /* MARCAS DE MISION: rombos violetas que laten, con su nivel al lado si el
     mapa esta agrandado. Es lo que convierte el minimapa en una brujula. */
  if(M.missions && M.missions.length){
    const pu=0.55+0.45*Math.sin(g.t*3);
    for(const mi of M.missions){
      if(misionHecha(mi)) continue;
      const px=x+mi.x*s, py=y+mi.y*s, r=(MINI.big?6:4)*(0.85+0.15*pu);
      ctx.fillStyle='rgba(160,90,230,'+(0.35+0.35*pu)+')';
      ctx.beginPath(); ctx.arc(px,py,r*2.1,0,TAU); ctx.fill();
      ctx.fillStyle='#c08bff';
      ctx.beginPath();
      ctx.moveTo(px,py-r); ctx.lineTo(px+r,py); ctx.lineTo(px,py+r); ctx.lineTo(px-r,py);
      ctx.closePath(); ctx.fill();
      if(MINI.big){
        ctx.fillStyle='#e8d6ff'; ctx.font='700 10px system-ui'; ctx.textAlign='center';
        ctx.fillText('N'+mi.lvl, px, py-r-4);
      }
    }
    ctx.textAlign='left';
  }
  for(const f of g.fighters){ if(!f.alive) continue;
    ctx.fillStyle=f===M.hero?'#fff':(f.team===M.hero.team?'#5fd6a0':'#ff3f5c');
    ctx.beginPath(); ctx.arc(x+f.x*s,y+f.y*s,f===M.hero?(MINI.big?5:3.5):(f.minion?1.6:2.6),0,TAU); ctx.fill(); }
  if(MINI.big){
    ctx.fillStyle='#8b8ba3'; ctx.font='600 11px system-ui';
    ctx.fillText('M · cerrar el mapa', x+8, y+mh-9);
    ctx.fillStyle='#c08bff';
    ctx.fillText((M.missions?M.missions.length:0)+' misiones activas', x+8, y-7);
  }
}

function drawCenterMsg(){

  ctx.strokeText(M.msg,VW/2,VH*0.26); ctx.fillText(M.msg,VW/2,VH*0.26);
  ctx.restore();
}

/* Rotulo bajo la mirilla cuando apuntas a una marca. Se monta una sola vez. */
function hudMission(){
  let box=document.getElementById('mistip');
  if(!box){ box=document.createElement('div'); box.id='mistip';
    box.style.cssText='position:fixed;left:50%;top:58%;transform:translateX(-50%);'+
      'background:rgba(12,10,20,.86);border:1px solid #6a3f9a;border-radius:9px;'+
      'padding:9px 13px;font-size:12px;color:#e8e8f2;pointer-events:none;z-index:60;'+
      'text-align:center;line-height:1.55;display:none;max-width:330px';
    document.body.appendChild(box); }
  /* aviso del contragolpe cargado, encima del rotulo de mision */
  {
    let cg=document.getElementById('cgtip');
    if(!cg){ cg=document.createElement('div'); cg.id='cgtip';
      cg.style.cssText='position:fixed;left:50%;top:46%;transform:translateX(-50%);'+
        'font-size:15px;font-weight:900;letter-spacing:.14em;color:#fff;'+
        'text-shadow:0 0 12px #fff,0 0 24px #8f6bff;pointer-events:none;z-index:62;display:none';
      document.body.appendChild(cg); }
    const h=M.hero, st=h?(h.bfStreak||0):0;
    if(h && st>0 && !M.paused){
      cg.style.display='block';
      const lleno='◆'.repeat(st), vacio='◇'.repeat(4-st);
      cg.innerHTML = st>=4
        ? '<span style="color:#fff">⟪ CLIC ⟫ FLASH NEGRO</span>'
        : '<span style="color:#c9b3ff;font-size:13px;letter-spacing:.3em">'+lleno+vacio+'</span>';
      cg.style.opacity='1';
    } else cg.style.display='none';
  }
  /* Brujula: en un mapa de 5.400 px hace falta saber hacia donde ir. */
  {
    let bj=document.getElementById('brujula');
    if(!bj){ bj=document.createElement('div'); bj.id='brujula';
      bj.style.cssText='position:fixed;left:50%;top:12%;transform:translateX(-50%);'+
        'font-size:12px;color:#c9b3ff;letter-spacing:.10em;pointer-events:none;'+
        'z-index:59;display:none;text-shadow:0 1px 6px #000';
      document.body.appendChild(bj); }
    const h=M.hero;
    if(M.cfg && M.cfg.mode==='open' && h && M.missions && M.missions.length && !M.paused){
      let mejor=null, dd=1e18;
      for(const mm of M.missions){ if(misionHecha(mm)) continue;
        const d=dist2(mm.x,mm.y,h.x,h.y); if(d<dd){ dd=d; mejor=mm; } }
      if(mejor){
        const ang=Math.atan2(mejor.y-h.y, mejor.x-h.x);
        let rel=ang-(CAM3?CAM3.yaw:0);
        while(rel>Math.PI) rel-=TAU; while(rel<-Math.PI) rel+=TAU;
        const flechas=['↑','↗','→','↘','↓','↙','←','↖'];
        const fl=flechas[(Math.round(rel/(TAU/8))+8)%8];
        bj.style.display='block';
        bj.innerHTML=fl+'  maldición nivel '+mejor.lvl+'  ·  '+Math.round(Math.sqrt(dd))+' m';
      } else bj.style.display='none';
    } else bj.style.display='none';
  }
  const mi = (M.cfg && M.cfg.mode==='open') ? M.aimMis : null;
  if(!mi || M.paused){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML =
    `<div style="color:#c08bff;font-weight:800;letter-spacing:.06em">${mi.nom}</div>`+
    `<div style="font-size:11px;color:#8b8ba3">Nivel de maldición ${mi.lvl}</div>`+
    `<div style="font-size:11px;margin-top:5px">`+
      `vida <b style="color:#ff7f8f">×${mi.hpMul}</b> · `+
      `poder <b style="color:#ffc46b">×${mi.powMul}</b> · `+
      `velocidad <b style="color:#7fd3ff">×${mi.spdMul}</b></div>`+
    `<div style="font-size:11px;margin-top:4px;color:var(--gold)">`+
      `+${mi.coins.toLocaleString('es')} ${CUR.kanji} · +${mi.xp} exp</div>`+
    `<div style="font-size:10.5px;margin-top:5px;color:#8b8ba3">clic para leerla</div>`;
}
